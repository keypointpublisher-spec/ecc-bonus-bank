 pheochromocytoma is suspected. Which agent should be used first?","o":["Intravenous phentolamine","Intravenous propranolol","Intravenous esmolol infusion","Oral clonidine","Intravenous furosemide"],"a":0,"e":"In a hypertensive crisis from pheochromocytoma, alpha blockade comes first with phentolamine or phenoxybenzamine, and nitroprusside or nicardipine are also listed. A beta-blocker alone can cause unopposed alpha activity and worsen the crisis.","k":"Pheochromocytoma crisis needs alpha blockade first, for example phentolamine."},{"n":172,"g":14,"q":"Why should a beta-blocker not be started before alpha blockade in a patient with pheochromocytoma?","o":["It raises plasma metanephrines and confounds the diagnosis of the tumor","It prevents the tumor from releasing catecholamines","It blocks the effect of phentolamine at the receptor","Unopposed alpha activity can precipitate a hypertensive emergency","It causes severe hypoglycemia in patients with pheochromocytoma by blocking glycogenolysis"],"a":3,"e":"Beta blockade is started only about two days after alpha blockade. If a beta-blocker is given first, unopposed alpha activity can precipitate a hypertensive emergency.","k":"Alpha blockade must come before beta blockade in pheochromocytoma."},{"n":173,"g":14,"q":"A 45-year-old woman has recurrent paroxysms of headache, sweating, and palpitations with episodes of severe hypertension. Which is the best initial biochemical test?","o":["Urinary 5-hydroxyindoleacetic acid","Serum cortisol","Plasma renin activity","Thyroid-stimulating hormone","Plasma free metanephrines"],"a":4,"e":"Plasma free metanephrines or urinary fractionated metanephrines are the first-line tests when pheochromocytoma is suspected. Imaging with adrenal-protocol CT follows biochemical confirmation, and definitive treatment is surgical resection.","k":"Plasma free metanephrines are the first test for pheochromocytoma."},{"n":174,"g":14,"q":"A 58-year-old woman with type 2 diabetes who takes empagliflozin fasted for three days before a procedure. She now has nausea, abdominal pain, and rapid breathing. Glucose is 160 mg/dL, there is an anion gap acidosis, and serum beta-hydroxybutyrate is high. What is the most likely diagnosis?","o":["Hyperosmolar hyperglycemic state","Euglycemic diabetic ketoacidosis from the SGLT2 inhibitor","Alcoholic ketoacidosis with a normal glucose in a patient who drinks","Simple starvation ketosis with a normal pH and a normal anion gap","Metformin-associated lactic acidosis with a markedly high lactate level"],"a":1,"e":"SGLT2 inhibitors cause urinary glucose loss, volume depletion, increased glucagon, lower insulin, and impaired ketone clearance. Fasting, surgery, acute illness, alcohol, and reduced insulin precipitate ketoacidosis even when glucose is near normal.","k":"SGLT2 inhibitor users can develop ketoacidosis with a nearly normal glucose."},{"n":175,"g":14,"q":"A patient with euglycemic diabetic ketoacidosis has a glucose of 200 mg/dL and has been started on an insulin infusion. Why is 5 percent dextrose added to the intravenous fluids?","o":["To prevent hypoglycemia while insulin keeps clearing ketones","To lower the anion gap without needing any insulin","To raise the serum potassium level before insulin is started","To reverse the effect of the SGLT2 inhibitor in the urine","Because insulin is contraindicated in this condition"],"a":0,"e":"Management is fluids, then an insulin infusion at 0.05 to 0.1 units/kg per hour once potassium is above 3.3 mEq/L. Dextrose 5 percent is added when the glucose is below 250 mg/dL, with 10 percent used if ketoacidosis persists, so the insulin can keep clearing ketones without causing hypoglycemia.","k":"Add dextrose to euglycemic ketoacidosis treatment so insulin can continue clearing ketones."},{"n":176,"g":14,"q":"A 66-year-old man taking empagliflozin is scheduled for elective surgery. According to the FDA update, how long before the procedure should the drug be stopped?","o":["At least 3 days","It does not need to be stopped","At least 10 days","At least 12 hours","The morning of surgery only"],"a":0,"e":"The FDA advised in 2020 that canagliflozin, dapagliflozin, and empagliflozin be stopped at least 3 days before scheduled surgery, and ertugliflozin at least 4 days, because of the risk of ketoacidosis.","k":"Stop empagliflozin at least 3 days before scheduled surgery."},{"n":177,"g":14,"q":"A 5-day-old full-term infant has poor feeding, lethargy, vomiting, and tachypnea after protein-containing feeds. Glucose is normal. Sepsis is being considered. Which test should be sent urgently?","o":["Serum ammonia, drawn without a tourniquet and sent on ice","A TSH level to screen for congenital hypothyroidism","A head CT to look for intracranial hemorrhage","A serum bilirubin to look for hemolytic disease","Only a blood culture, since sepsis is the leading concern"],"a":0,"e":"An inborn error of metabolism should be considered in a lethargic neonate with vomiting, even when sepsis is suspected and glucose is normal. Ammonia is an urgent test, and the sample must be transported on ice without delay.","k":"Send an urgent ammonia in a lethargic neonate with vomiting, and do not assume sepsis."},{"n":178,"g":14,"q":"A 6-day-old infant has a markedly raised ammonia level and metabolic acidosis. An inborn error of metabolism is suspected. Which initial step is appropriate?","o":["Stop protein, give IV dextrose, and start ammonia scavengers","Give valproate for any seizure activity that develops","Observe without treatment until the genetic results return from the laboratory","Increase the protein intake to promote growth and recovery of the infant","Restrict calories to reduce the metabolic load"],"a":0,"e":"Emergency management stops protein intake and oral feeds, supplies non-protein calories as intravenous dextrose, and starts ammonia scavengers such as sodium benzoate with sodium phenylacetate. Dialysis is considered for very high ammonia or poor response.","k":"In hyperammonemic neonates, stop protein, give dextrose, and start ammonia scavengers."},{"n":179,"g":14,"q":"A neonate with a suspected urea cycle disorder is having seizures. Which anticonvulsant should be avoided?","o":["Lorazepam","Midazolam","Phenobarbital","Valproate","Levetiracetam"],"a":3,"e":"For seizures in a suspected metabolic disorder a benzodiazepine is given first, followed by levetiracetam or phenobarbital. Valproate is avoided in this setting.","k":"Avoid valproate for seizures in a neonate with suspected inborn error of metabolism."},{"n":180,"g":15,"q":"A 42-year-old man with heavy alcohol use stopped eating two days ago after a binge. He has vomiting and abdominal pain. Glucose is 85 mg/dL, there is an anion gap metabolic acidosis with ketonemia, and the lactate is mildly raised. Which initial treatment is best?","o":["Thiamine, then 5 percent dextrose in normal saline","Emergency hemodialysis for the acidosis","Normal saline alone with observation overnight","Fomepizole to block alcohol dehydrogenase","An insulin infusion with a sodium bicarbonate bolus"],"a":0,"e":"In alcoholic ketoacidosis, thiamine 100 mg intravenously is given first to prevent Wernicke encephalopathy, followed by dextrose-containing saline. Magnesium and potassium are replaced as needed, and the acidosis usually responds quickly.","k":"Alcoholic ketoacidosis is treated with thiamine and dextrose-containing saline."},{"n":181,"g":15,"q":"Which laboratory pattern is typical of alcoholic ketoacidosis?","o":["A respiratory acidosis with a normal anion gap","A normal anion gap acidosis with a glucose of 600 mg/dL","A metabolic alkalosis with hyperkalemia","A raised osmolar gap with calcium oxalate crystals in the urine sediment","An anion gap acidosis with ketonemia and a low or normal glucose"],"a":4,"e":"Alcoholic ketoacidosis presents with ketonemia, ketonuria, an elevated anion gap, often a raised lactate, and a glucose that is usually low or normal. Methanol and ethylene glycol poisoning may need to be excluded.","k":"Alcoholic ketoacidosis has an anion gap acidosis with ketones and a low or normal glucose."},{"n":182,"g":15,"q":"A patient with alcoholic ketoacidosis has a glucose of 340 mg/dL on arrival. How does this change the management?","o":["Insulin is replaced by a sodium bicarbonate infusion in all cases of this type","Insulin should be given as a 10-unit bolus in every case","Insulin must always be given before thiamine and dextrose are started in every patient","Insulin is considered if glucose is above 300 mg/dL or DKA is suspected","Insulin is never used in this condition under any circumstances whatsoever"],"a":3,"e":"Insulin is generally not needed in alcoholic ketoacidosis and is reserved for atypical presentations suspicious for diabetic ketoacidosis or a glucose above 300 mg/dL. Thiamine and dextrose-containing fluids remain the foundation.","k":"Reserve insulin in alcoholic ketoacidosis for glucose above 300 mg/dL or suspected diabetic ketoacidosis."},{"n":183,"g":15,"q":"A man with alcoholic ketoacidosis has persistent vomiting. His arterial pH is 7.38 although his bicarbonate is 12 mmol/L and the anion gap is 26. What is the best explanation for the near-normal pH?","o":["Concurrent respiratory acidosis","Complete respiratory compensation with no other process","Bicarbonate administration before arrival","A coexisting metabolic alkalosis from vomiting","A normal ketone level"],"a":3,"e":"In alcoholic ketoacidosis the pH may appear near normal when vomiting causes a concurrent metabolic alkalosis. The anion gap and ketones reveal the underlying ketoacidosis.","k":"Vomiting can mask an anion gap acidosis with a concurrent metabolic alkalosis in alcoholic ketoacidosis."},{"n":184,"g":15,"q":"A 64-year-old woman with diabetes and chronic kidney disease taking metformin has abdominal pain, vomiting, and confusion. Her venous bicarbonate is 9 mmol/L with a high anion gap and a very high lactate. She has dyspnea but clear lungs. Which finding would meet an EXTRIP indication for hemodialysis in metformin-associated lactic acidosis?","o":["A lactate of 8 mmol/L","A pH of 7.25","A pH of 7.0 or below","A bicarbonate of 14 mmol/L","A creatinine of 2.0 mg/dL"],"a":2,"e":"EXTRIP recommends hemodialysis for metformin-associated lactic acidosis when lactate exceeds 20 mmol/L, pH is 7.0 or lower, shock is present, or standard supportive measures fail. A decreased level of consciousness is a weaker indication.","k":"Dialysis for metformin-associated lactic acidosis is indicated for pH 7.0 or below or lactate above 20 mmol/L."},{"n":185,"g":15,"q":"A patient with severe metformin-associated lactic acidosis is started on intermittent hemodialysis. When can dialysis be stopped?","o":["When the lactate is below 3 mmol/L and the pH is above 7.35","After exactly two hours of treatment have been completed","When the bicarbonate is 18 mmol/L regardless of the lactate","When the creatinine falls below 1.5 mg/dL","When the glucose has returned to the normal range"],"a":0,"e":"EXTRIP suggests continuing extracorporeal treatment until the lactate is below 3 mmol/L and the pH is above 7.35. Intermittent hemodialysis is preferred, and continuous renal replacement therapy is used if hemodialysis is unavailable.","k":"Continue dialysis for metformin toxicity until lactate is below 3 mmol/L and pH above 7.35."},{"n":186,"g":15,"q":"A patient with metformin-associated lactic acidosis and shock needs extracorporeal treatment. Intermittent hemodialysis is not available at the hospital. What is the alternative?","o":["Peritoneal lavage with saline","No treatment other than fluids","Continuous renal replacement therapy","Therapeutic plasma exchange","Hemoperfusion with activated charcoal only"],"a":2,"e":"Intermittent hemodialysis is preferred for metformin-associated lactic acidosis, and continuous renal replacement therapy is the alternative if it is unavailable. Toxicology consultation is advised, and isotonic bicarbonate may be part of initial resuscitation.","k":"Use continuous renal replacement therapy when intermittent hemodialysis is unavailable for metformin toxicity."},{"n":187,"g":15,"q":"A 51-year-old man taking metformin presents with nausea, abdominal pain, and altered mental status. He is tachypneic with clear lungs. Venous gas shows a low pH, bicarbonate of 11 mmol/L, and a high anion gap with elevated lactate. Which diagnosis best fits?","o":["Diabetic ketoacidosis with a glucose above 500 mg/dL","Metformin-associated lactic acidosis","Respiratory acidosis from opioid overdose","Acute adrenal crisis","Hyperosmolar hyperglycemic state"],"a":1,"e":"Metformin-associated lactic acidosis presents with a low pH, high anion gap metabolic acidosis, elevated lactate, abdominal pain, nausea, vomiting, altered mental status, and dyspnea with clear lungs, possibly with respiratory alkalosis.","k":"A metformin user with a high anion gap acidosis and high lactate has metformin-associated lactic acidosis until proven otherwise."},{"n":188,"g":15,"q":"A 24-year-old woman with anorexia nervosa, BMI 13, is admitted for supervised nutrition. Which electrolyte shift is the hallmark of refeeding syndrome?","o":["A rise in the serum potassium level","A rise in the serum magnesium level","A rise in the serum calcium level","A rise in the serum sodium level","A fall in the serum phosphate level"],"a":4,"e":"Reintroducing carbohydrate raises insulin, which drives phosphate and potassium into cells. Hypophosphatemia is the hallmark and impairs ATP production and respiratory muscle function. Potassium and magnesium also fall.","k":"Refeeding syndrome is characterized by hypophosphatemia, with falls in potassium and magnesium."},{"n":189,"g":15,"q":"A 56-year-old man with alcohol use disorder and 20 pounds of weight loss is about to start intravenous dextrose and enteral nutrition. Which step should come first?","o":["Start the full target calories as soon as possible on the first day","Give thiamine, then check and correct the electrolytes","Restrict phosphate intake to protect the kidneys","Give a high-dose insulin infusion to move glucose into the cells","Hold all vitamins until the electrolytes are normal again"],"a":1,"e":"Thiamine, about 100 mg, is given before dextrose because glucose metabolism increases thiamine requirements, and deficiency can cause Wernicke-Korsakoff syndrome. Electrolytes are checked and replaced as feeding begins.","k":"Give thiamine before dextrose or feeding in patients at risk of refeeding syndrome."},{"n":190,"g":15,"q":"A 30-year-old woman has been starved for ten days and is judged at high risk of refeeding syndrome. Which energy plan is suggested for the first 24 hours?","o":["About 10 to 20 kcal/kg, increased gradually","About 40 kcal/kg to restore weight quickly","No calories for the first 7 days","About 60 kcal/kg as a continuous dextrose infusion","The full calculated target on day one"],"a":0,"e":"ASPEN suggests starting with 10 to 20 kcal/kg, or 100 to 150 g of dextrose, in the first 24 hours, advancing gradually while electrolytes are replaced and monitored, for example every 12 hours for three days in high-risk patients.","k":"Start nutrition slowly at 10 to 20 kcal/kg per day in patients at high risk of refeeding syndrome."},{"n":191,"g":15,"q":"A malnourished 47-year-old woman begins refeeding. On day three she has runs of polymorphic ventricular tachycardia with a prolonged QT interval. Which deficiency most directly explains this?","o":["Hypercalcemia","Hyperkalemia","Hypernatremia","Hyperphosphatemia","Hypomagnesemia"],"a":4,"e":"Hypomagnesemia worsens hypokalemia and can cause QT prolongation, torsades de pointes, convulsions, and neuromuscular symptoms in refeeding syndrome. Replacement is given together with potassium and phosphate.","k":"Hypomagnesemia in refeeding can prolong the QT interval and cause torsades."},{"n":192,"g":15,"q":"A 4-year-old boy with new-onset type 1 diabetes has a venous pH of 7.05 and has received a sodium bicarbonate bolus for the acidosis. Which factor increases his risk of cerebral edema?","o":["Starting insulin an hour after fluids","Treatment with bicarbonate","Being older than twelve years","Hypercapnia","Established diabetes with previous episodes"],"a":1,"e":"Risk factors for cerebral injury in pediatric diabetic ketoacidosis include younger age, new-onset diabetes, longer symptom duration, greater hypocapnia, higher urea nitrogen, more severe acidosis, and bicarbonate treatment. Bicarbonate is not routinely recommended.","k":"Bicarbonate treatment increases the risk of cerebral edema in pediatric diabetic ketoacidosis."},{"n":193,"g":15,"q":"A 5-year-old girl is four hours into treatment for diabetic ketoacidosis. She develops a new severe headache, vomits, becomes irritable, and her heart rate falls from 112 to 62 per minute. What is the best immediate action?","o":["Give a sodium bicarbonate bolus","Give an insulin bolus","Increase the fluid rate to correct acidosis faster","Give mannitol or hypertonic saline immediately","Obtain a head CT before any treatment"],"a":3,"e":"A new headache, vomiting, slowing heart rate unexplained by sleep or volume repletion, and a change in mental status after treatment starts are warning signs of cerebral edema. Mannitol 0.5 to 1 g/kg or 3 percent saline 2.5 to 5 mL/kg is given promptly.","k":"Treat suspected cerebral edema in pediatric diabetic ketoacidosis at once with mannitol or hypertonic saline."},{"n":194,"g":15,"q":"A 9-year-old boy in diabetic ketoacidosis has just had intravenous fluids started. What is the correct plan for insulin?","o":["Give a 0.1 unit/kg bolus first, then start the insulin infusion at once without delay","Give insulin only after the pH is above 7.3","Infusion at 0.05 to 0.1 units/kg per hour, an hour after fluids, no bolus","Use subcutaneous insulin only until the acidosis resolves fully and the pH normalizes","Start insulin before any fluids have been given, within the first few minutes"],"a":2,"e":"Fluids are started first, and insulin follows at least one hour later at 0.05 to 0.1 units/kg per hour of regular insulin. An initial bolus is avoided because it can cause shock and worsen hypokalemia.","k":"In pediatric diabetic ketoacidosis, start insulin an hour after fluids with no bolus."},{"n":195,"g":15,"q":"A 7-year-old girl has moderate diabetic ketoacidosis with a pH of 7.15. She is alert with fair perfusion. What is the best initial fluid plan?","o":["A sodium bicarbonate infusion to correct the acidosis within the first hour of care","40 mL/kg of saline given as fast as possible through two large intravenous lines","Replacement of the entire fluid deficit within four hours using normal saline","0.18 percent saline at the maintenance rate only, with no initial bolus","Saline 10 to 20 mL/kg over 30 minutes, deficit over 24 to 48 hours"],"a":4,"e":"The initial resuscitation is 10 to 20 mL/kg of 0.9 percent saline over 20 to 30 minutes, using 20 mL/kg if perfusion is poor. The remaining deficit is replaced over 24 to 48 hours along with maintenance, with the aim of avoiding rapid shifts.","k":"Resuscitate pediatric diabetic ketoacidosis with 10 to 20 mL/kg saline and replace the deficit over 24 to 48 hours."},{"n":196,"g":16,"q":"A 35-year-old man is bitten on the hand by a rattlesnake. Two hours later the swelling has spread past the wrist toward the forearm, and he has a painful hemorrhagic bleb at the bite site. Which finding most clearly supports giving antivenom?","o":["Two puncture marks seen at the bite site","Mild pain at the bite site with no swelling","Positive identification of the snake as a pit viper species","Anxiety and a fast heart rate in the patient after the bite","Progressive swelling with spreading local tissue injury"],"a":4,"e":"Antivenom is indicated for significant or progressive local tissue injury, systemic toxicity, or significant or progressive hematologic toxicity. Puncture marks alone, mild pain, and anxiety do not meet these criteria.","k":"Give antivenom for progressive local injury, systemic toxicity, or hematologic toxicity after crotalid envenomation."},{"n":197,"g":16,"q":"Which first-aid measures are appropriate for a patient with a suspected rattlesnake bite on the forearm who is awaiting transport?","o":["Pack the limb in ice water to slow the spread of the venom","Make an incision over the fang marks and apply suction with a pump","Give an NSAID for pain control","Apply a tourniquet above the bite to slow the venom spread","Remove rings, immobilize the limb, and mark the swelling edge"],"a":4,"e":"Initial care includes removing rings and tight clothing, immobilizing and elevating the limb, and marking the edge of swelling with the date and time to track progression. Tourniquets, ice, incision, suction devices, and NSAIDs, which impair platelet function, should be avoided.","k":"For crotalid bites, immobilize and elevate the limb and mark the swelling, and avoid tourniquets, ice, incision, and NSAIDs."},{"n":198,"g":16,"q":"A 28-year-old man has been treated with antivenom for a rattlesnake bite and his platelets and fibrinogen have normalized. He asks about follow-up. Which plan is correct?","o":["Repeat testing only if he develops a fever","Repeat coagulation studies at 2 to 3 days and 5 to 7 days","Repeat testing once at six months","Repeat testing only if he develops bleeding","No further testing is needed once the laboratory values normalize"],"a":1,"e":"Coagulopathy from Crotalus species can rebound after antivenom is given, so for possible rattlesnake envenomation laboratory tests are repeated at 2 to 3 days and again at 5 to 7 days.","k":"Rattlesnake coagulopathy can recur after antivenom, so recheck labs at 2 to 3 and 5 to 7 days."},{"n":199,"g":16,"q":"A diver surfaces after a deep dive and 2 hours later develops numbness and weakness of the legs and difficulty urinating. What is the best initial management?","o":["Return to the water for in-water recompression at a shallow depth","100 percent oxygen and urgent transport for recompression","A head CT before giving any oxygen","Aspirin and discharge with outpatient follow-up in a few days","Reassurance and observation for 24 hours at home with oral fluids"],"a":1,"e":"Neurologic symptoms indicate type II decompression sickness. Start high-flow 100 percent oxygen, keep the patient supine as needed, give fluids, and arrange recompression immediately. Diagnosis is clinical, and CT and MRI have low sensitivity.","k":"Treat suspected neurologic decompression sickness with 100 percent oxygen and urgent recompression."},{"n":200,"g":16,"q":"A scuba diver loses consciousness and has a seizure within minutes of surfacing from a shallow dive after holding his breath during ascent. Which diagnosis should be assumed?","o":["Hypoglycemia from exertion during the dive","Chokes from a massive venous bubble load","Arterial gas embolism from pulmonary barotrauma","Type I decompression sickness with skin involvement","Nitrogen narcosis from the depth of the dive"],"a":2,"e":"Any diver who loses consciousness shortly after surfacing should be assumed to have arterial gas embolism. It starts during or within minutes of ascent, even from shallow depths, and is usually caused by breath holding or airway obstruction. Treatment is similar to that for decompression sickness.","k":"Loss of consciousness soon after surfacing means arterial gas embolism until proven otherwise."},{"n":201,"g":16,"q":"A diver with decompression sickness must be evacuated by air to a hyperbaric facility. Which aircraft arrangement is preferred?","o":["An unpressurized aircraft flown at 10,000 feet without supplemental oxygen to save time","A 1 atmosphere cabin, or an unpressurized aircraft flown low with oxygen","A helicopter flown at maximum altitude to shorten the transport time as much as possible","A standard commercial cabin pressurized to about 8,000 feet for the whole flight","Any aircraft, since altitude does not matter"],"a":1,"e":"Reduced pressure at altitude can worsen decompression sickness. Commercial cabins are pressurized to about 2,438 m (8,000 feet), so an aircraft with 1 atmosphere internal pressure is preferred, or an unpressurized aircraft flown low, ideally below 609 m (2,000 feet), with continuous oxygen.","k":"Evacuate decompression sickness patients with low altitude or a 1 atmosphere cabin."},{"n":202,"g":16,"q":"A climber at 4,500 m has severe breathlessness and cough with pink frothy sputum. A storm prevents descent and no supplemental oxygen or portable hyperbaric chamber is available. Which drug should be added?","o":["Acetazolamide","Salmeterol","Dexamethasone","Nifedipine","Furosemide"],"a":3,"e":"For high-altitude pulmonary edema, descent and oxygen are first, and nifedipine is used when descent is impossible or delayed and oxygen or hyperbaric therapy is unavailable. Diuretics and acetazolamide are not recommended for treatment.","k":"Use nifedipine for high-altitude pulmonary edema when descent and oxygen are unavailable."},{"n":203,"g":16,"q":"A climber at 4,800 m develops ataxia, confusion, and a severe headache. Which management is recommended?","o":["A furosemide dose to reduce the brain swelling","Continued ascent at a slower pace with close observation by the group","Immediate descent with dexamethasone and supplemental oxygen","Acetazolamide alone and rest at altitude for a day before reassessing","Ginkgo biloba taken by mouth"],"a":2,"e":"High-altitude cerebral edema is treated with descent, supplemental oxygen when available, and dexamethasone. A portable hyperbaric chamber is used for severe cases when descent is not possible.","k":"High-altitude cerebral edema needs descent, oxygen, and dexamethasone."},{"n":204,"g":16,"q":"A traveler asks which drug is recommended to prevent acute mountain sickness during a rapid ascent to 4,200 m. Which is the best choice?","o":["Inhaled budesonide","Salmeterol","Acetaminophen","Acetazolamide","Ginkgo biloba"],"a":3,"e":"Acetazolamide should be strongly considered for travelers at moderate or high risk of acute mountain sickness, and dexamethasone is an alternative for adults. Ginkgo biloba, inhaled budesonide, and acetaminophen are not recommended for prevention.","k":"Acetazolamide is recommended for acute mountain sickness prophylaxis; ginkgo and budesonide are not."},{"n":205,"g":16,"q":"A 30-year-old previously unvaccinated man has a dog bite on his hand. The dog cannot be observed. Which post-exposure regimen is correct?","o":["Immune globulin given intramuscularly in the buttock only, with no wound infiltration","Wound care alone, with observation of the patient for symptoms of rabies","Vaccine on days 0 and 3 only, without immune globulin or any wound irrigation","Immune globulin mixed in the same syringe as the first vaccine dose, given in the deltoid","Wound washing, HRIG 20 IU/kg around the wound, and vaccine on days 0, 3, 7, and 14"],"a":4,"e":"Wounds are cleaned with soap and water, and virucidal irrigation such as povidone-iodine can be added. Human rabies immune globulin is given at 20 IU/kg on day 0, infiltrated into and around the wound if feasible, and the vaccine is given on days 0, 3, 7, and 14. Immune globulin and vaccine are never mixed.","k":"Unvaccinated rabies exposure needs wound care, immune globulin infiltrated around the wound, and four vaccine doses."},{"n":206,"g":16,"q":"A 40-year-old woman who completed a full rabies pre-exposure vaccine series two years ago is bitten by a stray dog that cannot be tested. Which post-exposure plan is correct?","o":["Immune globulin plus four vaccine doses on days 0, 3, 7, and 14","Vaccine on days 0, 3, 7, 14, and 28","Immune globulin alone, without any vaccine","No rabies immune globulin, and vaccine on days 0 and 3","No treatment because she was previously vaccinated"],"a":3,"e":"Previously vaccinated persons do not receive immune globulin. They receive the vaccine on days 0 and 3. Immunosuppressed people who are unvaccinated need five doses on days 0, 3, 7, 14, and 28.","k":"Previously vaccinated patients need two post-exposure vaccine doses and no immune globulin."},{"n":207,"g":17,"q":"A 48-year-old man wakes with muffled hearing in the left ear. Otoscopy is normal. The Weber test lateralizes to the right ear, and air conduction is better than bone conduction on the Rinne test in both ears. He has no focal neurologic deficit. Which management is most appropriate?","o":["No treatment, since the cause is almost always idiopathic and cannot be treated","Antiviral therapy alone without corticosteroids, because the cause is almost always viral","Oral corticosteroids, after excluding conductive loss and stroke, with prompt audiometry","Noncontrast head CT and neurosurgical consultation for every patient with sudden unilateral hearing loss","Oral antibiotics for presumed otitis media, with reassurance that the hearing will return within days"],"a":2,"e":"The pattern suggests sudden sensorineural hearing loss, which is mostly idiopathic. The emergency evaluation confirms a normal ear examination, uses Weber and Rinne to exclude conductive loss, and excludes stroke with a neurologic examination. Oral steroids are the usual treatment, antivirals are not routine without exam findings, and routine CT head is not needed without other findings.","k":"Sudden sensorineural hearing loss is treated with steroids once conductive loss and stroke are excluded."},{"n":208,"g":17,"q":"A 61-year-old man with hypertension and diabetes has sudden hearing loss in the right ear with vertigo, vomiting, and inability to walk without falling toward the right. Which diagnosis must be excluded first?","o":["Meniere disease flare, which causes episodic hearing loss with vertigo lasting hours","Vestibular neuritis, which causes vertigo without any hearing loss","Impacted cerumen causing a conductive loss and a positional dizziness","Posterior circulation stroke from anterior inferior cerebellar artery occlusion","Acute otitis media with an inner ear complication"],"a":3,"e":"Sudden hearing loss with vertigo and ataxia in a patient with vascular risk factors raises concern for an anterior inferior cerebellar artery infarct, which is a recognized cause of sudden hearing loss. The workup of sudden sensorineural hearing loss includes a complete neurologic examination to exclude stroke before attributing the loss to an inner ear cause.","k":"Hearing loss plus vertigo and gait ataxia in a vascular patient is stroke until proven otherwise."},{"n":209,"g":17,"q":"A 3-year-old boy was treated for acute otitis media one week ago. He now has fever, and the left ear is pushed forward and downward with swelling behind it. The postauricular crease is obliterated. Which imaging study is the best next step?","o":["Lumbar puncture before any imaging, to look for meningitis from the ear infection","Tympanometry to assess middle ear compliance in the office","Plain skull radiographs to look for a mastoid air cell opacity","CT of the temporal bone and mastoid with intravenous contrast","Audiometry to quantify the hearing loss before any further workup"],"a":3,"e":"These findings indicate acute mastoiditis, a complication of otitis media. Contrast-enhanced CT of the mastoid shows the bony involvement and any abscess and is about 90% sensitive. Treatment includes intravenous antibiotics, ENT consultation, and admission, because intracranial complications such as venous sinus thrombosis, meningitis, and brain abscess can follow.","k":"A protruding ear after otitis media is mastoiditis and needs contrast CT and admission."},{"n":210,"g":17,"q":"A 72-year-old man with diabetes has severe ear pain out of proportion to the examination that has persisted for three weeks despite topical antibiotic drops. The canal is edematous with granulation tissue on the floor. He now has new left facial weakness. Which treatment approach is most appropriate?","o":["Systemic antipseudomonal therapy, such as a fluoroquinolone, with ENT involvement","Topical antifungal drops with outpatient follow-up in a month, since the infection is likely fungal","A longer course of topical ciprofloxacin alone, since the canal is the only site of disease","Oral acyclovir for presumed Ramsay Hunt syndrome and early dermatology follow-up","Oral amoxicillin and continued use of the topical drops at home with a recheck in a week"],"a":0,"e":"This is necrotizing, or malignant, otitis externa, usually caused by Pseudomonas in over 90% of cases and seen in diabetic or immunosuppressed patients. Otitis externa that persists beyond two to three weeks of topical therapy with granulation tissue and a cranial nerve palsy should raise concern. Treatment is systemic antipseudomonal therapy with ENT involvement.","k":"Refractory otitis externa with granulation tissue in a diabetic is necrotizing otitis externa."},{"n":211,"g":17,"q":"A 70-year-old man with diabetes is diagnosed with necrotizing otitis externa. Which cranial nerve is most often the first to be involved?","o":["The hypoglossal nerve","The olfactory nerve","The trigeminal nerve","The abducens nerve","The facial nerve"],"a":4,"e":"The facial nerve is often the first cranial nerve involved, and cranial nerves IX, X, and XI can follow. A CT can miss early osteomyelitis because about 30% bone destruction is needed to see it, and MRI is more sensitive for intracranial complications.","k":"Facial palsy is the classic first cranial neuropathy in necrotizing otitis externa."},{"n":212,"g":17,"q":"A 3-year-old girl has had two days of foul-smelling unilateral nasal discharge. A radiograph shows a round metallic disc in the right nostril with a double contour. Which management is most appropriate?","o":["Give honey by mouth and recheck the child in the morning to see if it moved","Irrigate the nose with warm water to flush the object out of the nostril","Watch for two days to see whether it passes spontaneously with the nasal discharge","Arrange urgent removal of the object by a clinician skilled in the technique","Ask the child to sneeze forcefully and send her home if it does not come out"],"a":3,"e":"A button battery lodged in the nose or ear requires urgent removal because it can cause tissue injury, and unilateral nasal discharge may be the only clue. Honey and sucralfate are used as temporizing measures for esophageal impaction and are not a substitute for removal.","k":"A button battery in the nose or ear is removed urgently, not observed."},{"n":213,"g":17,"q":"An 18-month-old child is brought in one hour after witnessed ingestion of a button battery. She is drooling, and a radiograph shows a round object with a double contour at the level of the clavicles. Which management is most appropriate?","o":["Induce vomiting with ipecac, because the battery is still high in the esophagus and may be expelled","Activated charcoal followed by discharge home with strict return precautions","Emergent endoscopic removal, without waiting for oral agents or for the stomach to empty","Whole bowel irrigation until the battery passes into the stomach and then the stool","Observe in the emergency department and repeat the radiograph in 24 hours to see whether it moved"],"a":2,"e":"A battery lodged in the esophagus is an emergency because tissue necrosis can occur within about two hours and injury continues after removal. The goal is removal within two hours of impaction. Do not induce emesis, and do not use whole bowel irrigation, charcoal, or a nasogastric tube, and do not delay removal for oral agents or a recent meal.","k":"An esophageal button battery needs emergent endoscopic removal."},{"n":214,"g":17,"q":"A 14-year-old boy has a permanent upper central incisor knocked out in a bicycle fall 20 minutes ago. His coach brings the tooth wrapped in dry tissue. If immediate reimplantation is not possible, which transport medium gives the longest expected viability?","o":["Antiseptic mouthwash, to keep the root surface sterile","Tap water, kept cool in a clean cup until the dentist can see the tooth","Oral rehydration solution or balanced salt solution","Tissue paper, kept at room temperature in the child's pocket","Dry gauze, wrapped tightly in a clean cloth"],"a":2,"e":"Dry storage allows less than about 60 minutes of viability, milk about 3 to 8 hours, and oral rehydration solution or Hank's balanced salt solution about 12 to 24 hours. The best result still comes from reimplanting as soon as possible, handling the tooth by the crown, and rinsing with saline without scrubbing the root.","k":"Reimplant avulsed permanent teeth at once, and store them in the best available medium if you cannot."},{"n":215,"g":17,"q":"A 3-year-old child falls and a primary upper incisor is knocked out. The socket has stopped bleeding. The parent brings the tooth with them. What is the most appropriate management?","o":["Place the tooth back in the socket and use the child's own gauze as a splint","Treat with oral antibiotics and reimplant the tooth at the dentist","Reimplant the tooth and splint it to adjacent teeth","Do not reimplant the tooth, and arrange follow-up with a pediatric dentist","Soak the tooth in citric acid and then reimplant it"],"a":3,"e":"Primary teeth are not reimplanted because doing so can interfere with eruption of the permanent tooth. Referral to a pediatric dentist within one to two weeks for a space maintainer is appropriate. A knocked out permanent tooth, in contrast, should be reimplanted as quickly as possible.","k":"Never reimplant an avulsed primary tooth."},{"n":216,"g":17,"q":"A 30-year-old man slapped on the ear has pain, mild hearing loss, and a small linear tympanic membrane perforation with some blood in the canal. Which additional finding should prompt urgent ENT evaluation?","o":["Vertigo with nystagmus or ataxia","Pain that improves over the first day","A small amount of blood-tinged drainage","A history of swimming earlier in the week","Persistent mild ear fullness"],"a":0,"e":"Small isolated perforations usually heal within four to six weeks with water kept out of the ear. Urgent ENT evaluation is warranted for hearing loss of 40 dB or more, vertigo, nystagmus or ataxia, facial nerve injury, a large perforation with folded edges, or prolonged healing, since these suggest inner ear or facial nerve injury.","k":"Vertigo, facial weakness, or marked hearing loss after tympanic membrane trauma is not a minor injury."},{"n":217,"g":17,"q":"A 24-year-old man has had three days of sore throat. He now has trismus, drooling, a muffled voice, and a swollen right tonsil with deviation of the uvula to the left. You plan needle aspiration. Which measure best reduces the risk of carotid injury?","o":["Have the patient swallow during advancement so that muscle contraction protects the carotid artery","Use ultrasound to identify vasculature and keep the needle depth shallow","Advance the needle blindly in a posterior and lateral direction until pus returns","Aspirate with a larger blade directed laterally to widen the opening and drain the abscess","Choose the deepest pole of the tonsil to reach the center of the abscess cavity"],"a":1,"e":"The carotid artery lies about 2.5 cm posterior and lateral to the tonsil, so aspiration and incision should be shallow. Ultrasound can distinguish cellulitis from abscess and show vascular structures before aspiration. Cure with aspiration is about 93 to 95 percent, with recurrence in roughly one in ten.","k":"Keep peritonsillar needle depth shallow and use ultrasound to avoid the carotid."},{"n":218,"g":18,"q":"A 68-year-old man with atrial fibrillation not on anticoagulation reports sudden, painless loss of vision in his right eye that began 90 minutes ago. Visual acuity is hand motion in that eye. The retina looks diffusely pale with a cherry-red spot at the macula and segmented columns of blood in the arterioles. His blood pressure is 158/92 mm Hg. Which management approach is most appropriate?","o":["Perform anterior chamber paracentesis at the bedside as the first and only intervention, before any other workup","Reassure him that this is a retinal migraine and arrange outpatient ophthalmology review in one week if it persists or recurs","Discharge on aspirin after a normal noncontrast head CT, with neurology follow-up in two weeks","Start oral prednisone and arrange a temporal artery biopsy within three months, with no further urgent workup","Treat as an emergency, with immediate ophthalmology involvement and a stroke-pathway workup including carotid imaging"],"a":4,"e":"A central retinal artery occlusion is a retinal stroke, and treatment should start before the diagnosis is formally confirmed because the timing of irreversible retinal damage is uncertain and may begin within minutes. The source advises prompt ophthalmology referral and a stroke-style evaluation, because carotid disease is the most common embolic source, and recommends against paracentesis because of injury and infection risk.","k":"Painless monocular vision loss with a pale retina and cherry-red spot is a retinal stroke that needs emergent ophthalmology and a vascular workup."},{"n":219,"g":18,"q":"A 76-year-old woman has sudden vision loss in her left eye with a pale retina and cherry-red spot. For two weeks she has had a new headache, scalp tenderness, and pain in her jaw when she chews. The ESR and CRP are markedly elevated. Which statement best guides her treatment?","o":["High-dose intravenous corticosteroids should start now, on the basis of history and inflammatory markers","Anticoagulation with heparin is the preferred first treatment for an arteritic occlusion of the retinal artery","Treatment is limited to aspirin because the occlusion is embolic and steroids would worsen the outcome","Corticosteroids should be withheld until the temporal artery biopsy confirms the diagnosis, to avoid a false negative","Corticosteroids are indicated only if a head MRI shows an acute infarct in the optic radiation"],"a":0,"e":"When the history fits giant cell arteritis and the ESR or CRP is raised, high-dose intravenous steroids start immediately in an arteritic occlusion. A temporal artery biopsy remains useful and can be done within about two weeks of starting steroids, so waiting for it only risks loss of the other eye.","k":"Do not delay steroids for biopsy when giant cell arteritis threatens sight."},{"n":220,"g":18,"q":"A 24-year-old man is struck in the right eye by a squash ball. Blood layers in the lower third of the anterior chamber. Visual acuity is 20/60 and the pupil is round. Which plan is most appropriate?","o":["Give ibuprofen for pain and discharge him with routine ophthalmology follow-up scheduled next month","Instill topical NSAID drops and discharge without checking the intraocular pressure, since vision is good","Apply a pressure patch to both eyes and keep him flat in bed for 24 hours to let the blood settle","Dilate the pupil and then immediately remove the layered blood with irrigation in the emergency department before any pressure check","Elevate the head, shield the eye, check the pressure, avoid aspirin and NSAIDs, and get ophthalmology review"],"a":4,"e":"A traumatic hyphema is managed by elevating the head, shielding the eye, checking pressure because larger hyphemas raise the risk of high intraocular pressure, and avoiding aspirin and NSAIDs that increase bleeding risk. Emergency ophthalmology assessment is needed, and daily pressure checks follow if the patient is discharged.","k":"Hyphema care is head up, shield on, pressure checked, no antiplatelet drugs, and ophthalmology the same day."},{"n":221,"g":18,"q":"A 5-year-old boy has blood layering in the anterior chamber of his left eye. There is no history of trauma, and his mother says he bruises easily. Which concern should most influence the workup?","o":["Allergic conjunctivitis, which is treated with topical antihistamines and cold compresses at home","Herpetic keratitis, which needs only a fluorescein dendrite examination and topical antiviral drops","A foreign body in the anterior chamber that will pass spontaneously within a few days of rest","A retinal detachment from silent trauma, which can be diagnosed by examination and needs no laboratory testing","An underlying bleeding disorder or leukemia, so blood count and coagulation studies are needed"],"a":4,"e":"A hyphema without trauma can be a sign of a blood disorder such as leukemia, hemophilia, or von Willebrand disease. Aspirin and warfarin can also cause spontaneous hyphema. In a child with easy bruising, laboratory evaluation belongs alongside emergency ophthalmic care.","k":"Spontaneous hyphema should prompt a search for a bleeding disorder or leukemia."},{"n":222,"g":18,"q":"An 8-year-old girl has four days of fever and a swollen, red left upper eyelid. She now has pain when she moves the eye and the eye looks pushed forward. The eyelid swelling is similar on both examination and photographs. Which finding most strongly indicates orbital rather than preseptal cellulitis?","o":["Proptosis with painful or limited eye movements","Eyelid erythema, which is equally prominent in preseptal infection","Swelling of the upper eyelid, which is present in both conditions and does not localize the infection","A temperature of 38.5 C, which can occur with either infection","A history of a recent insect bite near the eye, which can start either infection"],"a":0,"e":"Eyelid swelling occurs in both conditions. Orbital signs are what point to infection behind the septum: proptosis, pain with movement, restricted motility, diplopia, reduced acuity, an afferent pupillary defect, or optic disc changes. Orbital cellulitis needs intravenous antibiotics and close ophthalmic monitoring because it can threaten vision and life.","k":"Proptosis and painful ophthalmoplegia separate orbital from preseptal cellulitis."},{"n":223,"g":18,"q":"A 58-year-old man has a painful vesicular rash across the right forehead that began two days ago. There are vesicles on the tip of his nose. He has no visual symptoms. Why do the nasal vesicles matter?","o":["They suggest nasociliary nerve involvement, which raises corneal risk and needs slit-lamp examination","They indicate involvement of the central nervous system and require a lumbar puncture before any treatment","They indicate bacterial superinfection that needs systemic antibiotics and urgent wound culture","They prove underlying immunosuppression and require admission for intravenous therapy in every case","They confirm that the eye is spared because the maxillary branch rather than the ophthalmic branch is involved"],"a":0,"e":"Vesicles at the tip of the nose are called Hutchinson sign. The nasociliary branch of the ophthalmic division supplies both the nasal tip and the cornea, so the sign predicts ocular involvement even when the eye feels normal. About half of herpes zoster ophthalmicus cases involve the eye.","k":"Nasal tip vesicles predict eye involvement in herpes zoster ophthalmicus."},{"n":224,"g":18,"q":"A 63-year-old man on chemotherapy has a vesicular rash over the left forehead and upper eyelid with new blurred vision. Slit-lamp examination shows pseudodendrites. Which disposition and treatment is most appropriate?","o":["Discharge with a topical antibiotic ointment for the skin and no systemic antiviral therapy","Apply topical antiviral drops only and discharge without ophthalmology input or neuroimaging","Discharge with oral valacyclovir and a routine ophthalmology review in one month for the eye findings","Start high-dose oral prednisone alone and arrange outpatient follow-up with the oncology team in a week","Admit for intravenous acyclovir, obtain neuroimaging for the vision loss, and involve ophthalmology"],"a":4,"e":"In immunocompromised patients with herpes zoster ophthalmicus, intravenous acyclovir with hospitalization is recommended, and neuroimaging is advised when vision is lost. Pseudodendrites lack the epithelial erosion of true herpes simplex dendrites. Steroid use needs ophthalmology input.","k":"Immunocompromised patients with zoster ophthalmicus need admission and intravenous acyclovir."},{"n":225,"g":18,"q":"A 62-year-old woman describes flashes of light followed by a dark curtain moving across the lateral part of her right visual field over the past six hours. Central acuity is normal. The red reflex is present. Which statement about timing is most accurate?","o":["Repair is urgent but can safely wait up to a week if she lies flat with the detached side up","A macula-on detachment is an ophthalmologic emergency with same-day or next-day repair","Only macula-off detachments need an ophthalmology consultation from the emergency department","She can be seen in the eye clinic within two weeks, because her central acuity is currently normal","Outpatient observation is appropriate until the curtain reaches the central part of her vision"],"a":1,"e":"A curtain across the field points to retinal detachment, and a macula-on detachment is the most time-sensitive because central vision can still be saved. Same-day contact with a retinal surgeon is appropriate, and a macula-off detachment, though urgent, is repaired within about 24 to 72 hours.","k":"Preserve the macula: macula-on detachment needs same-day retinal care."},{"n":226,"g":18,"q":"A 55-year-old man with poorly controlled diabetes has sudden new floaters and blurred vision in the left eye. Funduscopy is obscured. Ocular ultrasound shows swirling echogenic material in the posterior chamber without a membrane tethered to the optic disc. What is the best next step?","o":["Arrange emergency surgery tonight because ultrasound has diagnosed a retinal detachment","Keep him flat for 48 hours and follow up in three weeks","Elevate the head of the bed and obtain ophthalmology review within 24 hours","Perform a lumbar puncture to exclude subarachnoid hemorrhage","Start oral steroids and discharge with a return visit in two weeks"],"a":2,"e":"Swirling echogenic material in the posterior chamber is the ultrasound pattern of vitreous hemorrhage, while a bright membrane tethered to the optic disc suggests detachment. Vitreous hemorrhage without detachment needs ophthalmology consultation within about 24 hours, and elevating the head lets blood settle inferiorly and can improve the view.","k":"Vitreous hemorrhage swirls on ultrasound and needs head elevation and prompt ophthalmology review."},{"n":227,"g":18,"q":"A 28-year-old woman who sleeps in her contact lenses has severe pain in the right eye, photophobia, and a white corneal infiltrate with a small hypopyon. Which approach is most appropriate?","o":["Stop lens wear and obtain urgent ophthalmology evaluation for a presumed sight-threatening ulcer","Reassure her and recheck in two weeks without any antimicrobial therapy, since the cornea will heal","Discharge with topical anesthetic drops to use as needed for pain relief until she is seen","Discharge with a topical steroid alone to reduce the inflammation and the pain from the infiltrate","Treat as a simple abrasion and discharge with lubricating drops and routine ophthalmology follow-up next month"],"a":0,"e":"Corneal ulcers in contact lens wearers are ocular emergencies and are commonly caused by Pseudomonas aeruginosa and Staphylococcus. Ophthalmology should be involved at the first visit, and any patient discharged needs repeat evaluation within about 24 hours. Fluoroquinolones have good ocular penetration, but the treatment plan belongs with ophthalmology.","k":"A contact lens ulcer with a hypopyon is an ocular emergency, not an abrasion."},{"n":228,"g":18,"q":"A 10-year-old boy is hit in the left eye by a baseball. There is almost no bruising or swelling, and the eye is white. He cannot look upward, he vomits twice, and his heart rate is 48 beats per minute. What is the best next step?","o":["Observe for two weeks until the swelling resolves before deciding about surgery on the fracture","Give an antiemetic and discharge him to rest at home with ice applied to the eye for a week","Treat the bradycardia with atropine and discharge him when the heart rate has normalized for an hour","Obtain thin-cut orbital CT and arrange urgent surgical repair, ideally within about 48 hours","Order a brain MRI for the vomiting and bradycardia and defer any orbital imaging until it is read"],"a":3,"e":"A white-eyed blowout fracture in a child can show severe motility restriction with little external trauma, and nausea, vomiting, and bradycardia are the oculocardiac reflex from entrapped muscle. CT is the imaging of choice but can underestimate entrapment in children, so clinical findings can justify surgery. Early repair, ideally within 48 hours, is associated with better long-term motility.","k":"Vomiting, bradycardia, and limited upgaze in a child after eye trauma mean entrapment until proven otherwise."},{"n":229,"g":19,"q":"A 9-year-old boy with severe hemophilia A falls from a bicycle and strikes his head. He is alert, has no vomiting, and has a small frontal bruise. His mother has factor concentrate at home. What is the most appropriate first step?","o":["Give factor replacement immediately, then image and observe according to symptoms","Give oral tranexamic acid and discharge with return precautions, since he has no signs of bleeding","Observe for six hours at home and give factor only if he develops headache or vomiting","Give desmopressin alone because he is neurologically normal and has only a small bruise","Obtain a head CT first and wait for the result before giving any factor concentrate to the child"],"a":0,"e":"Head or neck trauma in a patient with hemophilia warrants factor replacement immediately, even without evident bleeding, because clot stability may fail and delayed intracranial bleeding is a serious risk. Intracranial hemorrhage is the most common cause of hemorrhagic death in hemophilia.","k":"In hemophilia, treat head trauma with factor first and assume bleeding until proven otherwise."},{"n":230,"g":19,"q":"A 28-year-old man with hemophilia A has a swollen, warm, painful knee that began after a minor twist. He is afebrile. Which management is most appropriate?","o":["Wait for orthopedics to perform arthrocentesis first, since factor is not needed for a small joint bleed","Aspirate the joint to prevent cartilage damage from blood, before giving any factor replacement","Replace factor, protect, elevate, and ice the joint, and do not aspirate","Give intramuscular ketorolac for pain, which also reduces the joint swelling quickly","Start oral aspirin and a compression bandage, and arrange routine follow-up in a month"],"a":2,"e":"A swollen joint in hemophilia is a hemarthrosis until proven otherwise. Treatment is factor replacement with elevation, ice, and protection of the joint, and arthrocentesis is not indicated. NSAIDs and intramuscular injections should be avoided.","k":"Treat hemarthrosis in hemophilia with factor, not with aspiration or NSAIDs."},{"n":231,"g":19,"q":"A 35-year-old man with hemophilia A has a thigh hematoma that continues to expand after a standard factor VIII dose. A mixing study shows that the prolonged PTT does not correct. Which treatment is most appropriate?","o":["A bypassing agent, such as activated prothrombin complex concentrate or factor VIIa","Protamine sulfate to reverse any residual heparin effect","A repeat of the same factor VIII dose, given at twice the original dose","Platelet transfusion to correct the bleeding time and stabilize the expanding hematoma","Vitamin K and fresh frozen plasma given together as the first-line therapy at once"],"a":0,"e":"A PTT that does not correct on mixing indicates an inhibitor. Patients with inhibitors can be refractory to conventional factor and need hematology input and bypassing agents such as activated prothrombin complex concentrate or recombinant factor VIIa.","k":"A failed factor response with an uncorrected mixing study means an inhibitor."},{"n":232,"g":19,"q":"A 32-year-old woman has recurrent nosebleeds and heavy menses. Platelet count and PT are normal, the PTT is mildly prolonged, and von Willebrand factor activity is low. She is diagnosed with type 1 von Willebrand disease and has mucosal bleeding. Which agent is appropriate and acts by releasing stored von Willebrand factor?","o":["Vitamin K","Platelet transfusion","Aspirin","Protamine sulfate","Desmopressin"],"a":4,"e":"Desmopressin releases von Willebrand factor from endothelial stores and is usually effective in type 1 disease. Factor concentrate containing von Willebrand factor is first line for bleeding when desmopressin is not suitable. Platelet transfusion is considered only if replacement has been given and bleeding persists, and aspirin, NSAIDs, and heparin should be avoided.","k":"Desmopressin releases stored von Willebrand factor in type 1 disease."},{"n":233,"g":19,"q":"Two adults present with bleeding. One has a deficiency of a clotting factor and the other has von Willebrand disease. Which feature best favors a factor deficiency such as hemophilia?","o":["Gingival bleeding","Prolonged bleeding after a minor skin cut","Spontaneous bleeding into a joint","Epistaxis","Heavy menstrual bleeding"],"a":2,"e":"Von Willebrand disease causes mainly mucocutaneous bleeding such as epistaxis, gum bleeding, and menorrhagia. Hemarthrosis is unusual in von Willebrand disease and is typical of factor deficiencies.","k":"Hemarthrosis points to a factor deficiency, not to von Willebrand disease."},{"n":234,"g":19,"q":"A 40-year-old woman has petechiae on her legs and a platelet count of 25,000 per microliter. She has no mucosal bleeding and no other symptoms. She is otherwise well. Which treatment is most appropriate?","o":["A course of oral corticosteroids with early hematology follow-up","Emergency splenectomy","Platelet transfusion now","High-dose methylprednisolone, IVIG, and platelet transfusion together","No treatment and discharge without follow-up"],"a":0,"e":"Adults with immune thrombocytopenia and minor or no bleeding can be treated with steroids when the platelet count is below about 30,000. Admission is generally reserved for significant bleeding or counts below 20,000. Combined high-dose therapy and platelet transfusion are for severe bleeding.","k":"Mild bleeding with a low platelet count in immune thrombocytopenia is treated with steroids."},{"n":235,"g":19,"q":"A 50-year-old man with immune thrombocytopenia presents with hematemesis and a platelet count of 6,000 per microliter. He is tachycardic and his hemoglobin is falling. Which treatment is most appropriate?","o":["Oral prednisone alone as an outpatient with a platelet recheck in three days","High-dose steroids, intravenous immunoglobulin, and platelet transfusion","Observation only, because platelet transfusion always destroys the transfused cells in this condition","Rho(D) immune globulin alone, regardless of his Rh type, since it is the cheapest option","Elective splenectomy next week, with no immediate therapy for the active bleeding"],"a":1,"e":"For severe bleeding in adult immune thrombocytopenia, first-line treatment combines high-dose steroids, intravenous immunoglobulin, and platelet transfusion. Rho(D) immune globulin is an additional option that works by causing mild hemolysis in Rh-positive patients and is not first line for severe bleeding.","k":"Severe bleeding in immune thrombocytopenia needs steroids, IVIG, and platelets together."},{"n":236,"g":19,"q":"A 4-year-old child, well-appearing, has widespread bruising and a platelet count of 8,000 per microliter two weeks after a viral illness. There is no mucosal bleeding. Which approach is most appropriate?","o":["Start intravenous immunoglobulin regardless of symptoms, to raise the platelet count quickly","Give a platelet transfusion, since the count is very low and bruising is widespread","Observation with follow-up, since mild or no bleeding does not benefit from steroids or IVIG","Admit for emergency splenectomy, since the platelet count is below 10,000 per microliter","Give high-dose intravenous methylprednisolone, because the platelet count is below 10,000"],"a":2,"e":"In children with immune thrombocytopenia who have mild or no bleeding, steroids and IVIG have not been shown to help regardless of the platelet count, and the child can be managed as an outpatient. Admission and treatment are driven by significant bleeding rather than the number.","k":"Treat the bleeding child, not the platelet count, in pediatric immune thrombocytopenia."},{"n":237,"g":19,"q":"A 50-year-old man develops fever, flank pain, and red urine ten minutes into a red cell transfusion. Which is the first action?","o":["Give furosemide and continue at a slower rate, because circulatory overload is the commonest cause","Obtain a troponin and an ECG before deciding on any change to the transfusion","Stop the transfusion, notify the blood bank, and send a new type and screen","Give diphenhydramine and continue the transfusion at the same rate, as this is likely an allergy","Slow the infusion rate and give acetaminophen, then reassess for fever in thirty minutes"],"a":2,"e":"Whenever a transfusion reaction is suspected, the transfusion is stopped at least temporarily, the blood bank is called, and a new type and screen is drawn. This presentation suggests acute hemolysis from an incompatible unit, which needs evaluation with haptoglobin, LDH, free hemoglobin, bilirubin, urinalysis, and a direct antiglobulin test.","k":"Stop the transfusion first, then investigate."},{"n":238,"g":19,"q":"A 70-year-old man develops dyspnea three hours after a platelet transfusion. His blood pressure is 82/50 mm Hg, temperature is 38.6 C, and the BNP is normal. Chest radiography shows bilateral infiltrates. Which feature favors transfusion-related acute lung injury over transfusion-associated circulatory overload?","o":["An elevated BNP","Hypertension","Hypotension with a normal BNP","Jugular venous distension","An elevated pulmonary artery occlusion pressure"],"a":2,"e":"Both conditions cause dyspnea with bilateral infiltrates. Transfusion-related acute lung injury typically causes hypotension, fever, a normal BNP, and normal filling pressures, whereas circulatory overload causes hypertension, an elevated BNP, jugular venous distension, and elevated filling pressures.","k":"Low pressure, fever, and normal BNP favor TRALI; high pressure and high BNP favor TACO."},{"n":239,"g":19,"q":"A patient develops back pain and dark urine during a transfusion, and an acute hemolytic reaction is suspected. Which laboratory pattern best supports intravascular hemolysis from an incompatible unit?","o":["High BNP with a normal haptoglobin and a normal LDH after the transfusion","High haptoglobin, low LDH, and a negative direct antiglobulin test on the post-transfusion sample","Low haptoglobin, high LDH, and a positive direct antiglobulin test on the post-transfusion sample","Normal LDH, low bilirubin, and a negative urine dipstick for blood on the first voided sample","Eosinophilia with a normal LDH and a normal haptoglobin"],"a":2,"e":"Evaluation of an acute hemolytic reaction includes a CBC and smear, urinalysis, haptoglobin, LDH, free hemoglobin, total and direct bilirubin, and a direct antiglobulin test on pre- and post-transfusion samples. Hemolysis lowers haptoglobin and raises LDH and bilirubin.","k":"Confirm acute hemolysis with haptoglobin, LDH, bilirubin, urinalysis, and a direct antiglobulin test."},{"n":240,"g":19,"q":"A 20-year-old man develops dark urine and jaundice two days after a febrile illness and a meal of fava beans. Hemoglobin is 7.8 g/dL, reticulocytes are high, and the direct antiglobulin test is negative. Which smear finding best supports the likely diagnosis?","o":["Target cells and basophilic stippling","Spherocytes with increased central pallor","Sickled cells with Howell-Jolly bodies","Heinz bodies and bite cells","Schistocytes and helmet cells in large numbers"],"a":3,"e":"Oxidative hemolysis in glucose-6-phosphate dehydrogenase deficiency is triggered by infection, fava beans, and drugs such as dapsone, sulfonamides, nitrofurantoin, and methylene blue. The smear shows Heinz bodies and bite cells with a high reticulocyte count and a negative direct antiglobulin test. Management is to stop the trigger and give supportive care, since hemolysis usually resolves in about 8 to 14 days.","k":"Heinz bodies and bite cells point to G6PD deficiency hemolysis."},{"n":241,"g":19,"q":"A 45-year-old man with newly diagnosed acute myeloid leukemia has a white cell count of 220,000 per microliter, headache, and hypoxemia. Which intervention should be avoided before cytoreduction?","o":["Leukapheresis as a temporizing measure if chemotherapy is delayed","Red cell transfusion to a hemoglobin above 10 g/dL","Broad-spectrum antibiotics for fever, since infection is a leading cause of death in blast crisis","Hydroxyurea started while awaiting induction chemotherapy at the oncology center","Intravenous hydration to counter dehydration, which worsens viscosity and sludging"],"a":1,"e":"Symptomatic hyperleukocytosis, called leukostasis, is a hematologic emergency. Aggressive hydration, early hematology consultation, hydroxyurea, and leukapheresis if chemotherapy is delayed are used, and red cell transfusion to a high hemoglobin before the white count falls raises viscosity. Chemotherapy is the only treatment shown to improve survival.","k":"Do not transfuse red cells to a high hemoglobin in leukostasis before cytoreduction."},{"n":242,"g":19,"q":"A 50-year-old man with acute leukemia has a white cell count of 250,000 per microliter. His arterial blood gas shows a PaO2 of 58 mm Hg, but his pulse oximeter reads 97% and he is breathing comfortably. What best explains the discrepancy?","o":["Pulmonary embolism with intrapulmonary shunt that lowers the PaO2 but not the saturation","Carbon monoxide poisoning, which lowers the pulse oximeter reading but not the PaO2","An arterial sample contaminated with venous blood, which would also lower the pulse oximetry reading","Leukocytes consume oxygen in the sample, so the PaO2 reads falsely low","Methemoglobinemia, which would lower both measurements to about 85%"],"a":3,"e":"In extreme leukocytosis the white cells consume oxygen in vitro, which falsely lowers the measured PaO2. Pulse oximetry is more accurate in this setting. Clinical assessment should still look for true leukostasis, which can cause hypoxemia and respiratory failure.","k":"In extreme leukocytosis, trust the pulse oximeter over the blood gas PaO2."},{"n":243,"g":19,"q":"A 3-year-old girl had bloody diarrhea five days ago and is now pale and has not passed urine in 12 hours. Laboratory tests show anemia with schistocytes, a platelet count of 40,000, a rising creatinine, and normal PT and PTT. Which treatment should be avoided?","o":["Blood pressure control with an antihypertensive","Dialysis if uremia or fluid overload develops","Supportive care in a monitored setting","Early isotonic fluid resuscitation","Antibiotics for the diarrheal illness"],"a":4,"e":"This is hemolytic uremic syndrome, most often from Shiga toxin-producing E. coli. Management is mainly supportive. Antibiotics and antimotility agents may increase toxin release and risk, and platelet transfusion is avoided unless there is life-threatening bleeding because it may worsen thrombosis and renal failure.","k":"In Shiga toxin hemolytic uremic syndrome, avoid antibiotics, antimotility drugs, and routine platelets."},{"n":244,"g":19,"q":"A 28-year-old man becomes cyanotic after benzocaine spray for a procedure. His oxygen saturation is 85% and does not improve with 100% oxygen. His arterial blood appears chocolate brown. Which treatment is most appropriate?","o":["N-acetylcysteine","Exchange transfusion as the first treatment","Hydroxocobalamin","Hyperbaric oxygen as the first treatment","Intravenous methylene blue"],"a":4,"e":"Methemoglobinemia causes cyanosis that does not respond to oxygen and chocolate brown blood. Methylene blue is the treatment when the patient is symptomatic, but it is contraindicated in G6PD deficiency because it can cause hemolysis. Hyperbaric oxygen and exchange transfusion are options when methylene blue fails or is contraindicated.","k":"Oxygen-refractory cyanosis after benzocaine is methemoglobinemia treated with methylene blue."},{"n":245,"g":20,"q":"A 64-year-old man with melanoma has been receiving pembrolizumab for eight weeks. He has seven watery stools a day, abdominal pain, and a low-grade fever. Stool studies and an abdominal CT are obtained. What is the best management?","o":["Start empiric ciprofloxacin only and continue the immunotherapy","Continue the checkpoint inhibitor and give loperamide alone","Discharge with reassurance because the diarrhea is self-limited","Give an antimotility agent and a clear liquid diet only","Hold the checkpoint inhibitor and start corticosteroids"],"a":4,"e":"Checkpoint inhibitor colitis of grade 2 or higher calls for holding the drug and giving corticosteroids, after stool studies and imaging exclude other causes. Colitis occurs in 8 to 33 percent of patients and severe cases can cause perforation or toxic megacolon.","k":"Immune-related colitis of grade 2 or higher means hold the checkpoint inhibitor and start steroids."},{"n":246,"g":20,"q":"Which immune-related adverse event is the most common cause of death among patients treated with checkpoint inhibitors?","o":["Hypothyroidism","Colitis","Pneumonitis","Dermatitis","Hepatitis"],"a":2,"e":"Pneumonitis occurs in about 19 percent of patients and is the most common cause of death from immune-related adverse events. It presents with dyspnea, cough, and chest pain, and imaging is needed.","k":"Pneumonitis is the leading cause of death from checkpoint inhibitor toxicity."},{"n":247,"g":20,"q":"A 58-year-old woman on nivolumab has a grade 1 rash and mild fatigue. Her examination and basic laboratory studies are otherwise normal. What is the appropriate approach?","o":["Admit for intensive care monitoring of the rash","Start infliximab at once for the toxicity","Permanently discontinue the checkpoint inhibitor now and do not rechallenge","Start high-dose corticosteroids and hold the drug until the rash resolves","Continue the inhibitor with monitoring and symptomatic care"],"a":4,"e":"Grade 1 toxicity can be managed with continued therapy, monitoring, and symptomatic treatment. Grade 2 requires holding the drug and giving steroids, grade 3 needs higher-dose steroids, and grade 4 needs resuscitation.","k":"Grade 1 checkpoint inhibitor toxicity can usually be monitored while therapy continues."},{"n":248,"g":20,"q":"A 47-year-old woman received CAR-T cell therapy three days ago. She has a fever of 39.2 C and a blood pressure of 82/50 mmHg that improves to 100/62 after a fluid bolus. She needs low-flow nasal cannula oxygen but no vasopressor. What grade of cytokine release syndrome is this, and what is the management?","o":["Grade 4, with intubation and multiple vasopressors","Grade 2: fluids, supportive care, dexamethasone, and tocilizumab","Immune effector cell neurotoxicity, with levetiracetam only","Grade 1, with a fever work-up only and no further specific treatment","Grade 3, with vasopressors and high-flow oxygen"],"a":1,"e":"Grade 2 cytokine release syndrome has hypotension without a vasopressor requirement and low-flow nasal cannula oxygen. Management includes telemetry, fluids, supplemental oxygen, dexamethasone 4 to 10 mg once, and a single dose of tocilizumab.","k":"Cytokine release syndrome with fluid-responsive hypotension and low-flow oxygen is grade 2 and gets tocilizumab and dexamethasone."},{"n":249,"g":20,"q":"Which presentation meets criteria for grade 3 cytokine release syndrome?","o":["Hypotension that does not need a vasopressor and low-flow nasal cannula oxygen","Fever above 38 C with no hypotension or hypoxia","Hypotension requiring a vasopressor and oxygen by non-rebreather mask","Fever lasting more than three days in a patient who is well","Need for multiple vasopressors and positive-pressure ventilation"],"a":2,"e":"Grade 3 cytokine release syndrome has hypotension requiring a vasopressor (not vasopressin alone) and high-flow nasal cannula, face mask, or non-rebreather oxygen. Grade 4 requires multiple vasopressors and positive-pressure ventilation. Echocardiography is recommended for grade 3 and above.","k":"Grade 3 cytokine release syndrome needs one vasopressor and high-flow oxygen, and grade 4 needs multiple pressors and ventilation."},{"n":250,"g":20,"q":"A 72-year-old woman has a new headache, scalp tenderness, jaw pain when chewing, and blurred vision in the left eye. Her ESR is 95 mm per hour. A temporal artery biopsy can be arranged in three days. What is the best management?","o":["Obtain an MRI of the brain and defer all other treatment","Start antibiotics for presumed bacterial sinusitis","Start high-dose glucocorticoids now, without waiting for biopsy","Start an NSAID and arrange an outpatient review next week","Wait for the biopsy result before starting any steroid treatment"],"a":2,"e":"When giant cell arteritis is strongly suspected, high-dose systemic glucocorticoids are started promptly to prevent irreversible vision loss and involvement of the other eye. Biopsy should not delay steroids, and a negative biopsy does not exclude the disease.","k":"Start glucocorticoids immediately for suspected giant cell arteritis with visual symptoms, and do not wait for biopsy."},{"n":251,"g":20,"q":"What is the most common mechanism of vision loss in giant cell arteritis?","o":["Anterior ischemic optic neuropathy (ciliary artery occlusion)","Retinal detachment from vitreous traction","Optic neuritis with pain on eye movement","Acute angle-closure glaucoma with a fixed, mid-dilated pupil","Central retinal vein occlusion with macular edema and hemorrhage"],"a":0,"e":"Anterior ischemic optic neuropathy from occlusion of the posterior ciliary arteries causes about 85 percent of vision loss related to giant cell arteritis, which is why delay in glucocorticoids risks permanent blindness.","k":"Most vision loss in giant cell arteritis is anterior ischemic optic neuropathy."},{"n":252,"g":20,"q":"A 35-year-old woman has pneumonia and needs a beta-lactam antibiotic. Her chart lists a penicillin allergy, with a childhood rash that she cannot describe and no history of anaphylaxis. Which approach is most appropriate?","o":["Perform penicillin skin testing before any cephalosporin","Use vancomycin and aztreonam only","Avoid all beta-lactam antibiotics","Premedicate with an antihistamine and observe for 24 hours","Give a cephalosporin routinely without prior testing"],"a":4,"e":"Patients with an unverified non-anaphylactic penicillin allergy can receive any cephalosporin routinely without testing or added precautions. The risk of cross-reactivity is lower than once believed, and up to 99 percent of reported penicillin allergies are not true allergy after formal evaluation.","k":"A remote, non-anaphylactic penicillin allergy label does not prevent routine cephalosporin use."},{"n":253,"g":20,"q":"A 29-year-old man reports a vague penicillin reaction in childhood and has not had one since. He needs a course of amoxicillin for sinusitis. Which approach is preferred for a remote, benign history?","o":["Penicillin skin testing before any oral dose is given to him","Lifelong avoidance of all penicillins and cephalosporins in the chart","A direct oral amoxicillin challenge without prior skin testing","A specific IgE blood panel before any treatment","Graded desensitization in the intensive care unit"],"a":2,"e":"For remote, benign histories, a direct oral amoxicillin challenge without skin testing is preferred. Skin testing is best for anaphylaxis or a recent suspected IgE-mediated reaction such as immediate urticaria.","k":"Use a direct oral amoxicillin challenge for low-risk penicillin allergy histories."},{"n":254,"g":20,"q":"A 5-year-old boy has palpable purpura on the legs and buttocks, colicky abdominal pain, and swollen knees. His platelet count and coagulation studies are normal. His examination and vital signs are otherwise reassuring. What is the best next step?","o":["Give ibuprofen and send home without testing the urine","Give a platelet transfusion","Check a urinalysis and arrange nephrology follow-up","Give routine high-dose steroids to all patients","Perform a bone marrow biopsy"],"a":2,"e":"The picture is IgA vasculitis. Nephritis occurs in about 40 percent and can appear months later, so urinalysis and nephrology follow-up are essential. NSAIDs may worsen renal and gastrointestinal disease, and steroids are considered for severe abdominal or renal disease.","k":"In IgA vasculitis, check the urine and arrange follow-up because nephritis is the main long-term concern."},{"n":255,"g":20,"q":"A 4-year-old girl with IgA vasculitis develops intermittent severe colicky abdominal pain, vomiting, and bloody stool. Which complication should be evaluated first?","o":["Appendiceal abscess, with a barium enema","Gastric ulcer, with upper endoscopy","Intussusception, with abdominal ultrasound","Pancreatitis, with a lipase only","Bowel perforation, with abdominal plain radiograph only"],"a":2,"e":"Intussusception occurs in 2 to 6 percent of children with IgA vasculitis, mostly ileoileal, and stool guaiac is positive in more than half. Abdominal ultrasound is the preferred test, and admission is considered for severe abdominal pain.","k":"Colicky pain and bloody stool in IgA vasculitis should prompt an ultrasound for intussusception."},{"n":256,"g":21,"q":"A 24-year-old woman has lower abdominal pain for three days with cervical motion tenderness, a temperature of 37.8 C, and a negative pregnancy test. She is hemodynamically stable and tolerating oral intake. Which outpatient regimen is appropriate?","o":["Ceftriaxone intramuscularly plus doxycycline and metronidazole","Azithromycin as a single dose alone, which is adequate for chlamydia but not for this syndrome","Oral ciprofloxacin alone for fourteen days, which has unreliable activity against gonorrhea","Doxycycline alone for seven days, which leaves gonorrhea and anaerobes uncovered","Ceftriaxone alone, which treats gonorrhea but leaves anaerobes and chlamydia uncovered"],"a":0,"e":"Pelvic inflammatory disease is diagnosed empirically in a woman at risk for sexually transmitted infection with pelvic or lower abdominal pain, no other cause, and cervical, uterine, or adnexal tenderness. The outpatient regimen is ceftriaxone intramuscularly plus doxycycline and metronidazole for 14 days, with partners treated.","k":"Treat suspected PID empirically with a three-drug regimen."},{"n":257,"g":21,"q":"A 22-year-old woman with pelvic pain and cervical motion tenderness is diagnosed with pelvic inflammatory disease. Which finding most clearly requires hospital admission?","o":["Adnexal tenderness on the left","A temperature of 38.4 C alone","A positive pregnancy test","A positive chlamydia test","An intrauterine device in place"],"a":2,"e":"Admission criteria for pelvic inflammatory disease include tubo-ovarian abscess, pregnancy, sepsis or peritonitis, inability to tolerate oral therapy, and failed outpatient treatment. An intrauterine device does not by itself require admission or removal, and pregnancy also raises the possibility of ectopic pregnancy.","k":"Pregnancy is an admission criterion for PID."},{"n":258,"g":21,"q":"A 28-year-old woman with an intrauterine device placed six months ago has pelvic pain, cervical motion tenderness, and mucopurulent discharge. A pregnancy test is negative and she is stable. What is the best management of the device?","o":["Admit for emergency device removal and

 been documented on examination","Give IV thiamine with or before the dextrose, without withholding glucose in symptomatic hypoglycemia","Withhold both until a serum magnesium level and a head CT have both returned","Give oral thiamine and withhold dextrose until the confusion has resolved completely and the gait is steady"],"a":2,"e":"Glucose alone can precipitate or worsen Wernicke encephalopathy in at-risk patients, so thiamine should be given before or with glucose. If hypoglycemia is symptomatic, both are given together and glucose is not withheld. Oral absorption is unreliable and a dose of 100 mg a day is likely insufficient for treatment.","k":"In an at-risk patient, give intravenous thiamine with or before glucose, but never delay glucose in symptomatic hypoglycemia."},{"n":342,"g":27,"q":"A 33-year-old woman three months after gastric bypass has had weeks of vomiting and now has confusion and a wide-based gait. Her eye movements are normal and MRI of the brain is read as normal. Which statement is most accurate?","o":["Only patients with alcohol use disorder are at risk, so another cause of the confusion should be sought first","A normal MRI does not exclude Wernicke encephalopathy, so treatment should not be withheld","The diagnosis is excluded because the full classic triad is not present on examination at the bedside","The diagnosis is excluded by the normal MRI, which has a sensitivity above 95% overall for this condition","Treatment should wait until a serum thiamine level returns from the laboratory"],"a":1,"e":"The full triad of encephalopathy, oculomotor dysfunction, and ataxia is present in only about 10% of cases, so one component plus a risk factor should prompt treatment. MRI sensitivity is about 53%, and malabsorption after bariatric surgery, severe vomiting, and hyperemesis are recognized risk groups. Hypomagnesemia can cause resistance to thiamine.","k":"Treat suspected Wernicke encephalopathy empirically; a normal MRI or an incomplete triad does not rule it out."},{"n":343,"g":28,"q":"A 32-year-old woman at 34 weeks with cocaine use presents with painful vaginal bleeding. The uterus is rigid and tender, and the fetal heart rate is in the 90s. A bedside ultrasound shows no retroplacental clot. How should the ultrasound result be interpreted?","o":["Abruption is still likely, because ultrasound sensitivity is only about 25 to 50%","The ultrasound is diagnostic only if it is repeated by a radiologist in the morning","Abruption is excluded, and she can be observed for two hours and discharged","Abruption is excluded, and the bleeding should be attributed to a cervical source","The negative study means placenta previa is the only remaining explanation"],"a":0,"e":"Placental abruption is primarily a clinical diagnosis with painful bleeding, a tender or board-like uterus, and fetal distress. Ultrasound is useful to exclude previa but has low sensitivity for abruption, so a normal scan does not rule it out. Emergent obstetric involvement and delivery planning are the priorities in an unstable patient.","k":"Abruption is a clinical diagnosis; a normal ultrasound does not exclude it."},{"n":344,"g":28,"q":"A 30-year-old woman with severe placental abruption has oozing at her IV sites. Fibrinogen is 90 mg/dL and platelets are low. Which management is most appropriate alongside delivery planning?","o":["Give blood products including cryoprecipitate and plasma, targeting fibrinogen near 150 to 200 mg/dL","Give oral vitamin K and recheck the coagulation tests again in twenty-four hours before any other step","Give desmopressin alone to correct the platelet function defect and the bleeding tendency, then observe","Withhold all blood products until the delivery has been completed by the obstetric team","Start a heparin infusion to interrupt the consumptive coagulopathy until delivery occurs, then stop it"],"a":0,"e":"Abruption can trigger DIC in roughly 10 to 20% of severe cases. A fibrinogen below 200 mg/dL is concerning and below 100 mg/dL suggests severe DIC. Treatment is with blood products, FFP, cryoprecipitate, and platelets, targeting a fibrinogen of about 150 to 200 mg/dL, with massive transfusion and emergent cesarean as needed.","k":"Treat abruption-related DIC with blood products guided by fibrinogen while arranging delivery."},{"n":345,"g":28,"q":"A 28-year-old Rh-negative woman at 30 weeks has a placental abruption after a motor vehicle collision. She is hemodynamically stable. In addition to maternal and fetal monitoring, which step is indicated?","o":["Intramuscular vitamin K to prevent maternal alloimmunization against fetal cells","No Rh immune globulin, since it is given only for delivery at term in this clinical setting of trauma","Rh immune globulin only if the Kleihauer-Betke test is reported as negative after the sample is run","Rh immune globulin, plus a Kleihauer-Betke test to quantify fetomaternal hemorrhage","A direct Coombs test alone, which replaces the need for any immune globulin"],"a":3,"e":"Rh immune globulin is given to Rh-negative patients, and the Kleihauer-Betke test can quantify fetomaternal hemorrhage, particularly after trauma or abruption. Stable preterm patients are admitted for continuous fetal monitoring and serial labs, and antenatal betamethasone is given if preterm delivery is likely.","k":"Rh-negative patients with abruption need Rh immune globulin and quantification of fetomaternal bleeding."},{"n":346,"g":28,"q":"A 36-year-old woman with two prior cesarean deliveries presents at 33 weeks with painless bright red vaginal bleeding. The uterus is soft and nontender. Which action should be avoided until placental location is known?","o":["Continuous fetal heart rate monitoring","Digital cervical examination","Placement of two large-bore intravenous lines","Type and crossmatch with Rh status","Transabdominal ultrasound of the placenta"],"a":1,"e":"Painless bright red bleeding in the late second or third trimester with a soft nontender uterus suggests placenta previa, and prior cesarean delivery is a risk factor. A digital or speculum exam may provoke life-threatening hemorrhage, so ultrasound is first. Transvaginal ultrasound is safe and more accurate than transabdominal when needed.","k":"Do not perform a digital cervical exam in third-trimester painless bleeding until previa is excluded."},{"n":347,"g":28,"q":"A 34-year-old woman at 32 weeks with confirmed placenta previa has had a sentinel bleed that has stopped. She is hemodynamically stable and the fetal heart rate is reassuring. What is the appropriate plan?","o":["Send her home with strict instructions to return only for severe abdominal pain","Induce labor with oxytocin to deliver before the bleeding recurs at home","Discharge with pelvic rest because the bleeding has stopped on its own and she is stable","Perform a speculum and digital examination to assess cervical dilation in the department","Admit with continuous fetal monitoring, obstetric input, and steroids if under 34 weeks"],"a":4,"e":"A stable patient with previa is admitted to labor and delivery for bed rest, NPO status as needed, continuous fetal monitoring, and obstetric planning for delivery, with antenatal steroids if under 34 weeks. Unstable or actively bleeding patients need aggressive resuscitation and emergent cesarean delivery.","k":"Stable placenta previa with bleeding is admitted, monitored, and given steroids if preterm."},{"n":348,"g":28,"q":"A 22-year-old sexually active woman has lower abdominal pain for three days. Her temperature is 38.2 C, and pelvic examination shows cervical motion tenderness. The pregnancy test is negative and no other cause is identified. What is true about the diagnosis?","o":["PID is excluded because the patient has no vaginal discharge to report and has a negative pregnancy test","PID can be diagnosed only after laparoscopy confirms tubal inflammation directly by visual inspection","Pelvic or lower abdominal pain with cervical, uterine, or adnexal tenderness and no other cause","PID requires both fever and mucopurulent cervical discharge to be present on the pelvic examination","PID is diagnosed only if the erythrocyte sedimentation rate is above 100 mm/h on the same day as the visit"],"a":2,"e":"Presumed PID needs a woman at risk for sexually transmitted infection with pelvic or lower abdominal pain, at least one of cervical motion, uterine, or adnexal tenderness, and no other identifiable cause. Fever, mucopurulent discharge, and raised inflammatory markers support but are not required. Adnexal tenderness is the most sensitive exam finding.","k":"Treat presumed PID on clinical criteria; do not wait for confirmatory tests."},{"n":349,"g":28,"q":"A hemodynamically stable 24-year-old woman with mild PID is going to be treated as an outpatient. Which regimen matches current guidance?","o":["Doxycycline alone for 3 days, with a test of cure arranged at 6 weeks","Ceftriaxone intramuscularly once, with no oral antibiotics prescribed afterward and no follow-up visit","Ceftriaxone intramuscularly once, then doxycycline and metronidazole for 14 days","Metronidazole alone for 7 days, with the partner treated as well at the visit","Azithromycin as a single oral dose with no other antibiotics given afterward for the infection"],"a":2,"e":"Outpatient regimens combine a single intramuscular cephalosporin (ceftriaxone, or cefoxitin with probenecid) with doxycycline and metronidazole for 14 days. Partners from the previous 60 days are treated, sex is avoided for 2 weeks, and follow-up occurs at about 72 hours.","k":"Outpatient PID treatment is a cephalosporin plus 14 days of doxycycline and metronidazole."},{"n":350,"g":28,"q":"Which patient with suspected pelvic inflammatory disease should be admitted?","o":["A 23-year-old woman with mild pain whose partner has been treated","A 27-year-old woman with a negative pregnancy test and normal vital signs","A 30-year-old woman who requests outpatient treatment and has reliable follow-up","A pregnant woman with lower abdominal pain and adnexal tenderness","A 25-year-old woman with HIV infection who has mild pain and tolerates oral medication"],"a":3,"e":"Admission is advised for pregnancy, tubo-ovarian abscess that is large or unstable, sepsis or peritonitis, Fitz-Hugh-Curtis syndrome, inability to tolerate oral intake, and failure of outpatient therapy. HIV infection alone is not an automatic criterion for admission. Rupture of a tubo-ovarian abscess is the most common cause of death.","k":"Pregnancy, abscess, peritonitis, or failed outpatient treatment means admit."},{"n":351,"g":28,"q":"A 19-year-old woman has sudden severe right pelvic pain with vomiting. The pregnancy test is negative. Transvaginal ultrasound shows a 6 cm ovarian cyst, and Doppler demonstrates arterial and venous flow. What is the best next step?","o":["Gynecology consultation for laparoscopy, since preserved Doppler flow does not exclude torsion","Repeat the ultrasound in one week to see whether the cyst has grown, and treat only if it has done so","Wait for peritoneal signs to develop before involving the gynecologic surgeon in the care of the patient","Oral contraceptive pills to suppress the cyst, with a repeat ultrasound recheck in a month or so","Discharge with analgesics because normal Doppler flow effectively rules out torsion of the ovary"],"a":0,"e":"Sudden unilateral pelvic pain with vomiting and an ovarian mass over 5 cm is classic for torsion. The presence of Doppler flow does not exclude it, absent flow is only about 50% sensitive, and peritoneal signs are late. With high suspicion the patient goes to the operating room without further delay.","k":"Normal Doppler flow does not exclude ovarian torsion; act on clinical suspicion."},{"n":352,"g":28,"q":"Which transvaginal ultrasound finding is the most specific for ovarian torsion?","o":["Free fluid in the cul-de-sac behind the uterus","Whirlpool sign of the twisted vascular pedicle","Peripherally displaced follicles within an edematous ovary","Ovarian edema with a heterogeneous stroma on gray scale","Enlargement of the ovary compared with the contralateral side"],"a":1,"e":"The whirlpool sign, a twisted vascular pedicle on Doppler, is the most specific finding. Ovarian enlargement over 4 cm, edema, peripheral follicles, and free fluid are supportive but less specific. Transvaginal ultrasound is the test of choice, and imaging should not delay surgery when suspicion is high.","k":"The whirlpool sign is the most specific ultrasound finding of ovarian torsion."},{"n":353,"g":28,"q":"At laparoscopy for torsion 30 hours after symptom onset, the ovary appears dusky and black. What is the most appropriate management?","o":["Perform oophoropexy only, leaving the ovary twisted in place after fixation","Remove the ovary at once because a black ovary is always necrotic tissue and cannot recover function","Close the abdomen and wait for the ovary to untwist spontaneously over the next several days","Detorse the ovary and conserve it, since appearance does not predict nonviability","Remove the ovary and the fallopian tube on the affected side as a routine part of the operation"],"a":3,"e":"Laparoscopic detorsion is the procedure of choice and preserves fertility. Salvage is high within 6 hours, and an ovary may still be viable at 24 to 36 hours, so a black or dusky appearance should not be assumed to mean necrosis. Oophorectomy is reserved for clearly necrotic tissue or suspected malignancy.","k":"Detorse and conserve the ovary; do not remove one just because it looks dusky."},{"n":354,"g":28,"q":"During a vaginal delivery the fetal head delivers, then retracts against the perineum, and the anterior shoulder does not deliver with routine traction. Which is the best first maneuver?","o":["Wait several minutes for spontaneous rotation and delivery of the shoulder","Apply strong downward traction on the fetal head while the patient pushes","Perform an immediate cesarean delivery in the operating room without trying maneuvers","McRoberts position with the hips flexed, then suprapubic pressure","Apply fundal pressure to push the anterior shoulder through the maternal pelvis"],"a":3,"e":"The turtle sign suggests shoulder dystocia. After calling for help and considering episiotomy, McRoberts positioning is the best first option, with suprapubic pressure raising success further. Next steps include rotational maneuvers, delivery of the posterior arm, and the all-fours position. The anterior shoulder is impacted against the pubic symphysis.","k":"Start shoulder dystocia with help, McRoberts, and suprapubic pressure."},{"n":355,"g":28,"q":"Which factor is a recognized antepartum risk factor for shoulder dystocia?","o":["A first pregnancy delivered before 36 weeks","Maternal diabetes with a macrosomic fetus","Maternal age under 18 years","A fetus in the breech presentation","Rupture of membranes for less than one hour"],"a":1,"e":"Risk factors before labor include prior shoulder dystocia, macrosomia, diabetes, maternal BMI above 30, induction of labor, short maternal stature, small pelvis, and postterm pregnancy. Intrapartum factors include prolonged labor, oxytocin augmentation, and assisted vaginal delivery. Transient brachial plexus palsy occurs in about 3 to 17% of affected births.","k":"Macrosomia and maternal diabetes raise the risk of shoulder dystocia."},{"n":356,"g":28,"q":"A woman in active labor is 4 cm dilated, and the examiner feels a pulsatile loop of umbilical cord at the cervix. The fetal heart rate is now 70. What is the best management?","o":["Attempt to push the cord back into the uterus and continue labor as planned with close monitoring","Elevate the presenting part by hand, use knee-chest position, and go to emergent cesarean delivery","Place her supine and observe for a spontaneous recovery of the fetal heart rate over the next hour","Remove the examining hand to reduce handling of the cord and fetal head, and recheck in ten minutes","Encourage her to push to deliver rapidly in the delivery room without moving her to the operating room"],"a":1,"e":"Umbilical cord prolapse is an obstetric emergency. The examiner who made the diagnosis keeps the presenting part elevated until the operating room, the patient is placed in knee-chest or Trendelenburg position, and emergent cesarean delivery follows. The cord should not be reduced, and she should not push or cough.","k":"In cord prolapse, keep the presenting part elevated, never reduce the cord, and go to emergent cesarean delivery."},{"n":357,"g":28,"q":"A 29-year-old woman, two days after delivery, has right upper quadrant pain and a blood pressure of 160/100 mm Hg. Platelets are 70,000 per microliter, AST is 210 U/L, and LDH is 800 U/L, with schistocytes on the smear. What is the best management?","o":["Start magnesium sulfate, control blood pressure, and correct coagulopathy, as HELLP can occur postpartum","Withhold magnesium because delivery has already occurred and seizures can no longer happen after birth","Start heparin for suspected thrombotic thrombocytopenic purpura without any other treatment being given first","Reassure her that postpartum pain is normal and discharge her home with routine outpatient follow-up in a week","Give high-dose oral steroids and discharge her with a repeat blood count in a week at the clinic"],"a":0,"e":"HELLP (hemolysis, elevated liver enzymes, low platelets) is a variant of preeclampsia that may present within 48 hours after delivery. Management matches severe preeclampsia: magnesium sulfate, blood pressure control, and correction of coagulopathy. Admit.","k":"Postpartum right upper quadrant pain with high pressure and low platelets is HELLP until proven otherwise."},{"n":358,"g":28,"q":"A 33-year-old woman with HELLP syndrome awaits delivery. She has no bleeding, and her platelet count is 15,000 per microliter. What is the appropriate action regarding platelets?","o":["Withhold platelets unless the count falls below 5,000","Transfuse platelets, because the count is below 20,000","Give vitamin K and recheck the platelet count in the morning","Transfuse platelets only if the patient develops fever","Give platelets only after the epidural has been placed"],"a":1,"e":"In HELLP syndrome, platelets are transfused for counts below 20,000 per microliter or for active uncontrolled bleeding. Thrombocytopenia carries a risk of intra-abdominal bleeding such as hepatic hematoma, and the differential includes thrombotic thrombocytopenic purpura, hemolytic uremic syndrome, DIC, and acute fatty liver of pregnancy.","k":"Transfuse platelets in HELLP at counts below 20,000 or with uncontrolled bleeding."},{"n":359,"g":29,"q":"A 28-year-old woman has palpitations, chest tightness, tingling in the hands, and fear of dying. After the workup she is diagnosed with a panic attack. Which traditional intervention should be avoided?","o":["A low dose of lorazepam","Reassurance and patient education","Slowing the breathing with coaching","Rebreathing into a paper bag","Hydroxyzine intramuscularly"],"a":3,"e":"Paper bag rebreathing is traditional but not recommended, because it can cause morbidity or death in hypoxic patients or those with myocardial ischemia. Any benefit probably comes from reassurance. Reassurance, education, and an anxiolytic such as lorazepam or hydroxyzine are reasonable.","k":"Do not use paper bag rebreathing for suspected panic attacks."},{"n":360,"g":29,"q":"A 34-year-old woman returning from a long flight has sudden dyspnea, pleuritic chest pain, anxiety, a heart rate of 118, and an oxygen saturation of 93%. A colleague suggests a panic attack. Which statement is correct?","o":["Panic is a diagnosis of exclusion, so pulmonary embolism must be considered first","A normal oxygen saturation is required before pulmonary embolism can be considered","Panic attack can be diagnosed from the anxiety alone, without further testing","Lorazepam should be given and the diagnostic workup omitted, since she is anxious","Pleuritic chest pain is typical of a panic attack and does not need evaluation"],"a":0,"e":"A panic attack is a diagnosis of exclusion made from the history and examination after must-not-miss mimics are considered, including pulmonary embolism, acute coronary syndrome, aortic dissection, tension pneumothorax, cardiac tamponade, anaphylaxis, and toxic ingestions.","k":"Exclude emergent causes of dyspnea before diagnosing panic."},{"n":361,"g":29,"q":"A 24-year-old woman with severe malnutrition from anorexia nervosa is admitted. What should be done before starting dextrose-containing fluids or feeding?","o":["Give a large dextrose bolus","Give only oral glucose to raise blood sugar quickly","Start feeding first and check electrolytes after 72 hours","Check potassium, magnesium, and phosphorus and give thiamine","Start full caloric feeding immediately to reverse starvation"],"a":3,"e":"In patients at risk for refeeding syndrome, potassium, magnesium, and phosphorus are checked and replaced before feeding, and thiamine, about 100 mg in adults, is given before feeding or dextrose-containing fluids. Calories are started low, about 10 to 20 kcal per kg in the first 24 hours, and advanced gradually.","k":"Replace electrolytes and give thiamine before refeeding."},{"n":362,"g":29,"q":"A malnourished patient begins parenteral nutrition and develops weakness and respiratory failure. Which laboratory pattern is characteristic of refeeding syndrome?","o":["Hyperkalemia with hyperphosphatemia and hypermagnesemia","Hypophosphatemia with hypokalemia and hypomagnesemia","Hypocalcemia with hypermagnesemia and hyperphosphatemia","Hypermagnesemia with hyperphosphatemia and hyperkalemia","Hypercalcemia with hypernatremia"],"a":1,"e":"Glucose-driven insulin release moves potassium, magnesium, and phosphorus into cells, causing hypokalemia, hypomagnesemia, and hypophosphatemia. Severe hypophosphatemia can cause hemolysis, hypotension, altered mental status, and impaired cardiac and diaphragmatic contraction.","k":"Refeeding drops phosphorus, potassium, and magnesium."},{"n":363,"g":29,"q":"A 17-year-old girl with anorexia nervosa has a heart rate of 44 beats per minute, a blood pressure of 76/48 mm Hg, and a temperature of 35.2 C. She is alert and denies symptoms. What is the most appropriate disposition?","o":["Discharge with oral nutritional supplements and instructions to eat three meals a day","Observe in the waiting area for one hour and discharge if she feels better","Discharge after a supervised meal and a short observation in the waiting area","Admit for monitoring, since she meets criteria for medical instability","Discharge to outpatient psychiatry with a follow-up appointment next week"],"a":3,"e":"Inpatient criteria for anorexia nervosa include a heart rate below 50, blood pressure below 80/50, a temperature below 96 F (about 35.6 C), severe electrolyte disturbance, cardiac problems, severe purging, psychosis, or high suicide risk. Hypophosphatemia and refeeding shifts can cause arrhythmia.","k":"Bradycardia, hypotension, and hypothermia in anorexia nervosa mean admit."},{"n":364,"g":29,"q":"An 18-year-old patient with anorexia nervosa and recurrent purging also has major depression. Which antidepressant should be avoided because of seizure risk?","o":["Citalopram","Mirtazapine","Sertraline","Bupropion","Escitalopram"],"a":3,"e":"Bupropion is avoided in patients with eating disorders because of seizure risk. Other cautions in anorexia nervosa include careful intravenous fluid rates because of pulmonary edema risk, and recognition that even a liter of dextrose saline could harm a patient eating under about 400 kilocalories a day.","k":"Avoid bupropion in patients with eating disorders."},{"n":365,"g":29,"q":"A 34-year-old man last used heroin 18 hours ago. He has yawning, rhinorrhea, tremor, and a COWS score of 14. He asks for treatment to start buprenorphine. Which initial dose and next step is appropriate?","o":["Naltrexone, to begin treatment for opioid use disorder in the emergency department","Buprenorphine 16 mg immediately, with discharge and no period of observation","Methadone 40 mg orally, followed by observation for several hours before discharge","Naloxone, to speed the withdrawal so that treatment can be given sooner","Buprenorphine 4 to 8 mg sublingually, then reassess in 30 to 45 minutes"],"a":4,"e":"Buprenorphine induction guided by the Clinical Opiate Withdrawal Scale starts when the score is 8 or higher, with 4 to 8 mg followed by observation for 30 to 45 minutes and redosing if the score stays 8 or higher. The patient can then be discharged on about 16 mg daily as a bridge to follow-up.","k":"Start buprenorphine when COWS is 8 or higher and reassess after 30 to 45 minutes."},{"n":366,"g":29,"q":"A 29-year-old man used fentanyl four hours ago and now asks for buprenorphine. His COWS score is 3. What is the best approach?","o":["Give a large dose of buprenorphine intravenously to guarantee a complete response","Give naltrexone first, then buprenorphine one hour later to complete the induction","Wait and reassess until the COWS is 8 or higher, or give written home induction steps","Give buprenorphine immediately, since he is requesting treatment and has recently used it","Give naloxone to start the withdrawal and shorten the waiting time for treatment"],"a":2,"e":"Giving buprenorphine too early risks precipitated withdrawal. With a COWS of 0 to 7, the patient can be observed until the score is above 8 before standard induction, or offered unobserved home induction instructions. Fentanyl withdrawal begins about 2 to 5 hours after use.","k":"Do not start buprenorphine until withdrawal is established to avoid precipitated withdrawal."},{"n":367,"g":29,"q":"A patient in opioid withdrawal is given clonidine. Which adverse effect most limits its use?","o":["Respiratory depression","Hypotension","QT prolongation with torsades","Seizures","Hypertension"],"a":1,"e":"Clonidine reduces autonomic symptoms of opioid withdrawal, and its major adverse effect is hypotension, so it is given when the systolic pressure is above 90 mm Hg. Clonidine patches are not useful for acute withdrawal, and benzodiazepines can be added for sedation.","k":"Clonidine for opioid withdrawal can cause hypotension."},{"n":368,"g":29,"q":"A 22-year-old man develops a twisted neck, upward gaze deviation, and jaw spasm two hours after intramuscular haloperidol for agitation. Which treatment is most appropriate?","o":["Bromocriptine","Intravenous phenytoin as a loading dose over twenty minutes","Dantrolene given as an intravenous bolus","An additional dose of haloperidol to relax the muscle spasm","Intravenous benztropine or diphenhydramine"],"a":4,"e":"Acute dystonic reactions are an idiosyncratic extrapyramidal effect of antipsychotics and antiemetics and usually occur within 48 hours. Treatment is intravenous benztropine 1 to 2 mg or diphenhydramine 25 to 50 mg, with symptoms often improving within minutes. Laryngeal involvement can threaten the airway.","k":"Treat acute dystonia with an anticholinergic."},{"n":369,"g":29,"q":"A 25-year-old man receives haloperidol decanoate and develops an acute dystonic reaction that resolves with intravenous benztropine. Which discharge plan is most appropriate?","o":["Naloxone every six hours for 24 hours to prevent a relapse","Repeat haloperidol to complete the course and prevent recurrence of the agitation","A short course of oral benztropine, for 2 to 3 days","Observe for 24 hours in the department without any drug and then discharge","No further medication, since the reaction has fully resolved after the injection"],"a":2,"e":"When the causative drug is long-acting, an oral anticholinergic is continued after the acute reaction to prevent relapse, for example benztropine for two to three days or diphenhydramine for 24 to 72 hours. The offending agent should be stopped, and the patient's psychiatrist consulted before changing antipsychotics.","k":"After dystonia from a long-acting drug, continue an oral anticholinergic for a few days."},{"n":370,"g":30,"q":"A 24-year-old sexually active man has had 24 hours of gradually worsening left scrotal pain with dysuria. The left testis is tender along the epididymis, the cremasteric reflex is present, and elevation relieves the pain. Which treatment is appropriate?","o":["Observation with ibuprofen and no antibiotics, with return precautions given","Single-dose fluconazole with scrotal support and a urology visit next month","Amoxicillin for 3 days alone, with no treatment of sexual partners at all","Nitrofurantoin for 5 days alone, with no coverage for gonorrhea or chlamydia","Ceftriaxone intramuscularly plus doxycycline for 10 days"],"a":4,"e":"In sexually active men under 35, chlamydia and gonorrhea are the likely organisms, and treatment is ceftriaxone plus doxycycline. In men over 35 or those not sexually active, enteric organisms are likely and levofloxacin is used. A positive Prehn sign does not rule out torsion, and ultrasound is used when the picture is equivocal.","k":"Treat epididymitis in a young sexually active man for gonorrhea and chlamydia."},{"n":371,"g":30,"q":"Which finding favors epididymitis over testicular torsion?","o":["Sudden severe pain with a high-riding testis lying in a transverse position","Absence of the cremasteric reflex on the affected side of the scrotum","Nausea and vomiting beginning together with the first onset of pain","Pain onset during sleep with no urinary symptoms and no fever present","Gradual onset of pain with an intact cremasteric reflex"],"a":4,"e":"Epididymitis typically builds over many hours, peaking near 24 hours, with urinary symptoms and an intact cremasteric reflex, which is usually absent in torsion. Pain relief with elevation (Prehn sign) is not reliable enough to exclude torsion, and Doppler ultrasound shows increased epididymal flow in epididymitis.","k":"An intact cremasteric reflex and gradual onset favor epididymitis; do not exclude torsion on Prehn sign alone."},{"n":372,"g":30,"q":"A 58-year-old man with poorly controlled diabetes has perineal pain out of proportion to the exam findings, fever, and crepitus over the scrotum. His blood pressure is 92/58 mm Hg. What is the single most important intervention?","o":["Emergent surgical debridement with resuscitation and broad-spectrum antibiotics, without imaging","Obtain CT of the pelvis first and give oral antibiotics only if an abscess is found on the scan results","Admit for intravenous antibiotics and perform surgery only if he deteriorates overnight in the hospital","Start oral antibiotics and re-examine the perineum in 48 hours as an outpatient at the clinic","Start oral antibiotics and re-examine the perineum in 48 hours as an outpatient"],"a":0,"e":"Fournier gangrene is a necrotizing infection of the perineum and genitals, with diabetes present in 40 to 60% of cases. Pain out of proportion and crepitus are key, though the early course can look deceptively benign. Emergent debridement is the most important intervention, mortality is 20 to 40%, and imaging should not delay surgery.","k":"In suspected Fournier gangrene, go to surgery; do not wait for imaging."},{"n":373,"g":30,"q":"Which empiric antibiotic combination is appropriate for Fournier gangrene?","o":["Ceftriaxone alone, which covers the usual pathogens of this necrotizing infection","Oral amoxicillin-clavulanate alone, started once the patient can tolerate oral intake","Vancomycin, piperacillin-tazobactam (or meropenem), and clindamycin","Trimethoprim-sulfamethoxazole alone, which covers the polymicrobial flora of the perineum","Ciprofloxacin alone, which covers anaerobes and the toxin-producing streptococci"],"a":2,"e":"Coverage is broad: an MRSA agent (vancomycin or linezolid), a broad gram-negative and anaerobic agent (piperacillin-tazobactam or meropenem), and clindamycin for toxin suppression and synergy. Antibiotics support but do not replace surgical debridement.","k":"Use triple broad-spectrum coverage including clindamycin for necrotizing perineal infection."},{"n":374,"g":30,"q":"A 25-year-old man with sickle cell disease has a painful erection for seven hours. Cavernosal blood is dark, with a pH of 7.1. After analgesia, what is the next step in treatment?","o":["Arrange outpatient urology follow-up and discharge him with oral analgesics only","Observe for 24 hours because most episodes resolve on their own without treatment","Give oral sildenafil and apply ice packs to the perineum for pain and swelling","Start therapeutic anticoagulation for a suspected venous thrombosis of the penis","Aspirate cavernosal blood and inject diluted phenylephrine, with urology involved"],"a":4,"e":"A sustained painful erection beyond 4 hours with acidotic, hypoxic cavernosal blood is ischemic priapism, a urologic emergency. The stepwise approach is pain control or a penile block, aspiration of cavernosal blood, saline irrigation, then intracavernosal phenylephrine with blood pressure and heart rate monitoring, and a shunt if refractory. Sickle cell patients also need hydration, oxygen, and urology.","k":"Ischemic priapism is treated with aspiration and intracavernosal phenylephrine, with a shunt if refractory."},{"n":375,"g":30,"q":"A 19-year-old man has a painless prolonged erection after a straddle injury three days ago. Corporal blood gas looks like normal arterial blood. Which statement is most accurate?","o":["Testicular torsion, which needs surgical exploration within six hours of onset","Priapism from a sickle cell crisis that needs an urgent exchange transfusion","Nonischemic priapism, which often resolves without emergent decompression","Urethral rupture, which needs placement of a suprapubic catheter at once","Ischemic priapism that needs emergent aspiration and injection of phenylephrine now"],"a":2,"e":"Nonischemic (high-flow) priapism usually follows perineal trauma through an arterio-cavernosal shunt, is painless, and has a corporal gas resembling arterial blood. It usually self-resolves and needs observation, with urology consultation for surgical correction or embolization if it persists. Ischemic priapism has a pH below 7.25, pO2 below 30, and pCO2 above 60 mm Hg.","k":"Painless priapism after perineal trauma with arterial-range gas is nonischemic."},{"n":376,"g":30,"q":"A patient with sickle cell disease and priapism undergoes partial exchange transfusion to a high hematocrit target. Which complication is a recognized risk of this approach?","o":["Hepatic rupture from the sudden rise in blood viscosity","A neurologic event, as in the ASPEN syndrome","Pulmonary embolism from clot in the penile veins","Toxic megacolon from the rapid shift in fluid volume","Acute pancreatitis from hypertriglyceridemia during the transfusion"],"a":1,"e":"ASPEN syndrome is the combination of sickle cell priapism, exchange transfusion, and neurologic events. Initial management of sickle cell priapism is hydration, analgesia, oxygen, and urology consultation, with the transfusion goal hematocrit above 30% and exchange transfusion discussed with a specialist.","k":"Exchange transfusion for sickle cell priapism carries a risk of neurologic events (ASPEN)."},{"n":377,"g":30,"q":"A healthy 28-year-old man with a prior kidney stone has typical right renal colic, is afebrile, and has well-controlled pain. His urinalysis shows hematuria. Which imaging approach is appropriate?","o":["Contrast-enhanced CT of the abdomen, which is mandatory in all patients with typical renal colic of this kind","Intravenous pyelogram, because it is the most sensitive test available for stones today","MRI of the abdomen and pelvis to avoid any radiation exposure at all in a patient with colic","A plain abdominal radiograph alone, because it reliably excludes ureteral obstruction in a patient with colic","Avoid CT, since he is under 50 with a known stone history and typical colic; ultrasound is acceptable"],"a":4,"e":"In young, healthy patients with known nephrolithiasis and typical colic, CT can be avoided. Ultrasound and CT showed no difference in missed high-risk diagnoses with complications. CT is reasonable in middle-aged patients without prior stones. Hematuria has a sensitivity of 71 to 95% and a specificity of 18 to 49% and cannot rule stones in or out.","k":"Do not reflexively image young patients with known stones and typical colic by CT."},{"n":378,"g":30,"q":"A 34-year-old man has a 6 mm distal ureteral stone and pain controlled with ibuprofen. Which therapy has been shown to increase passage rates for stones of this size?","o":["Bed rest with a low-calcium diet","Oral opioids scheduled every four hours","Tamsulosin at bedtime","Large-volume intravenous fluids to flush the stone","Prophylactic ciprofloxacin for all stone patients"],"a":2,"e":"Tamsulosin as medical expulsive therapy increased passage from 48% to 76% in the trial cited, but only for stones of 5 mm or larger. Passage rates fall with size, from about 78% for 1 to 4 mm to 39% above 8 mm. Intravenous fluids to flush stones have not improved outcomes, and bedtime dosing limits orthostatic hypotension.","k":"Use an alpha-blocker for distal stones of 5 mm or larger; fluids do not help."},{"n":379,"g":30,"q":"Which patient with renal colic needs admission rather than discharge with outpatient follow-up?","o":["A patient with a known 4 mm stone that is already passing into the bladder","A patient with a first stone who tolerates oral fluids and walks well","A patient with a 3 mm stone whose pain is controlled on oral analgesics","A patient with colic who is afebrile and has a normal creatinine level","An obstructing stone in a solitary kidney with a rising creatinine"],"a":4,"e":"Admission is advised for an obstructed single or transplanted kidney, acute renal failure, signs of urosepsis such as fever, hypotension, or elevated lactate, infected stones, and pregnancy with complications. Complete obstruction can cause irreversible renal damage within about 3 weeks. Consult for stones above 10 mm.","k":"Solitary kidney with obstruction, AKI, or infection means admit."},{"n":380,"g":30,"q":"A 26-year-old otherwise healthy woman has acute pyelonephritis, is hemodynamically stable, and tolerates oral intake. Which feature of another patient would most clearly favor admission instead?","o":["A negative urine pregnancy test","Second-trimester pregnancy","Costovertebral angle tenderness on one side","A urine culture pending at discharge","Mild flank pain with a temperature of 38.0 C"],"a":1,"e":"Discharge is reasonable for young, otherwise healthy patients who tolerate oral intake. Admission is considered for age over 60, calculi, obstruction, recent instrumentation, diabetes, immunocompromise, inability to take oral medications, a solitary kidney, and second-trimester pregnancy with obstetric consultation. Ceftriaxone is preferred in pregnancy.","k":"Pregnancy, obstruction, diabetes, or inability to take oral medication shifts pyelonephritis to inpatient care."},{"n":381,"g":30,"q":"A 55-year-old woman with diabetes has had three days of antibiotics for pyelonephritis and still has fever and flank pain. What is the best next step?","o":["Discharge with the same antibiotic and recheck only if symptoms worsen","Repeat the urine culture only and continue the same antibiotic for another week","Stop antibiotics and test for viral causes of fever","Add oral steroids to reduce the renal inflammation","Obtain CT or ultrasound to look for abscess, obstruction, or stones"],"a":4,"e":"Failure to improve after about 3 days of therapy, along with diabetes, male sex, older age, and prior stones, are triggers to image for renal or perinephric abscess, obstruction, or emphysematous pyelonephritis. Emphysematous disease nearly always occurs with diabetes and obstruction and may require nephrectomy.","k":"Pyelonephritis that fails to improve by day 3 needs imaging for abscess or obstruction."},{"n":382,"g":30,"q":"An 82-year-old man with a urinary catheter has a swollen, painful glans, and the foreskin is retracted behind it, forming a tight band. Which approach is best?","o":["Arrange outpatient urology review in two weeks and apply a cold pack to the swollen glans in the meantime","Apply antibiotic ointment and leave the foreskin retracted until the swelling has fully resolved","Penile block or topical anesthesia, then manual compression and reduction; consult urology if it fails","Observe overnight with a loose dressing in place, because the swelling usually resolves on its own","Perform an immediate circumcision in the emergency department under a local penile block, then discharge him"],"a":2,"e":"Paraphimosis is a urologic emergency because venous engorgement can compromise arterial flow and cause glans necrosis. Reduce promptly after a penile block or topical anesthetic, using circumferential pressure to reduce edema. If reduction fails, call urology emergently, and a dorsal slit is an option when perfusion is impaired and urology is unavailable.","k":"Reduce paraphimosis promptly; escalate to urology or a dorsal slit if perfusion is threatened."},{"n":383,"g":30,"q":"Manual reduction of paraphimosis is difficult because of marked edema. Which adjunct acts as an osmotic agent to reduce the swelling?","o":["Topical corticosteroid cream applied to the glans","Intravenous furosemide given before the procedure","A tight compressive wrap left on overnight","Oral prednisone given for three days","Granulated sugar applied to the distal penis"],"a":4,"e":"Granulated sugar draws fluid out of the edematous tissue by osmosis. Other adjuncts include ice packs in 3-minute intervals, hyaluronidase injected into the foreskin, and Babcock clamps with gentle traction. Failed reduction needs emergent urology input, and all patients are referred to decide on circumcision.","k":"Sugar, ice, or hyaluronidase can reduce edema and help reduction in paraphimosis."},{"n":384,"g":30,"q":"A 70-year-old man has gross hematuria with clots, suprapubic pain, and an inability to void. The bladder is distended on ultrasound. Which is the best next step?","o":["Place a standard small-bore catheter and observe for the return of urine output over several hours","Give intravenous furosemide to wash out the clots through diuresis alone and recheck in an hour","Order a CT urogram and defer any bladder drainage until it has been read","Place a large-bore three-way catheter and irrigate the bladder to evacuate the clots","Start oral antibiotics and arrange outpatient cystoscopy for the next month with the urology clinic"],"a":3,"e":"Clots can cause bladder outlet obstruction, so adequate drainage is essential. A triple-lumen urinary catheter with intermittent or continuous bladder irrigation is used, with urology consultation if drainage cannot be ensured. Imaging and further workup follow stabilization.","k":"Clot retention needs a three-way catheter and bladder irrigation."},{"n":385,"g":30,"q":"A 62-year-old smoker has painless gross hematuria that has cleared. He is stable, has normal renal function, and tolerates oral intake. What is the most appropriate plan?","o":["Repeat the urinalysis in six months and refer only if hematuria persists","Admit for cystoscopy and kidney biopsy tonight under general anesthesia","Multiphasic CT urography, with urology referral within about two weeks","Reassure him because painless hematuria is almost always benign in smokers","Perform a plain abdominal film and discharge him without any follow-up"],"a":2,"e":"Painless hematuria suggests malignancy, hyperplasia, or a vascular cause. Stable patients can be managed as outpatients, with a multiphasic CT urogram (noncontrast, nephrographic, and delayed phases) and urology referral within 2 weeks for patients over 40 with risk factors for urologic cancer. Nephrology referral is for casts, dysmorphic red cells, proteinuria, or AKI.","k":"Painless hematuria in an older smoker needs imaging and urology referral, not reassurance."},{"n":386,"g":31,"q":"A 48-year-old man experiencing homelessness has two months of cough, night sweats, and weight loss, and has coughed up blood. Which chest radiograph pattern is typical of reactivation tuberculosis?","o":["Isolated hilar lymphadenopathy with clear lung fields","Cavitary or noncavitary lesions in the upper lobes","Diffuse bat-wing perihilar opacities without cavities","Bilateral lower lobe consolidation with a normal hilum","A lobar consolidation with air bronchograms in the lingula only"],"a":1,"e":"Reactivation tuberculosis typically appears as cavitary or noncavitary lesions in the upper lobes or the superior segment of the lower lobe. Primary disease may show infiltrates in any area, and isolated hilar or mediastinal adenopathy may be the only sign. Miliary disease resembles millet seeds.","k":"Upper lobe cavitation suggests reactivation tuberculosis."},{"n":387,"g":31,"q":"A 35-year-old woman with a positive sputum PCR for tuberculosis is clinically stable, afebrile, and tolerates oral intake. She has reliable follow-up. What should the emergency physician do about treatment?","o":["Start isoniazid alone and discharge with a nine-month supply of medication without any scheduled follow-up","Start four-drug therapy in the ED and discharge her with a one-week supply of drugs and no other plan","Admit every patient with a positive PCR regardless of stability for a full eight weeks of inpatient care","Wait until three negative smears are obtained before arranging any follow-up care","Not start antituberculous drugs in the ED unless public health directs it; arrange coordinated follow-up"],"a":4,"e":"For stable patients who can be discharged, TB medications should not be started in the ED unless public health specifically instructs it. Admit those who appear ill, in whom the diagnosis is uncertain, or who are nonadherent. The standard regimen is isoniazid, rifampin, pyrazinamide, and ethambutol for 8 weeks followed by isoniazid and rifampin for 18 weeks.","k":"Stable suspected or confirmed tuberculosis is coordinated with public health, not started blindly in the ED."},{"n":388,"g":31,"q":"A 40-year-old man with HIV infection and a CD4 count of 90 per microliter has two weeks of fever and cough. The chest radiograph is normal. What does the normal film mean?","o":["It excludes tuberculosis in a patient who has been taking isoniazid prophylaxis for several months","It indicates latent tuberculosis only, which needs no airborne isolation or further testing at this stage","It excludes tuberculosis because the CD4 count is below 200 per microliter and the lungs are clear","It does not exclude tuberculosis, since immunocompromised patients may have normal radiographs","It means a tuberculin skin test will be strongly positive in this patient"],"a":3,"e":"Immunocompromised patients are less likely to have classic lesions and may have a normal chest film. Tuberculosis is 200 to 500 times more common in people with AIDS. A tuberculin skin test is not suitable for ruling out active disease, whereas sputum PCR rapidly detects TB and rifampin resistance.","k":"A normal chest film does not exclude tuberculosis in advanced HIV infection."},{"n":389,"g":31,"q":"A 38-year-old man with HIV infection (CD4 count 60 per microliter) has three weeks of progressive exertional dyspnea and dry cough. Chest radiograph shows bilateral interstitial infiltrates. Which therapy is first line?","o":["Fluconazole for presumed disseminated cryptococcal infection","Oseltamivir for presumed influenza pneumonia in this patient","Trimethoprim-sulfamethoxazole","Ceftriaxone alone for community-acquired pneumonia in this setting","Isoniazid with rifampin for presumed pulmonary tuberculosis"],"a":2,"e":"This presentation is Pneumocystis pneumonia, the most common opportunistic infection in AIDS, with CD4 below 200 as the main risk. Trimethoprim-sulfamethoxazole is first line, given orally for mild disease and intravenously for 21 days in severe disease. Dapsone with trimethoprim, atovaquone, pentamidine, and primaquine with clindamycin are alternatives.","k":"Pneumocystis pneumonia in advanced HIV is treated with trimethoprim-sulfamethoxazole."},{"n":390,"g":31,"q":"A patient with HIV and Pneumocystis pneumonia has a room air PaO2 of 62 mm Hg. Which adjunct has an indication?","o":["Corticosteroids, because the room air PaO2 is below 70 mm Hg","Inhaled nitric oxide as first-line therapy","Therapeutic enoxaparin for presumed pulmonary embolism","Corticosteroids are not indicated unless intubation is required","High-dose intravenous immune globulin"],"a":0,"e":"Adjunctive corticosteroids are indicated in HIV patients with severe respiratory parameters, defined as a room air PaO2 below 70 mm Hg or an alveolar-arterial gradient above 35 mm Hg. A typical schedule is prednisone for days 1 to 5, a reduced dose for days 6 to 10, and a lower dose through day 21, with intravenous methylprednisolone if oral dosing is not possible.","k":"Add steroids to Pneumocystis treatment when PaO2 is below 70 mm Hg or the A-a gradient exceeds 35."},{"n":391,"g":31,"q":"A 41-year-old man with advanced HIV has progressive dyspnea and desaturation on walking. The chest radiograph is read as normal. Which statement is correct?","o":["Pneumocystis pneumonia always causes lobar consolidation with air bronchograms","An elevated LDH is specific and confirms the diagnosis of Pneumocystis pneumonia","The radiograph is normal in about 25% of cases, and chest CT is highly sensitive","A normal radiograph excludes Pneumocystis pneumonia in an HIV patient","CT scanning adds no value here because the radiograph is already normal"],"a":2,"e":"The classic radiograph shows bilateral interstitial infiltrates in a bat-wing pattern, but the film is normal in about 25% of cases. CT sensitivity is high, near 100% with a specificity of about 89%, with a ground-glass pattern. LDH elevation is sensitive but not specific, and the alveolar-arterial gradient is increased.","k":"A normal chest film does not exclude Pneumocystis pneumonia; use CT when suspicion is high."},{"n":392,"g":31,"q":"A 52-year-old man with alcohol use disorder has fever, a foul-smelling sputum, and a thick-walled cavity with an air-fluid level in the right lower lobe. Which regimen is appropriate?","o":["Trimethoprim-sulfamethoxazole alone, which covers staphylococci and many anaerobes","Vancomycin alone, which gives reliable coverage of MRSA and oral anaerobes","Oral ciprofloxacin alone, which covers the gram-negative organisms here","Azithromycin alone, which covers the atypical organisms that cause it","Clindamycin or ampicillin-sulbactam, covering oral anaerobes"],"a":4,"e":"Lung abscess usually follows aspiration pneumonia, which takes 7 to 14 days to cavitate, and community-acquired cases are mostly oral anaerobes such as peptostreptococcus, prevotella, bacteroides, and fusobacterium. Treatment combines clindamycin with a second or third-generation cephalosporin or with ampicillin-sulbactam.","k":"Lung abscess needs anaerobic coverage such as clindamycin plus ampicillin-sulbactam."},{"n":393,"g":31,"q":"Which statement about the treatment of lung abscess is correct?","o":["Medical management succeeds in 70 to 90% of cases, and bronchoscopic drainage can seed other segments","Bronchoscopic drainage is the standard first-line treatment for every abscess and always helps recovery","Early surgical resection is required for nearly all abscesses larger than 2 cm in their greatest diameter","Antibiotics are ineffective unless a chest tube has been placed beforehand to drain the pus","Drainage cannot occur spontaneously because the abscess cavity is sealed off from the bronchial tree"],"a":0,"e":"Antibiotics alone succeed in 70 to 90% of lung abscesses. Drainage often occurs spontaneously through communication with the tracheobronchial tree, and an air-fluid level indicates that communication. Bronchoscopic drainage may seed other parts of the lung. Admit patients for treatment.","k":"Most lung abscesses resolve on antibiotics alone."},{"n":394,"g":31,"q":"A 60-year-old man has had pneumonia for five days. Ultrasound shows a loculated pleural effusion, and a chest tube drained little fluid. Which stage is this, and what is likely needed?","o":["Resolution stage, where antibiotics alone are required and any drainage procedure should be stopped","Fibrinopurulent stage, where loculations make a single chest tube unlikely to work and VATS may be needed","Exudative stage, where a single chest tube will usually clear the pleural fluid within a day or two of placement","Early transudative stage, which is expected to resolve with diuretics alone and no drainage procedure","Organizational stage, where a pleural peel develops within the first day of the pneumonia and blocks drainage"],"a":1,"e":"Parapneumonic effusions pass through an exudative stage (free-flowing, amenable to a chest tube, perhaps under 48 hours), a fibrinopurulent stage (loculations make single tube drainage unlikely), and an organizing stage (weeks, with a pleural peel restricting lung expansion). Video-assisted thoracic surgery may be needed when drainage fails.","k":"Loculated effusions need more than a single chest tube; consider surgery."},{"n":395,"g":31,"q":"Which pleural fluid result, together with grossly purulent fluid, supports a diagnosis of empyema?","o":["Pleural fluid WBC above 50,000 per microliter, or a positive Gram stain or culture","Pleural fluid pH above 7.4 with a low white cell count in the fluid and a negative culture","Pleural fluid protein below 1 g/dL with clear fluid on gross inspection and a normal cell count","Pleural fluid glucose above 120 mg/dL with a normal pleural pH and a low white cell count","Pleural fluid LDH below 200 IU/mL with a negative Gram stain result and a clear gross appearance"],"a":0,"e":"Empyema is diagnosed by grossly purulent fluid on thoracentesis plus at least one of a positive Gram stain or culture, WBC above 50,000 per microliter, glucose below 60, pH below 7.2, or LDH above 1,000 IU/mL. Antibiotic therapy includes piperacillin-tazobactam, with vancomycin added if MRSA risk exists.","k":"Purulent pleural fluid with high WBC, low glucose, or low pH defines empyema."},{"n":396,"g":31,"q":"A 44-year-old woman with pulmonary arterial hypertension on a home epoprostenol infusion arrives hypotensive and dyspneic. The infusion pump is found to be off because of a dead battery. What is the most important immediate action?","o":["Resume the prostacyclin infusion immediately, since abrupt cessation can cause decompensation","Give a 2-liter saline bolus to restore preload to the failing right ventricle before anything else is done","Intubate promptly to control oxygenation before any other treatment is given","Start a beta-blocker to reduce the strain on the failing right ventricle and slow the heart rate","Hold the infusion until the blood pressure returns to normal on its own, then restart it later at a lower rate"],"a":0,"e":"Stopping prostacyclin therapy abruptly can cause acute decompensation, so the medication pump should be checked first and the infusion resumed at once. Infusion lines can also become infected, so line infection should be considered. Specialist consultation should be early because these patients are critically ill with high mortality.","k":"Restart interrupted prostacyclin therapy at once in pulmonary hypertension decompensation."},{"n":397,"g":31,"q":"A 50-year-old woman with pulmonary hypertension has right heart failure with hypotension, an elevated jugular venous pressure, and peripheral edema. She is not fluid responsive. What is the preferred vasopressor strategy?","o":["Low-dose dopamine to dilate the renal vessels and support urine output in the failing right heart","Phenylephrine alone, aiming for a mean arterial pressure of about 100 mm Hg for several hours","Large-volume crystalloid until the central venous pressure is above 20 mm Hg on the monitor","Norepinephrine or vasopressin to keep MAP above 65 mm Hg, avoiding fluid boluses","Nitroprusside infusion to reduce pulmonary vascular resistance quickly"],"a":3,"e":"In decompensated pulmonary hypertension, avoid fluids unless the patient is clearly responsive, use IV diuretics if overloaded, and start vasopressin or norepinephrine to reach a MAP above 65 mm Hg. Once the MAP is adequate, low-dose dobutamine can support contractility. Avoid hypoxia, hypercapnia, and acidosis, which raise pulmonary vascular resistance.","k":"Right heart failure from pulmonary hypertension needs pressors and decongestion, not fluid loading."},{"n":398,"g":31,"q":"A patient with severe pulmonary hypertension develops new atrial flutter with rapid ventricular response and hypotension. Which approach is recommended?","o":["Give intravenous diltiazem to control the ventricular rate promptly","Give intravenous metoprolol and observe the rhythm for spontaneous conversion","Give a large crystalloid bolus before attempting any rhythm intervention","Avoid AV nodal blockers; consider cardioversion and rhythm control","Start a digoxin loading dose and discharge if the heart rate improves"],"a":3,"e":"New tachyarrhythmias such as atrial flutter or fibrillation portend a worse prognosis in pulmonary hypertension. These patients depend on atrial contribution and contractility, so rate control with AV nodal agents is avoided and cardioversion with rhythm control is considered.","k":"Avoid rate control in decompensated pulmonary hypertension and favor cardioversion."},{"n":399,"g":31,"q":"A patient with pulmonary hypertension and hypoxemia is tiring. Which approach to oxygenation is recommended?","o":["Apply high-pressure BiPAP immediately to maximize alveolar recruitment and reduce the work of breathing","Restrict oxygen because hyperoxia worsens the pulmonary vascular resistance and the right heart strain","Intubate early because positive pressure always improves right heart function and oxygen delivery in this disease state","Try a non-rebreather mask or high-flow nasal cannula first; avoid intubation and noninvasive ventilation if possible","Give a diuretic only and leave the patient breathing room air for now while the response is awaited"],"a":3,"e":"Positive pressure ventilation can reduce preload and lead to rapid decompensation and death in these patients, so intubation and noninvasive ventilation are avoided if possible. If intubation is unavoidable, use low tidal volumes and low PEEP as tolerated. Maintain saturation above 90% because hypoxia raises pulmonary vascular resistance.","k":"Positive pressure can collapse the preload of a failing right ventricle; oxygenate noninvasively when possible."},{"n":400,"g":32,"q":"A 2-year-old boy has a barking cough, inspiratory stridor at rest, and mild chest wall retractions. He is alert, has no cyanosis, and is drinking. What is the most appropriate treatment?","o":["A five-day course of oral amoxicillin","A single dose of dexamethasone","Nebulized albuterol every 20 minutes","Dexamethasone every six hours for 48 hours","Chest physiotherapy with humidified oxygen only"],"a":1,"e":"This is croup, which typically affects children from 6 months to 3 years. One dose of dexamethasone is usually sufficient, with onset in about 6 hours and effect lasting about 72 hours, and oral and intramuscular routes work equally well. Albuterol is contraindicated because it may worsen edema.","k":"Croup is treated with a single dose of dexamethasone; albuterol and antibiotics do not help."},{"n":401,"g":32,"q":"A 3-year-old with croup has stridor at rest that resolves 30 minutes after nebulized racemic epinephrine. He now appears comfortable. What should happen next?","o":["Observe him for 2 to 3 hours after treatment for return of stridor at rest","Discharge him immediately because the stridor at rest has resolved fully","Admit to the ICU for every child who has received a single dose of epinephrine","Repeat the epinephrine every hour for 12 hours regardless of the symptoms","Observe for 10 minutes and discharge with oral albuterol for use at home"],"a":0,"e":"Racemic epinephrine takes effect within about 30 minutes but lasts about 2 hours, so stridor can return as it wears off. Children should be watched for 2 to 3 hours after administration, and repeated dosing requires ICU admission for cardiac monitoring.","k":"Observe a child 2 to 3 hours after nebulized epinephrine for croup before discharge."},{"n":402,"g":32,"q":"A 14-month-old child has abrupt-onset inspiratory stridor while playing, with no fever or preceding cold. The quality of the stridor changes markedly from minute to minute. Which diagnosis is most likely?","o":["Bacterial tracheitis following a recent viral upper respiratory infection","Foreign body in the airway","Subglottic hemangioma presenting with a biphasic noisy breathing pattern","Epiglottitis in an unvaccinated child with a rapidly progressive fever","Viral croup (laryngotracheobronchitis) from a parainfluenza infection"],"a":1,"e":"Sudden onset with marked variation in the character of stridor suggests a foreign body, whereas croup follows a prodrome with a barking cough. Bacterial tracheitis presents with croup-like symptoms and a toxic appearance, and epiglottitis with rapid sore throat, fever, and drooling in an unvaccinated child.","k":"Abrupt, variable stridor in a toddler without fever suggests an airway foreign body."},{"n":403,"g":32,"q":"A 4-month-old has had two days of rhinorrhea, wheeze, and crackles. Her oxygen saturation is 93%, and she is feeding without difficulty. Which management is most appropriate?","o":["Intramuscular dexamethasone as a single dose before discharge, with return precautions given to parents","Supportive care with nasal suctioning and hydration, without bronchodilators or steroids","Intravenous ceftriaxone for a presumed bacterial infection of the lungs, started in the emergency department","Nebulized racemic epinephrine on a scheduled basis every four hours for the first two days at home","Nebulized albuterol every four hours for five days at home, with a follow-up visit at the clinic"],"a":1,"e":"Bronchiolitis is a clinical diagnosis in infants under 2 years, caused by RSV in about 70% of cases. Supportive care is the mainstay. Bronchodilators and racemic epinephrine are not recommended, the AAP recommends against systemic steroids, and antibiotics are reserved for suspected bacterial infection. A chest film is not routinely needed.","k":"Treat bronchiolitis with support; avoid albuterol, steroids, and antibiotics."},{"n":404,"g":32,"q":"Which infant with bronchiolitis most clearly needs hospital admission?","o":["An 8-month-old with mild tachypnea and good oral intake","A 10-month-old with a saturation of 95% who is feeding well","A 2-month-old born at 33 weeks with an oxygen saturation of 87%","A 9-month-old whose family is concerned but reliable","A 12-month-old with a clear nasal discharge and normal work of breathing"],"a":2,"e":"Factors favoring admission include age under 3 months, prematurity under 34 weeks, underlying heart or lung disease, an initial saturation below 88%, inability to tolerate oral intake, tachypnea with accessory muscle use, and an unreliable caregiver. Saturation alone should not decide admission, and RSV test results should not drive it.","k":"Young age, prematurity, hypoxemia, and poor intake drive admission in bronchiolitis."},{"n":405,"g":32,"q":"A 5-month-old with bronchiolitis has hypoxemia and increased work of breathing despite low-flow oxygen. Which therapy has randomized trial support for reducing escalation of care?","o":["High-flow nasal cannula oxygen","Scheduled nebulized albuterol","Empiric oral azithromycin","Chest percussion every four hours","Oral dexamethasone for three days"],"a":0,"e":"A multicenter randomized trial found that hypoxemic infants on high-flow oxygen needed less escalation than those on standard oxygen. The benefit appears to come from the flow rate, with starting flows of about 1 to 2 L/kg per minute. Nasal CPAP or intubation may still be required for evolving respiratory failure.","k":"High-flow nasal oxygen is the supported escalation for hypoxemic bronchiolitis."},{"n":406,"g":32,"q":"An unvaccinated 3-year-old has a high fever, drooling, muffled speech, and sits leaning forward on her hands. She is quiet and frightened. What is the best approach?","o":["Lay her flat and have two nurses obtain intravenous access immediately, then send blood cultures and a count","Give nebulized racemic epinephrine and observe her for two hours before deciding on any further step","Keep her calm in a position of comfort and call anesthesia and ENT to secure the airway in the operating room","Send her to radiology for a lateral neck film before any airway planning, with a nurse accompanying her","Examine the throat with a tongue depressor to confirm the diagnosis at once while she sits on the parent's lap"],"a":2,"e":"This is epiglottitis, usually caused by Haemophilus influenzae type b in unvaccinated children. Avoid upsetting the child, since crying can trigger complete obstruction, and do not examine the oropharynx because of the risk of laryngospasm. Airway management should be performed by the most experienced operator, preferably in the OR with ENT standby and surgical airway equipment ready.","k":"In suspected pediatric epiglottitis, avoid agitation and secure the airway in a controlled setting."},{"n":407,"g":32,"q":"A 45-year-old man has a severe sore throat out of proportion to a normal-appearing pharynx, a muffled voice, and difficulty swallowing. He is hemodynamically stable. What is the best test to establish the diagnosis?","o":["Throat culture and rapid streptococcal antigen test","Flexible nasopharyngolaryngoscopy","Noncontrast CT of the head","Bronchoscopy under general anesthesia","Barium swallow study"],"a":1,"e":"Adults now make up most epiglottitis cases, and the sore throat is characteristically out of proportion to the exam. Flexible nasopharyngolaryngoscopy gives the definitive diagnosis, while a lateral soft tissue neck film may show a thumbprint sign with about 90% sensitivity in adults. Airway comes first, and treatment includes ceftriaxone with vancomycin in sicker patients.","k":"Adult epiglottitis is confirmed by flexible laryngoscopy, with the airway the first priority."},{"n":408,"g":32,"q":"A 6-week-old infant has had paroxysms of cough with apnea and cyanosis for two days. The white blood cell count is 45,000 per microliter with 80% lymphocytes. Which management is correct?","o":["Give intravenous corticosteroids to reduce the paroxysms of coughing and the apneic episodes","Discharge with oral amoxicillin and a cough suppressant for the household to use at home","Admit to a monitored setting, give azithromycin, and use droplet precautions","Treat with nebulized albuterol and repeat the blood count in a week","Start airborne isolation precautions and give isoniazid for the infant for several months"],"a":2,"e":"Pertussis in young infants often presents with apnea rather than a whoop, with marked leukocytosis and lymphocytosis. Azithromycin is used, droplet precautions are applied, and neonates with apnea should be admitted to the ICU. Antibiotics do not change severity but may reduce infectivity.","k":"Infants with apnea and lymphocytosis need admission, azithromycin, and droplet precautions for pertussis."},{"n":409,"g":32,"q":"A 3-week-old infant is confirmed to have pertussis. His mother, father, and a pregnant aunt at 35 weeks all live in the home and are well. What should be done for the household?","o":["Tetanus vaccination alone for all adult household contacts, with no antibiotics given to anyone living at home","Prophylaxis only for the mother, since she had the closest contact with the infant during the illness","Postexposure prophylaxis for all household contacts, with priority for infants and third-trimester pregnant women","No prophylaxis because the household contacts have no symptoms at present and are all fully vaccinated against it","Prophylaxis only for contacts who develop a cough lasting three weeks or longer in the household at home"],"a":2,"e":"Postexposure prophylaxis with azithromycin is recommended for all household exposures to known pertussis, especially infants, third-trimester pregnant women, and immunocompromised people. Patients are considerably less infectious after 5 days of antibiotics or 3 weeks into the paroxysmal phase.","k":"Give prophylaxis to all household contacts of pertussis, prioritizing infants and pregnant women."},{"n":410,"g":32,"q":"A 2-year-old had sudden coughing and choking while eating peanuts. He now has persistent wheeze that does not respond to bronchodilators, and the chest radiograph is normal. What is the best next step?","o":["Bronchoscopy, since a normal radiograph does not exclude a bronchial foreign body","Treat as asthma with systemic steroids and observe for 24 hours before any other test is planned","Perform abdominal thrusts to dislodge the object from the airway","Treat with a course of oral antibiotics and repeat the film in two weeks to see if it has cleared","Discharge on albuterol because the chest radiograph is normal at present and the wheeze is mild"],"a":0,"e":"Foreign body aspiration is most common at age 1 to 3, and the object lodges in a bronchus in about 80%. Radiographs are negative in over 50% of tracheal and 25% of bronchial foreign bodies. Inspiratory and expiratory films may show air trapping, and a persistent wheeze not responding to bronchodilators with a compatible history calls for rigid bronchoscopy.","k":"A compatible history with a normal radiograph still needs bronchoscopy."},{"n":411,"g":32,"q":"A 7-month-old infant is conscious but unable to cry or cough after choking on a small toy. What is the correct initial maneuver?","o":["A blind finger sweep of the mouth","Alternating back blows and chest thrusts","Abdominal thrusts with the infant held upright","Immediate bag-valve-mask ventilation","Waiting for the infant to cough the object out spontaneously"],"a":1,"e":"For a conscious infant with complete obstruction, back blows and chest thrusts are used. A visible object may be removed by hand without pushing it further in, and laryngoscopy with Magill forceps can remove a visualized object. If these fail, bag-valve-mask ventilation or intubation may dislodge the object.","k":"Use back blows and chest thrusts, not abdominal thrusts, for a choking infant."},{"n":412,"g":33,"q":"A 22-year-old tall, thin man has sudden right pleuritic chest pain at rest. He is comfortable, has a normal heart rate and saturation, and the chest radiograph shows a small apical pneumothorax. This is his first episode. What is an appropriate approach?","o":["Immediate surgical pleurodesis during the same hospital admission, since a first episode may recur","Discharge without imaging and advise him to avoid air travel for a year, with no follow-up visit","Oxygen with observation for about 6 hours and a repeat radiograph; discharge if no progression","Admit for chest tube placement and early thoracoscopy in the operating room within the next day","Needle decompression at the second intercostal space, midclavicular line, followed by a chest tube"],"a":2,"e":"A first primary spontaneous pneumothorax that is small and asymptomatic can be observed on supplemental oxygen, with a repeat film and discharge if there is no progression, plus recheck within 24 hours. Larger or symptomatic primary cases get needle aspiration, then a chest tube if that fails. Recurrent episodes call for admission and VATS.","k":"Small, stable first primary pneumothoraces can be observed with oxygen and a repeat film."},{"n":413,"g":33,"q":"A 66-year-old smoker with emphysema has a small spontaneous pneumothorax and mild dyspnea. Which statement about management is correct?","o":["Observation alone is preferred, because chest tubes cause more harm in patients with underlying COPD than they prevent","Admit; most symptomatic secondary pneumothoraces need a tube or aspiration, since observation carries mortality","Perform needle decompression and discharge if the lung has re-expanded afterward on the follow-up film","Treat exactly like a primary pneumothorax and discharge after four hours of observation, since he is mildly dyspneic","Discharge with a prescription for oral steroids and follow-up in two weeks, since he has emphysema"],"a":1,"e":"Secondary pneumothorax occurs with underlying lung disease and has a worse prognosis. The page advises admitting all secondary pneumothoraces, a chest tube for symptomatic, large, or bilateral cases, and notes that observation alone is associated with some mortality in small asymptomatic cases.","k":"All secondary pneumothoraces are admitted, and most need drainage."},{"n":414,"g":33,"q":"A 24-year-old man has a symptomatic primary pneumothorax with a 4 cm distance from the lung apex to the cupola. He is stable. What is the best initial intervention?","o":["Bed rest at home with high-flow oxygen","Needle aspiration, with a chest tube or thoracoscopy if it fails","Needle decompression with a large-bore angiocatheter and discharge","Immediate thoracotomy","Observation for six hours and discharge"],"a":1,"e":"A pneumothorax with more than 3 cm from apex to cupola on an upright film is classed as large. For large or symptomatic primary pneumothorax, needle aspiration is performed, and failure suggests no resistance after 4 L aspirated without re-expansion. Tube thoracostomy follows, with admission, and VATS for recurrence.","k":"Large or symptomatic primary pneumothorax gets aspiration first, then a chest tube if it fails."},{"n":415,"g":33,"q":"A patient has just been intubated and has absent lung sliding on the left on ultrasound, but no lung point is seen. What is the most important consideration?","o":["Ultrasound is less sensitive than a chest radiograph for detecting a pneumothorax in the supine patient","A lung point should never be seen in a patient who has a pneumothorax, and finding one rules it out","Absent lung sliding is diagnostic of a pneumothorax in all circumstances and needs no further confirmation","Lung sliding is always absent after sedation and paralysis for intubation in every patient who is ventilated","Right mainstem intubation can mimic absent sliding; a lung point is needed to confirm pneumothorax"],"a":4,"e":"Absent lung sliding is not specific. Apnea or right mainstem intubation can cause absent sliding without a pneumothorax. A lung point, where sliding meets a nonsliding area, is considered pathognomonic. Ultrasound is more sensitive than chest radiography for pneumothorax in trauma patients.","k":"Absent lung sliding needs a lung point or clinical context to diagnose pneumothorax."},{"n":416,"g":33,"q":"A 17-year-old with asthma has chest pain, neck swelling that crackles on palpation, and a crunching sound synchronous with the heartbeat. The chest radiograph appears normal. What should be done next?","o":["Start high-dose intravenous steroids and admit for observation of the asthma exacerbation on the ward","Obtain a CT scan of the chest, since about 30% of cases show a normal radiograph","Perform pericardiocentesis on the suspicion that tamponade is developing","Place a chest tube on the assumption that tension physiology is present","Discharge him, since a normal radiograph excludes air in the mediastinum in a young adult with asthma"],"a":1,"e":"Subcutaneous emphysema of the neck and a systolic crunch (Hamman crunch) suggest pneumomediastinum, with asthma as the most common comorbidity. CT is the preferred test. About 30% of spontaneous cases have a normal chest film. Primary cases are benign and reabsorb over 1 to 2 weeks with supportive care.","k":"A normal chest film does not exclude pneumomediastinum; CT is the preferred test."},{"n":417,"g":33,"q":"A 28-year-old man has severe chest pain and neck crepitus after repeated forceful vomiting. Which statement is most appropriate?","o":["Valsalva maneuvers should be encouraged in order to clear the mediastinal air through the airway","Primary spontaneous pneumomediastinum is the only possible cause here, so he can be discharged now","Esophageal rupture is a life-threatening cause, so secondary cases need testing and admission","The pneumomediastinum is always benign and needs only analgesia at home with no further testing at all","A normal CT scan excludes any serious cause of the air in the neck after vomiting, so discharge is safe"],"a":2,"e":"Excessive vomiting including Boerhaave syndrome is a recognized cause, and esophageal rupture is a life-threatening cause of pneumomediastinum. Primary cases are benign and self-limited with outpatient follow-up in 24 to 48 hours, but secondary cases require a lower threshold for further testing and admission.","k":"Consider esophageal rupture when pneumomediastinum follows forceful vomiting."},{"n":418,"g":33,"q":"A hiker arrives at 3,800 meters on the second night with dyspnea at rest, a dry cough, and pink frothy sputum. Which is the treatment of choice?","o":["Intravenous furosemide and bed rest at altitude","Acetazolamide alone and continue the ascent","Immediate descent with minimal exertion","Intravenous morphine for dyspnea","A hot shower and oral rehydration"],"a":2,"e":"High-altitude pulmonary edema is noncardiogenic and the most lethal altitude illness, with mortality near 50% if descent is not completed in time. Immediate descent is the treatment of choice, with exertion minimized. If descent is impossible, use oxygen, a portable hyperbaric bag, keeping the patient warm, and expiratory positive airway pressure.","k":"Descend first in high-altitude pulmonary edema."},{"n":419,"g":33,"q":"A climber has high-altitude pulmonary edema, and a storm prevents descent. Which measures are appropriate while descent is arranged?","o":["Sleeping medication to help the climber rest until the storm clears and descent becomes possible later","Intravenous fluid bolus and a loop diuretic to clear the pulmonary edema while waiting for the storm to clear","Continued exertion to help the lungs acclimatize to the altitude","Supplemental oxygen and nifedipine, with a portable hyperbaric bag that does not delay descent","Salmeterol and acetazolamide given as the only treatments available, with no oxygen or other measures"],"a":3,"e":"When descent is not possible, give supplemental oxygen, use a portable hyperbaric bag if available (which should not delay descent), keep the patient warm, and use expiratory positive airway pressure. Nifedipine is used for treatment when descent is not possible and for prevention in those with prior HAPE.","k":"Oxygen and nifedipine bridge to descent in high-altitude pulmonary edema."},{"n":420,"g":33,"q":"What ascent rate is recommended above 2,500 meters to reduce the risk of high-altitude pulmonary edema?","o":["Up to 600 meters per day with a rest day every second day","A rapid ascent followed by 24 hours of strenuous exercise to acclimatize","Up to 1,000 meters per day if the climber is fit","There is no recommended rate because only altitude matters","No more than 300 to 350 meters of sleeping elevation gain per day"],"a":4,"e":"Gradual ascent, no more than 300 to 350 meters (about 1,000 feet) per day above 2,500 meters (8,000 feet), is the key preventive measure. Risk factors include rapid ascent, heavy exertion, cold, sleeping medications, and prior HAPE. Prevention drugs include nifedipine, tadalafil or sildenafil, salmeterol, and dexamethasone.","k":"Slow ascent is the primary prevention for altitude illness."},{"n":421,"g":33,"q":"A patient has a tracheostomy placed four days ago. The tube is found to be dislodged on the bed. He has strid

intravenous antibiotics before any outpatient option","Withhold antibiotics until the cervical cultures return, since the diagnosis is unconfirmed","Remove the device before giving any antibiotics, because it is the source of infection","Replace the device with a new one immediately, to maintain her contraception","Treat with antibiotics and leave the device in place"],"a":4,"e":"In pelvic inflammatory disease with an intrauterine device in place, treatment is the same and the device does not need to be removed. The device is a risk factor mainly in the first 21 days after insertion.","k":"Treat PID without removing a properly placed IUD."},{"n":259,"g":21,"q":"A 38-year-old man with HIV, a CD4 count of 40 cells per microliter, and two weeks of headache has cryptococcal meningitis. The opening pressure is markedly elevated. Which management step is most appropriate?","o":["Therapeutic lumbar puncture to lower the pressure by about half, or to below 20","Avoid any repeat lumbar puncture and give mannitol only, since drainage risks herniation","Start corticosteroids to reduce the pressure and the brain edema from the infection","Start antiretrovirals immediately without antifungal therapy, to restore immune function quickly","Discharge with oral fluconazole alone and repeat the lumbar puncture in two weeks"],"a":0,"e":"In cryptococcal meningitis the opening pressure is usually elevated, and drainage of cerebrospinal fluid until the pressure falls below 20 or by about 50% is recommended. Induction therapy is amphotericin B plus flucytosine, and CSF cryptococcal antigen is highly sensitive and specific.","k":"Drain CSF in cryptococcal meningitis to lower raised pressure."},{"n":260,"g":21,"q":"A 29-year-old man has a painless genital ulcer with a clean base and nontender inguinal nodes. Serology confirms primary syphilis. Which treatment is recommended?","o":["A single intramuscular dose of benzathine penicillin G","Intravenous penicillin for 14 days, which is the regimen reserved for neurosyphilis","A single dose of ceftriaxone only, which is not a recommended regimen for primary syphilis","A single oral dose of azithromycin, which has been associated with treatment failure","Benzathine penicillin G weekly for three weeks, which is the regimen for late latent disease"],"a":0,"e":"Primary, secondary, and early latent syphilis, defined as under one year, are treated with benzathine penicillin G 2.4 million units intramuscularly once. Late latent disease needs three weekly doses, and neurosyphilis needs intravenous penicillin for 10 to 14 days.","k":"Early syphilis is treated with one dose of benzathine penicillin."},{"n":261,"g":21,"q":"A 45-year-old man with HIV has blurred vision, uveitis, and a positive rapid plasma reagin test. Ocular syphilis is diagnosed. How should he be treated?","o":["Topical steroids only, with outpatient ophthalmology follow-up in a month","As neurosyphilis, with intravenous penicillin G for 10 to 14 days","Observation with repeat serology in three months, since vision loss is probably from HIV retinopathy","A single intramuscular dose of benzathine penicillin G, as for early syphilis without eye involvement","Oral doxycycline for four weeks, which is an alternative only for non-neurologic late disease"],"a":1,"e":"Ocular syphilis is treated like neurosyphilis. Regimens include aqueous penicillin G intravenously every 4 hours or by continuous infusion for 10 to 14 days, or procaine penicillin with probenecid. Ceftriaxone is an alternative.","k":"Ocular syphilis gets neurosyphilis therapy."},{"n":262,"g":21,"q":"A 30-year-old man develops fever, chills, myalgias, and mild hypotension four hours after receiving benzathine penicillin for secondary syphilis. He has no hives, wheeze, or angioedema. What is the most likely explanation?","o":["A drug fever from the vehicle","Contaminated medication causing sepsis","IgE-mediated anaphylaxis","A Jarisch-Herxheimer reaction","Serum sickness"],"a":3,"e":"The Jarisch-Herxheimer reaction produces fever, chills, myalgias, headache, tachycardia, and mild hypotension within hours of starting treatment for spirochetal infection and usually resolves within 12 to 24 hours. Treatment is symptomatic, and it is not an allergic reaction to penicillin.","k":"Fever and chills hours after syphilis treatment without urticaria is a Jarisch-Herxheimer reaction."},{"n":263,"g":21,"q":"A 40-year-old man with HIV has had three weeks of progressive exertional dyspnea and dry cough. His oxygen saturation is 88% on room air, the chest radiograph shows bilateral interstitial infiltrates, and the PaO2 is 58 mm Hg. In addition to trimethoprim-sulfamethoxazole, which therapy is indicated?","o":["Nebulized albuterol only","Intravenous acyclovir","A corticosteroid taper","Hydroxychloroquine","Amphotericin B"],"a":2,"e":"Pneumocystis pneumonia in HIV is treated with trimethoprim-sulfamethoxazole. Adjunctive corticosteroids are given when the room air PaO2 is below 70 mm Hg or the alveolar-arterial gradient is above 35 mm Hg, as in this patient.","k":"Add steroids to Pneumocystis therapy when PaO2 is under 70 or the A-a gradient is over 35."},{"n":264,"g":21,"q":"A 36-year-old man with HIV and a CD4 count of 80 has two weeks of dry cough and exertional dyspnea. His chest radiograph is normal and his oxygen saturation falls with walking. What is the best next step?","o":["Reassure him because a normal radiograph excludes Pneumocystis pneumonia","A CT of the chest to look for ground-glass opacities","Obtain an ECG and discharge","Discharge with an antitussive","Repeat the chest radiograph in two weeks"],"a":1,"e":"The chest radiograph is normal in about 25% of Pneumocystis pneumonia, and CT can show a ground-glass pattern with sensitivity near 100% in the reference. LDH is usually elevated but not specific, and exertional desaturation supports the diagnosis.","k":"A normal chest radiograph does not rule out Pneumocystis pneumonia."},{"n":265,"g":21,"q":"A 36-year-old man with HIV and a CD4 count of 50 has headache, fever, and a seizure. CT shows multiple ring-enhancing lesions in the basal ganglia. Which empiric treatment is most appropriate?","o":["Pyrimethamine and sulfadiazine with leucovorin","Intravenous acyclovir for presumed herpes simplex encephalitis in this immunocompromised patient","Intravenous ceftriaxone and vancomycin only, for presumed bacterial brain abscesses","Amphotericin B for presumed cryptococcal disease of the brain, started in the emergency department","Whole-brain radiation for presumed primary lymphoma, started the same day"],"a":0,"e":"Multiple subcortical ring-enhancing lesions in a patient with HIV and a CD4 count under 100 suggest CNS toxoplasmosis. Empiric treatment is pyrimethamine plus leucovorin and either sulfadiazine, clindamycin, or another companion agent, and dexamethasone can be added for significant edema or mass effect.","k":"Multiple ring-enhancing lesions with a very low CD4 count are treated empirically for toxoplasmosis."},{"n":266,"g":21,"q":"A patient with advanced HIV has a single enhancing lesion on brain imaging. Which location and number most favor primary CNS lymphoma over toxoplasmosis?","o":["Multiple lesions in the basal ganglia, which is the classic pattern of toxoplasmosis","Isodense exudate filling the basal cisterns, which suggests tuberculous meningitis","Multiple small lesions with no enhancement, which suggest an old infarct or small vessel disease","A single lesion in the periventricular white matter or corpus callosum","Multiple subcortical lesions, which suggest an infectious cause such as toxoplasmosis"],"a":3,"e":"Toxoplasmosis typically causes multiple subcortical lesions, often in the basal ganglia, whereas primary CNS lymphoma more often presents as a single periventricular or corpus callosum lesion. Cerebral tuberculosis can show basal cistern exudate.","k":"Single periventricular lesion suggests lymphoma; multiple subcortical lesions suggest toxoplasmosis."},{"n":267,"g":21,"q":"A 22-year-old man has urethral discharge and dysuria. Gram stain shows gram-negative intracellular diplococci. Which treatment is recommended?","o":["Cefixime alone, which leaves chlamydia untreated unless coverage is added","Ceftriaxone intramuscularly plus doxycycline","Doxycycline alone, which would treat chlamydia but not gonorrhea","Azithromycin 1 g alone, which does not provide reliable gonorrhea coverage","Ciprofloxacin alone, since fluoroquinolone resistance in gonorrhea is rare"],"a":1,"e":"Uncomplicated gonorrhea is treated with a single intramuscular dose of ceftriaxone, and chlamydia is treated at the same time with doxycycline for seven days when either infection is suspected. Cefixime-based regimens need added chlamydia coverage.","k":"Treat gonorrhea with ceftriaxone and cover chlamydia as well."},{"n":268,"g":21,"q":"A 28-year-old health care worker sustains a deep needlestick injury with visible blood on the needle from a patient with advanced HIV and a high viral load. It has been 3 hours since exposure. Which management is most appropriate?","o":["Wait for the source patient's repeat testing before treating, since the viral load is already known","Give hepatitis B immune globulin only, since this is the most likely infection from a needle","Give a two-drug regimen for seven days, which is enough for an occupational exposure","Offer reassurance and test again at six months, because transmission risk is below one percent","Start a three-drug antiretroviral regimen now and continue for 28 days"],"a":4,"e":"Postexposure prophylaxis should start as soon as possible, ideally within 2 hours and generally within 72 hours, and continue for 28 days. High-risk exposures include a deep injury or visible blood on the device from a source with symptomatic disease or high viral load, and a regimen of three or more antiretroviral drugs is used.","k":"Start HIV postexposure prophylaxis immediately and continue for 28 days."},{"n":269,"g":22,"q":"A 55-year-old man with HIV has a month of cough, weight loss, and night sweats. Chest radiography shows an upper-lobe cavity. He is ill-appearing. Which approach best evaluates for active tuberculosis?","o":["A tuberculin skin test, to rule out active disease before any isolation measures","A single sputum specimen sent to the laboratory, with discharge pending results","Airborne isolation and two sputum specimens at least 8 hours apart, with rapid PCR","An interferon-gamma release assay alone, which rules out active disease if negative","Pleural fluid analysis only, since a cavity on radiography implies an effusion"],"a":2,"e":"Sputum PCR rapidly detects tuberculosis and rifampin resistance, and two specimens at least 8 hours apart including an early morning sample are used to rule out active disease. Tuberculin testing is for population screening and not for ruling out active disease. Ill-appearing patients are admitted, and public health is contacted.","k":"Rule out active tuberculosis with sputum testing, not a skin test."},{"n":270,"g":22,"q":"A 50-year-old homeless man with a known tuberculosis exposure is hypotensive despite fluid resuscitation. He has hyponatremia and hyperpigmentation. Which diagnosis should be considered?","o":["Pulmonary embolism","Adrenal insufficiency from tuberculosis","Septic shock from pneumococcal pneumonia only","Acute myocardial infarction","Miliary tuberculosis with no endocrine involvement"],"a":1,"e":"Adrenal involvement is usually bilateral in tuberculosis, and adrenal insufficiency should be considered in shock in a patient with tuberculosis risk factors. Extrapulmonary tuberculosis includes lymph node disease, which is the most common form, pericarditis, peritonitis, meningitis, arthritis, and spinal disease.","k":"Think adrenal tuberculosis in refractory shock with risk factors."},{"n":271,"g":22,"q":"A 6-week-old unvaccinated infant has a paroxysmal cough, then a brief apneic episode with color change. The white blood cell count is 40,000 per microliter with 85% lymphocytes. Which plan is most appropriate?","o":["Give oral oseltamivir and discharge home with a return precautions sheet only","Treat with oral amoxicillin alone and arrange outpatient review in one week","Start oral corticosteroids for the cough and discharge home with follow-up","Admit with droplet precautions and give a macrolide such as azithromycin","Discharge home with a cough suppressant and a follow-up call in 48 hours"],"a":3,"e":"Infants with pertussis can present with apnea, and lymphocytosis is common. Infants with apnea are admitted, droplet precautions are used, and azithromycin is the treatment, though antibiotics mainly reduce infectiousness rather than shorten the illness.","k":"Infant pertussis with apnea needs admission, droplet precautions, and azithromycin."},{"n":272,"g":22,"q":"A 70-year-old nursing home resident has had influenza symptoms for four days and is now hypoxemic and admitted to the hospital. Which statement about antiviral therapy is correct?","o":["Oseltamivir should be started, since it may help severely ill inpatients beyond 48 hours","Oseltamivir should be given only after a repeat chest radiograph shows clearing","Oseltamivir should be withheld because symptoms have already lasted for more than 48 hours","Corticosteroids alone are the standard therapy for hospitalized influenza","Antibiotics alone should be used until the viral PCR returns and confirms influenza"],"a":0,"e":"For admitted patients, treatment should start promptly and empirically, and benefit is greatest within 48 hours but may extend to severely ill inpatients with 48 hours to 5 days of symptoms. There is no evidence of benefit after 5 days. The adult dose is 75 mg twice daily for 5 days.","k":"Hospitalized influenza patients are treated even beyond 48 hours."},{"n":273,"g":22,"q":"A 32-year-old previously healthy man had influenza and was improving, but after five days he develops high fever, productive cough, and a cavitary infiltrate. Which organisms should empiric therapy cover?","o":["Legionella only","Atypical organisms such as Mycoplasma and Chlamydia species only, with no other coverage","Anaerobes only","Streptococcus pneumoniae and Staphylococcus aureus including MRSA","Pseudomonas and Acinetobacter only, with double gram-negative antibiotic coverage"],"a":3,"e":"Worsening after initial improvement suggests secondary bacterial pneumonia. The most common organisms are Streptococcus pneumoniae and Staphylococcus aureus, and MRSA can cause necrotizing, cavitary infection with high mortality in previously healthy young adults.","k":"Post-influenza bacterial pneumonia is pneumococcus or Staphylococcus aureus including MRSA."},{"n":274,"g":22,"q":"A 45-year-old man who injects black tar heroin has diplopia, ptosis, dysphagia, and a descending symmetric weakness. His pupils are dilated and his mental status is clear. Which management is most appropriate?","o":["Edrophonium testing in the emergency department and discharge if the response is positive","Contact the CDC or health department for antitoxin, debride the wound, and admit to the ICU","Wait for electromyography and nerve conduction studies before any treatment is started","Intravenous immunoglobulin as for Guillain-Barre syndrome and admission to a neurology ward","Oral prednisone with an outpatient neurology review in one week"],"a":1,"e":"Descending weakness with cranial nerve findings, dilated pupils, and a clear sensorium after injection drug use suggests wound botulism. Equine antitoxin is obtained through the CDC or the health department, wounds are debrided with antibiotics, and the patient is admitted to the ICU with early ventilatory support because respiratory failure can develop.","k":"Descending paralysis with dilated pupils is botulism until proven otherwise."},{"n":275,"g":22,"q":"A 5-month-old infant has constipation, a weak cry, poor feeding, and decreased head control. His mother gave him honey on a pacifier. Which treatment is indicated?","o":["Intramuscular gentamicin","Oral neostigmine","Equine botulism antitoxin","Intravenous immunoglobulin for Guillain-Barre syndrome","Human-derived botulism immune globulin"],"a":4,"e":"Infant botulism follows ingestion of spores, often from honey, and is treated with human-based botulism immune globulin obtained through the CDC or health department. Equine antitoxin is used for foodborne and inhalational botulism in patients over one year old. Honey should not be given to infants under 12 months.","k":"Infant botulism is treated with human botulism immune globulin."},{"n":276,"g":22,"q":"An 8-year-old boy with sickle cell disease has fever and bone pain in the left leg. Which organism is classically associated with osteomyelitis in this condition in addition to Staphylococcus aureus?","o":["Pasteurella multocida","Eikenella corrodens","Salmonella","Group B Streptococcus","Pseudomonas aeruginosa"],"a":2,"e":"In sickle cell disease, osteomyelitis is associated with Salmonella and other gram-negative bacteria as well as Staphylococcus aureus. Empiric therapy combines ceftriaxone or cefotaxime with an agent active against Staphylococcus, such as vancomycin, clindamycin, or nafcillin.","k":"Sickle cell osteomyelitis: think Salmonella as well as Staphylococcus."},{"n":277,"g":22,"q":"A 55-year-old man with diabetes has a plantar foot ulcer. A probe touches bone, and the radiograph is normal. Which imaging study is most useful next?","o":["CT of the foot","MRI of the foot","Ultrasound of the heel","Repeat plain radiograph the same day","No imaging, because the probe test is unreliable"],"a":1,"e":"Plain radiographs may be normal early, with changes appearing about 10 to 21 days after infection. MRI is the standard imaging for osteomyelitis and can be positive as early as 3 to 5 days. A positive probe-to-bone test is a risk factor for osteomyelitis in the diabetic foot.","k":"A normal early radiograph does not exclude osteomyelitis; MRI is the standard."},{"n":278,"g":22,"q":"A 78-year-old woman has watery diarrhea after antibiotics. Her white blood cell count is 18,000 per microliter and her creatinine is 1.9 mg/dL. She is normotensive with no ileus. Which feature would define fulminant disease?","o":["Three loose stools in 24 hours","A creatinine above 1.5 mg/dL","A white blood cell count above 15,000","Hypotension, ileus, or megacolon","A fever of 38.2 C"],"a":3,"e":"A white cell count of 15,000 or more or a creatinine above 1.5 mg/dL defines severe Clostridioides difficile infection. Fulminant infection is defined by hypotension, ileus or significant distension, or megacolon, and is treated with higher-dose oral vancomycin and intravenous metronidazole, with surgical consultation.","k":"Severe C. difficile is leukocytosis or raised creatinine; fulminant is shock, ileus, or megacolon."},{"n":279,"g":22,"q":"A 40-year-old man steps on a rusty nail. He has received two doses of tetanus vaccine as a child and does not remember more. The wound is deep and contaminated. What is the best prophylaxis?","o":["A tetanus toxoid-containing vaccine plus tetanus immune globulin","Tetanus immune globulin alone","No prophylaxis because the wound looks minor and was cleaned at home","Oral antibiotics for seven days and no vaccine or immune globulin given","Tetanus vaccine alone"],"a":0,"e":"For a dirty wound in a patient with an unknown or fewer than three-dose history, both a tetanus toxoid-containing vaccine and tetanus immune globulin are given. For clean wounds with an incomplete history, vaccine alone is enough.","k":"Dirty wound plus incomplete vaccination needs vaccine and immune globulin."},{"n":280,"g":22,"q":"A 10-year-old girl has migratory arthritis of the knees and ankles, a new apical murmur, and a sore throat two weeks ago. A throat swab is negative for group A Streptococcus. Which antibiotic recommendation is correct?","o":["Aspirin only, since antibiotics have no role once the arthritis has begun","Doxycycline for 10 days, which eradicates group A Streptococcus reliably in children","Ciprofloxacin for 5 days, as a first-line choice for streptococcal infection","No antibiotic should be given because the throat culture is negative for the organism","Penicillin should be given even though the culture is negative"],"a":4,"e":"Acute rheumatic fever is diagnosed using the modified Jones criteria, with two major or one major and two minor criteria plus evidence of preceding group A streptococcal infection. Penicillin is indicated for all patients with rheumatic fever even if the throat culture is negative, and aspirin is the primary treatment for carditis and arthritis.","k":"Treat rheumatic fever with penicillin regardless of the culture result."},{"n":281,"g":23,"q":"A 34-year-old hiker has fever, fatigue, and palpitations three weeks after a tick bite and a circular rash. His ECG shows complete heart block with a ventricular rate of 38 beats per minute. Which management is most appropriate?","o":["Admit with cardiac monitoring and give intravenous ceftriaxone","Intravenous acyclovir","Observation only, since heart block in Lyme disease never needs treatment","Oral doxycycline and discharge with outpatient follow-up","High-dose oral steroids as the only therapy"],"a":0,"e":"Lyme carditis ranges from first-degree block with a PR interval under 0.3 seconds, treated with oral doxycycline or amoxicillin, to high-degree block, which needs intravenous ceftriaxone or penicillin G and cardiac monitoring. Patients with Lyme carditis are admitted for monitoring.","k":"High-degree block from Lyme carditis needs admission, monitoring, and intravenous antibiotics."},{"n":282,"g":23,"q":"A 45-year-old woman removes a tick from her thigh. She believes it was attached for about two days, and it was an engorged adult Ixodes scapularis. She lives where more than 20% of ticks carry the organism. She reports removing it 24 hours ago and has no drug allergies. Which action is most appropriate?","o":["Order Lyme serology now and treat if positive","Give a single dose of doxycycline","Give a 14-day course of amoxicillin","Reassure her and give no prophylaxis because the tick is removed","Give intravenous ceftriaxone for three days"],"a":1,"e":"Single-dose doxycycline prophylaxis is considered when the tick was an adult or nymphal Ixodes scapularis attached for more than 36 hours, prophylaxis can start within 72 hours of removal, the local infection rate in ticks exceeds 20%, and doxycycline is not contraindicated. Attachment under 24 hours carries no meaningful risk.","k":"Doxycycline prophylaxis after a tick bite requires a qualifying tick, long attachment, early timing, and endemic area."},{"n":283,"g":23,"q":"A 12-year-old boy who lives in an endemic area has had two days of headache, stiff neck, and new bilateral facial weakness. Cerebrospinal fluid shows lymphocytic pleocytosis and Lyme antibodies. Which treatment is most appropriate?","o":["A single oral dose of doxycycline taken once, with discharge","Oral azithromycin for five days","Intravenous ceftriaxone for 14 to 28 days","Intravenous acyclovir for two weeks, given for presumed encephalitis","Oral amoxicillin for three days"],"a":2,"e":"Lyme meningitis and other early disseminated neurologic disease, including cranial nerve palsy with meningitis, is treated with intravenous ceftriaxone for about 14 to 28 days, with doxycycline as an alternative. A lumbar puncture is needed when neurologic findings accompany facial palsy.","k":"Lyme meningitis is treated with intravenous ceftriaxone for weeks."},{"n":284,"g":23,"q":"A 35-year-old man returns from sub-Saharan Africa and has fever and chills ten days later. A thick and thin blood smear is negative on the first sample. What is the best next step?","o":["Exclude malaria and discharge on antipyretics, since the first smear is negative","Repeat the smears every 12 hours for two to three days before excluding malaria","Treat only for typhoid and stop malaria testing, since both can present with fever","Wait for cyclic fevers to appear before repeating the blood test","Send a single serum antibody test and discharge if the result is negative"],"a":1,"e":"A first smear is positive in more than 90% of cases, so a negative smear does not exclude malaria in a febrile traveler. Smears are repeated twice daily for two to three days. In an unstable patient with strong suspicion, treatment should not wait for repeat smears.","k":"A single negative smear does not exclude malaria in a febrile traveler."},{"n":285,"g":23,"q":"A 30-year-old woman returns from West Africa with fever, confusion, and a hemoglobin of 6.5 g/dL. Smear shows Plasmodium falciparum with a parasitemia of 8%. Which treatment is first line?","o":["Intravenous artesunate","Oral primaquine","Oral chloroquine","Intravenous ceftriaxone","Oral artemether-lumefantrine alone"],"a":0,"e":"Altered mental status, severe anemia, and a parasitemia above 5% define severe malaria. Intravenous artesunate is the first-line treatment, clears parasites faster than quinine, and is given for at least 24 hours before an oral course. Patients need admission, and ICU care if complications develop.","k":"Severe falciparum malaria needs intravenous artesunate."},{"n":286,"g":23,"q":"A 28-year-old woman has had four days of fever, headache, and myalgia during a dengue outbreak. Today her fever has resolved, but she now has persistent vomiting, right upper quadrant tenderness, and a narrowed pulse pressure. Which management is most appropriate?","o":["Give ibuprofen for abdominal pain and discharge home with advice","Give aspirin for fever and pain","Admit for monitored intravenous fluid resuscitation","Give prophylactic platelet transfusions to raise the count above normal","Give high-dose corticosteroids"],"a":2,"e":"Persistent vomiting, right upper quadrant tenderness, a narrowed pulse pressure, and mucosal bleeding are warning signs of severe dengue, which classically appears around defervescence. Intravenous fluids with careful monitoring are the mainstay. NSAIDs and aspirin raise bleeding risk, and prophylactic platelets and steroids are not recommended.","k":"Warning signs after defervescence in dengue mean admit and give careful intravenous fluids."},{"n":287,"g":23,"q":"A 15-year-old boy has had dengue for four days. Yesterday his fever resolved and he felt better. Today he is lethargic, restless, and has cold extremities. Which statement best explains this?","o":["He is in the recovery phase and needs only oral fluids and acetaminophen at home","The fever resolution proves that the illness has ended and the symptoms are anxiety","He is in the critical phase at defervescence, with plasma leakage that threatens shock","He has an allergic reaction to the acetaminophen he has taken for the fever","He has developed a secondary bacterial sepsis that is unrelated to the dengue infection"],"a":2,"e":"The critical phase of dengue occurs around the time the fever resolves, when plasma leakage can cause shock, bleeding, and organ impairment. It affects a minority of patients, and lethargy, restlessness, and a narrowed pulse pressure are warning signs.","k":"In dengue, the dangerous period begins as the fever falls."},{"n":288,"g":23,"q":"A 40-year-old man wakes to find a bat in his bedroom. He has no visible bite, has never been vaccinated against rabies, and the bat has flown away. Which management is most appropriate?","o":["Rabies immune globulin without any vaccine, since it provides immediate protection","Observe the bat for ten days to see whether it becomes ill and then decide","Rabies vaccine alone, because there is no visible wound and the bat has gone","Rabies immune globulin plus a four-dose rabies vaccine series","No treatment, since there is no visible bite and sleeping contact alone is harmless"],"a":3,"e":"A bat in a room with unknown salivary exposure is an indication for prophylaxis, because bite marks can be missed. An unvaccinated, immunocompetent patient receives immune globulin plus vaccine on days 0, 3, 7, and 14. Immune globulin can be given up to 7 days after the first vaccine dose.","k":"Possible unrecognized bat exposure needs full rabies prophylaxis."},{"n":289,"g":23,"q":"A 32-year-old man who completed a full rabies vaccine series two years ago is bitten by a bat. He is immunocompetent. Which regimen is correct?","o":["Rabies vaccine on days 0 and 3 without immune globulin","Rabies immune globulin plus a four-dose vaccine series","Rabies immune globulin alone","A five-dose vaccine series with immune globulin","Observation without prophylaxis"],"a":0,"e":"Previously vaccinated immunocompetent patients need only two doses of vaccine on days 0 and 3, with no immune globulin. Unvaccinated patients receive immune globulin plus four doses. Immunocompromised patients receive five doses and immune globulin.","k":"Previously vaccinated patients get two vaccine doses and no immune globulin."},{"n":290,"g":23,"q":"An unvaccinated 18-month-old has three days of fever, cough, coryza, and conjunctivitis. Examination shows tiny bluish-white spots on an erythematous base on the buccal mucosa. Which action is the highest priority?","o":["Standard precautions only, with the child seated in the waiting room","Droplet precautions in a shared room","Place the child in an airborne infection isolation room immediately","Send the family to the waiting room to wait without a mask until a bed opens","Cohort the child with other febrile patients"],"a":2,"e":"Koplik spots are the pathognomonic enanthem of measles. Measles is airborne, so the patient is masked and placed in an airborne isolation room at once, staff wear respiratory protection at least as effective as N95, and the room is not reused for at least two hours after the patient leaves. Patients are contagious from about four days before to four days after the rash.","k":"Koplik spots mean measles and immediate airborne isolation."},{"n":291,"g":23,"q":"A 30-year-old immunocompetent, nonimmune man was exposed to a patient with measles 48 hours ago at work. He is well. Which measure is most appropriate?","o":["Measles vaccine within 72 hours of exposure","Oseltamivir","No intervention because he has no symptoms","Oral vitamin A","Immune globulin only, since vaccine is never useful after exposure"],"a":0,"e":"Postexposure prophylaxis for nonimmune immunocompetent contacts is MMR vaccine within 72 hours of exposure. Immune globulin is given up to 6 days after exposure to immunocompromised patients, infants under 12 months, and others at high risk of complications.","k":"MMR within 72 hours protects exposed nonimmune contacts; immune globulin extends to 6 days for high-risk contacts."},{"n":292,"g":23,"q":"A 28-year-old man returned from India two weeks ago and has had ten days of fever, abdominal pain, and a pulse of 68 beats per minute despite a temperature of 39.5 C. A blood culture grows Salmonella Typhi that is resistant to nalidixic acid. Which empiric therapy is most appropriate?","o":["Ceftriaxone or azithromycin rather than a fluoroquinolone","Amoxicillin alone, which is standard therapy for susceptible Salmonella","Oral doxycycline for ten days, which has reliable activity in enteric fever","Ciprofloxacin alone, which is the traditional oral therapy for enteric fever","Trimethoprim-sulfamethoxazole alone, which remains first-line in South Asia"],"a":0,"e":"Relative bradycardia for the degree of fever (Faget sign) and rose spots point to enteric fever. Fluoroquinolone resistance should be assumed when the isolate is resistant to nalidixic acid, so ceftriaxone or azithromycin is used, and infectious diseases input is advised because of multidrug-resistant strains.","k":"Assume fluoroquinolone resistance in nalidixic acid-resistant typhoid and use ceftriaxone or azithromycin."},{"n":293,"g":23,"q":"A 68-year-old asplenic man who vacationed on Cape Cod has fever, hemolytic anemia, thrombocytopenia, and a blood smear showing intraerythrocytic parasites in a Maltese cross pattern. Parasitemia is 6%. Which treatment is most appropriate?","o":["Oral chloroquine","Atovaquone plus azithromycin as an outpatient","Clindamycin plus quinine, with admission","Doxycycline alone","Ceftriaxone"],"a":2,"e":"Babesiosis is more severe in asplenic and elderly patients. Mild disease with parasitemia under 4% is treated with atovaquone plus azithromycin. Severe disease, with parasitemia above 4%, hemoglobin below 10 g/dL, or asplenia, is treated with clindamycin plus quinine and admission.","k":"Severe babesiosis in an asplenic patient is treated with clindamycin plus quinine."},{"n":294,"g":24,"q":"A 50-year-old man has a hot, swollen first metatarsophalangeal joint. His serum uric acid is normal. How should the normal level be interpreted?","o":["It excludes gout, because the level is below the threshold for crystal formation","It indicates that allopurinol should be started today to prevent further attacks","It proves the diagnosis is pseudogout, since urate crystals would raise the serum level","It does not exclude gout, since about 30% of acute attacks occur with normal levels","It means that crystal analysis of the joint fluid is unnecessary for diagnosis"],"a":3,"e":"Serum uric acid is unreliable during an acute gout attack, and about 30% of attacks occur with normal levels. It can even be low during an attack because of crystal precipitation. Diagnosis rests on the clinical picture and, when needed, joint fluid analysis showing negatively birefringent needle-shaped crystals.","k":"A normal uric acid does not exclude acute gout."},{"n":295,"g":24,"q":"A 72-year-old woman has an acutely swollen knee. Synovial fluid shows rhomboid-shaped crystals that are positively birefringent under polarized light. Which diagnosis is most likely?","o":["Cholesterol crystal arthritis, a rare cause of chronic effusions","Septic arthritis with no crystals, since the fluid appears turbid","Calcium pyrophosphate deposition disease","Calcium oxalate arthropathy, seen mainly in patients on dialysis","Gout, because the crystals are urate crystals seen in many older patients"],"a":2,"e":"Gout produces negatively birefringent needle-shaped monosodium urate crystals, and pseudogout produces positively birefringent rhomboid-shaped calcium pyrophosphate crystals. Crystals do not exclude infection, so cell count, Gram stain, and culture still matter.","k":"Rhomboid positively birefringent crystals mean calcium pyrophosphate."},{"n":296,"g":24,"q":"A 60-year-old man with stage 4 chronic kidney disease has acute podagra. Which treatment is most appropriate?","o":["Intravenous colchicine, which acts faster than oral dosing","Start allopurinol today, to lower the urate level and end the flare","Indomethacin three times a day, which relieves the pain quickly in most patients","High-dose ibuprofen three times a day, with a proton pump inhibitor for protection","Oral corticosteroids, such as prednisone, with a taper"],"a":4,"e":"NSAIDs should be avoided in renal insufficiency, and colchicine needs dose reduction. Prednisone 30 to 50 mg tapered over about 10 days is an option. Colchicine should never be given intravenously, and urate-lowering therapy should not be started during a flare, though it should be continued if already taken.","k":"Use steroids for gout flares in advanced kidney disease and do not start urate-lowering therapy mid-flare."},{"n":297,"g":24,"q":"A 58-year-old man has a hot, swollen knee, a temperature of 38.9 C, and needle-shaped crystals in the joint fluid. The synovial white cell count is 90,000 per microliter. What is the best management?","o":["Inject the joint with a glucocorticoid, to treat the crystal-induced inflammation","Discharge with NSAIDs and review in a week, since crystals confirm the diagnosis","Treat as possible septic arthritis until the Gram stain and culture are available","Repeat arthrocentesis in one week without treatment, since the fluid is probably inflammatory","Treat as gout only and discharge with colchicine, since crystals were seen on microscopy"],"a":2,"e":"Crystals do not exclude septic arthritis, and the two can coexist. Septic arthritis is highly unlikely when the synovial white count is below 50,000, so a count of 90,000 with fever demands treatment for infection until the culture is known. Steroid injection should be avoided when the picture is uncertain.","k":"Crystals and infection can coexist; a very high synovial white count means treat for infection."},{"n":298,"g":24,"q":"A 13-year-old obese boy has two weeks of left knee pain and a limp. His knee examination is normal. Which investigation is most appropriate?","o":["Ultrasound of the knee for effusion, then discharge with ibuprofen","Reassurance and discharge for growing pains with outpatient follow-up","Anteroposterior and lateral radiographs of the symptomatic knee only","MRI of the knee with and without contrast","Anteroposterior and frog-leg radiographs of both hips"],"a":4,"e":"Slipped capital femoral epiphysis typically occurs in obese adolescents, and pain is often referred to the knee. Bilateral anteroposterior and frog-leg views of the hip show the widened physis and later displacement, and up to 40% of cases are bilateral.","k":"Knee pain in an obese adolescent needs a hip radiograph."},{"n":299,"g":24,"q":"A 12-year-old boy is diagnosed with slipped capital femoral epiphysis on radiographs. Which management is correct?","o":["Strict non-weight bearing and analgesia, with orthopedic consultation for fixation","Hip massage, physical therapy, and weight reduction counseling at the pediatric clinic","Hip aspiration followed by discharge on crutches with a return visit in a week","Weight bearing as tolerated with NSAIDs and clinic follow-up in four weeks","Crutches for comfort with outpatient referral to orthopedics next month"],"a":0,"e":"Slipped capital femoral epiphysis requires strict non-weight bearing, analgesia, orthopedic consultation from the emergency department, and admission. Internal fixation is immediate for unstable slips and may be delayed a few days for stable slips.","k":"Slipped capital femoral epiphysis is an orthopedic emergency: non-weight bearing and fixation."},{"n":300,"g":24,"q":"A 5-year-old boy has hip pain and cannot bear weight. His temperature is 38.7 C, ESR is 50 mm per hour, and white blood cell count is 14,000 per microliter. Which interpretation is most accurate?","o":["This is a viral myositis that needs no testing and will settle with rest","All four Kocher criteria are met, so septic arthritis is likely and needs urgent aspiration","Legg-Calve-Perthes disease should be diagnosed by observation over several weeks","Discharge with a return visit in one week, since the child is only five years old","This is transient synovitis, so NSAIDs and reassurance are sufficient with follow-up in a week"],"a":1,"e":"The Kocher criteria are inability to bear weight, ESR above 40, white cell count above 12,000, and fever of 38.5 C or higher. The probability of a septic joint rises with the number met: about 3% with one, 40% with two, 93% with three, and 99% with four.","k":"A child with four Kocher criteria has septic arthritis until proven otherwise."},{"n":301,"g":24,"q":"A child with hip pain meets two of the four Kocher criteria for septic arthritis. Which approximate probability of septic arthritis does this carry?","o":["About 15%","About 93%","About 99%","About 40%","About 3%"],"a":3,"e":"With one criterion the probability of a septic joint is about 3%, with two about 40%, with three about 93%, and with four about 99%. A child with two criteria is at substantial risk and needs further evaluation, such as ultrasound and arthrocentesis if an effusion is present.","k":"Two Kocher criteria still carry a substantial risk of a septic joint."},{"n":302,"g":24,"q":"A 72-year-old woman has several weeks of aching and morning stiffness in both shoulders and hips. The ESR is markedly elevated. Which question is most important to ask before treatment?","o":["Whether she has had a recent vaccination, since vaccines commonly trigger this syndrome","Whether she takes vitamin D supplements, since deficiency mimics this presentation","Whether she has headache, jaw claudication, or visual symptoms of giant cell arteritis","Whether she has had recent tooth extractions, which commonly cause shoulder pain at her age","Whether she has joint swelling in the toes only, which would suggest gout instead"],"a":2,"e":"Polymyalgia rheumatica occurs almost exclusively after age 50, with proximal pain and morning stiffness. About 15% of patients develop giant cell arteritis, so headache, scalp tenderness, jaw claudication, and visual symptoms must be sought, and NSAIDs are avoided when giant cell arteritis is a concern.","k":"Always screen polymyalgia rheumatica patients for giant cell arteritis symptoms."},{"n":303,"g":24,"q":"A 74-year-old woman with polymyalgia rheumatica has no headache, jaw pain, or visual symptoms. Which emergency department treatment is most appropriate?","o":["High-dose intravenous methylprednisolone with admission to the hospital for observation","A prolonged course of antibiotics, since the presentation suggests an infection","Colchicine at a standard dose, as in the treatment of acute gout","Daily NSAIDs at full dose, which relieve the stiffness and avoid steroid exposure","Low-dose oral prednisone with follow-up arranged and a slow taper"],"a":4,"e":"Low-dose corticosteroids typically produce a rapid response, and an example regimen is prednisone 15 mg daily for several weeks, followed by a taper over about a year. Patients can generally be discharged with enough medication to bridge to follow-up.","k":"Polymyalgia rheumatica responds quickly to low-dose prednisone."},{"n":304,"g":24,"q":"A 38-year-old man has had three days of low back pain after lifting. He has no fever, no weakness, no numbness, and normal bowel and bladder function. Which management is most appropriate?","o":["No imaging, with acetaminophen or an NSAID and advice to stay active","Lumbar MRI today, to exclude a disc herniation before any treatment is started","A week of bed rest with opioids, followed by a gradual return to activity","Plain lumbar radiographs and a muscle relaxant for a week of bed rest","Intravenous corticosteroids, to reduce the inflammation around the nerve roots"],"a":0,"e":"Routine lumbar imaging is not recommended for acute nontraumatic low back pain without red flags, progressive neurologic deficit, or a duration of at least six weeks. First-line treatment is acetaminophen or an NSAID with continued activity, and steroids are unlikely to help.","k":"Uncomplicated acute low back pain needs no imaging."},{"n":305,"g":24,"q":"A 45-year-old man has right leg pain radiating below the knee. A straight leg raise reproduces the pain. What does this test indicate?","o":["It screens for a herniated disc, with sensitivity of about 68 to 80%","It proves nerve root avulsion when the pain is reproduced below the knee","It excludes cauda equina syndrome when the test is negative on both legs","It confirms a spinal epidural abscess when the pain is reproduced","It is diagnostic of ankylosing spondylitis when the pain is bilateral"],"a":0,"e":"The straight leg raise is a screening test for a herniated disc with a reported sensitivity of 68 to 80%, so a negative test does not exclude one. About 80% of patients with sciatica improve without surgery, and treatment resembles that for non-radicular pain, with gabapentin or a tricyclic antidepressant as options.","k":"A positive straight leg raise supports a herniated disc but a negative one does not exclude it."},{"n":306,"g":24,"q":"A 40-year-old man with acute low back pain is prescribed an NSAID. Which add-on therapy has been shown to provide no benefit over an NSAID alone?","o":["Home stretching exercises","A lidocaine patch","Topical diclofenac","A benzodiazepine","Continued normal activity"],"a":3,"e":"Benzodiazepines add no benefit over NSAIDs alone for low back pain, and muscle relaxants have limited evidence. Opioids may be considered only for short use in moderate to severe pain and are linked to higher emergency department return rates, while steroids are unlikely to help.","k":"Benzodiazepines add nothing to NSAIDs in acute low back pain."},{"n":307,"g":24,"q":"A 50-year-old man has had back pain for two days. Which patient most clearly needs imaging in the emergency department?","o":["A 50-year-old with pain radiating to the buttock and a normal neurologic examination","A 28-year-old with back pain that began after a long drive and improves with walking","A 42-year-old with low back pain and progressive left foot weakness over two days","A 45-year-old whose pain is improving on day four with an NSAID and normal activity","A 35-year-old with back pain and a muscle spasm that began after lifting a box yesterday"],"a":2,"e":"Imaging is not recommended for acute low back pain without red flags, but severe or progressive neurologic deficit is one of the indications. MRI is the preferred study when there is concern for infection, neoplasm, epidural compression, or cauda equina syndrome.","k":"Progressive neurologic deficit is an indication for imaging in back pain."},{"n":308,"g":24,"q":"A 26-year-old man has swollen, painful knees and ankles that began three weeks after an episode of infectious diarrhea. He also has red eyes and dysuria. Which treatment is most appropriate?","o":["Intravenous antibiotics for presumed septic arthritis only, with no NSAID","Colchicine alone, since the presentation resembles an acute crystal arthropathy flare","An NSAID, with treatment of any infection and exclusion of gonococcal arthritis","Allopurinol at a standard dose, started in the emergency department","High-dose methotrexate started in the emergency department for the arthritis"],"a":2,"e":"Arthritis, urethritis, and conjunctivitis after a gastrointestinal or genitourinary infection suggest reactive arthritis, a seronegative spondyloarthropathy often associated with HLA-B27. NSAIDs are first line, steroids are used for refractory cases, and mimics such as gonococcal arthritis must be excluded.","k":"Reactive arthritis is treated with NSAIDs after exclusion of septic mimics."},{"n":309,"g":24,"q":"A 25-year-old man with reactive arthritis has a pustular rash on the palms and soles. What is this skin finding called?","o":["Malar rash","Erythema nodosum on the shins","Erythema marginatum on the trunk","Keratoderma blennorrhagicum","Heliotrope rash on the eyelids"],"a":3,"e":"Keratoderma blennorrhagicum occurs in about 15% of reactive arthritis patients, on the palms and soles, and resembles pustular psoriasis. Reactive arthritis typically begins 2 to 6 weeks after an infection and is classically remembered as arthritis, urethritis, and conjunctivitis.","k":"Palm and sole pustules in reactive arthritis are keratoderma blennorrhagicum."},{"n":310,"g":25,"q":"A 58-year-old man with hypertension has had continuous vertigo for 24 hours with vomiting and horizontal nystagmus. His strength and speech are normal. On HINTS testing, which finding indicates a central cause?","o":["A head impulse test with a corrective saccade","Nystagmus that fatigues and suppresses with visual fixation","Unidirectional horizontal nystagmus that is greatest on gaze to one side","Skew deviation on the alternate cover test","Hearing loss in one ear with tinnitus on the same side"],"a":3,"e":"A normal head impulse test, direction-changing or vertical nystagmus, and skew deviation point to a central lesion. Positive HINTS is reported as 100% sensitive and 96% specific for a central lesion in acute vestibular syndrome, but it applies only to continuous vertigo with nystagmus.","k":"In acute vestibular syndrome, skew, vertical or direction-changing nystagmus, or a normal head impulse points to stroke."},{"n":311,"g":25,"q":"A 62-year-old woman has several seconds of spinning vertigo each time she rolls over in bed, with no hearing loss or neurologic deficits. A Dix-Hallpike maneuver reproduces her symptoms with a brief torsional nystagmus. What is the best treatment?","o":["Intravenous diazepam infusion for 24 hours in the unit","Canalith repositioning (Epley maneuver) at the bedside","Urgent CT angiography of the head and neck vessels","High-dose oral steroids for one week at home","Admission for MRI and neurology consultation"],"a":1,"e":"Brief, positional vertigo with a positive Dix-Hallpike test is benign paroxysmal positional vertigo, and the Epley maneuver treats the cause directly. Vestibular suppressants such as meclizine or benzodiazepines can be used for symptoms but are not the treatment.","k":"Positional vertigo with a positive Dix-Hallpike test is treated with the Epley maneuver."},{"n":312,"g":25,"q":"A 66-year-old man with diabetes has acute vertigo and inability to walk without falling. HINTS testing is central, and a noncontrast head CT is normal. What is the best next step?","o":["Treat as vestibular neuritis with a short steroid course and outpatient follow-up","Lumbar puncture to look for infectious causes of the vertigo and imbalance","Repeat the head CT in six hours and discharge if it is still normal","Urgent MRI with vascular imaging and neurology consultation despite the normal CT","Discharge with meclizine because the CT scan has excluded a stroke"],"a":3,"e":"Noncontrast CT sensitivity for posterior circulation stroke is only about 26%, and MRI at 24 hours is about 68%. Central vertigo requires urgent imaging and consultation, and gait should be tested because inferior cerebellar stroke causes severe instability and falls even when the exam is otherwise mild.","k":"A normal CT does not exclude a cerebellar stroke; central vertigo needs MRI and vascular imaging."},{"n":313,"g":25,"q":"A 72-year-old man with diabetes and a blood pressure of 152/90 mm Hg had 20 minutes of right arm weakness that has fully resolved. He has no speech disturbance. What is his ABCD2 score and the associated early stroke risk?","o":["A score of 4 (moderate risk), with about 4% risk of stroke in 2 days","A score of 2 (low risk), with about 1% risk of stroke in 2 days","A score of 7 (high risk), with about 18% risk of stroke in 2 days","A score of 3 (low risk), with about 3% risk of stroke in 90 days","A score of 6 (high risk), with about 8% risk of stroke in 2 days"],"a":4,"e":"Age 60 or older scores 1, blood pressure at or above 140/90 scores 1, unilateral weakness scores 2, duration of 10 to 59 minutes scores 1, and diabetes scores 1, for a total of 6. Scores of 6 to 7 carry about 8.1% stroke risk at 2 days. The score has not been validated well and should not be used alone for disposition.","k":"ABCD2 totals age, pressure, clinical features, duration, and diabetes, but it does not replace workup."},{"n":314,"g":25,"q":"A 64-year-old woman has had a transient ischemic attack with an ABCD2 score of 5. A noncontrast CT excludes hemorrhage. Which antiplatelet strategy is recommended?","o":["Clopidogrel alone, continued for one year, with no aspirin at any point","No antiplatelet therapy until a carotid ultrasound has been completed","Aspirin alone, continued indefinitely, with no second antiplatelet agent","Aspirin plus clopidogrel, continuing the clopidogrel for three weeks","Warfarin started immediately with an INR goal above 3 for secondary prevention"],"a":3,"e":"High-risk TIA (ABCD2 of 4 or more) is treated with dual antiplatelet therapy after hemorrhage is excluded: an aspirin load then daily aspirin, with a clopidogrel load followed by daily clopidogrel for 3 weeks only. Low-risk patients receive aspirin alone.","k":"High-risk TIA receives short-term dual antiplatelet therapy after hemorrhage is excluded."},{"n":315,"g":25,"q":"A 55-year-old man has a transient ischemic attack with an ABCD2 score of 2. Would you discharge him on the basis of that low score alone?","o":["Yes, because a score under 4 means the 7-day stroke risk is effectively zero in a man this age","Yes, but only if the ECG is also normal and he has a primary care physician for follow-up","No, because every TIA patient must be admitted to a monitored bed for 72 hours","No; ACEP advises against relying on risk scores alone and favors a rapid ED protocol","No, because the ABCD2 score is valid only for patients under the age of 60"],"a":3,"e":"ACEP gives a Level B recommendation not to rely on existing risk stratification instruments alone to identify patients safe for discharge, and that a rapid ED-based diagnostic protocol can safely identify those at short-term risk. The Canadian TIA Score is reported to perform better than ABCD2, particularly in the low-risk group.","k":"A low ABCD2 score does not make a TIA patient safe for discharge on its own."},{"n":316,"g":25,"q":"A 31-year-old woman, six days postpartum, has a severe headache, blurred vision, and a generalized seizure. Her blood pressure is 190/110 mm Hg. MRI shows bilateral symmetric vasogenic edema in the parieto-occipital white matter. What is the appropriate blood pressure goal?","o":["Avoid antihypertensives, because the edema is not caused by the blood pressure","Allow permissive hypertension for 24 hours to protect cerebral perfusion pressure","Avoid antihypertensives, because the edema is not caused by the blood pressure at all in this setting","Lower the mean arterial pressure about 25% over the first few hours without abrupt drops","Normalize the blood pressure to 120/80 mm Hg within the first 30 minutes of care with a bolus agent"],"a":3,"e":"This is posterior reversible encephalopathy syndrome, most often caused by hypertensive emergency including eclampsia. The goal is roughly a 25% reduction in mean arterial pressure over the first hours, using nicardipine or labetalol, and avoiding precipitous drops because of the risk of posterior circulation ischemia. Magnesium sulfate is first-line for eclamptic seizures.","k":"Treat posterior reversible encephalopathy syndrome with a controlled 25% fall in mean pressure, not a rapid normalization."},{"n":317,"g":25,"q":"A 45-year-old kidney transplant recipient on tacrolimus has a seizure, headache, and visual blurring. His blood pressure is 170/100 mm Hg. MRI shows bilateral parieto-occipital edema consistent with PRES. Besides blood pressure control and seizure treatment, which step is appropriate?","o":["Increase the tacrolimus dose to prevent graft rejection from the stress response","Discharge him once the seizure stops, with a plan for outpatient MRI next month","Add a second calcineurin inhibitor to protect the transplant during the illness","Reduce or stop the offending immunosuppressant with the transplant team","Start lifelong phenytoin and continue all immunosuppression unchanged for now"],"a":3,"e":"Immunosuppressive and cytotoxic drugs such as cyclosporine, tacrolimus, cisplatin, bevacizumab, and methotrexate are recognized causes of posterior reversible encephalopathy syndrome. The offending drug is reduced or stopped, blood pressure is controlled, seizures are treated, and most cases reverse fully in days to weeks.","k":"Remove or reduce the causative drug in posterior reversible encephalopathy syndrome."},{"n":318,"g":25,"q":"A 34-year-old woman with multiple sclerosis reports two days of worsening leg weakness and blurry vision. She has a temperature of 38.4 C and dysuria, and her symptoms are worse after a hot shower. What is the best next step?","o":["Start high-dose methylprednisolone immediately, since any worsening in multiple sclerosis is a true relapse","Reassure her that heat sensitivity needs no further evaluation and discharge her home with advice to cool down","Obtain a urinalysis and treat the infection, since steroids are not indicated for a pseudorelapse","Order an urgent lumbar puncture to look for oligoclonal bands in the spinal fluid before any treatment is given","Start plasma exchange as first-line treatment for what must be a true relapse"],"a":2,"e":"Fever, heat, and infection, especially urinary tract infection, can transiently worsen old deficits (Uhthoff phenomenon). A pseudorelapse typically lasts under 24 hours and does not show a new enhancing lesion. Steroids are for true relapses, and infection should be excluded before starting them.","k":"Check for infection before treating a multiple sclerosis exacerbation with steroids."},{"n":319,"g":25,"q":"A 76-year-old man has progressive difficulty walking for eight months, described as slow, shuffling steps. He now has mild forgetfulness and urinary urgency. CT shows enlarged ventricles with tight high-convexity sulci and an acute callosal angle. Which statement is correct?","o":["Opening pressure on lumbar puncture is markedly elevated, and that elevated pressure is the diagnostic finding","Gait disturbance is the earliest feature, and lumbar puncture with normal pressure is the definitive test","Widened sulci with an obtuse callosal angle favor this diagnosis over cerebral atrophy on imaging","Incontinence is the earliest feature, and the gait changes appear only at the very end of the illness course","The diagnosis cannot be considered without clinical signs of raised intracranial pressure such as papilledema"],"a":1,"e":"Normal pressure hydrocephalus presents with gait disturbance first, then cognitive decline and later incontinence, without headache or vomiting. Ventriculomegaly with a narrowed convexity and an acute callosal angle favor it over atrophy, which shows widened sulci and an obtuse angle. Lumbar puncture with normal opening pressure is the definitive test, and improvement after the tap supports the diagnosis.","k":"Normal pressure hydrocephalus starts with a gait disorder and shows ventriculomegaly with tight convexities."},{"n":320,"g":26,"q":"A 72-year-old woman has had a new right temporal headache for three weeks, with scalp tenderness and jaw pain when she chews. This morning she had a 10-minute episode of blurred vision in the right eye that has resolved. The ESR is markedly elevated. Which is the best next step?","o":["Give a triptan for the headache and send her home with outpatient neurology follow-up next month","Hold glucocorticoids until the temporal artery biopsy confirms the diagnosis in the pathology report","Start oral ibuprofen and repeat the inflammatory markers in two weeks at the clinic visit","Order a noncontrast head CT and discharge her with analgesics if the study is normal tonight","Start high-dose intravenous glucocorticoid now and arrange temporal artery biopsy within days"],"a":4,"e":"Visual symptoms with suspected giant cell arteritis mean treatment cannot wait for tissue. The regional emergency guidance gives intravenous methylprednisolone for visual or cerebrovascular manifestations, and says biopsy should be arranged within about a week; steroids started first may lower biopsy yield but do not change the decision.","k":"With visual symptoms, treat suspected giant cell arteritis immediately and biopsy afterward."},{"n":321,"g":26,"q":"A 70-year-old man started prednisone two days ago for suspected giant cell arteritis. A unilateral temporal artery biopsy is reported as negative. His headache and jaw claudication persist, and the ESR is 95 mm/h. How should the biopsy result be interpreted?","o":["It is unreliable only because of the elevated ESR, and a repeat ESR should decide therapy","It does not exclude the disease, since one-sided biopsies miss cases and steroids lower yield","It excludes the disease only if the biopsy specimen was longer than 3 cm in total length and bilateral","It confirms a mimic such as a migraine variant, and the steroid course should be shortened","It excludes the disease, so the prednisone can be stopped and an alternative cause pursued at once"],"a":1,"e":"Biopsy sensitivity is quoted at 50 to 95%, a unilateral specimen has a high false-negative rate, and glucocorticoids started before biopsy may reduce sensitivity. A negative result in a patient with a compatible picture leads to clinical judgment, contralateral biopsy or vascular ultrasound, not automatic withdrawal of therapy.","k":"A negative unilateral temporal artery biopsy does not rule out giant cell arteritis."},{"n":322,"g":26,"q":"A 38-year-old man has had excruciating right orbital pain for 45 minutes, with a red tearing eye, a blocked right nostril, and ptosis. He is pacing the room and cannot lie still. He has had similar attacks around the same time each night for the past two weeks. Which acute therapy is supported for this condition?","o":["Oral ibuprofen, which is the recommended abortive agent for these attacks","Oral opioid analgesia, which should be given early to prevent the next attack","Intravenous fluid bolus, which shortens the duration of each attack","High-flow oxygen, which relieves the attack in about 70% of patients","Dark quiet room with bed rest, which is the standard first-line acute treatment"],"a":3,"e":"The picture is cluster headache: severe unilateral orbital pain lasting 15 to 180 minutes, ipsilateral autonomic signs, restlessness, and attacks clustered at the same time of day. High-flow oxygen is effective in about 70% of patients, and triptans and intranasal lidocaine are other acute options. Verapamil is used for prevention.","k":"Cluster headache attacks respond to high-flow oxygen, so treat first and think about other causes only if the picture is atypical."},{"n":323,"g":26,"q":"A 27-year-old woman, three weeks postpartum, has had a headache for six days that worsens when she coughs or bends over. She has just had a focal seizure of the left leg, and fundoscopy shows papilledema. A noncontrast head CT is unremarkable. Which study is the best next test?","o":["Repeat noncontrast head CT in 24 hours to look for delayed changes","Electroencephalography to localize the focus of the seizure activity","Lumbar puncture before any further imaging to measure the opening pressure","MRI with MR venography of the head","D-dimer, with discharge if the result is within the normal range"],"a":3,"e":"Postpartum state, progressive headache worse with Valsalva, focal seizure, and papilledema suggest cerebral venous thrombosis. MRI with MR venography is the study of choice, with CT venography a reasonable alternative. A noncontrast CT is not sensitive enough to exclude it and D-dimer cannot be relied on to rule it out.","k":"Suspected cerebral venous thrombosis needs venography; neither a plain CT nor D-dimer excludes it."},{"n":324,"g":26,"q":"A contrast-enhanced head CT in a patient with suspected cerebral venous thrombosis shows a triangular area of enhancement surrounding a central filling defect in the superior sagittal sinus. What is this finding called?","o":["Spot sign","Hot cross bun sign","Empty delta sign","Hyperdense basilar artery sign","String of beads sign"],"a":2,"e":"The empty delta sign is a dense triangle of enhancing sinus wall around a nonenhancing clot, seen on contrast CT in the superior sagittal sinus. The cord sign on noncontrast CT is another venous thrombosis sign. The other options belong to arterial occlusion, intracerebral hemorrhage expansion, fibromuscular dysplasia, and multiple system atrophy.","k":"A triangular filling defect in the superior sagittal sinus on contrast CT is the empty delta sign of venous sinus thrombosis."},{"n":325,"g":26,"q":"MR venography confirms thrombosis of the superior sagittal and left transverse sinuses in a 34-year-old woman. She has had one focal seizure and has a supratentorial lesion on MRI. Which plan best describes initial and ongoing therapy?","o":["Immediate systemic thrombolysis as the first-line therapy for every patient with cerebral venous sinus thrombosis","Observation without anticoagulation until the clot burden is shown to be stable on repeat imaging in a week","Antiseizure medication and analgesics only, because anticoagulation always worsens venous infarcts and bleeding","Aspirin alone for three months, with anticoagulation reserved for patients who deteriorate on later imaging","Heparin or low molecular weight heparin, then an oral anticoagulant for months, plus antiseizure therapy"],"a":4,"e":"Anticoagulation with heparin or low molecular weight heparin is recommended for cerebral venous thrombosis, followed by oral anticoagulation for about 3 to 6 months. Antiseizure prophylaxis is recommended for a seizure plus a focal cerebral lesion. Thrombolysis and hemicraniectomy are reserved for rapid decline or persistent severe intracranial hypertension.","k":"Cerebral venous thrombosis is treated with anticoagulation; thrombolysis is rescue therapy only."},{"n":326,"g":26,"q":"A 26-year-old woman with obesity has had daily headaches for two months that are worse in the morning and when she lies down. She reports brief episodes of visual blackout when standing. Fundoscopy shows bilateral papilledema, and CT and MR venography are normal. Which finding on lumbar puncture supports the diagnosis?","o":["Opening pressure of 15 cm H2O with oligoclonal bands in the CSF","Normal opening pressure with xanthochromia in the supernatant","Opening pressure below 10 cm H2O with a low CSF glucose","Opening pressure of 20 cm H2O with a neutrophilic pleocytosis","Opening pressure above 25 cm H2O with normal CSF composition"],"a":4,"e":"Young women with obesity, positional or morning headache, papilledema, and normal imaging fit idiopathic intracranial hypertension. The confirmatory finding is an elevated opening pressure, above 25 cm H2O, after secondary causes such as venous sinus thrombosis are excluded on MRI and MR venography.","k":"Papilledema with normal imaging calls for lumbar puncture and an opening pressure above 25 cm H2O."},{"n":327,"g":26,"q":"A 29-year-old woman with idiopathic intracranial hypertension reports that her vision has become blurry over four days. Visual acuity is reduced in both eyes and she has severe headache. What is the best disposition and management?","o":["Admit, start acetazolamide, consider therapeutic lumbar puncture, and involve ophthalmology","Start high-dose intravenous steroids alone and discharge with an outpatient neurology review","Discharge on acetaminophen with routine primary care follow-up arranged in three months","Discharge on a short opioid course with advice to avoid bending and straining at home","Admit only if the optic discs appear pale; otherwise stop all medications and observe"],"a":0,"e":"Admission is advised for severe pain, focal findings, or vision changes. Acetazolamide lowers CSF production, repeated or large-volume lumbar punctures lower pressure, and weight loss and stopping causative drugs follow. Surgery such as shunting or optic nerve sheath fenestration is considered if medical therapy fails with vision threatened.","k":"Visual change in idiopathic intracranial hypertension is a threat to sight and warrants admission and ophthalmology involvement."},{"n":328,"g":26,"q":"A 29-year-old woman had spinal anesthesia for a cesarean delivery two days ago. She now has an intense frontal-occipital headache that is severe when she sits or stands and almost gone when she lies flat. Which feature is most characteristic of this headache?","o":["Sudden thunderclap onset at the moment of the puncture itself","Progressive worsening when lying flat with morning vomiting","Worsening when upright with relief when supine","Unilateral orbital pain with tearing and a blocked nostril","Fever and nuchal rigidity starting a few hours after the procedure"],"a":2,"e":"A positional headache that appears 24 to 48 hours after dural puncture is typical of post-dural puncture headache. The aggravation upright with relief supine is described as pathognomonic. Fever, neck stiffness, or signs of infection at the puncture site call for urgent evaluation for another cause.","k":"A headache that is worse upright and better lying flat after a dural puncture is a post-dural puncture headache."},{"n":329,"g":26,"q":"Which procedure carries the highest reported rate of post-dural puncture headache?","o":["Epidural catheter placement with a loss-of-resistance technique and no puncture","Inadvertent dural puncture with a 17-gauge epidural needle","Subarachnoid block performed with the patient in the sitting position","Subarachnoid block with a 25-gauge spinal needle","Diagnostic lumbar puncture performed with the patient lying on the side"],"a":1,"e":"Incidence falls as needle caliber shrinks: under 1% with a 25-gauge spinal needle, near 36% after diagnostic lumbar puncture with a 20 or 22-gauge needle, and roughly 75 to 80% after inadvertent dural puncture with a 17-gauge epidural needle. Younger age and female sex add risk.","k":"Large-bore dural puncture causes post-dural puncture headache most often."},{"n":330,"g":26,"q":"A 31-year-old woman has a documented post-dural puncture headache that has lasted four days. She cannot sit upright for more than a few minutes, and bed rest, fluids, oral analgesics, and caffeine have given only short relief. Which treatment is definitive?","o":["Epidural blood patch, with success in about 85% of patients","Prophylactic repeat dural puncture at an adjacent level to seal the leak","High-dose oral steroids for a week to reduce the meningeal inflammation","Placement of a lumbar drain to divert CSF away from the site of the leak","Lumbar puncture with removal of 30 mL of CSF to reset the pressure"],"a":0,"e":"Most post-dural puncture headaches resolve in 7 to 10 days, and caffeine gives only short-term relief. For patients who fail conservative care and cannot wait, an epidural blood patch is the definitive treatment, with roughly 85% success and a higher rate if repeated. Prophylactic patching after inadvertent dural puncture has not been shown to reduce incidence.","k":"Persistent, disabling post-dural puncture headache is treated with an epidural blood patch."},{"n":331,"g":27,"q":"A 45-year-old man wakes with left facial droop. He cannot wrinkle the left forehead, cannot close the left eye, and has no limb weakness, speech change, or headache. Which finding best supports Bell's palsy over a central stroke?","o":["Sparing of the forehead with weakness of the lower face only","Preserved eyelid closure with isolated drooping of the mouth corner","Associated crossed weakness of the right arm and leg on exam","Weakness that includes the forehead on the affected side","Sudden onset of vertigo with a vertical nystagmus on gaze testing"],"a":3,"e":"A peripheral facial nerve lesion paralyzes the forehead because the facial nucleus supplying the forehead receives input from both hemispheres, so forehead sparing points to stroke. The abducens nerve should also be normal on testing, which helps rule out a central cause.","k":"Forehead involvement points to a peripheral lesion; forehead sparing points to stroke."},{"n":332,"g":27,"q":"A 38-year-old woman presents 36 hours after the onset of unilateral facial paralysis. The ear exam is normal, there is no vesicular rash, and she has no other neurologic findings. Which treatment has the best support?","o":["Intravenous methylprednisolone for three days followed by an urgent lumbar puncture","No treatment at all, because spontaneous recovery makes steroids harmful in all patients","Oral valacyclovir alone for one week, with steroids held in reserve for worsening disease","Immediate MRI of the brain and temporal bone followed by surgical nerve decompression","Oral prednisone within 72 hours of onset, plus eye lubrication and taping at night"],"a":4,"e":"Prednisone for about a week, started within 72 hours of onset, has level B evidence. Antivirals likely add no benefit to steroids, and routine imaging or labs are not recommended. Eye care with artificial tears, ointment, and taping prevents exposure keratitis because eyelid closure is incomplete.","k":"Treat Bell's palsy with early oral steroid and protect the eye."},{"n":333,"g":27,"q":"A patient diagnosed with Bell's palsy returns because the weakness has continued to progress to complete paralysis over several weeks, with facial twitching. Which interpretation is most appropriate?","o":["Atypical course suggesting a structural cause such as a neoplasm, so imaging is needed","This is the expected course, and recovery usually begins only after about the sixth week","This is a recurrence of Bell's palsy and the steroid course should simply be repeated","This is Ramsay Hunt syndrome and acyclovir alone should be prescribed for her","This is a sign of Lyme disease and antibiotics should be started without any imaging"],"a":0,"e":"Routine imaging is not recommended for new Bell's palsy, but weakness progressing to paralysis over weeks to months or with spasm suggests a neoplasm, and facial paralysis with pulsatile tinnitus and hearing loss suggests a glomus or cerebellopontine angle tumor. Referral and imaging follow.","k":"Facial weakness that keeps progressing beyond about three weeks is not Bell's palsy until imaging says so."},{"n":334,"g":27,"q":"A 34-year-old man has had two days of ascending leg weakness and tingling beginning two weeks after a diarrheal illness. The knee and ankle reflexes are absent. A lumbar puncture is performed. Which CSF result is expected?","o":["Lymphocytic pleocytosis above 100 cells with a normal protein level","Normal protein with oligoclonal bands as the only abnormality","Elevated protein with a normal white cell count","Neutrophilic pleocytosis with a very low glucose level","Xanthochromia with a normal protein concentration"],"a":2,"e":"Guillain-Barre syndrome is an acute immune-mediated polyneuropathy that often follows Campylobacter or viral illness, with ascending weakness and areflexia. The typical CSF finding is albuminocytologic dissociation, with protein above 45 and fewer than 10 white cells, though HIV-associated cases can show pleocytosis.","k":"Areflexic ascending weakness with high CSF protein and few cells is Guillain-Barre syndrome."},{"n":335,"g":27,"q":"A 40-year-old man with Guillain-Barre syndrome has a vital capacity that has fallen to 14 mL/kg over 12 hours. His oxygen saturation is 96% on room air. What is the most appropriate action?","o":["Give a trial of pyridostigmine and repeat the vital capacity measurement after an hour","Start noninvasive ventilation with low pressures and discharge him home if he tolerates it overnight","Prepare for intubation and admit to the ICU, as the vital capacity has crossed the threshold","Reassure him because the saturation is normal, then recheck the vital capacity again tomorrow morning","Start high-dose corticosteroids and observe on a general ward overnight with routine nursing checks"],"a":2,"e":"A vital capacity below 15 mL/kg, a negative inspiratory force weaker than -30 cm H2O, hypoxemia, bulbar dysfunction, or aspiration are indications to intubate. Oxygen saturation is a late and unreliable marker. ICU admission is also warranted for autonomic dysfunction or a fall of more than 30% in vital capacity.","k":"Intubate in Guillain-Barre syndrome on vital capacity and negative inspiratory force trends, not on saturation."},{"n":336,"g":27,"q":"Rapid sequence intubation is planned for a patient with Guillain-Barre syndrome who has had four days of progressive paralysis. Which neuromuscular blocker should be avoided?","o":["Atracurium","Rocuronium bromide","Vecuronium bromide","Cisatracurium","Succinylcholine"],"a":4,"e":"Succinylcholine can cause severe hyperkalemia in patients with prolonged denervation and immobility, such as Guillain-Barre syndrome. A nondepolarizing agent such as rocuronium is the usual alternative.","k":"Avoid succinylcholine in Guillain-Barre syndrome."},{"n":337,"g":27,"q":"A 58-year-old woman with myasthenia gravis on pyridostigmine is brought in with weakness. Which finding favors cholinergic crisis over myasthenic crisis?","o":["Small pupils, profuse secretions, and fasciculations","Normal pupils with mild secretions and dysphagia","Weakness that began after a respiratory infection last week","Weakness that improves briefly with edrophonium","Fatigable ptosis that worsens by the end of the day"],"a":0,"e":"Cholinergic crisis follows excess acetylcholinesterase inhibitor and produces miosis, markedly increased secretions, fasciculations, and sometimes bradycardia and sweating. In myasthenic crisis the pupils are normal and secretions normal or mildly increased, and edrophonium improves rather than worsens strength.","k":"Miosis, secretions, and fasciculations in a patient on pyridostigmine suggest cholinergic crisis."},{"n":338,"g":27,"q":"A 62-year-old man with myasthenia gravis has pneumonia and needs an antibiotic. Which choice is most likely to worsen his neuromuscular transmission?","o":["Levofloxacin","Ampicillin","Piperacillin-tazobactam","Meropenem","Ceftriaxone"],"a":0,"e":"Fluoroquinolones, aminoglycosides, macrolides, tetracyclines, clindamycin, and vancomycin are among the antimicrobials that can unmask or worsen myasthenia. Infection is also the most common precipitant of crisis, so the choice of agent needs care.","k":"Avoid fluoroquinolones and aminoglycosides in myasthenia gravis when an alternative exists."},{"n":339,"g":27,"q":"A 48-year-old woman with myasthenic crisis has an oxygen saturation of 96%, a PCO2 of 50 mm Hg, a forced vital capacity of 18 mL/kg, and a negative inspiratory force of -25 cm H2O. She is tiring. What is the best next step?","o":["Observe on room air because the saturation is normal and she remains alert and talking in full sentences","Prepare for intubation, because hypercapnia and weak mechanics outweigh a normal saturation","Order a stat edrophonium test before making any decision about the airway at all in this patient","Give high-dose steroids and defer all airway decisions until they have had time to take effect","Increase the pyridostigmine dose and reassess the vital capacity again tomorrow morning at rounds"],"a":1,"e":"Myasthenia causes hypercapnic failure and hypoxemia is late, so saturation must not be relied on. Intubation is considered for forced vital capacity below 20 mL/kg, a negative inspiratory force weaker than -30 cm H2O, PCO2 above 45 mm Hg, bulbar weakness, or falling serial values.","k":"In myasthenic crisis, intubate on mechanics and trend; do not wait for desaturation."},{"n":340,"g":27,"q":"A 40-year-old man ate home-canned vegetables 24 hours ago. He now has double vision, difficulty swallowing, and a descending symmetric weakness. His pupils are dilated and sluggish and deep tendon reflexes are reduced. Which finding most strongly distinguishes this from myasthenia gravis?","o":["Weakness that is worse at the end of the day and better with rest","Prominent fasciculations with miosis and increased salivation","Dilated, poorly reactive pupils with descending paralysis","Fatigable ptosis that improves with an ice pack applied to the eyelid","Ascending weakness with absent reflexes after a diarrheal illness"],"a":2,"e":"Botulism produces a symmetric descending flaccid paralysis starting with cranial nerves, with dilated pupils, reduced reflexes, and anticholinergic signs such as dry mouth. Pupils are involved in botulism but not in myasthenia. Equine antitoxin, obtained through the CDC or the health department, is used for foodborne cases in patients over 1 year of age.","k":"Descending paralysis with dilated pupils after canned food points to botulism."},{"n":341,"g":27,"q":"A 55-year-old man with chronic alcohol use is brought in confused with an unsteady gait. His fingerstick glucose is 48 mg/dL. He needs dextrose. Which approach is correct?","o":["Give dextrose first and start thiamine only if an MRI later shows mammillary body changes on imaging","Give dextrose alone, because thiamine is needed only when a full classic triad has

lone, once the saturation falls","End-tidal carbon dioxide waveform capnography","Blood pressure cuff cycling every 15 minutes, with alarm limits","Heart rate trend alone, as it falls with hypoxia","Clinical observation of chest rise only, by a nurse"],"a":1,"e":"Capnography detects hypoventilation and apnea earlier than pulse oximetry or clinical assessment, because the waveform disappears before saturation falls. The source notes that this has not been shown to reduce serious adverse events, but it provides an earlier warning.","k":"Capnography gives the earliest warning of hypoventilation."},{"n":513,"g":40,"q":"A 78-year-old man with coronary artery disease and atrial fibrillation needs synchronized cardioversion. He is stable on a monitor. Which agent is favored by the source for a brief procedure like this?","o":["Ketamine at a high dose because it raises blood pressure and heart rate during the cardioversion","Midazolam alone at a large dose","Etomidate, because it is short acting and gentle on the circulation","Propofol at a large bolus because it is the fastest","Dexmedetomidine because it prevents arrhythmias"],"a":2,"e":"Etomidate is a short acting alternative to propofol for brief procedures such as cardioversion and joint reduction, and it preserves hemodynamics. Ketamine causes a sympathetic surge that is a concern in older patients with heart disease, and propofol causes hypotension.","k":"Etomidate suits short procedures in patients with fragile circulation."},{"n":514,"g":40,"q":"A patient needs sedation for reduction of a hip dislocation, where muscle relaxation matters. Which agent does the source favor for orthopedic procedures?","o":["Ketamine only, in every case","Etomidate, because myoclonus helps the reduction","Dexmedetomidine as a loading dose","Midazolam alone as a sole agent","Propofol"],"a":4,"e":"Propofol is favored for orthopedic reductions because of the muscle relaxation it produces. Etomidate myoclonus makes it less desirable for reduction, and midazolam was designed for moderate sedation.","k":"Propofol relaxes muscle, which helps with reductions."},{"n":515,"g":40,"q":"During sedation with propofol, the capnography waveform becomes flat but the oxygen saturation is still 98%. What should you do?","o":["Withdraw the monitor because the waveform is unreliable","Give flumazenil immediately","Wait for the saturation to fall below 90% before acting, since the waveform lags behind the oxygen level in the blood","Increase the propofol infusion","Stimulate the patient, open the airway with a jaw thrust, and support ventilation if apnea persists"],"a":4,"e":"A flat waveform appears before desaturation and signals apnea or obstruction. Escalate stepwise: stimulate, jaw thrust, airway adjunct, bag-mask ventilation, then noninvasive ventilation, supraglottic airway, or intubation.","k":"Act on the capnography waveform, not on the saturation."},{"n":516,"g":40,"q":"A 5-year-old has a laceration repair under ketamine sedation and becomes agitated during recovery with hallucinations. What does the source say about preventing this reaction?","o":["It only happens in patients older than 60","It is always prevented by giving atropine first","There is little evidence that prevention works, and midazolam can be given if the reaction occurs","It occurs only when ketamine is given too fast","Pretreatment with high dose haloperidol prevents it in all children and is routinely recommended before ketamine"],"a":2,"e":"Emergence reactions after ketamine are described with little evidence for prevention. Midazolam pretreatment is optional, and midazolam can treat a reaction if it occurs.","k":"Emergence reactions from ketamine are treated, not reliably prevented."},{"n":517,"g":40,"q":"A 55-year-old man develops metallic taste, tinnitus, and a generalized seizure minutes after a brachial plexus block with bupivacaine. He then becomes bradycardic. Which treatment is recommended in addition to airway support?","o":["Beta-blocker for tachyarrhythmia","Intravenous vasopressin as the first line vasopressor, followed by a calcium channel blocker for rate control","Observation only, since the symptoms are mild","Calcium channel blocker for blood pressure control","Intravenous lipid emulsion 20% bolus followed by infusion, and a benzodiazepine for seizures"],"a":4,"e":"Local anesthetic systemic toxicity begins with central nervous system signs and progresses to cardiovascular collapse. Treat seizures with benzodiazepines, support the airway, and give lipid emulsion, with early consideration of ECMO for refractory arrest.","k":"Give lipid emulsion for local anesthetic cardiovascular toxicity."},{"n":518,"g":40,"q":"A patient in cardiac arrest after an inadvertent intravascular bupivacaine injection is not responding to standard resuscitation. Which drug should be avoided?","o":["Sodium bicarbonate for severe acidosis","Amiodarone for ventricular arrhythmias","Lipid emulsion","Succinylcholine for airway control if needed","Vasopressin"],"a":4,"e":"In local anesthetic arrest, avoid vasopressin, calcium channel blockers, and beta-blockers. Amiodarone is preferred for ventricular arrhythmias, and early ECMO or transfer is considered.","k":"Avoid vasopressin and calcium channel blockers in local anesthetic arrest."},{"n":519,"g":40,"q":"In the treatment of local anesthetic systemic toxicity, which lipid regimen is described by the source?","o":["No lipid is used; only calcium is recommended","A bolus of 1.5 mL/kg of 20% lipid emulsion over one minute, then an infusion of 0.25 mL/kg/min","A bolus of 0.1 mL/kg followed by a rapid push","A continuous infusion of 5 mL/kg/min for one hour","A single bolus of 10 mL/kg of 10% lipid emulsion over thirty minutes, with no infusion afterward"],"a":1,"e":"The source describes a 1.5 mL/kg bolus of 20% lipid emulsion over one minute followed by 0.25 mL/kg/min for 20 minutes or until stable, increasing the infusion if hemodynamics decline, with a maximum total of 12 mL/kg.","k":"Lipid rescue is a bolus plus an infusion with a cap on total volume."},{"n":520,"g":40,"q":"Which local anesthetic maximum doses are correct according to the source for lidocaine without epinephrine?","o":["1 mg/kg, with a maximum of 50 mg","10 mg/kg, with no maximum","15 mg/kg, with a maximum of 1,000 mg","5 mg/kg, with a maximum of 300 mg","2.5 mg/kg, with a maximum of 175 mg"],"a":3,"e":"Plain lidocaine has a maximum of 5 mg/kg up to 300 mg, and 7 mg/kg up to 500 mg with epinephrine. Bupivacaine is 2.5 mg/kg up to 175 mg plain and 3 mg/kg up to 225 mg with epinephrine.","k":"Know the plain and epinephrine maximum doses for lidocaine and bupivacaine."},{"n":521,"g":40,"q":"A nurse wants to buffer bupivacaine with sodium bicarbonate to reduce injection pain. What does the source advise?","o":["Do not buffer bupivacaine with bicarbonate, though lidocaine can be buffered at 1 mL bicarbonate to 9 mL lidocaine","Buffer bupivacaine at 1 to 9 but never lidocaine, because lidocaine precipitates when it is mixed with bicarbonate","Buffer both agents in equal volumes of bicarbonate and local anesthetic to reduce injection pain safely at the bedside","Buffering has no effect and is never done in the ED, whichever agent or concentration is chosen for the patient","Buffer only when epinephrine has been added to the bupivacaine, because it then prevents precipitation in the syringe"],"a":0,"e":"Buffering lidocaine with bicarbonate (1 mL to 9 mL) reduces injection pain, and slow injection helps. Bupivacaine should not be buffered with bicarbonate.","k":"Buffer lidocaine, not bupivacaine."},{"n":522,"g":40,"q":"A 20-year-old needs a topical anesthetic for a minor open scalp laceration repair. Which agent has an onset of 20 to 30 minutes on open wounds?","o":["Plain lidocaine 1% injection","Topical benzocaine spray","Cocaine paste","Plain lidocaine 1% injection through the edge of an open wound, which takes effect at once","LET (lidocaine, epinephrine, tetracaine) gel"],"a":4,"e":"LET is applied to open wounds with an onset of 20 to 30 minutes, whereas EMLA is used on intact skin and needs 1 to 2 hours.","k":"LET is for open wounds and EMLA for intact skin."},{"n":523,"g":40,"q":"A 45-year-old man needs a digital block for a finger laceration. Which statement about epinephrine in digital blocks is supported by the source reviewed?","o":["It is useful only in children","It must never be mixed with lidocaine in any circumstance, because necrosis is certain to follow","It is required to prevent infection","Studies report it is safe, though the evidence is low quality","It must never be mixed with lidocaine in any case"],"a":3,"e":"Older teaching avoided epinephrine in digits, but multiple studies report it as safe, and a Cochrane review found no reported adverse effects, though the quality of the evidence was low.","k":"Epinephrine in digital blocks has not been shown to cause necrosis."},{"n":524,"g":40,"q":"Which patient is NOT a candidate for a transthecal (flexor sheath) digital block?","o":["A patient with a normal finger and landmarks","A patient with a laceration of the distal phalanx","A patient with suspected tenosynovitis of the flexor tendon","A patient with a simple fingertip laceration","A patient needing a block of the third digit for a nail bed injury"],"a":2,"e":"The transthecal block is contraindicated with flexor tendon involvement or infection, such as felon or tenosynovitis, because it could spread infection along the sheath. Overlying skin infection and distorted landmarks are also contraindications to digital blocks.","k":"Avoid a transthecal block when the flexor sheath is infected."},{"n":525,"g":40,"q":"A digital block is planned with a 27 to 30 gauge needle. How many nerves supply each digit that the block must reach?","o":["Two: one dorsal and one palmar","Three: only the radial, ulnar, and median nerves reach the fingers, so a wrist block is needed","Six: three on each side","One: the proper digital nerve only","Four: two dorsal and two palmar or plantar nerves"],"a":4,"e":"Each digit has four nerves: two dorsal at about 10 and 2 o'clock, and two palmar or plantar at about 4 and 8 o'clock. The traditional block places about 1 mL near the ventral nerve and 1 mL for the dorsal nerve on each side.","k":"A digital block must reach four nerves."},{"n":526,"g":41,"q":"A 34-year-old man has a clean 4 cm forearm laceration. A colleague insists the wound must be irrigated with sterile saline only. What does the source reviewed say?","o":["Tap water doubles infection rates","Irrigation is unnecessary for any wound","Hydrogen peroxide is the preferred irrigant","Tap water is as effective as sterile water or saline, and higher pressure irrigation is better","Only sterile saline delivered by a gentle syringe flush prevents infection, so tap water must never be used"],"a":3,"e":"Tap water is as effective as sterile water or saline for wound irrigation, and its pressure of about 45 psi exceeds that of a syringe. High pressure irrigation is recommended, for example through an 18 gauge syringe.","k":"Tap water works for wound irrigation."},{"n":527,"g":41,"q":"A 30-year-old woman has a facial laceration sutured today. When should the sutures be removed according to the source?","o":["2 days for the face and 3 days for the legs","30 days for all wounds","2 days for the face and 3 days for the legs, since earlier removal prevents scarring everywhere","No removal is needed for any site","About 5 days for the face and 7 to 10 days for the back and extremities"],"a":4,"e":"Suture removal times are about 5 days for the face, 5 to 7 for the ear, eyelid, and nose, 7 for the scalp, 7 to 10 for the back and extremities, and 10 to 14 days over extensor joints. Lip and oral mucosa sutures are absorbable.","k":"Remove facial sutures earlier than limb sutures."},{"n":528,"g":41,"q":"For which wound is tissue adhesive (skin glue) the best choice?","o":["A wound on an oral mucosal surface","A contaminated puncture wound on the foot that has been open for several hours before arrival","A low tension, well approximated laceration on the forehead","A dog bite on the forearm","A wound over the axilla with moisture"],"a":2,"e":"Tissue adhesive suits low tension, well approximated wounds. Avoid it in bite, contaminated, or puncture wounds, on mucosal surfaces, and in moist areas such as the groin and axilla. Do not apply antibiotic ointment, which can dissolve the glue early.","k":"Use glue only on clean, low tension wounds."},{"n":529,"g":41,"q":"A 68-year-old man with diabetes has a 4 cm abscess on the buttock with surrounding cellulitis. He is afebrile. After incision and drainage, which approach is favored?","o":["Send him home without follow-up","Pack the wound, since diabetes is an indication for packing, and arrange a wound check in 2 days","Close the wound primarily with sutures to prevent the cavity from refilling with pus, and arrange follow-up if needed","Use only antibiotics without drainage","Leave the cavity open without any dressing and no follow-up"],"a":1,"e":"Incision and drainage is the core treatment. The source recommends packing abscesses larger than 5 cm, pilonidal abscesses, and abscesses in immunocompromised or diabetic patients, with a wound check in about 2 days.","k":"Pack abscesses in diabetic patients and recheck in two days."},{"n":530,"g":41,"q":"A 25-year-old man has a skin abscess that has been drained. He is well, with no systemic symptoms and no diabetes. Which is the first line oral antibiotic if one is chosen in the source reviewed?","o":["Penicillin V","Ciprofloxacin","Amoxicillin alone, which covers methicillin-resistant Staphylococcus aureus in most cases","Azithromycin","Trimethoprim-sulfamethoxazole"],"a":4,"e":"Methicillin-resistant Staphylococcus aureus is the commonest cause of purulent skin infection. Trimethoprim-sulfamethoxazole is first line, with clindamycin as an equal alternative with more adverse effects. Some guidance recommends withholding antibiotics after drainage in simple cases.","k":"Cover MRSA when treating a drained abscess."},{"n":531,"g":41,"q":"A 3-year-old has a pebble in one nostril that completely blocks the airway of that side. The child is calm and the object is smooth. Which technique is described as the 'parent's kiss'?","o":["The parent pinches both nostrils shut","The parent seals the child's mouth, closes the opposite nostril, and gives a short sharp puff of air","The parent forces the child to blow hard","The parent suctions the object out through the nostril by sucking on a drinking straw held against the nose","The parent flushes the nostril with water"],"a":1,"e":"The parent's kiss is a positive pressure technique: seal the mouth, close the opposite nostril, and deliver a short sharp puff. It works best when the object occludes the nostril completely. Barotrauma is a possible complication.","k":"Positive pressure can dislodge a smooth nasal foreign body."},{"n":532,"g":41,"q":"A 4-year-old has a foreign body in the nose after playing with toys. Which object must be removed immediately in the emergency department?","o":["A piece of paper","A small piece of foam","A bead that is not touching the septum","A button battery","A pebble in the anterior nostril"],"a":3,"e":"Button batteries or multiple strong magnets cause tissue necrosis and need immediate removal. Radiographs help when a foreign body is suspected but not seen, to exclude a battery or magnets across the septum.","k":"Button batteries and strong magnets in the nose are emergencies."},{"n":533,"g":41,"q":"A nasal foreign body cannot be seen but the child has unilateral foul-smelling discharge. What is recommended before discharge?","o":["Nasal decongestant spray and discharge","A CT of the head in every case","Antibiotics for ten days with no imaging","A radiograph to exclude a battery or magnets, with ENT follow-up","Antibiotics for ten days with no imaging, as radiographs cannot show a battery or magnet"],"a":3,"e":"If a foreign body is suspected but not seen, a radiograph can exclude a button battery or magnets across the septum before discharge, with ENT follow-up. Prophylactic antibiotics are sometimes given for objects present a long time or with edema.","k":"Look for batteries and magnets with a radiograph when the nasal foreign body is unseen."},{"n":534,"g":41,"q":"A 35-year-old man crushed his fingertip 12 hours ago and has a painful dark collection under the nail with no fracture and an intact nail plate. What is the usual management in the source reviewed?","o":["Trephination with handheld cautery, with no antibiotics needed for an uncomplicated hematoma","Amputate the fingertip","Remove the entire nail plate in every case and repair the nail bed, followed by a prescription for antibiotics","Prescribe antibiotics for 10 days after trephination","Leave it alone and review in a month"],"a":0,"e":"Simple acute subungual hematomas, without nail bed disruption or an open fracture, can be trephinated. Handheld cautery needs no anesthesia, and prophylactic antibiotics are not needed for uncomplicated cases. Complex injuries need nail bed repair.","k":"Trephinate a simple subungual hematoma."},{"n":535,"g":41,"q":"A patient has a subungual hematoma with a displaced fracture of the distal phalanx and a disrupted nail plate. What is the right treatment?","o":["Sterile dressing and no follow-up, because fractures of the distal phalanx need no treatment","Discharge with ice only","Antibiotics only","Sterile dressing and no follow-up","Nail bed repair with absorbable sutures and splinting of the fracture"],"a":4,"e":"Complex hematomas, associated with a fracture or nail plate disruption, need nail bed repair with absorbable sutures, with nail removal only if there is avulsion or nail fold disruption. Splint the digit if there is a fracture.","k":"Associated fracture or nail plate disruption means repair, not just trephination."},{"n":536,"g":41,"q":"A 24-year-old man arrives pulseless after a stab wound to the left chest. He had pupillary reactivity and a measurable pressure just before arrest, and the arrest began 4 minutes ago. What does the EAST guideline recommend?","o":["Continue closed chest compressions only","Pronounce death now because a patient without a pulse after penetrating chest injury has no chance of survival","Delay for a CT scan first","Perform a needle thoracostomy and stop","Resuscitative thoracotomy, which is strongly recommended for penetrating thoracic injury with signs of life"],"a":4,"e":"For penetrating thoracic injury with signs of life who arrive pulseless, the guideline gives a strong recommendation for resuscitative thoracotomy. Signs of life include pupillary reactivity, spontaneous breathing, a carotid pulse, measurable blood pressure, motor movement, or organized cardiac electrical activity.","k":"Penetrating chest trauma with signs of life and pulselessness needs thoracotomy."},{"n":537,"g":41,"q":"A blunt trauma patient arrives pulseless with no signs of life after a fall. Which statement fits the EAST guideline?","o":["A strong recommendation for thoracotomy within 1 minute","Thoracotomy is required for all pulseless blunt patients, whether or not any signs of life are present","There is a conditional recommendation against resuscitative thoracotomy","No recommendation of any kind exists","Thoracotomy is required for all pulseless blunt patients"],"a":2,"e":"For blunt trauma patients who are pulseless on arrival with no signs of life, the guideline conditionally recommends against thoracotomy. Before stopping, confirm an adequate airway and decompress both pleural spaces to exclude tension physiology.","k":"Blunt trauma with no signs of life and no pulse: conditional recommendation against."},{"n":538,"g":41,"q":"During resuscitative thoracotomy, a surgeon prepares to clamp the descending aorta. Which technique helps distinguish the aorta from the esophagus?","o":["Clamping the first structure seen","Palpating for the thoracic duct and clamping the structure that lies closest to the left lung hilum","Passing an orogastric or nasogastric tube and opening the mediastinal pleura first","Waiting for ultrasound at the bedside","Using needle aspiration of the aorta"],"a":2,"e":"The descending aorta is cross-clamped just above the diaphragm. A gastric tube helps identify the esophagus, and the mediastinal pleura is opened first. Open the pericardium longitudinally at least a finger breadth anterior to the phrenic nerve.","k":"Use a gastric tube to tell the esophagus from the aorta."},{"n":539,"g":41,"q":"What incision is described for resuscitative thoracotomy in the source reviewed?","o":["A midline abdominal incision only, with no chest entry required","A left anterolateral thoracotomy at about the fourth intercostal space","A right posterior thoracotomy at the eighth intercostal space, with the patient turned prone","A left subcostal incision under the ribs, with no chest entry","A clavicular incision above the first rib on the left side"],"a":1,"e":"The incision is a left anterolateral thoracotomy at about the fourth intercostal space. The pericardium is opened, cardiac injuries are controlled with digital pressure, a stapler, or a Foley catheter, and internal defibrillation uses about 20 J.","k":"Resuscitative thoracotomy uses a left anterolateral incision at the fourth intercostal space."},{"n":540,"g":42,"q":"A 40-year-old man walks into a hospital emergency department with no insurance and a complaint of chest tightness. The registrar says he must prove he can pay before being seen. Under EMTALA, what is required?","o":["A medical screening examination only for ambulance arrivals, and only when the hospital has an open bed","A medical screening examination to determine whether an emergency medical condition exists, regardless of ability to pay","A screening examination only if the patient requests it in writing and signs the hospital financial form","Treatment only after insurance verification and a financial responsibility form are completed at registration by the patient","Evaluation only if the hospital has an on-call specialist available and the patient has a known insurer"],"a":1,"e":"EMTALA requires a medical screening examination for anyone who comes to a dedicated emergency department seeking care, to determine whether an emergency medical condition exists. The law does not allow payment status to delay it.","k":"Everyone who presents to the ED is entitled to a medical screening exam."},{"n":541,"g":42,"q":"A 30-year-old woman in active labor arrives at a rural hospital without obstetric services. She is not stable for transfer. Which is a requirement for transferring an unstable patient with an emergency medical condition?","o":["The receiving hospital will accept the patient without any paperwork, and the sending physician signs nothing","The transfer happens only if the patient can pay and the receiving hospital has already billed the insurer","The patient agrees verbally to transfer and a nurse documents the conversation in the chart without physician certification at all","The patient requests it in writing after being informed of the risks, and a physician certifies that benefits outweigh risks","The transfer is forbidden in every circumstance once the patient is registered as a patient in the department"],"a":3,"e":"An unstabilized patient may be transferred only if the patient or a representative requests transfer in writing after being told the risks, and a physician certifies that expected benefits outweigh the increased risks. An appropriate transfer also needs stabilizing treatment within capability, an accepting facility, records, and qualified transport.","k":"Unstable transfers need a written request or a physician certification of benefit over risk."},{"n":542,"g":42,"q":"An on-call specialist refuses to come to the emergency department, stating that another specialty should handle the patient. What is the position under EMTALA?","o":["The emergency physician has no authority to call an on-call physician","The specialist can refuse any patient who is uninsured","Only the hospital administrator can decide who responds","On-call physicians must respond within a reasonable time and cannot refuse because they think another specialty is needed","The specialist may decline to come if they are covering another hospital and believe a different service is better suited"],"a":3,"e":"The emergency physician decides whether an on-call physician is needed. On-call physicians must respond within a reasonable time and cannot refuse because they believe another specialty is appropriate. Document the time, name, and discussion, and escalate disagreements.","k":"On-call physicians must respond when the ED physician requests."},{"n":543,"g":42,"q":"Which statement about EMTALA penalties is accurate according to the source reviewed?","o":["Only the hospital is liable, never the physician","Violations can cost hospitals and physicians fines of up to $50,000 per violation and can end Medicare participation","Penalties apply only to private offices","There are no financial penalties for individual physicians, and hospitals receive only written warnings after review","Violations need not be reported at all"],"a":1,"e":"Violations must be reported within 72 hours. Fines of up to $50,000 per violation apply to hospitals and physicians, and CMS can terminate the hospital's Medicare provider agreement.","k":"EMTALA penalties apply to both the hospital and the physician."},{"n":544,"g":42,"q":"An 82-year-old man with dementia refuses admission for pneumonia. Which element is part of decision-making capacity?","o":["He agrees with the physician's recommendation after the plan is explained once by the resident","He has a family member present","He can reason about the options and explain how he reached the decision","He has a normal blood pressure","He can recite the date and place correctly"],"a":2,"e":"Capacity requires four elements: expressing a choice, understanding the relevant information, appreciating the situation and its consequences, and reasoning about the options. Agreement with the physician is not required, and capacity can change over time.","k":"Capacity means understand, appreciate, reason, and express a choice."},{"n":545,"g":42,"q":"A patient with a psychiatric illness changes his answer about treatment from minute to minute during the discussion. Which capacity element is most affected?","o":["The ability to read","The ability to remember his birthday only","The ability to express a stable choice","The ability to hear","The ability to walk"],"a":2,"e":"Expressing a choice is one of four elements of capacity. Frequent reversals due to altered mental status or psychiatric illness suggest a lack of capacity, which is assessed for each decision and can change over time.","k":"Repeated reversals of choice suggest a capacity problem."},{"n":546,"g":42,"q":"A busy emergency department physician hands off a critically ill patient with a one-word summary: 'stable', 'watcher', or 'unstable'. Which I-PASS element is this?","o":["Illness severity","Action list","Synthesis by receiver","Patient summary","Situation awareness and contingency planning"],"a":0,"e":"I-PASS stands for illness severity, patient summary, action list, situation awareness and contingency plans, and synthesis by receiver. The illness severity element is a one-word acuity summary.","k":"Illness severity is the first element of I-PASS."},{"n":547,"g":42,"q":"After a handoff, the oncoming physician repeats the plan back and asks questions. Which I-PASS element is this?","o":["Illness severity rating","Synthesis by receiver","Patient summary given","Situation awareness and planning","Action list for the team"],"a":1,"e":"Synthesis by receiver is the final step, where the receiving clinician asks questions and confirms the plan of care. It is a closed loop that catches errors.","k":"The receiver must restate and confirm the plan."},{"n":548,"g":42,"q":"Which finding does the AHRQ patient safety primer note about communication in closed malpractice claims involving emergency physicians and trainees?","o":["Communication failures were not a significant factor in the claims reviewed","Communication failures were a leading cause of preventable error","Errors occurred only on night shifts in the closed claims reviewed","Handoffs were never involved in any of the closed claims reviewed","Only equipment failures caused errors in the closed claims reviewed"],"a":1,"e":"The primer states that communication failures were a leading cause of preventable error in closed malpractice claims involving emergency physicians and trainees. Structured handoffs reduce this risk, and interruptions impair the receiver's ability to listen.","k":"Communication failure is a leading cause of preventable error."},{"n":549,"g":42,"q":"In a mass casualty incident, a rescuer using the START algorithm finds a patient who is breathing at 36 breaths per minute. What triage category applies?","o":["Expectant (black) because the rate is fast","Delayed (yellow)","No category until a physician arrives","Minor (green)","Immediate (red)"],"a":4,"e":"In START, a respiratory rate above 30 per minute places the patient in the immediate category. The algorithm also uses walking, breathing, perfusion by radial pulse, and the ability to obey commands.","k":"A respiratory rate above 30 makes a START patient immediate."},{"n":550,"g":42,"q":"Which START triage category is assigned to victims who are unlikely to survive given the severity of their injuries and available resources?","o":["Delayed (yellow)","Expectant (black)","Immediate (red)","Observation (white)","Minor (green)"],"a":1,"e":"START categories are minor (green), delayed (yellow), immediate (red), and expectant (black). Expectant patients are unlikely to survive given injury severity or available care, and receive palliative care and pain relief.","k":"Expectant patients are those unlikely to survive with available resources."}]}</script>

 if(run.mode==="exam"||run.fb==="end"){run.ids.forEach(function(id){if(run.ans[id]!==undefined)rec(id,run.ans[id]===byId[id].a,0)})}
 var c=0;run.ids.forEach(function(id){if(run.ans[id]===byId[id].a)c++});run.c=c;
 if(run.mode==="exam"){S.exams.push({d:ymd(),n:run.ids.length,c:c,p:Math.round(100*c/run.ids.length),t:run.dur});save()}
 route()}
function results(app){var n=run.ids.length,c=run.c,ans=Object.keys(run.ans).length,p=Math.round(100*c/n);
 var cats={};run.ids.forEach(function(id){var q=byId[id],k=gById[q.g].c,o=cats[k]||(cats[k]={n:0,c:0});o.n++;if(run.ans[id]===q.a)o.c++});
 var miss=run.ids.filter(function(id){return run.ans[id]!==byId[id].a});
 app.innerHTML='<div class="eyebrow">'+esc(run.label)+' complete</div><h1>'+c+' of '+n+' correct · '+p+'%</h1><p style="color:var(--mut)">'+ans+' answered in '+Math.floor(run.dur/60)+' min '+run.dur%60+' s.</p>'+
 '<div class="btns"><button class="btn p" id="rm"'+(miss.length?"":" disabled")+'>Redo the '+miss.length+' missed</button><a class="btn" href="#/practice">New session</a><a class="btn" href="#/home">Home</a></div>'+
 '<h2>By content area</h2><div class="grid g2">'+Object.keys(cats).map(function(k){var o=cats[k],pp=Math.round(100*o.c/o.n);return'<div class="card"><b>'+esc(title(k))+'</b><div class="bar '+(pp<60?"bd":pp>=80?"ok":"")+'"><i style="width:'+pp+'%"></i></div><small style="color:var(--mut)">'+o.c+' of '+o.n+' · '+pp+'%</small></div>'}).join("")+'</div>'+
 '<h2>Review every question</h2>'+run.ids.map(function(id,i){return qrev(byId[id],run.ans[id],i+1)}).join("");
 $("#rm").onclick=function(){start(shuffle(miss),{label:"Missed questions",fb:"now"})};wireRev(app)}
function qrev(q,a,i){var ok=a===q.a,un=a===undefined;
 return'<details class="card" style="margin-bottom:10px"><summary><span style="color:'+(ok?"var(--ok)":"var(--bad)")+';font-weight:700;margin-right:10px">'+(ok?"✓":un?"–":"✗")+'</span>'+(i?i+". ":"")+'Q'+q.n+' · '+esc(q.q.length>110?q.q.slice(0,108)+"…":q.q)+'</summary><p class="serif" style="font-size:18px">'+esc(q.q)+'</p><div class="opts">'+q.o.map(function(o,k){var cl=k===q.a?" ok":k===a?" no":"";return'<div class="opt'+cl+'" style="cursor:default"><span class="l">'+"ABCDE"[k]+'</span><span class="t">'+esc(o)+'</span><span class="mk">'+(k===q.a?"✓ Correct":k===a?"✗ Your answer":"")+'</span></div>'}).join("")+'</div><div class="exp"><p style="margin:0">'+esc(q.e)+'</p><div class="kp"><b>KEY PRINCIPLE</b>'+esc(q.k)+'</div></div><div style="margin-top:10px"><button class="btn fl2" data-id="'+q.n+'" style="min-height:40px;padding:4px 12px">'+(S.flag[q.n]?"⚑ Flagged":"⚐ Flag for later")+'</button></div></details>'}
function wireRev(app){app.querySelectorAll(".fl2").forEach(function(b){b.onclick=function(){var id=+b.dataset.id;S.flag[id]?delete S.flag[id]:S.flag[id]=1;save();b.textContent=S.flag[id]?"⚑ Flagged":"⚐ Flag for later"}})}
/* FLASHCARDS */
var INT=[0,1,3,7,14,30];
function cards(app){var now=Date.now(),due=[],nw=[];
 Q.forEach(function(q){var c=S.cards[q.n];if(!c)nw.push(q.n);else if(c.due<=now)due.push(q.n)});
 var queue=shuffle(due).concat(shuffle(nw).slice(0,15)),i=0,flip=false;
 function draw(){if(i>=queue.length){app.innerHTML='<div class="eyebrow">Flashcards</div><h1>'+(queue.length?"Deck done":"Nothing due")+'</h1><div class="card empty">'+(queue.length?"You went through "+queue.length+" cards. Come back tomorrow for the ones you marked.":"New cards unlock daily. Mark cards you miss and they return sooner.")+'<div class="btns" style="justify-content:center;margin-top:14px"><a class="btn p" href="#/practice">Practice questions</a></div></div>';return}
  var q=byId[queue[i]],g=gById[q.g];
  app.innerHTML='<div class="eyebrow">Flashcards</div><div class="top"><h1 style="flex:1;font-size:26px">Key principles</h1><b>'+(i+1)+' / '+queue.length+'</b></div><div class="prog" style="margin-bottom:12px"><i style="width:'+(i/queue.length*100)+'%"></i></div>'+
  '<div class="fc" id="fc" role="button" tabindex="0" aria-label="Flip card"><div class="qmeta"><span class="tag">Q '+q.n+'</span><span>'+esc(g.t)+'</span></div>'+
  (!flip?'<p class="stem serif" style="margin-top:14px">'+esc(q.q)+'</p><p style="color:var(--mut)">Tap to reveal the answer and key principle.</p>':'<p class="serif" style="font-size:19px;margin:14px 0 6px"><b>'+"ABCDE"[q.a]+'. '+esc(q.o[q.a])+'</b></p><p style="margin:0 0 10px">'+esc(q.e)+'</p><div class="kp"><b>KEY PRINCIPLE</b>'+esc(q.k)+'</div>')+'</div>'+
  (flip?'<div class="row" style="margin-top:14px"><button class="btn" id="bad" style="flex:1;justify-content:center;border-color:var(--bad)">✗ Missed it</button><button class="btn p" id="gd" style="flex:1;justify-content:center">✓ Got it</button></div>':'<div class="row" style="margin-top:14px"><button class="btn d" id="rv" style="flex:1;justify-content:center">Show answer</button></div>');
  var f=function(){flip=true;draw()};$("#fc").onclick=function(){if(!flip)f()};$("#fc").onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();if(!flip)f()}};
  if(!flip)$("#rv").onclick=f;else{
   $("#gd").onclick=function(){var c=S.cards[q.n]||(S.cards[q.n]={b:0,due:0});c.b=Math.min(5,c.b+1);c.due=Date.now()+INT[c.b]*86400000;if(!c.b)c.due=Date.now()+864e5;save();i++;flip=false;draw()};
   $("#bad").onclick=function(){S.cards[q.n]={b:0,due:Date.now()+36e5};save();i++;flip=false;draw()}}}
 draw()}
/* PROGRESS */
function progress(app){var days=[],d=new Date();d.setDate(d.getDate()-13);for(var i=0;i<14;i++){var k=ymd(d),v=S.days[k]||{a:0,c:0};days.push({k:k,d:d.getDate(),a:v.a,c:v.c});d.setDate(d.getDate()+1)}
 var mx=Math.max(5,Math.max.apply(null,days.map(function(x){return x.a}))),tot=0,cor=0;for(var k in S.days){tot+=S.days[k].a;cor+=S.days[k].c}
 var avg=S.ms.length?Math.round(S.ms.reduce(function(a,b){return a+b},0)/S.ms.filter(Boolean).length/1000)||0:0;
 app.innerHTML='<div class="eyebrow">Progress</div><h1>Your numbers</h1><div class="grid g4"><div class="card stat"><span>Answers given</span><b>'+tot+'</b></div><div class="card stat"><span>Accuracy now</span><b>'+Math.round(acc()*100)+'%</b><small>latest result per question</small></div><div class="card stat"><span>Questions seen</span><b>'+seen()+'/'+N+'</b></div><div class="card stat"><span>Avg per question</span><b>'+avg+'s</b></div></div>'+
 '<h2>Last 14 days</h2><div class="card"><div class="chart" role="img" aria-label="Answers per day for the last 14 days">'+days.map(function(x){return'<div><span>'+(x.a||"")+'</span><i style="height:'+(x.a/mx*100)+'%"><u style="height:'+(x.a?x.c/x.a*100:0)+'%"></u></i><span>'+x.d+'</span></div>'}).join("")+'</div><p style="font-size:12px;color:var(--mut);margin:8px 0 0"><span style="color:var(--ord);font-weight:700">Orange</span> = correct · grey = answered</p></div>'+
 '<h2>By content area</h2><div class="grid g2">'+CATS.map(function(c){var t=cstat(c),p=Math.round(t.acc*100);return'<div class="card"><div class="row"><b>'+esc(title(c))+'</b><span class="sp"></span><span>'+(t.seen?p+"%":"–")+'</span></div><div class="bar '+(t.seen&&p<60?"bd":p>=80?"ok":"")+'"><i style="width:'+(t.seen?p:0)+'%"></i></div><small style="color:var(--mut)">'+t.seen+' of '+t.n+' seen</small></div>'}).join("")+'</div>'+
 '<h2>Settings</h2><div class="card row"><label>Daily goal <select class="sel" id="gl" style="width:auto">'+[10,20,30,50].map(function(n){return'<option'+(S.goal===n?" selected":"")+'>'+n+'</option>'}).join("")+'</select></label><span class="sp"></span><button class="btn" id="ex">Export progress</button><button class="btn" id="rs">Reset all progress</button></div><p class="foot">Progress lives only in this browser on this device. Clearing site data erases it. The study index is a coverage-weighted accuracy figure for planning your study, not a prediction of exam performance.</p>';
 $("#gl").onchange=function(){S.goal=+this.value;save()};
 $("#ex").onclick=function(){var b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="ecc-bank-progress.json";a.click()};
 $("#rs").onclick=function(){if(confirm("Erase all saved progress in this browser?")){S={att:{},flag:{},days:{},cards:{},exams:[],goal:20,theme:S.theme,ms:[]};save();route()}}}
/* REVIEW */
function review(app){var m=Q.filter(function(q){return S.att[q.n]&&!S.att[q.n].l}),f=Q.filter(function(q){return S.flag[q.n]});
 app.innerHTML='<div class="eyebrow">Review</div><h1>Missed and flagged</h1><div class="btns"><button class="btn p" id="rm"'+(m.length?"":" disabled")+'>Practice '+m.length+' missed</button><button class="btn" id="rf"'+(f.length?"":" disabled")+'>Practice '+f.length+' flagged</button></div>'+
 '<div class="row" style="margin-top:14px"><input type="search" id="sq" placeholder="Search all 550 questions by keyword" aria-label="Search questions"></div><div id="out"></div>';
 var out=$("#out");function show(list,h){out.innerHTML='<h2>'+h+' ('+list.length+')</h2>'+(list.length?list.slice(0,80).map(function(q){return qrev(q,S.att[q.n]?(S.att[q.n].l?q.a:-1):undefined,0)}).join(""):'<div class="card empty">Nothing here yet.</div>')+(list.length>80?'<p class="empty">Showing 80 of '+list.length+'. Narrow your search.</p>':'');wireRev(app)}
 var base=f.concat(m.filter(function(q){return!S.flag[q.n]}));show(base,"Flagged and missed");
 $("#rm").onclick=function(){start(shuffle(m.map(function(q){return q.n})),{label:"Missed questions"})};$("#rf").onclick=function(){start(shuffle(f.map(function(q){return q.n})),{label:"Flagged questions"})};
 $("#sq").oninput=function(){var v=this.value.trim().toLowerCase();if(v.length<3){show(base,"Flagged and missed");return}var w=v.split(/\s+/);show(Q.filter(function(q){var t=(q.q+" "+q.o.join(" ")+" "+q.e+" "+q.k).toLowerCase();return w.every(function(x){return t.indexOf(x)>-1})}),"Search results")}}
function search(app){review(app)}
route();
})();
</script></body></html>

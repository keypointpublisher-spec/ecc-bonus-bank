or and is desaturating. What is the best course of action?","o":["Immediately reinsert the same tube blindly through the fresh stoma, since the tract is still very short and fragile","Wait for the surgeon to arrive before oxygenating the patient, to avoid making the airway worse","Perform a cricothyrotomy at once without attempting oral oxygenation or any other airway maneuver","Reinsert a larger tube forcefully to keep the fresh tract open and prevent the stoma from closing","Do not blindly reinsert; cover the stoma, oxygenate from above, and intubate orally if needed"],"a":4,"e":"A tract under 7 days old is immature, so reinsertion risks a false passage as the tract can close rapidly. Apply high-flow oxygen to the stoma and the face (unless a laryngectomy), cover the stoma, and ventilate from above with oral intubation. If neither route works, an emergency surgical airway is the last resort.","k":"An immature tracheostomy tract should not be blindly reinserted; oxygenate from above."},{"n":422,"g":33,"q":"A patient with a tracheostomy placed six weeks ago is found with the tube out. He is struggling to breathe. What is the best approach?","o":["Cover the stoma and insist on oral intubation as the first step, and avoid any attempt at reinsertion","Place a nasopharyngeal airway and avoid the mature stoma altogether during the entire resuscitation","Wait for the day team to arrive and reinsert the tube at that time, giving oxygen by mask meanwhile","Reinsert a tube two sizes larger in order to prevent a recurrence of the displacement, with no guide","Apply oxygen to the stoma and face, then reinsert the same or a smaller tube over a suction catheter"],"a":4,"e":"A tract older than 7 days is mature and the tube can usually be replaced at the bedside. Oxygen is given to the stoma and the face, and the same size or one size smaller is inserted, with a suction catheter used as a bougie guide. If reinsertion fails, ventilate from above or proceed to a surgical airway.","k":"A mature tracheostomy tract can usually be reinserted at the bedside."},{"n":423,"g":33,"q":"A patient with a tracheostomy has a small bright red bleed from the tube, then suddenly bleeds massively from the stoma. What is the immediate temporizing measure?","o":["Apply bedside suction and observe the patient for 30 minutes before deciding on any further action","Hyperinflate the cuff; if bleeding persists, compress the innominate artery through the stoma","Deflate the cuff to reduce the pressure that the tube exerts on the trachea and the artery beneath it","Remove the tube and pack the neck from the outside with gauze, then arrange transfer to the operating room","Give tranexamic acid by mouth and arrange outpatient surgical follow-up for the next working day"],"a":1,"e":"A sentinel bleed followed by massive hemorrhage suggests tracheo-innominate fistula, a life-threatening emergency. Temporize by hyperinflating the cuff to tamponade the vessel, and if that fails apply digital compression of the innominate artery through the stoma with the finger anterior and downward. Emergent surgery is definitive.","k":"Tracheo-innominate fistula needs cuff hyperinflation, finger compression, and emergent surgery."},{"n":424,"g":34,"q":"A 24-year-old man is agitated and hallucinating after eating jimsonweed seeds. His skin is dry and flushed, the pupils are dilated, he is febrile, and he has not urinated for 10 hours. Which treatment is the agent of choice for his agitation?","o":["Intravenous benzodiazepines, repeated as needed","Intravenous fluids and observation without sedation","Intravenous diphenhydramine to reduce the symptoms","Oral activated charcoal for every ingestion regardless of mental status","Haloperidol as the first-line agent"],"a":0,"e":"Anticholinergic toxicity produces red skin, mydriasis, delirium, urinary retention, anhidrotic hyperthermia, and tachycardia. Benzodiazepines are the agents of choice and reduce the risk of hyperthermia, rhabdomyolysis, and injury, and they raise seizure threshold. Physostigmine is reserved for severe agitation or delirium unresponsive to benzodiazepines.","k":"Sedate anticholinergic agitation with benzodiazepines first."},{"n":425,"g":34,"q":"A 20-year-old woman after a mixed ingestion has hot dry skin, delirium, a heart rate of 140, and a QRS of 118 ms with a terminal R wave in aVR. What should be avoided and what should be given?","o":["Give procainamide for the wide-complex rhythm","Avoid all sedatives and give intravenous magnesium","Give physostigmine and digoxin immune Fab for the wide QRS","Avoid physostigmine and give sodium bicarbonate for the wide QRS","Give physostigmine because the delirium is severe, and bicarbonate for acidosis only"],"a":3,"e":"A QRS above 100 ms or a terminal R wave in aVR suggests sodium channel blockade, as with tricyclic antidepressants. Physostigmine is contraindicated here and in bradycardia or AV block, since it has been associated with cardiac arrest. Sodium bicarbonate 2 mEq/kg is the treatment, with an infusion if effective and a QRS goal below 110 ms.","k":"Wide QRS in an anticholinergic picture means sodium channel blockade: give bicarbonate, avoid physostigmine."},{"n":426,"g":34,"q":"Which finding best distinguishes anticholinergic toxicity from a sympathomimetic toxidrome in a febrile, agitated patient?","o":["Tachycardia with a regular sinus rhythm and a normal blood pressure","Agitation and hallucinations with confusion and picking at the air","Hypertension with an elevated temperature and diaphoresis","Dry skin with decreased or absent bowel sounds","Dilated pupils that react sluggishly to a bright light source"],"a":3,"e":"Anticholinergic toxicity is characterized by dry skin (anhidrosis), especially of the axillae and mouth, with decreased or absent bowel sounds, urinary retention, mydriasis, tachycardia, and delirium. Mydriasis, tachycardia, and agitation are shared with sympathomimetic poisoning, so dryness of the skin and mucous membranes is the discriminating sign.","k":"Anhidrosis and absent bowel sounds separate anticholinergic from sympathomimetic toxicity."},{"n":427,"g":34,"q":"A farmer has salivation, bronchorrhea, miosis, vomiting, fasciculations, and a heart rate of 48 after pesticide exposure. What is the endpoint for atropine dosing?","o":["Drying of bronchial secretions","A systolic blood pressure above 160 mm Hg","Cessation of the fasciculations","A heart rate above 140","Resolution of the miosis"],"a":0,"e":"Organophosphate poisoning causes muscarinic and nicotinic effects, and respiratory failure from bronchospasm, bronchorrhea, and diaphragmatic weakness is the main cause of death. Atropine is doubled every 5 minutes until the bronchial secretions dry; a heart rate above 80 and systolic pressure above 80 are secondary goals. Atropine does not reverse nicotinic effects.","k":"Titrate atropine to dry bronchial secretions in organophosphate poisoning."},{"n":428,"g":34,"q":"Rapid sequence intubation is needed for a patient with organophosphate poisoning and respiratory failure. Which paralytic should be avoided?","o":["Succinylcholine","Vecuronium","Cisatracurium","Rocuronium","Propofol as the induction agent"],"a":0,"e":"Succinylcholine is hydrolyzed by plasma cholinesterase, which organophosphates inhibit, so paralysis is prolonged and the page calls it absolutely contraindicated. A nondepolarizing agent such as rocuronium or vecuronium is used, and higher doses may be needed. Benzodiazepines treat seizures, and phenytoin is ineffective.","k":"Avoid succinylcholine in organophosphate poisoning."},{"n":429,"g":34,"q":"Three days after an organophosphate poisoning that was successfully treated with atropine, a patient develops neck flexor weakness, proximal limb weakness, and cranial nerve palsies, and is struggling to breathe. What is true about this condition?","o":["The intermediate syndrome, which neither atropine nor pralidoxime prevents or treats","Guillain-Barre syndrome, which needs plasmapheresis to treat the progressive weakness over days","Organophosphate withdrawal, which resolves within minutes on its own without any treatment given","Cholinergic crisis, which is treated with more atropine until the secretions have dried up completely","Delayed neuropathy, which is treated with pralidoxime alone for several days after the exposure"],"a":0,"e":"Intermediate syndrome occurs 24 to 96 hours after the acute cholinergic phase with proximal limb and neck flexor weakness and cranial nerve palsies, and can lead to respiratory failure. An early bedside clue is difficulty lifting the head off the pillow. Atropine and pralidoxime do not prevent or treat it, and admitted patients should be monitored for 48 to 96 hours.","k":"Intermediate syndrome needs respiratory monitoring and support; antidotes do not prevent it."},{"n":430,"g":34,"q":"A 45-year-old woman overdosed on propranolol and has seizures, a wide QRS, bradycardia, and hypotension that persists after fluids and atropine. Which therapy is the next step listed after atropine and fluids?","o":["Glucagon by intravenous bolus followed by an infusion","Amiodarone infusion to treat the wide-complex rhythm","Oral activated charcoal alone, given through a nasogastric tube","Intravenous diltiazem to slow the heart rate and stabilize the rhythm","Flumazenil to reverse the effects of the overdose on the central nervous system"],"a":0,"e":"Propranolol crosses the blood-brain barrier and causes seizures and sodium channel blockade with a wide QRS. When fluids and atropine fail, the sequence on the page is glucagon, calcium, high-dose insulin with glucose, vasopressors, bicarbonate for a wide QRS, and magnesium for QT prolongation. Lipid emulsion and ECMO are salvage options.","k":"Glucagon is the first antidote after fluids and atropine in beta-blocker poisoning."},{"n":431,"g":34,"q":"A 35-year-old man ingested sotalol and has a normal ECG and no symptoms 6 hours after ingestion. What is the appropriate disposition?","o":["Discharge, because most beta-blocker effects appear within six hours of ingestion and he is asymptomatic","Admit with monitoring, since sotalol can cause delayed QT prolongation and torsades","Treat with oral calcium and discharge once the symptoms have improved","Observe for another hour and discharge if the QTc is normal at that time, with a repeat ECG next week","Discharge and check the potassium level at an outpatient visit in one week, with a repeat ECG then"],"a":1,"e":"Beta-blocker effects typically appear within 6 hours, but sotalol has class III antiarrhythmic activity and can cause delayed and prolonged toxicity with QT prolongation, torsades de pointes, and ventricular fibrillation. Admit all sotalol ingestions and all symptomatic patients. Hemodialysis is effective for nadolol, sotalol, and atenolol.","k":"Admit all sotalol ingestions for monitoring."},{"n":432,"g":34,"q":"A 78-year-old woman on chronic digoxin, recently started on amiodarone, has nausea, yellow-green visual halos, and bidirectional ventricular tachycardia. What is the definitive therapy?","o":["Intravenous lidocaine bolus","Intravenous amiodarone bolus","Intravenous calcium chloride bolus","Digoxin immune fab","Synchronized cardioversion as the first-line therapy"],"a":3,"e":"Bidirectional ventricular tachycardia is nearly pathognomonic for digoxin toxicity. Amiodarone raises digoxin levels by about 50%, and macrolides, verapamil, diltiazem, and quinidine are other precipitants. DigiFab is indicated for life-threatening arrhythmias, hyperkalemia above 5 mEq/L in acute poisoning, and hemodynamic instability.","k":"Life-threatening digoxin-induced arrhythmia is treated with digoxin immune fab."},{"n":433,"g":34,"q":"A 26-year-old woman after an acute intentional digoxin overdose has a potassium of 6.2 mEq/L and a heart rate of 38. What does the potassium value signify?","o":["A sign of chronic toxicity, in which the potassium is expected to be low","A laboratory artifact that should be repeated before any treatment is given","A benign finding that should be treated only with intravenous calcium gluconate","A marker of severe acute toxicity that supports giving digoxin immune fab","A reason to give insulin and dextrose and to defer the antidote for now"],"a":3,"e":"In acute poisoning, Na/K-ATPase inhibition shifts potassium out of cells, and a potassium above 5.0 mEq/L is a marker of severe toxicity and an indication for DigiFab. Chronic toxicity is more often associated with low or normal potassium, from diuretics. Calcium use is controversial and requires extreme caution.","k":"Hyperkalemia in acute digoxin poisoning signals severity and is an indication for fab fragments."},{"n":434,"g":34,"q":"A 70-year-old woman with chronic digoxin toxicity is taking a loop diuretic and has a potassium of 3.0 mEq/L. What is the target for potassium correction?","o":["Above 5.5 mEq/L, so that potassium competes with digoxin at the receptor and lessens its effect","Allow the potassium to remain low, to reduce the risk of hyperkalemia during later treatment with antibodies","Above 4.0 mEq/L, since hypokalemia increases digoxin binding and toxicity","Normal levels are irrelevant to the clinical course of digoxin toxicity or its treatment in this patient","Above 6.0 mEq/L, which is protective against ventricular arrhythmias in digoxin toxicity of this kind"],"a":2,"e":"Hypokalemia increases the risk of toxicity since potassium and digoxin compete for the same site on the Na/K-ATPase, and correcting potassium to above 4.0 mEq/L is recommended in chronic toxicity. Chronic toxicity most often follows renal insufficiency, dehydration, and drug interactions. Empiric DigiFab for chronic toxicity is a smaller number of vials than for acute poisoning.","k":"Replace potassium to above 4.0 in chronic digoxin toxicity."},{"n":435,"g":35,"q":"A 55-year-old woman on chronic lithium has recently started ibuprofen, lisinopril, and hydrochlorothiazide. She now has a coarse tremor, ataxia, slurred speech, and confusion. What is the most important initial intervention?","o":["Whole bowel irrigation for all patients regardless of formulation","Oral sodium polystyrene sulfonate to remove the drug","Activated charcoal, which binds lithium effectively","Forced diuresis with furosemide to enhance excretion","Isotonic saline resuscitation, avoiding loop diuretics"],"a":4,"e":"Chronic lithium toxicity is neurologic and more severe than acute toxicity, and NSAIDs, ACE inhibitors, and thiazides reduce excretion. Fluids are the most important initial intervention, with normal saline preferred. Activated charcoal does not adsorb lithium, loop diuretics should be avoided, and whole bowel irrigation is for sustained-release ingestions.","k":"Saline is the cornerstone of lithium toxicity treatment; charcoal and forced diuresis do not help."},{"n":436,"g":35,"q":"A patient with lithium toxicity and impaired kidney function has a serum lithium of 4.3 mEq/L. What is the recommended treatment?","o":["Intravenous sodium bicarbonate alone","Furosemide infusion","Oral activated charcoal","Observation with serial levels only","Hemodialysis"],"a":4,"e":"EXTRIP recommends hemodialysis when kidney function is impaired and the lithium level is above 4.0 mEq/L, or when there is clinical deterioration with decreased consciousness, seizures, or life-threatening dysrhythmias regardless of the level. Levels rebound after dialysis, so recheck 6 to 8 hours later.","k":"Dialyze lithium toxicity with impaired kidney function and a level above 4.0, or with neurologic deterioration."},{"n":437,"g":35,"q":"A lithium level drawn from a green-top tube is reported as 2.8 mEq/L in a patient who looks well. What is the likely explanation?","o":["The tube contains lithium heparin, which falsely elevates the result","The tube contains sodium fluoride, which falsely lowers the result of the lithium measurement","The level reflects brain concentration rather than the serum level","The level is real and indicates a recent acute ingestion, so decontamination should be started","The patient has nephrogenic diabetes insipidus from chronic therapy"],"a":0,"e":"Lithium heparin (green-top) tubes falsely elevate lithium levels and should not be used. The therapeutic range is 0.6 to 1.2 mEq/L, levels do not correlate well with symptoms, and repeat levels every 2 to 4 hours are used after overdose.","k":"Never draw a lithium level in a lithium heparin tube."},{"n":438,"g":35,"q":"A 3-year-old ingested an unknown number of prenatal vitamins and has vomiting and lethargy. The estimated dose of elemental iron is above 60 mg/kg. Which statement about management is correct?","o":["Activated charcoal should be given because it binds iron effectively in the gut after an ingestion","No treatment is needed unless the serum iron exceeds 2,000 micrograms/dL at any time after the ingestion","Hemodialysis is the preferred method to remove iron from the blood in a severe iron overdose","Deferoxamine is indicated for severe toxicity, and activated charcoal is not recommended","Whole bowel irrigation is contraindicated in all iron ingestions, including those with visible tablets"],"a":3,"e":"Severe iron toxicity is defined as over 60 mg/kg of elemental iron. Deferoxamine is indicated for shock, acidosis, altered mental status, an iron level above 500 mcg/dL (or above 350 with systemic toxicity), a large number of pills on the film, or pregnancy. Charcoal does not adsorb iron, and whole bowel irrigation is used for large ingestions.","k":"Chelate severe iron poisoning with deferoxamine; charcoal and dialysis do not remove iron."},{"n":439,"g":35,"q":"Which serum iron level, measured about four hours after ingestion, suggests moderate to severe systemic toxicity?","o":["Below 100 mcg/dL","Above 500 mcg/dL","Between 100 and 150 mcg/dL","Below 300 mcg/dL","Between 150 and 250 mcg/dL"],"a":1,"e":"Peak levels occur at about 4 hours, though very high doses may delay the peak. A level below 300 mcg/dL is nontoxic or mild, 300 to 500 causes significant GI symptoms with possible systemic toxicity, above 500 indicates moderate to severe systemic toxicity, and above 1,000 indicates severe toxicity. Levels guide but do not absolutely predict toxicity.","k":"An iron level above 500 mcg/dL signals moderate to severe systemic toxicity."},{"n":440,"g":35,"q":"A 17-year-old girl who took her grandmother's tuberculosis medication has had two generalized seizures that did not respond to lorazepam. She has a metabolic acidosis. Which antidote is indicated?","o":["Intravenous pyridoxine","Intravenous methylene blue","Intravenous naloxone","Intravenous hydroxocobalamin","Intravenous physostigmine"],"a":0,"e":"Seizures refractory to conventional treatment, with metabolic acidosis and coma, are the hallmarks of isoniazid toxicity. Isoniazid metabolites interfere with pyridoxine and reduce GABA synthesis. Pyridoxine is the antidote, and benzodiazepines may help but may not be effective alone.","k":"Refractory seizures with acidosis after isoniazid overdose are treated with pyridoxine."},{"n":441,"g":35,"q":"An adult has had a refractory seizure after an isoniazid overdose of unknown quantity. What is the empiric pyridoxine dose?","o":["10 g orally","500 mg orally","5 g intravenously","1 g orally","100 mg intravenously"],"a":2,"e":"When the amount is unknown, treat with an empiric 5 g of pyridoxine; if the quantity is known, give a 1:1 ratio of pyridoxine to ingested isoniazid. In children the dose is 70 mg/kg, maximum 5 g. Infuse at about 1 g per minute until seizures stop or the maximum is reached. Pyridoxine may temporarily worsen the acidosis.","k":"Give empiric pyridoxine 5 g for an unknown isoniazid overdose with seizures."},{"n":442,"g":35,"q":"A 22-year-old woman develops cyanosis after benzocaine throat spray for a procedure. Her oxygen saturation by pulse oximetry is 85% and does not improve on 100% oxygen. The arterial PaO2 is normal and the blood appears chocolate brown. What is the treatment?","o":["Methylene blue","Sodium thiosulfate as the sole therapy","Hydroxocobalamin","Hyperbaric oxygen as the first-line therapy","Acetylcysteine"],"a":0,"e":"Methemoglobinemia from oxidizing agents such as benzocaine, dapsone, and nitrites causes chocolate-brown blood, a pulse oximetry reading near 85% that does not respond to oxygen, and a normal PaO2. Co-oximetry confirms it, and methylene blue is given to symptomatic patients or those with methemoglobin above 25%.","k":"A saturation gap that does not respond to oxygen suggests methemoglobinemia, which is treated with methylene blue."},{"n":443,"g":35,"q":"A patient with methemoglobinemia is known to have G6PD deficiency. Which statement is correct?","o":["Intravenous sodium nitrite is the treatment of choice in this case, given slowly over several minutes","Observation alone is the only option, since every form of treatment is contraindicated in G6PD deficiency","Methylene blue is contraindicated; ascorbic acid, exchange transfusion, or hyperbaric oxygen may be used","Only supplemental oxygen is needed, with no other treatment at all, since the condition resolves alone","Methylene blue is preferred because it is safe in G6PD deficiency and works quickly in all patients"],"a":2,"e":"Methylene blue can cause acute hemolytic anemia in G6PD deficiency. Alternatives include ascorbic acid orally, exchange transfusion for symptomatic cases, and hyperbaric oxygen when methylene blue is ineffective or contraindicated. IV hydration and bicarbonate may help the acidosis.","k":"Avoid methylene blue in G6PD deficiency."},{"n":444,"g":35,"q":"An 18-month-old has swallowed a coin-shaped object. The anteroposterior radiograph shows a double ring (halo) sign with the object in the esophagus. What is the appropriate management?","o":["Observation at home with a repeat film in 24 hours to see if the object passes without any intervention at all in the child","Give activated charcoal to adsorb the electrolyte contents of the battery before further imaging","Perform whole bowel irrigation to move the object along the gut and out through the rectum","Emergent endoscopic removal within about two hours, with honey or sucralfate while waiting in eligible children","Administer a laxative and wait for passage of the object through the gastrointestinal tract at home over several days"],"a":3,"e":"A double ring or halo sign on the AP view distinguishes a button battery from a coin. A button battery in the esophagus can cause severe necrosis in as little as 2 hours, so removal is emergent and observation is not appropriate. Honey (age 12 months or older) or sucralfate can be given before removal, but removal must not be delayed.","k":"An esophageal button battery needs emergent removal; do not observe."},{"n":445,"g":35,"q":"A 45-year-old woman develops tinnitus, a metallic taste, and a seizure minutes after an interscalene nerve block. She then becomes bradycardic with a widened QRS. Which treatment is specific?","o":["20% intravenous lipid emulsion, with airway support and benzodiazepines for the seizure","Intravenous verapamil to slow the ventricular rate quickly and terminate the wide complex rhythm","Intravenous lidocaine to suppress the ventricular arrhythmia, given as a bolus followed by an infusion","Intravenous vasopressin to treat the hypotension and the arrhythmia, with airway support in the resuscitation room","Intravenous metoprolol to control the heart rate and reduce myocardial oxygen demand in this patient"],"a":0,"e":"Local anesthetic systemic toxicity progresses from CNS signs to cardiovascular collapse and generally occurs within minutes of injection. Treatment includes airway management with 100% oxygen, benzodiazepines for seizures, lipid emulsion 1.5 mL/kg bolus then an infusion, and amiodarone preferred for ventricular arrhythmias. ACLS modifications avoid vasopressin, calcium channel blockers, and beta-blockers, and early ECMO should be considered.","k":"Treat local anesthetic toxicity with airway support, benzodiazepines, and lipid emulsion; avoid vasopressin and beta-blockers."},{"n":446,"g":36,"q":"An 81-year-old woman falls from a stool and has an open forearm fracture with a clean 1 cm wound over a closed-looking fragment end. She is stable and the wound is classified as Gustilo type I. Which antibiotic plan fits best?","o":["Ceftriaxone for 72 hours starting after the operation","No antibiotics because the wound is small, clean, and well irrigated","Piperacillin-tazobactam for 5 days as routine in every open fracture","Cefazolin started within one hour, continued for about 24 hours","Oral cephalexin started the next morning, for a week in all cases"],"a":3,"e":"Antibiotics for open fractures work best when the first dose is given within one hour of injury or of arrival. Type I injuries are covered with cefazolin for about 24 hours from injury or after the first debridement. Type II and III injuries need broader coverage and longer duration.","k":"Give open fracture antibiotics within one hour, using cefazolin for type I."},{"n":447,"g":36,"q":"A 28-year-old construction worker has an open tibia fracture with an 8 cm wound, extensive soft tissue injury, and adequate soft tissue cover of the bone (Gustilo type IIIA). What antibiotic duration is recommended in the guideline reviewed?","o":["A single dose of cefazolin at induction only","Oral amoxicillin-clavulanate for 14 days","Cefazolin for 24 hours after the first dose, adding gentamicin only if the wound later appears infected","Ceftriaxone for 72 hours after injury, or 24 hours after soft tissue coverage if that is shorter","Vancomycin alone for 5 days"],"a":3,"e":"Type II and III open fractures receive ceftriaxone, continuing for 72 hours after injury or no more than 24 hours after soft tissue coverage, whichever is shorter. Penicillin allergy changes the agents but not the principle of early, adequate coverage.","k":"Type II and III open fractures need ceftriaxone for up to 72 hours."},{"n":448,"g":36,"q":"A 40-year-old man has an open tibia fracture after a fall from a boat into saltwater. Which antibiotic addition is recommended for this contamination?","o":["Oral ciprofloxacin alone","No change, because water exposure does not alter risk","Piperacillin-tazobactam together with doxycycline","Metronidazole alone","Cefazolin alone because the wound is small"],"a":2,"e":"Fresh water exposure calls for piperacillin-tazobactam, and saltwater exposure adds doxycycline to cover marine organisms. Farm and soil contamination adds anaerobic coverage with metronidazole.","k":"Water contamination of an open fracture needs gram-negative and marine coverage."},{"n":449,"g":36,"q":"A 30-year-old man is shot through the forearm with a high velocity rifle (muzzle velocity above 2,000 feet per second). The bullet fractured the radius. How should the wound be treated for antibiotic purposes?","o":["As a closed fracture needing only tetanus prophylaxis","With a single oral dose and discharge","As a type I injury because the wound is small","As a Gustilo type III open fracture","With no antibiotics because ballistic injuries are sterile"],"a":3,"e":"High velocity ballistic fractures are managed like Gustilo type III injuries because of large zones of soft tissue damage. Low velocity wounds in nonoperative extremity fractures may need no antibiotics.","k":"Treat high velocity ballistic fractures as type III open fractures."},{"n":450,"g":36,"q":"A 25-year-old man has a knife wound to the medial upper arm. The radial pulse is absent, the hand is pale and cool, and a hematoma is expanding. What is the best next step?","o":["Splinting and discharge with vascular follow-up in the clinic within a week","Immediate surgical exploration without further imaging","Doppler pressure index to see whether it is below 0.9 before any decision on surgery","CT angiography first, then decide on surgery, even in the presence of hard signs","Observation for 24 hours with serial pulse checks and no imaging"],"a":1,"e":"Absent distal pulses, distal ischemia, bruits, pulsatile bleeding, and expanding hematoma are hard signs. They carry more than 90% risk of arterial injury and lead to immediate exploration without more workup.","k":"Hard signs of extremity vascular injury mean surgery, not imaging."},{"n":451,"g":36,"q":"Which finding is a soft sign of extremity arterial injury, which carries about a 30% risk of arterial injury, rather than a hard sign?","o":["An absent distal pulse in the injured limb","A rapidly expanding hematoma around the injury","A palpable thrill over the injury or a bruit heard over it","A peripheral nerve deficit near the wound","Pulsatile bleeding from the wound at the injury site"],"a":3,"e":"Soft signs include a small nonexpanding hematoma, a subjectively diminished pulse, a nerve deficit, a history of significant bleeding, unexplained hypotension, and a high risk orthopedic injury. Pulsatile bleeding, thrill or bruit, absent pulses, and expanding hematoma are hard signs.","k":"Soft signs call for further testing, hard signs for surgery."},{"n":452,"g":36,"q":"A man in hemorrhagic shock has a shotgun wound to the thigh. A colleague proposes using the arterial pressure index to rule out major vascular injury. Why is the index unreliable here?","o":["It only detects venous injuries","It is unreliable in shock states, in shotgun wounds, and for proximal injuries","It requires a computed tomography scan before it is valid","It gives false positives in all younger patients","It cannot be measured with a handheld Doppler device in the emergency department and needs formal vascular laboratory testing"],"a":1,"e":"An arterial pressure index above 0.9 has a high negative predictive value, but it is unreliable for proximal and popliteal injuries, shotgun wounds, multiple injuries, and shock. CT angiography is the more reliable study when a vascular injury remains in question.","k":"Do not rely on the pressure index in shock or with shotgun wounds."},{"n":453,"g":36,"q":"A 29-year-old man had a posterior knee dislocation that was reduced in the field. Distal pulses are palpable and equal. The injured leg ankle-brachial index is 0.82. What is the best next step?","o":["MRI of the knee to evaluate for ligament tears before any vascular study","CT angiography or arterial duplex to look for popliteal artery injury","Repeat the examination in two weeks when the swelling has settled","Discharge in a knee immobilizer because the pulses are normal at the foot","Reassure him because an index below 0.9 is normal after trauma to the knee"],"a":1,"e":"Popliteal artery injury occurs in about one quarter of knee dislocations, and normal pulses do not exclude it. An index below 0.9 calls for arterial duplex or CT angiography, with vascular surgery involvement if abnormal.","k":"Normal pulses do not exclude popliteal injury after knee dislocation."},{"n":454,"g":36,"q":"A 24-year-old man has a pelvic fracture after a crash. He cannot urinate and has blood at the urethral meatus. What is the best next step?","o":["CT cystography through a Foley catheter","Retrograde urethrography before any catheter is placed","Insert a Foley catheter and check the urine","Suprapubic aspiration of urine as the only test","Digital rectal examination to look for a high-riding prostate and decide"],"a":1,"e":"Blood at the meatus is the most important sign of urethral injury. In a male with signs of urethral injury, retrograde urethrography is done before any catheter, because catheterization can convert a partial tear into a complete one.","k":"Image the male urethra before placing a catheter."},{"n":455,"g":36,"q":"Which examination finding is considered the most important sign of urethral injury after pelvic trauma in a man?","o":["Blood at the urethral meatus","Tenderness over the pubic symphysis","Scrotal swelling without bruising","A high-riding prostate on rectal examination","Microscopic hematuria on a dipstick"],"a":0,"e":"Blood at the meatus is the most important sign. A high-riding prostate is unreliable because pelvic hematoma changes the examination. Perineal or scrotal bruising and inability to void also raise concern.","k":"Blood at the meatus is the key sign of urethral injury."},{"n":456,"g":36,"q":"A man with a pelvic fracture has extravasation of contrast on retrograde urethrography at the membranous urethra. What is the best initial management?","o":["Forceful passage of a Foley catheter past the injury to bypass the tear","Observation without urinary drainage and review in the clinic within two weeks","Immediate primary repair in the emergency department under local anesthesia","Long term indwelling urethral catheter without imaging follow up in the clinic","Suprapubic catheter with delayed definitive repair after several weeks"],"a":4,"e":"Suprapubic cystostomy is the preferred initial management for most urethral injuries associated with pelvic fracture, and definitive surgery is usually delayed about 8 to 12 weeks. Forceful catheterization risks converting a partial injury to complete disruption.","k":"Drain urethral disruption with a suprapubic catheter and repair later."},{"n":457,"g":36,"q":"A 35-year-old man has been trapped under rubble for six hours. Rescuers are about to free his legs. Which prehospital step is best before release?","o":["Restrict fluids to avoid pulmonary edema and give them only after the limb is freed and the urine output drops","Release the legs first and give fluids only if symptoms develop in the next several hours","Give potassium-containing fluids to prevent hypokalemia, and avoid lactated Ringer's solution","Start intravenous crystalloid, preferably lactated Ringer's, and aim for urine output above 300 mL per hour","Give sodium bicarbonate routinely to every patient as the first step, before any fluids are given"],"a":3,"e":"Crush injury releases muscle breakdown products, potassium, and myoglobin when the limb is freed. Fluids started before release, with lactated Ringer's preferred, and a urine output target above 300 mL per hour reduce the risk of kidney injury.","k":"Give fluids before releasing a crushed limb."},{"n":458,"g":36,"q":"A man freed after hours under a collapsed wall has peaked T waves and a potassium of 7.4 mmol/L. What is the best treatment?","o":["Furosemide alone to excrete potassium","Sodium polystyrene as the only treatment","Withhold calcium so it does not deposit in injured muscle, and give only insulin and dextrose with careful monitoring","Observation and repeat electrolytes in six hours","Intravenous calcium to stabilize the myocardium and insulin with dextrose to shift potassium"],"a":4,"e":"Hyperkalemia after reperfusion of crushed muscle is treated by stabilizing the heart with intravenous calcium and shifting potassium with insulin and glucose. Calcium is given for ECG changes despite the general advice to avoid correcting asymptomatic hypocalcemia.","k":"Treat crush hyperkalemia with calcium and insulin plus dextrose."},{"n":459,"g":36,"q":"A rescued man has a calcium of 6.9 mg/dL after a long entrapment. He has no tetany, a normal QRS, and a normal QT interval. How should the low calcium be managed?","o":["Give sodium bicarbonate because it raises calcium","Do not give calcium unless ECG changes or symptoms appear, because it can deposit in necrotic muscle","Start a calcium infusion for 24 hours without monitoring","Give magnesium to correct the calcium","Give a large calcium bolus to normalize the level immediately and repeat every hour until the level is above 9 mg/dL"],"a":1,"e":"Hypocalcemia in crush injury results from calcium entering damaged muscle. Early correction of asymptomatic hypocalcemia is avoided because calcium can deposit in necrotic muscle and later release, and levels normalize over time. Treat for ECG changes, hyperkalemia, or symptoms.","k":"Do not routinely correct asymptomatic hypocalcemia in crush injury."},{"n":460,"g":36,"q":"Which statement about urine alkalinization in crush injury is accurate according to the source reviewed?","o":["Normal saline is preferred because it makes urine alkaline","Sodium bicarbonate is not routinely recommended, and lactated Ringer's reduces the need for alkalinization","Urine pH should be kept below 5 in every patient to prevent myoglobin from precipitating in the renal tubules","Alkalinization replaces the need for intravenous fluids","Sodium bicarbonate should be given routinely to every patient"],"a":1,"e":"A urine pH goal above 6.5 is mentioned, but bicarbonate is not routinely recommended and is considered mainly when normal saline is the only fluid. Lactated Ringer's reduces the need for alkalinization.","k":"Fluids come first in crush injury; bicarbonate is not routine."},{"n":461,"g":36,"q":"A CT scan after a bicycle crash shows a 7 cm intraparenchymal splenic hematoma. The patient is hemodynamically normal. What is the AAST grade?","o":["Grade II injury","Grade V injury","Grade I injury, the mildest grade","Grade III injury","Grade IV injury"],"a":3,"e":"An intraparenchymal hematoma larger than 5 cm, or expanding, is grade III. Grade IV involves hematoma larger than 10 cm or segmental or hilar vessel laceration with devascularization of more than 25% of the spleen, and grade V is a shattered spleen or hilar devascularization.","k":"Splenic hematoma over 5 cm is grade III."},{"n":462,"g":36,"q":"A 29-year-old man is hemodynamically normal after blunt trauma. CT shows a grade III splenic injury, and the abdomen is soft. Which approach is correct?","o":["Perform splenectomy only if the injury is grade V","Operate now because every grade III splenic injury requires splenectomy to prevent delayed rupture of the capsule","Give anticoagulation to prevent clots forming in the spleen","Discharge home because the patient looks well","Admit for monitoring with serial examinations, and operate for peritonitis or hemodynamic instability"],"a":4,"e":"Surgery is indicated by hemodynamic instability or diffuse peritonitis, not by grade alone. Stable patients can be managed conservatively, but nonoperative management fails in 10 to 15% of cases and needs resources for urgent laparotomy.","k":"Operate for instability or peritonitis, not for the grade alone."},{"n":463,"g":37,"q":"A 31-year-old man arrives after a knife wound to the left side of his neck, between the cricoid cartilage and the angle of the mandible. A large expanding hematoma is visible. His voice is intact, he breathes comfortably, and his blood pressure is 128/76 mmHg. What is the best next step?","o":["Obtain CT angiography first and decide on surgery only after the radiologist's report is finalized","Probe the wound at the bedside to see whether the platysma was breached","Apply a pressure dressing and send him for a contrast swallow study","Proceed to operative exploration with airway control prepared, without waiting for imaging","Observe in the department for 24 hours with serial neck examinations"],"a":3,"e":"A large expanding hematoma is a hard sign of vascular injury in penetrating neck trauma. Hard signs send the patient to the operating room, and imaging is reserved for stable patients with soft signs or no signs. Bedside probing and observation delay definitive control of a bleeding vessel.","k":"Hard signs in penetrating neck trauma mean surgical exploration, not further imaging."},{"n":464,"g":37,"q":"A 24-year-old man has a gunshot wound to the neck in the zone between the cricoid cartilage and the angle of the mandible. He is hemodynamically normal. His only symptom is a hoarse voice, and there is no expanding hematoma, bruit, or neurologic deficit. Which approach fits best?","o":["Immediate bedside exploration of the tract under local anesthesia","Multidetector CT angiography of the neck and a chest radiograph","Direct laryngoscopy only, with discharge if the cords look normal","Carotid duplex ultrasound as the sole test, then discharge","Mandatory exploration in the operating room for every neck gunshot wound"],"a":1,"e":"Dysphonia is a soft sign. A stable patient with soft signs has imaging, and multidetector CT angiography with a chest film is the first-line study. Low sensitivity for pharyngoesophageal injury means contrast swallow, endoscopy, or exploration may follow if suspicion remains.","k":"Stable soft signs in penetrating neck trauma lead to CT angiography."},{"n":465,"g":37,"q":"A 35-year-old man is brought in after a stab wound to the neck. He has a rapidly enlarging hematoma, a changed voice, and subcutaneous air over the neck. Oxygen saturation is 94% on a mask. Which airway plan is most appropriate?","o":["Use awake sedation with spontaneous breathing and avoid paralysis in every case","Wait until stridor appears so that intubation is only done when it is absolutely necessary and surgeons have prepared the operating room","Use bag-mask ventilation alone until the surgeon arrives","Intubate early with rapid sequence technique by the most experienced operator, with a surgical airway kit open","Place a nasotracheal tube blindly to avoid manipulating the neck"],"a":3,"e":"Bleeding or hematoma, subcutaneous air, and voice change signal a threatened airway, and delay makes the anatomy worse. Rapid sequence intubation is a safe approach, a flexible endoscope helps if the anatomy is distorted, and a surgical airway is the backup if oral intubation fails.","k":"Intubate penetrating neck injuries early, with a surgical airway ready."},{"n":466,"g":37,"q":"A man has a stab wound just above the sternal notch. A colleague asks which anatomic zone it lies in and why zone matters for planning. Which zone is it?","o":["Zone III, from the angle of the mandible to the base of the skull","Zone II, from the cricoid cartilage to the angle of the mandible, the middle zone of the neck","Zone I, from the sternal notch and clavicles up to the cricoid cartilage","Zone 0, the thoracic outlet below the clavicles and the sternum","Zone IV, the retropharyngeal space behind the pharynx and trachea"],"a":2,"e":"Zone I runs from the sternal notch and clavicles to the cricoid cartilage. Zone II lies from the cricoid to the angle of the mandible, and zone III from the angle to the base of skull. Zone I injuries can involve great vessels and the thorax, which is why the chest radiograph is part of the first assessment.","k":"Zone I is the sternal notch to the cricoid cartilage."},{"n":467,"g":37,"q":"A 34-year-old woman is the restrained driver in a high-speed collision. Her neck CT shows a fracture of C5 through the foramen transversarium. Her neurologic examination is normal. Which step is best?","o":["Start therapeutic heparin without imaging because the injury is certain in this patient","Carotid duplex alone, because it detects vertebral artery injury reliably in the neck","CT angiography of the head and neck to look for blunt cerebrovascular injury","Discharge with a soft collar because the neurologic examination is normal in the department","Repeat the neurologic examination in a week before any further study is ordered"],"a":2,"e":"A cervical spine fracture at any level after a high-energy mechanism is a screening indication for CT angiography in the expanded Denver criteria. Vertebral artery injury is associated with fractures through the transverse foramen. Stroke usually follows within the first days, so screening aims to find the injury before it causes ischemia.","k":"Cervical spine fracture after high energy trauma triggers CTA for blunt cerebrovascular injury."},{"n":468,"g":37,"q":"A 27-year-old man is in a motorcycle crash. His head CT is normal, but he has a dense left hemiparesis and a right Horner syndrome. What should you do now?","o":["Urgent CT angiography of the head and neck","Lumbar puncture to exclude a bleed","MRI of the brain the next morning after observation","Repeat the noncontrast head CT in six hours","Carotid duplex ultrasound and discharge if it is normal"],"a":0,"e":"A focal deficit including Horner syndrome, or a neurologic examination not explained by initial brain imaging, requires urgent CT angiography because a carotid or vertebral dissection is likely. Ultrasound misses much of the vertebral and proximal carotid system.","k":"A deficit that the head CT does not explain needs urgent vascular imaging."},{"n":469,"g":37,"q":"CT angiography after a fall shows a pseudoaneurysm of the internal carotid artery in the neck. Which grade of blunt cerebrovascular injury on the Biffl scale is this?","o":["Grade I injury, the mildest grade","Grade II injury","Grade V injury","Grade III injury","Grade IV injury"],"a":3,"e":"The Biffl scale grades luminal irregularity or less than 25% narrowing as I, dissection or hematoma with 25% or more narrowing as II, pseudoaneurysm as III, occlusion as IV, and transection with extravasation as V.","k":"Biffl grade III is a pseudoaneurysm."},{"n":470,"g":37,"q":"A 40-year-old man with multiple injuries, including a stable splenic laceration, has a grade II vertebral artery dissection on CT angiography. He has no intracranial hemorrhage. Which management is most appropriate?","o":["Withhold treatment because he has no symptoms and the lesion is small","Start an antithrombotic agent as soon as bleeding risk from other injuries allows, often an antiplatelet drug","Wait for stroke symptoms before starting any antithrombotic therapy at all","Place a stent in every grade II lesion before discharge, followed by lifelong dual antiplatelet therapy, regardless of bleeding risk","Give a heparin bolus immediately regardless of other injuries or bleeding risk"],"a":1,"e":"Antithrombotic therapy is associated with lower rates of stroke and death than no treatment, and an antiplatelet drug is a reasonable first choice for many patients. Treatment starts when the bleeding risk from other injuries allows. Routine stenting of grade II or III lesions is not recommended.","k":"Treat blunt cerebrovascular injury with antithrombotics once bleeding risk allows."},{"n":471,"g":37,"q":"A trauma surgeon argues for screening every high risk blunt trauma patient for blunt cerebrovascular injury rather than waiting for neurologic signs. Which fact best supports early screening?","o":["Strokes from these injuries most often occur within 72 hours, so treatment can start before ischemia","Screening has no false negatives with the Denver criteria","Almost every patient with blunt neck trauma has an injury, so all of them need angiography within an hour","Treatment is useless once a patient is asymptomatic","The injuries always cause immediate neurologic deficits that are easy to see"],"a":0,"e":"Blunt cerebrovascular injury occurs in roughly 1 to 3% of blunt trauma patients, and strokes cluster in the first 72 hours. Many patients are asymptomatic early, which is why screening aims to find lesions first. Even expanded criteria miss some injuries.","k":"Screen early because strokes from these injuries cluster within 72 hours."},{"n":472,"g":37,"q":"A 28-year-old man is punched in the face and has a mobile hard palate with movement of the upper teeth. The nose and the orbits do not move when you rock the palate. What fracture pattern is most likely?","o":["Le Fort III","An isolated nasal bone fracture","Le Fort II","Le Fort IV","Le Fort I"],"a":4,"e":"Le Fort I is a transverse fracture that separates the lower maxilla, so only the hard palate and teeth move, and it is stable. Le Fort II moves the nose with the palate, and Le Fort III separates the whole face from the skull.","k":"In Le Fort I only the palate and teeth move."},{"n":473,"g":37,"q":"A 38-year-old man has a mobile midface after a collision. The hard palate and the nose move together, but the eyes stay fixed. He has clear fluid dripping from the nose. What is the best interpretation?","o":["Le Fort III, because the eyes always move in this pattern","Le Fort I with an ordinary nasal drip from a bloody nose, requiring only nasal packing and discharge","A mandibular fracture with saliva in the nose","Isolated nasal fracture and a viral rhinitis","Le Fort II, with a cerebrospinal fluid leak from cribriform plate disruption"],"a":4,"e":"Le Fort II is a pyramidal fracture in which the palate and nose move but the eyes do not. Le Fort II and III injuries are associated with cribriform plate disruption and cerebrospinal fluid rhinorrhea, so clear nasal fluid should raise that concern.","k":"Le Fort II and III fractures can leak cerebrospinal fluid."},{"n":474,"g":37,"q":"A 33-year-old man has a dish-face deformity and the whole face moves on the skull after a crash. He is vomiting blood and needs an airway. Which approach is reasonable?","o":["Delay the airway until the facial surgeons are ready to operate","Place nasal packing and a nasal airway as the primary airway plan, avoiding any oral airway manipulation","Secure the airway, considering awake intubation, and control bleeding with packing","Use only a bag-mask to avoid disturbing the fractures","Avoid intubation and give high flow oxygen only"],"a":2,"e":"Le Fort III is a craniofacial disjunction. Management begins with a patent airway, awake intubation is considered when intubation is required, and nasal or oral packing may control hemorrhage. Nasal devices are poor choices in a mobile unstable midface.","k":"Le Fort III threatens the airway and bleeds heavily, so secure the airway first."},{"n":475,"g":37,"q":"A 15-year-old boy is hit in the eye by a baseball. He has vertical double vision, cannot look upward with the right eye, and vomits twice. His heart rate is 48 beats per minute. There is almost no bruising or swelling. What is the most important next step?","o":["Head CT only, because vomiting suggests intracranial injury and no orbital study is needed","Orbital CT and urgent ophthalmic or surgical review for an entrapped muscle","Reassurance that the slow heart rate is from an athlete's physiology and needs no further study","Discharge with advice to return in four to five days for review, and nasal decongestants","Warm compresses and review in two weeks if the symptoms persist, with an eye shield at night"],"a":1,"e":"A white-eyed blowout fracture can trap the inferior rectus with little external sign. Upward gaze triggers the oculocardiac reflex, with nausea, vomiting, and bradycardia. Repair within hours to days gives better recovery than delay, and delayed release is linked to partial recovery.","k":"Vomiting, bradycardia, and restricted upgaze after eye trauma suggest entrapment."},{"n":476,"g":37,"q":"A 12-year-old girl has vomiting after being struck around the eye. A head CT is normal and the emergency physician plans to discharge her with a diagnosis of concussion. What step is most likely to prevent a missed diagnosis?","o":["Check intraocular pressure with a tonometer","Repeat the head CT at 24 hours and discharge home if the child is no longer vomiting","Order a cervical spine series for neck pain","Give an antiemetic and discharge with outpatient review","Test extraocular movements for restricted gaze and diplopia, and image the orbits"],"a":4,"e":"White-eyed blowout fractures are often missed because soft tissue swelling is minimal and bone displacement is small. Vomiting leads to a head CT, and the orbital diagnosis is overlooked. Asking about diplopia and testing eye movements finds the entrapment.","k":"Test eye movements in any child with vomiting after periocular trauma."},{"n":477,"g":37,"q":"Two patients have orbital floor fractures. Which patient needs surgery within hours rather than observation for one to two weeks?","o":["An adult with a small floor fracture, normal motility, and no diplopia on examination","A teenager with vertical diplopia and an entrapped inferior rectus muscle on CT","An adult with periorbital bruising and a nondisplaced fracture with normal eye movements","A patient with nasal pain, normal vision, normal eye movements, and a stable nasal fracture","An adult with a floor fracture and a resolved subconjunctival hemorrhage with full motility"],"a":1,"e":"Standard orbital floor fractures are often observed for one to two weeks. Entrapment of muscle can cause ischemia and fibrosis, so urgent repair is recommended. A delay of two to three weeks was associated with slower or partial recovery.","k":"Muscle entrapment makes an orbital fracture a surgical urgency."},{"n":478,"g":37,"q":"A 26-year-old man was hit by a metal fragment while hammering. He has eye pain, a teardrop pupil, a flat anterior chamber, and blood all around the conjunctiva. Which management is correct?","o":["Apply a firm pressure patch to stop bleeding","Place a rigid shield without pressure, keep him fasting, give an antiemetic, and call ophthalmology","Perform a Seidel test with fluorescein to confirm the leak","Measure intraocular pressure with applanation tonometry to determine whether the globe has ruptured","Irrigate the eye and instill topical anesthetic repeatedly"],"a":1,"e":"Findings suggest an open globe. Avoid pressure, manipulation, and tonometry. Protect the eye with a metal shield or cup, keep the patient fasting, control nausea to avoid straining, and call ophthalmology for emergent repair.","k":"Shield an open globe, avoid pressure, and never check the pressure."},{"n":479,"g":37,"q":"A 45-year-old man has an open globe injury from a grinder, with no intraocular foreign body suspected on examination or CT. Which antibiotic is a first choice according to the source reviewed?","o":["Intravenous levofloxacin","A topical aminoglycoside drop only","Oral amoxicillin for five days","No antibiotic until the operating room","Intravenous vancomycin as a sole agent"],"a":0,"e":"For open globe without an intraocular foreign body, intravenous levofloxacin is the first choice, with vancomycin plus ceftazidime as a second choice. Systemic antibiotics are started promptly because endophthalmitis is the feared complication.","k":"Give systemic antibiotics promptly for an open globe."},{"n":480,"g":38,"q":"A 30-year-old man was 20 feet from an explosion in a closed room. He has no external wounds but has dyspnea, hemoptysis, and hypoxemia. Which injury is the most common fatal primary blast injury?","o":["Blast lung from the shock wave at air-fluid interfaces in the alveoli","Perforated tympanic membrane with conductive hearing loss in both ears from the blast","Penetrating fragment injury to the chest","Burn and toxic inhalation from fire","Crush injury from a collapsed structure"],"a":0,"e":"Primary blast injury affects organs with air-fluid interfaces: tympanic membranes, alveoli, and the gastrointestinal tract. Blast lung is the most common fatal primary blast injury and can present with hypoxemia and hemoptysis despite no external wounds.","k":"Blast lung is the most common fatal primary blast injury."},{"n":481,"g":38,"q":"After a bomb blast, a 40-year-old woman has a ruptured tympanic membrane and no other symptoms. How should the finding be interpreted?","o":["It is common, but it is not a reliable marker of primary blast injury severity, so look for other injuries","An intact membrane would have excluded serious blast injury, so no further evaluation is needed at all","It proves that she has blast lung and needs a chest tube and mechanical ventilation at once, whatever the imaging shows","It requires immediate operative repair in every patient, regardless of symptoms or hearing","It means the blast was secondary rather than primary, so no primary injury is possible"],"a":0,"e":"Tympanic membrane rupture is the most common ear injury from blast, and about 75% heal on their own with supportive care. It does not predict the severity of other primary blast injuries, so assessment still has to be complete.","k":"Tympanic rupture does not predict how severe the blast injury is."},{"n":482,"g":38,"q":"An explosion throws a 50-year-old man against a wall, causing a femur fracture and a pneumothorax. Which blast category does this injury belong to?","o":["Secondary blast injury","Quaternary blast injury","None, because only fragments count as blast injury","Tertiary blast injury","Primary blast injury"],"a":3,"e":"Primary injury is direct shock wave damage, secondary injury is from fragments, tertiary injury is from the body or objects being thrown, and quaternary injury is from burns, toxins, and environmental effects.","k":"Tertiary blast injuries come from being thrown or struck."},{"n":483,"g":38,"q":"A 70-year-old man has a heavily contaminated puncture wound from a rusty nail. He is unsure about previous tetanus vaccination. Which prophylaxis is best?","o":["Wound irrigation alone, as vaccination is not needed in a patient of this age","Tetanus immune globulin alone, given today","Oral antibiotics alone, without any vaccine or immune globulin","Tetanus toxoid vaccine together with tetanus immune globulin","Tetanus toxoid vaccine alone, given today"],"a":3,"e":"For a dirty wound in a patient with unknown vaccination status or fewer than three previous doses, both toxoid and immune globulin are given. Older patients are more likely to have poor immunity.","k":"Dirty wound plus unknown vaccine history needs toxoid and immune globulin."},{"n":484,"g":38,"q":"A 38-year-old man has a dirty laceration from a farm tool. He completed a full primary tetanus series and his last booster was 7 years ago. What is the best management?","o":["Toxoid plus immune globulin","A booster of tetanus toxoid without immune globulin","No prophylaxis until the wound shows signs of infection, when a full course is then given","No prophylaxis until the wound is infected","A full three-dose primary series"],"a":1,"e":"For three or more previous doses, a clean wound needs a booster only if more than 10 years have passed, and a dirty wound if more than 5 years have passed. Immune globulin is reserved for those with unknown or incomplete history.","k":"Dirty wounds need a booster if the last dose was over five years ago."},{"n":485,"g":38,"q":"A 24-year-old man punched a person in the mouth six days ago. He now has a swollen, tender hand over the third metacarpophalangeal joint with a small healing laceration. Which management is most appropriate?","o":["Primary suture closure of the wound with nonabsorbable sutures and no antibiotic because the wound is small and clean today, with routine follow-up","Cephalexin alone for three days with no imaging and primary closure of the wound after irrigation","Reassurance because the wound is small and clean, with no imaging, no antibiotic, and routine review","Warm soaks only and review in one week, with no radiograph and no antibiotic prescribed today","Hand radiograph, irrigation, leaving the wound open, and an antibiotic active against mouth flora such as amoxicillin-clavulanate"],"a":4,"e":"A laceration over a metacarpophalangeal joint after striking teeth is a closed-fist injury that harbors mouth flora. Patients often present days later. Treat with irrigation, leave the wound open, check a radiograph for fracture or tooth fragments, and give antibiotics with coverage of anaerobes and Eikenella.","k":"Treat a fight bite as a serious infection even when it looks small."},{"n":486,"g":38,"q":"Which organisms should antibiotics cover in a closed-fist injury caused by a human tooth?","o":["Pseudomonas aeruginosa and Candida","Clostridium tetani only","Staphylococcus aureus alone, since it causes nearly all hand infections after clenched-fist injuries","Staphylococcus aureus, streptococci, Eikenella, and anaerobes","Gram-negative rods only"],"a":3,"e":"Human mouth flora are polymicrobial. Closed-fist infections need coverage for staphylococci, viridans streptococci, Eikenella, and anaerobes such as Bacteroides and Fusobacterium.","k":"Fight bites need polymicrobial coverage including Eikenella and anaerobes."},{"n":487,"g":38,"q":"A 29-year-old man presents five days after a fight bite with swelling, redness spreading up the dorsum of the hand, and fever. What is the best disposition?","o":["Discharge on oral antibiotics with no review","Order a single outpatient radiograph and reassure the patient that the infection will resolve on its own","Discharge with a sling and ibuprofen","Perform primary closure and discharge","Admit for intravenous antibiotics and hand surgery consultation"],"a":4,"e":"Delayed presentation, local infection, or systemic symptoms in a closed-fist injury call for admission, intravenous antibiotics, and hand surgery review. Simple early cases may go home with oral antibiotics and close follow-up.","k":"Delayed or systemic fight bite infection needs admission and hand surgery."},{"n":488,"g":38,"q":"A 3-year-old with an isolated bruise over the ear is brought in. The parent says he fell from the sofa. Using the TEN-4-FACESp rule, how should this be interpreted?","o":["The screen applies only to children younger than 6 months, so it does not apply to this child","The screen is positive only if three or more sites are bruised, so it is negative here","The screen is not useful in a child older than 2 years, so it does not apply here","The screen is positive because an ear bruise raises the likelihood of abuse, so further evaluation is needed","The screen is negative because the parent's history of a fall from the sofa adequately explains the bruise on the ear of the child"],"a":3,"e":"TEN-4-FACESp flags bruising on the torso, ear, or neck, bruising anywhere on infants younger than 5 months, bruising on the frenulum, angle of the jaw, fleshy cheek, eyelid, or subconjunctiva, and patterned bruising. Any one positive item increases the likelihood of abuse. The rule applies to children younger than 4 years.","k":"One positive TEN-4-FACESp item calls for an abuse evaluation."},{"n":489,"g":38,"q":"A 4-month-old, not yet mobile, has a single small bruise on the shin. The caregiver reports no injury. How does the TEN-4-FACESp rule treat this?","o":["It is negative, because the shin is an ordinary bruising site and the bruise is small and isolated","It is not applicable to infants","It is negative, because the bruise is small","It is a positive screen, because any bruise in an infant younger than 5 months is positive","It is positive only if the bruise is on the torso"],"a":3,"e":"In the FACESp version, bruising anywhere on a child younger than 5 months is a positive item. The rule had a sensitivity of 96% and specificity of 87% in the derivation cohort.","k":"Any bruise in a nonmobile infant is concerning."},{"n":490,"g":38,"q":"A 32-year-old woman says she was strangled by her partner two hours ago. She has a hoarse voice, facial petechiae, and a normal neurologic examination. Which imaging is the best choice for her vessels?","o":["Carotid Doppler ultrasound alone","No imaging because the neurologic examination is normal","MRI of the lumbar spine","A plain neck radiograph","CT angiography of the carotid and vertebral arteries"],"a":4,"e":"Voice change and petechiae are triggers for imaging after nonfatal strangulation. CT angiography is the gold standard for the vessels. Carotid Doppler ultrasound is not recommended because it is least sensitive and cannot assess the vertebral arteries.","k":"Image the neck vessels with CT angiography after serious strangulation."},{"n":491,"g":38,"q":"Which imaging modality is NOT recommended for evaluating the vessels after nonfatal strangulation?","o":["Carotid Doppler ultrasound","MRA of the neck","MRI of the brain for stroke symptoms","CT of the neck with contrast","CT angiography of the carotid and vertebral arteries"],"a":0,"e":"Carotid Doppler ultrasound is the least sensitive study and cannot adequately evaluate the vertebral arteries or the proximal internal carotid. CT angiography is the gold standard for vessels, and MRI is best for soft tissue and the brain.","k":"Do not use carotid ultrasound to exclude strangulation vascular injury."},{"n":492,"g":38,"q":"An 8-year-old boy has his permanent upper incisor knocked out on a playground. It is on the grass, and he is calm. What is the best immediate step?","o":["Rinse it gently with saline, then reimplant it at once and splint","Wait for radiographs before touching the tooth, and then decide on reimplantation","Place it in tap water until a dentist can see him later today","Send the family to a dentist tomorrow with the tooth wrapped in a tissue","Scrub the root with soap to remove dirt, then store it dry in a tissue"],"a":0,"e":"Reimplantation within 60 minutes gives the best survival of a permanent avulsed tooth. Gently rinse with saline, avoid scrubbing, and splint after replantation, with dental follow-up within 24 hours.","k":"Reimplant an avulsed permanent tooth as soon as possible."},{"n":493,"g":38,"q":"A permanent tooth is knocked out and cannot be replanted at the scene. Which storage choice is best until the child reaches the emergency department?","o":["Cold milk","Orange juice","Rubbing alcohol","Tap water","Dry gauze"],"a":0,"e":"If immediate replantation is not possible, Hank's balanced salt solution is ideal and cold milk is acceptable. Saliva is a short-term fallback. Tap water and dry storage damage the root surface cells.","k":"Store an avulsed tooth in milk or saline, never in tap water."},{"n":494,"g":38,"q":"A 30-year-old man's right hand is amputated at the wrist in a press. The part is retrieved. Which preservation method is best?","o":["Wrap it in thin cloth, seal it in a bag, and place it on ice without direct contact","Immerse it in warm saline and keep it at body temperature until surgery","Leave it at room temperature in a clean cloth and place it in a dry bag","Place it directly on dry ice in a sealed container to keep it as cold as possible and prevent any decay","Soak it in alcohol before bagging it, then keep it on ice"],"a":0,"e":"Cooling extends the tolerable ischemia time. The part is wrapped in thin cloth and sealed in a bag on ice, never in direct contact with ice, which could freeze tissue. Prolonged warm ischemia of more than 6 hours with muscle bulk is a contraindication to replantation.","k":"Cool the amputated part without freezing it."},{"n":495,"g":38,"q":"A 52-year-old man has an open globe injury with a metallic foreign body inside the eye on CT. Which antibiotic combination is recommended in the source reviewed?","o":["Levofloxacin alone","No antibiotics until the foreign body is removed","Ceftazidime plus vancomycin","Topical gentamicin alone","Oral amoxicillin alone"],"a":2,"e":"When an intraocular foreign body is present, ceftazidime plus vancomycin is the recommended regimen, with ciprofloxacin plus vancomycin for penicillin allergy. Endophthalmitis risk is higher with a retained foreign body.","k":"An intraocular foreign body raises endophthalmitis risk and changes antibiotic choice."},{"n":496,"g":39,"q":"A 2-year-old girl is brought in crying after being pulled up by her hand when she tripped. She holds the arm still, refuses to supinate, and has no swelling, bruising, or bony tenderness. What is the best next step?","o":["Attempt reduction with a hyperpronation maneuver, without radiographs first","Order a CT scan of the elbow","Discharge with a sling and no reduction","Place a long arm cast for two weeks","Obtain elbow radiographs and an orthopedic consultation before attempting any maneuver in a child"],"a":0,"e":"This is the classic story and findings of radial head subluxation, a clinical diagnosis that needs no imaging before reduction. Hyperpronation had a first attempt success of 94% versus 69% for supination in the source reviewed.","k":"Reduce a classic nursemaid's elbow without imaging."},{"n":497,"g":39,"q":"A child has had a reduction of nursemaid's elbow with a pronation maneuver. Which finding after the procedure indicates success?","o":["The child begins using the arm normally within about 30 minutes","The child still holds the arm still and will not move it after an hour","The child needs radiographs in every case","The elbow is placed in a rigid splint for a week","The child remains tender at the radial head and is sent home"],"a":0,"e":"After successful reduction, the child uses the arm spontaneously and has full motion within about 30 minutes. If the child will not use the arm after multiple attempts, obtain radiographs and consider fracture. No immobilization is needed after a successful reduction.","k":"Return of spontaneous use confirms a successful reduction."},{"n":498,"g":39,"q":"A 3-year-old has failed two reduction attempts for suspected radial head subluxation and still will not use the arm. What is the next step?","o":["Apply a long arm cast without imaging","Give sedation and manipulate the elbow forcefully until it clicks, then discharge without imaging","Attempt the same maneuver ten more times","Discharge with reassurance and no imaging","Obtain radiographs and consider another diagnosis such as a fracture"],"a":4,"e":"Imaging is indicated when the story is unclear or reduction fails after multiple attempts, because a fracture, such as a Salter-Harris injury, may be present.","k":"Image a child's elbow when reduction fails."},{"n":499,"g":39,"q":"A 28-year-old man has a seizure and then has severe shoulder pain. The arm is held internally rotated and adducted, the anterior shoulder looks flat, and he cannot rotate or abduct the arm. What is the most likely diagnosis?","o":["Isolated clavicle fracture with a shoulder strain","Inferior shoulder dislocation (luxatio erecta)","Posterior shoulder dislocation","Anterior shoulder dislocation","Rotator cuff tendinitis with a muscle strain"],"a":2,"e":"Posterior dislocations account for about 5% of shoulder dislocations. They follow forceful internal rotation and adduction, as in seizure or electric shock, and show a flat anterior shoulder with a prominent posterior shoulder.","k":"Think posterior shoulder dislocation after a seizure or electric shock."},{"n":500,"g":39,"q":"A 25-year-old man has an anterior shoulder dislocation. He is stable and a shoulder radiograph confirms the dislocation without fracture. Which pain control option has fewer complications and a shorter stay than procedural sedation in the source reviewed?","o":["Intra-articular lidocaine injection into the joint","General anesthesia in the operating room for every first dislocation, whatever the patient's age","No analgesia, since reduction is quick","Intramuscular haloperidol","Oral acetaminophen alone"],"a":0,"e":"The source states that intra-articular lidocaine (20 mL of 1%) had equal pain control, fewer complications, and shorter emergency department stays than procedural sedation for shoulder reduction.","k":"Intra-articular lidocaine is a safe alternative to sedation for shoulder reduction."},{"n":501,"g":39,"q":"A 62-year-old man has had a dislocated shoulder for six weeks. He presents with pain and wants it reduced in the emergency department today. What is the best approach?","o":["Reduce it using the Captain Morgan technique","Do not attempt reduction in the department; refer for operative management because of arterial injury risk","Apply traction with a weight overnight","Give an injection and send him home","Reduce it now under deep sedation using maximal traction because the delay does not change the risk of injury"],"a":1,"e":"Chronic dislocations, older than about 4 weeks, should not be reduced in the emergency department because of the risk of arterial injury. They are managed in the operating room.","k":"Do not reduce chronic shoulder dislocations in the emergency department."},{"n":502,"g":39,"q":"After reduction of a first anterior shoulder dislocation in a 19-year-old athlete, what is the best counseling about recurrence?","o":["Recurrence is impossible once the Hill-Sachs lesion forms, so no further counseling is required","Recurrence is impossible once the Hill-Sachs lesion forms","Recurrence is common in young patients, reported at about 72% under age 23","Recurrence is prevented completely by a one week sling","Recurrence is less than 2% in all age groups"],"a":2,"e":"Recurrence after shoulder dislocation is about 27% for patients older than 30 and about 72% for those under 23. A sling and swathe is used for about a week until orthopedic follow-up.","k":"Young patients have a high recurrence rate after shoulder dislocation."},{"n":503,"g":39,"q":"A 28-year-old man has a hip dislocation after a motor vehicle collision. The leg is shortened, internally rotated, and adducted. What is the most likely type, and what is the target for reduction time?","o":["Posterior dislocation, reduced within 24 hours","Anterior dislocation, which needs no reduction","Anterior dislocation, reduced within 48 hours because avascular necrosis risk is unrelated to timing","Posterior dislocation, reduced within about 6 hours to lower avascular necrosis risk","Posterior dislocation, which should wait for CT in every case"],"a":3,"e":"Posterior dislocations make up about 90% of hip dislocations, and the limb is shortened, internally rotated, and adducted. Reduction within 6 hours lowers the risk of avascular necrosis, which ranges from 5 to 40%.","k":"Reduce a dislocated native hip within about six hours."},{"n":504,"g":39,"q":"A 74-year-old woman with a prosthetic hip has a posterior dislocation of the prosthesis. She is stable and sedated. Which technique works with a prosthetic hip and needs only one provider?","o":["Forceful traction without sedation","The Captain Morgan technique","Waiting for operative reduction only","The Hippocratic method in all cases","The Allis maneuver, which needs two assistants and cannot be used for prostheses"],"a":1,"e":"The Captain Morgan technique needs only one provider, works with prosthetic hips, and lowers the risk of injury to the provider's knee. The Allis maneuver and the Waddell technique are other posterior reduction methods.","k":"The Captain Morgan technique is a one-provider option for posterior hip reduction."},{"n":505,"g":39,"q":"After a posterior hip dislocation, a patient cannot extend the great toe. Which injury is suggested?","o":["Femoral nerve injury","Spinal cord transection at L1","Sciatic nerve injury","Obturator nerve injury","Superficial peroneal nerve entrapment only"],"a":2,"e":"Sciatic nerve injury occurs in about 8 to 20% of hip dislocations. Check extensor hallucis longus function by testing toe extension, and the risk rises with delayed reduction.","k":"Test toe extension after hip dislocation to look for sciatic injury."},{"n":506,"g":39,"q":"A 6-year-old boy has a swollen foreskin retracted behind the glans that cannot be pulled forward. The glans looks dusky. What is the best initial management?","o":["Observation with warm baths and elevation for several days because swelling resolves without treatment","Cold compresses and discharge","Manual reduction after analgesia, with urology involved and dorsal slit if perfusion is threatened","Circumcision under general anesthesia in all cases at once","Antibiotics only"],"a":2,"e":"Paraphimosis traps retracted foreskin behind the glans and is a urologic emergency. Reduce it manually after analgesia and compression. If it fails and perfusion is impaired and urology is unavailable, a dorsal slit is done. Delay risks glans necrosis.","k":"Paraphimosis needs prompt reduction to protect the glans."},{"n":507,"g":39,"q":"Which adjunct has been used to reduce edema before manual reduction of paraphimosis?","o":["High dose oral corticosteroids for three days before any attempt at manual reduction","Nitroglycerin patch","Intravenous diuretics","Topical povidone iodine","Granulated sugar applied as an osmotic agent"],"a":4,"e":"Granulated sugar applied as an osmotic agent, ice packs in 3 minute intervals, hyaluronidase injection, and circumferential compression are described adjuncts. Babcock clamps with gentle traction can be used if needed.","k":"Compression and osmotic agents help reduce paraphimosis edema."},{"n":508,"g":39,"q":"A 22-year-old man with sickle cell disease has a painful erection lasting six hours. Cavernosal blood gas shows pH 7.1, pO2 25 mmHg, and pCO2 70 mmHg. What does this indicate?","o":["Nonischemic (high flow) priapism that needs only observation","A venous thrombosis of the legs","Normal arterial flow after trauma","Ischemic (low flow) priapism, which is a urologic emergency","An erection from sexual stimulation"],"a":3,"e":"Ischemic priapism shows hypoxic, hypercarbic, acidotic cavernosal blood, with pH below 7.25, pO2 below 30, and pCO2 above 60 mmHg. It is painful and can lead to necrosis. High flow priapism resembles normal arterial gas.","k":"Cavernosal gas distinguishes ischemic from nonischemic priapism."},{"n":509,"g":39,"q":"A man has ischemic priapism for five hours. Pain control and a penile nerve block are done. What is the next step in stepwise management?","o":["Apply ice to the penis for two hours at home and return only if the erection lasts for more than a day","Give oral phosphodiesterase inhibitors and discharge him after a repeat examination in the morning with a follow-up call","Start intravenous heparin and arrange an outpatient hematology review within the week","Place a Foley catheter and wait overnight to see whether the erection subsides without any other treatment","Aspirate cavernosal blood and irrigate with cold saline, then use intracavernosal phenylephrine if needed"],"a":4,"e":"After analgesia, aspirate cavernosal blood (about 25 mL, up to twice), irrigate with cold saline, then use intracavernosal phenylephrine diluted to 100 mcg/mL if needed. Monitor blood pressure and heart rate. Refractory cases need urology for a shunt.","k":"Aspiration and intracavernosal phenylephrine are the stepwise treatments."},{"n":510,"g":39,"q":"A man with sickle cell disease has ischemic priapism that does not resolve after aspiration and phenylephrine. Which statement about exchange transfusion is correct?","o":["It is contraindicated in sickle cell disease","It cures priapism within minutes in every patient, so aspiration and urology review are not needed","It cures priapism within minutes in every patient","It is associated with ASPEN syndrome, so urology consultation is still needed","It replaces the need for hydration and analgesia"],"a":3,"e":"In sickle cell priapism, give intravenous hydration, analgesia, and oxygen, and transfuse to a hematocrit above 30%. Exchange transfusion has been linked to ASPEN syndrome (priapism, exchange transfusion, and neurological events), so it does not replace urology involvement.","k":"Sickle cell priapism needs hydration and urology, and exchange transfusion has risks."},{"n":511,"g":40,"q":"A 30-year-old man ate a full meal one hour ago and needs urgent shoulder reduction under procedural sedation. A resident wants to wait six hours for fasting. What does the ACEP clinical policy cited by the source support?","o":["Ketamine sedation is the only agent allowed when not fasted","Clear liquids are forbidden for 12 hours before sedation","Six hours of fasting is required before every sedation, regardless of urgency, patient age, or the agent that is chosen for it","Aspiration risk is eliminated after four hours of fasting","Fasting time before the procedure has not been shown to reduce emesis or aspiration, so urgent procedures need not be delayed"],"a":4,"e":"ACEP found that fasting of any duration has not reduced emesis or aspiration risk during emergency procedural sedation, so the procedure need not be delayed. Some specialty societies still use 2 hours for clear liquids and 6 hours for solids, but these are not required for emergency procedures.","k":"Recent oral intake alone should not delay urgent procedural sedation."},{"n":512,"g":40,"q":"During procedural sedation, which monitoring addition detects hypoventilation earliest?","o":["Pulse oximetry a

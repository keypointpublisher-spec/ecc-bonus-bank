:root{--navy:#0E2A40;--deep:#061A2B;--or:#F78F1E;--ord:#A85E0F;--bg:#EAF0F5;--card:#fff;--ink:#0B1F30;--mut:#4A6075;--line:#D3DEE8;--ok:#1B7A4B;--okb:#E3F4EA;--bad:#B0205A;--badb:#FBE6EE;--chip:#DCE6EF;--hl:#FFF3E2;--sh:0 1px 2px rgba(6,26,43,.08),0 6px 18px rgba(6,26,43,.06)}
[data-t=dark]{--bg:#07121C;--card:#0F2335;--ink:#EAF1F7;--mut:#9FB4C6;--line:#22405A;--ok:#5FD08F;--okb:#103325;--bad:#FF7BA8;--badb:#3A1427;--chip:#173048;--hl:#2B2112;--ord:#FFA94D;--sh:none}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.os{font-family:"Oswald","Arial Narrow",Impact,sans-serif;font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin:0}
.serif{font-family:Georgia,"Source Serif 4","Times New Roman",serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--ord)}
:focus-visible{outline:3px solid var(--or);outline-offset:2px}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--or)}
.hw{max-width:1120px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.logo{width:40px;height:40px;border-radius:8px;background:var(--or);color:var(--deep);display:grid;place-items:center;font-family:Oswald,sans-serif;font-size:15px}
.brand b{display:block;font-family:Oswald,sans-serif;font-size:17px;line-height:1.05;letter-spacing:.06em;text-transform:uppercase}
.brand i{display:block;font-style:normal;font-size:11px;letter-spacing:.14em;color:#F9B15F;text-transform:uppercase}
nav{display:flex;gap:4px;margin-left:auto}
nav a{color:#D7E3EC;text-decoration:none;padding:9px 12px;border-radius:8px;min-height:44px;display:flex;align-items:center;font-size:15px;font-weight:600}
nav a[aria-current=page]{background:rgba(247,143,30,.2);color:#fff;box-shadow:inset 0 -3px 0 var(--or)}
.tb{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;min-width:44px;min-height:44px}
main{max-width:1120px;margin:0 auto;padding:22px 16px 90px}
.eyebrow{font:700 12px Oswald,sans-serif;letter-spacing:.2em;color:var(--ord);text-transform:uppercase}
h1{font-size:34px;line-height:1.1;margin:4px 0 6px}
h2{font-size:21px;margin:30px 0 12px;display:flex;align-items:center;gap:12px}
h2:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--line),transparent)}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--deep),var(--navy) 60%,#16405F);color:#fff;border-radius:18px;padding:28px;display:grid;grid-template-columns:1fr auto;gap:22px;align-items:center;border-bottom:5px solid var(--or)}
.hero h1{font-size:40px}.hero p{color:#C8D8E5;max-width:520px;margin:6px 0 18px}
.ecg{position:absolute;left:0;right:0;bottom:2px;opacity:.22;pointer-events:none}
.hero>*:not(.ecg){position:relative}
.ring{width:150px;height:150px;position:relative;text-align:center}
.ring svg{position:absolute;inset:0}
.ring div{position:absolute;inset:0;display:grid;place-content:center}
.ring b{font:700 38px Oswald,sans-serif}.ring small{font-size:11px;letter-spacing:.18em;color:#F9B15F}
.note{font-size:12px;color:#B5C8D8;margin-top:6px;max-width:170px}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:2px solid var(--navy);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 18px;min-height:46px;font-weight:700;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.p{background:var(--or);border-color:var(--or);color:#1B1004}
.btn.d{background:var(--navy);color:#fff}
.hero .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.45);color:#fff}.hero .btn.p{background:var(--or);border-color:var(--or);color:#1B1004}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--sh)}
.stat b{font:700 32px Oswald,sans-serif;display:block;line-height:1.1}.stat span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:700}
.stat small{display:block;color:var(--mut);margin-top:4px}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--or)}
.bar.ok i{background:var(--ok)}.bar.bd i{background:var(--bad)}
.cat{margin-bottom:22px}
.cat h3{font-size:15px;color:var(--mut);margin-bottom:8px;letter-spacing:.1em}
.gt{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gc{text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--chip);border-radius:12px;padding:12px 12px 10px;min-height:92px;box-shadow:var(--sh)}
.gc:hover{border-color:var(--or)}
.gc.w{border-left-color:var(--bad)}.gc.g{border-left-color:var(--ok)}.gc.m{border-left-color:var(--or)}
.gc small{font:700 11px Oswald,sans-serif;letter-spacing:.14em;color:var(--mut)}
.gc b{display:block;font-size:14px;line-height:1.3;margin:2px 0}
.gc em{font-style:normal;font-size:12px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:44px;font-size:14px;text-align:left}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:inset 0 -3px 0 var(--or)}
.opts{display:grid;gap:10px;margin:18px 0}
.opt{display:flex;gap:12px;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;align-items:flex-start}
.opt:hover:not([disabled]){border-color:var(--or);background:var(--hl)}
.opt .l{flex:none;width:32px;height:32px;border-radius:8px;background:var(--chip);display:grid;place-items:center;font:700 15px Oswald,sans-serif}
.opt[aria-pressed=true]{border-color:var(--navy);background:var(--hl)}.opt[aria-pressed=true] .l{background:var(--navy);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok .l{background:var(--ok);color:#fff}
.opt.no{border-color:var(--bad);background:var(--badb)}.opt.no .l{background:var(--bad);color:#fff}
.opt .t{flex:1}.opt .mk{font-weight:700;font-size:13px;white-space:nowrap;align-self:center}
.opt.ok .mk{color:var(--ok)}.opt.no .mk{color:var(--bad)}
.stem{font-size:20px;line-height:1.5}
.qmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--mut);font-size:13px}
.tag{background:var(--chip);border-radius:6px;padding:2px 8px;font:700 11px Oswald,sans-serif;letter-spacing:.12em}
.exp{border-left:6px solid var(--or);background:var(--card);border-radius:12px;padding:16px;margin-top:14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.kp{margin-top:10px;background:var(--navy);color:#fff;border-radius:10px;padding:12px 14px}.kp b{color:#F9B15F;font:700 12px Oswald,sans-serif;letter-spacing:.16em;display:block}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.prog{flex:1;min-width:120px;height:8px;background:var(--chip);border-radius:6px;overflow:hidden}.prog i{display:block;height:100%;background:var(--or)}
.timer{font:700 24px Oswald,sans-serif;font-variant-numeric:tabular-nums}.timer.low{color:var(--bad)}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.nv{min-height:40px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-weight:700}
.nv.a{background:var(--navy);color:#fff}.nv.f{box-shadow:inset 0 -4px 0 var(--or)}.nv.c{outline:3px solid var(--or)}
.nv.ok{background:var(--okb);color:var(--ok);border-color:var(--ok)}.nv.no{background:var(--badb);color:var(--bad);border-color:var(--bad)}
.sel,input[type=search]{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.lbl{font:700 12px Oswald,sans-serif;letter-spacing:.16em;color:var(--mut);text-transform:uppercase;display:block;margin:0 0 8px}
.flash{perspective:1000px}
.fc{min-height:300px;background:var(--card);border:2px solid var(--navy);border-radius:18px;padding:26px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--sh);border-bottom:8px solid var(--or)}
.chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}
.chart i{display:block;width:100%;max-width:34px;background:var(--chip);border-radius:4px 4px 0 0;position:relative;min-height:2px}.chart i u{position:absolute;left:0;right:0;bottom:0;background:var(--or);border-radius:4px 4px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.empty{text-align:center;color:var(--mut);padding:24px}
.foot{margin-top:40px;color:var(--mut);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
.res li{padding:10px 0;border-bottom:1px solid var(--line);list-style:none}
.res{padding:0;margin:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:50;border-bottom:3px solid var(--or)}
details.dc summary:before{content:"▸";margin-right:8px;color:var(--ord)}details.dc[open] summary:before{content:"▾"}details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
.sr{position:absolute;left:-9999px}
@media(max-width:760px){
 h1{font-size:28px}.hero{grid-template-columns:1fr;padding:20px}.hero h1{font-size:30px}.ring{width:120px;height:120px}
 .g4{grid-template-columns:1fr 1fr}.g3,.g2{grid-template-columns:1fr}
 .brand i{display:none}.hw{gap:8px}
 nav{position:fixed;bottom:0;left:0;right:0;margin:0;background:var(--navy);border-top:3px solid var(--or);justify-content:space-around;padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:30}
 nav a{flex-direction:column;justify-content:center;font-size:11px;padding:4px 6px;gap:0;min-width:56px}
 .stem{font-size:18px}.tb{margin-left:auto}
}
@media(prefers-reduced-motion:no-preference){.opt,.btn,.gc{transition:border-color .15s,background .15s}}
@media print{header,nav,.btns{display:none}}

es exposure","c":"ENVIRONMENTAL DISORDERS","a":196,"b":206},{"id":17,"t":"Ear, nose, mouth, and throat emergencies beyond the airway infections","c":"HEAD, EAR, EYE, NOSE AND THROAT DISORDERS","a":207,"b":217},{"id":18,"t":"Eye and orbital emergencies beyond the red eye","c":"HEAD, EAR, EYE, NOSE AND THROAT DISORDERS","a":218,"b":228},{"id":19,"t":"Bleeding, hemolysis, and transfusion emergencies","c":"HEMATOLOGIC DISORDERS","a":229,"b":244},{"id":20,"t":"Checkpoint inhibitor toxicity, cytokine release syndrome, vasculitis, and drug allergy labels","c":"IMMUNE SYSTEM DISORDERS","a":245,"b":255},{"id":21,"t":"HIV, sexually transmitted infections, and opportunistic infections","c":"SYSTEMIC INFECTIOUS DISORDERS","a":256,"b":268},{"id":22,"t":"Bacterial, viral, and postinfectious emergencies","c":"SYSTEMIC INFECTIOUS DISORDERS","a":269,"b":280},{"id":23,"t":"Tick-borne, zoonotic, and travel-related infections","c":"SYSTEMIC INFECTIOUS DISORDERS","a":281,"b":293},{"id":24,"t":"Joint, bone, and back conditions in the emergency department","c":"MUSCULOSKELETAL DISORDERS (NON-TRAUMATIC)","a":294,"b":309},{"id":25,"t":"Vertigo, Transient Ischemic Attack, and Other Neurologic Emergencies","c":"NERVOUS SYSTEM DISORDERS","a":310,"b":319},{"id":26,"t":"Headache and Intracranial Pressure Syndromes","c":"NERVOUS SYSTEM DISORDERS","a":320,"b":330},{"id":27,"t":"Neuromuscular and Cranial Nerve Emergencies","c":"NERVOUS SYSTEM DISORDERS","a":331,"b":342},{"id":28,"t":"Obstetric and Gynecologic Emergencies Beyond the Core Chapters","c":"OBSTETRICS AND GYNECOLOGY","a":343,"b":358},{"id":29,"t":"Medical emergencies in psychiatric and substance use presentations","c":"PSYCHOBEHAVIORAL DISORDERS","a":359,"b":369},{"id":30,"t":"Urogenital and Renal Emergencies Beyond the Core Chapters","c":"RENAL AND UROGENITAL DISORDERS","a":370,"b":385},{"id":31,"t":"Pulmonary Infections and Pulmonary Hypertension","c":"THORACIC-RESPIRATORY DISORDERS","a":386,"b":399},{"id":32,"t":"Pediatric and Upper Airway Respiratory Emergencies","c":"THORACIC-RESPIRATORY DISORDERS","a":400,"b":411},{"id":33,"t":"Pneumothorax, Mediastinal Air, Altitude Illness, and Tracheostomy Emergencies","c":"THORACIC-RESPIRATORY DISORDERS","a":412,"b":423},{"id":34,"t":"Poisonings: Autonomic and Cardiac Drugs","c":"TOXICOLOGIC DISORDERS","a":424,"b":434},{"id":35,"t":"Poisonings: Metals, Metabolic Toxins, and Procedural Toxicity","c":"TOXICOLOGIC DISORDERS","a":435,"b":445},{"id":36,"t":"Trauma: limb, vascular, and genitourinary injuries","c":"TRAUMATIC DISORDERS","a":446,"b":462},{"id":37,"t":"Trauma: neck, face, and eye injuries","c":"TRAUMATIC DISORDERS","a":463,"b":479},{"id":38,"t":"Trauma: special mechanisms and populations","c":"TRAUMATIC DISORDERS","a":480,"b":495},{"id":39,"t":"Orthopedic reductions and genitourinary procedures","c":"PROCEDURES AND SKILLS","a":496,"b":510},{"id":40,"t":"Procedural sedation and local anesthesia","c":"PROCEDURES AND SKILLS","a":511,"b":525},{"id":41,"t":"Wound, soft tissue, and resuscitative procedures","c":"PROCEDURES AND SKILLS","a":526,"b":539},{"id":42,"t":"Patient safety, ethics, and systems-based practice","c":"OTHER COMPONENTS","a":540,"b":550}],"qs":[{"n":1,"g":1,"q":"An 82-year-old woman is screened with the three STEADI key questions. Which answer makes her screen positive for fall risk?","o":["A score of 2 on a depression questionnaire alone","Yes to all three questions together only","Yes to any one of the three questions","Yes to a fall more than 5 years ago and nothing else","A body mass index above 25 with no symptoms"],"a":2,"e":"In the STEADI algorithm, a yes to any one of the three key questions (unsteady when standing or walking, worries about falling, or has fallen in the past year) identifies a patient at risk, who then gets gait, strength, and balance testing.","k":"Any one yes on the three STEADI questions is a positive fall-risk screen."},{"n":2,"g":1,"q":"An 88-year-old man with dementia is brought in after being found on the floor. He cannot give a history and his physical examination looks unremarkable. Which statement is most accurate?","o":["Only laboratory tests should be ordered because imaging adds radiation risk","Injuries are always obvious because older adults report pain reliably to the staff","History may be unreliable and the examination can miss injuries, so image early","A normal examination excludes injury in a patient who cannot report pain well","Imaging is never helpful after an unwitnessed fall in a patient with dementia"],"a":2,"e":"Identifying injuries comes first after a fall. History may be unreliable in cognitive impairment, and examination can produce false negatives. When injury status cannot be determined and suspicion remains high, a whole-body CT can be considered.","k":"In cognitively impaired fallers, a normal exam does not exclude injury."},{"n":3,"g":1,"q":"A 79-year-old woman on aspirin and clopidogrel falls and strikes her head. She feels well and the neurologic examination is normal. Which factor raises the risk of an intracranial bleed?","o":["Taking combined antiplatelet therapy","A normal body mass index","Taking acetaminophen","Taking vitamin D","Having fallen indoors rather than outdoors"],"a":0,"e":"Older adults taking combined antiplatelet therapy have a higher risk of intracranial bleeding after a fall, so head imaging deserves a low threshold even when the examination looks normal.","k":"Combined antiplatelet therapy raises the risk of intracranial hemorrhage after a fall."},{"n":4,"g":1,"q":"A 75-year-old woman with a normal vitamin D level asks if daily supplements will prevent falls. Which statement reflects the evidence in the review?","o":["Supplements are the strongest single intervention to prevent falls in older adults","Supplements reduce falls by half even in people with normal vitamin D levels","Supplements did not reduce falls in people without deficiency","Vitamin D should never be given even when a documented deficiency is present","Falls in this age group are caused mainly by an excess of vitamin D intake"],"a":2,"e":"A nationwide study of over 25,000 people without vitamin D deficiency found no reduction in falls with supplementation. CDC guidance recommends treating deficiency, and exercise and multicomponent programs remain the main interventions.","k":"Vitamin D prevents falls only when a deficiency is corrected."},{"n":5,"g":1,"q":"A 77-year-old man has a positive fall-risk screen. Timed Up and Go and balance testing show poor gait, strength, and balance. What does STEADI recommend?","o":["Referral to physical therapy or an exercise program such as Tai Chi","Immediate nursing home placement without any further assessment of her home","A prolonged period of bed rest until the balance problem has resolved","Prescription of a benzodiazepine to ease her anxiety about falling again","A CT scan of the chest to look for a cause of her unsteadiness"],"a":0,"e":"For patients with poor gait, strength, or balance, STEADI advises referral to physical therapy or an evidence-based exercise or fall prevention program such as Tai Chi. Reassessment is planned in 30 to 90 days.","k":"Poor gait or balance in a faller calls for exercise or physical therapy."},{"n":6,"g":1,"q":"An 84-year-old woman falls repeatedly. She takes an anticholinergic bladder medication, a sedative-hypnotic, and an antihypertensive. What is the most useful medication-related step?","o":["Add a second sedative to improve her sleep at night and reduce nocturnal falls","Review the list using the Beers Criteria and reduce fall-risk drugs","Stop all of her medicines at once without any review of what each is for","Start a stimulant medication to improve her balance during the daytime","Continue every drug as prescribed and simply add a walker for safety"],"a":1,"e":"STEADI advises reviewing medications for fall risk using the Beers Criteria and stopping, switching, or reducing doses of drugs that raise risk. Anticholinergics can also affect vision.","k":"Deprescribe fall-risk drugs using the Beers Criteria."},{"n":7,"g":1,"q":"An 86-year-old woman has been less alert and has fallen twice in two days. Her temperature is 36.8 C and her white cell count is normal. Which interpretation is the most appropriate?","o":["The normal white cell count rules out sepsis in this age group","Infection can occur without fever or leukocytosis, so search for a source","The cause is certainly psychiatric because the temperature is normal","The normal temperature excludes infection in an older woman who has fallen","A fall is never a sign of infection and should be considered separately"],"a":1,"e":"Older adults often lack fever, and sepsis may occur without the usual leukocytosis. Falls, reduced intake, confusion, and a change in functional status are warning signs and should prompt a search for infection in the urinary, respiratory, skin, and gastrointestinal systems.","k":"Do not rely on fever to rule out infection in older adults."},{"n":8,"g":1,"q":"A 79-year-old woman with diabetes has two days of fatigue, nausea, and worsening shortness of breath. She has no chest pain. Which diagnosis should be considered?","o":["Gastroenteritis alone because chest pain is absent from her history","An allergic reaction to a recent medication change in the past week","Acute coronary syndrome without chest pain","Dehydration alone because she is nauseated and fatigued today","Anxiety alone because of her age and sex and the vague symptoms"],"a":2,"e":"Most myocardial infarctions in older adults occur without chest pain, with fatigue, nausea, or shortness of breath. Atypical symptoms are an independent predictor of in-hospital mortality, so an ECG and troponin are indicated.","k":"In older adults, myocardial infarction often presents without chest pain."},{"n":9,"g":1,"q":"An 83-year-old man has mild diffuse abdominal discomfort and constipation. His abdomen is soft with no guarding. Which approach is most appropriate?","o":["Discharge with a laxative and advice to return if pain worsens","Avoidance of imaging because of his age and the radiation exposure","Reliance on the white cell count to decide whether imaging is needed","Reassurance because there are no peritoneal signs on examination","A low threshold for CT of the abdomen"],"a":4,"e":"In older adults peritoneal signs may be absent because of decreased pain perception, appendicitis can present with diffuse rather than localized pain, and CT is the modality of choice with a low threshold for use.","k":"Absent peritoneal signs do not exclude a surgical abdomen in older patients."},{"n":10,"g":1,"q":"A 76-year-old man taking metoprolol and diltiazem has a heart rate of 82 and a blood pressure of 110/60. He is lethargic and has a temperature of 38.5 C. Which interpretation is most appropriate?","o":["A heart rate of 82 excludes sepsis in any patient with a temperature this high","A pulse of 82 may be falsely reassuring since the drugs can mask tachycardia","Beta blockers do not alter the heart rate response to infection at all","His blood pressure of 110/60 is hypertensive for a man of his age","Rate-slowing drugs improve outcomes in sepsis and so are always continued"],"a":1,"e":"Beta blockers and calcium channel blockers can mask tachycardia, so a reassuring pulse should be interpreted against the medication list in an ill older patient.","k":"Rate-slowing drugs can hide tachycardia in older patients."},{"n":11,"g":1,"q":"A 90-year-old woman in a nursing home has new confusion and has received a fluoroquinolone for a urinary infection 2 days ago. What should be considered?","o":["Vitamin B12 excess from her daily multivitamin tablet","A conversion disorder triggered by the recent hospitalization and stress","Alcohol withdrawal even though she has been in a nursing home for months","Drug-induced delirium from the fluoroquinolone and the infection itself","A first presentation of primary dementia with no other contributing factor"],"a":3,"e":"A change in mental status is often one of the first signs of acute illness in an older adult, urinary tract sepsis often presents as altered mental status, and fluoroquinolones can precipitate delirium. Dementia and delirium also limit the history.","k":"Consider drug-induced delirium when new confusion follows a fluoroquinolone."},{"n":12,"g":2,"q":"A 40-day-old boy has a rectal temperature of 38.3 C at home. He feeds well and is playful. Which set of results classifies him as low risk by the PECARN febrile infant rule?","o":["A normal urinalysis and a temperature below 39 C with no other testing at all","A normal white cell count, a normal platelet count, and a negative blood culture at 6 hours","A normal chest radiograph, a normal CRP, and a negative nasal swab for influenza","A normal lumbar puncture and a negative urine culture at 24 hours without blood tests","A normal urinalysis, an ANC of 4,090 or less, and a procalcitonin of 1.71 or less"],"a":4,"e":"The PECARN rule for febrile infants 60 days old or younger calls an infant low risk when the urinalysis is normal, the absolute neutrophil count is 4,090 per microliter or less, and procalcitonin is 1.71 ng/mL or less. Sensitivity was 97.7% with a negative predictive value of 99.6%.","k":"PECARN low risk needs a normal urinalysis, ANC at or below 4,090, and procalcitonin at or below 1.71."},{"n":13,"g":2,"q":"A well-appearing, term 14-day-old girl has a rectal temperature of 38.4 C. Which approach is recommended by the 2021 AAP guideline for febrile infants 8 to 21 days old?","o":["Blood culture only, with oral antibiotics and next-day review in the clinic","Lumbar puncture only when the procalcitonin is above 0.5 ng/mL on the first draw","Observation at home with a call from the clinic at 24 hours after discharge","Urinalysis, urine and blood cultures, lumbar puncture, parenteral antibiotics, and admission","Urinalysis and a procalcitonin only, with discharge if both are normal and he feeds well at home"],"a":3,"e":"For infants 8 to 21 days old the guideline calls for a full evaluation: urinalysis, urine and blood cultures, lumbar puncture, an assessment of herpes simplex risk, parenteral antimicrobials, and admission. Children's Mercy applies lumbar puncture regardless of inflammatory markers in this age band.","k":"Febrile infants 8 to 21 days old get the full sepsis workup and admission."},{"n":14,"g":2,"q":"A well-appearing 25-day-old boy has a rectal temperature of 38.2 C. His urinalysis is normal. His procalcitonin is above the abnormal threshold. What does the AAP guideline for infants 22 to 28 days old advise?","o":["A repeat temperature at home and review in 1 week","No further testing because only the urine can be a source in this age group","An abnormal inflammatory marker should prompt a lumbar puncture","Discharge because the urinalysis is normal and the infant looks well","A chest radiograph to exclude pneumonia before any other test"],"a":2,"e":"For 22 to 28 days the guideline uses a tailored approach: inflammatory markers are obtained, procalcitonin with absolute neutrophil count is preferred, and any abnormal marker prompts lumbar puncture. A positive source calls for admission, and unsuccessful or deferred lumbar puncture also leads to admission.","k":"In the 22 to 28 day group, an abnormal inflammatory marker prompts a lumbar puncture."},{"n":15,"g":2,"q":"A well-appearing 45-day-old girl has a temperature of 38.2 C. Her urinalysis and inflammatory markers are negative. Her parents have a phone and a car. Which plan fits the guideline for infants 29 to 60 days old?","o":["A repeat blood culture at 72 hours with no earlier visit","A CT of the head before discharge","Observation at home with reevaluation at 24 hours","Mandatory lumbar puncture and 48 hours of admission","Routine empiric antibiotics for 7 days at home"],"a":2,"e":"For 29 to 60 days, infants with a negative urinalysis and negative inflammatory markers may be observed at home. The parents and clinician should agree on reliable phone and transport, willingness to watch and report changes, and reevaluation at 24 hours.","k":"A well infant aged 29 to 60 days with negative urinalysis and markers may go home with 24 hour reevaluation."},{"n":16,"g":2,"q":"A 38-day-old infant has a rectal temperature of 38.7 C and otherwise looks well. His urinalysis is negative. Which statement about the temperature is correct under the AAP guideline?","o":["Only a temperature above 40 C counts as abnormal","Temperature has no role in the guideline once the urinalysis is normal","The temperature should be rechecked only after antipyretic dosing","A rectal temperature above 38.0 C is the only measure used","A temperature above 38.5 C counts as an abnormal inflammatory marker"],"a":4,"e":"In the guideline summary, a temperature above 38.5 C is treated as a positive inflammatory marker, and infants with a temperature above 38.5 C are excluded from the reasoning that allows limited evaluation when urinalysis and markers are negative.","k":"A temperature above 38.5 C counts as an abnormal marker in febrile infants."},{"n":17,"g":2,"q":"A 33-day-old has a rectal temperature of 38.3 C. Which laboratory result is an abnormal inflammatory marker under the AAP guideline summary?","o":["A platelet count of 310,000 per microliter","A C-reactive protein of 28 mg/L","A normal white cell count","A procalcitonin of 0.3 ng/mL","A C-reactive protein of 12 mg/L"],"a":1,"e":"The summary lists procalcitonin above 0.5, C-reactive protein above 20 mg/L, and a high absolute neutrophil count as abnormal markers. Procalcitonin is preferred. Total white cell count is not considered useful for risk stratification.","k":"Procalcitonin above 0.5 or CRP above 20 mg/L is abnormal in the febrile infant."},{"n":18,"g":2,"q":"A 20-day-old infant is febrile and has a vesicle on the scalp. Which infant finding is a trigger to evaluate for and consider empiric treatment of herpes simplex virus?","o":["A urinalysis with 2 white cells per high power field","Skin vesicles on the infant","A history of a normal term vaginal delivery with no maternal fever","Weight gain that follows the growth curve","A mild nasal congestion"],"a":1,"e":"The herpes triggers include maternal genital lesions or maternal fever around delivery and infant vesicles, seizures, hypothermia, mucous membrane ulcers, CSF pleocytosis without a positive Gram stain, leukopenia, thrombocytopenia, and a raised ALT. Workup includes CSF PCR, surface swabs, ALT, and blood PCR.","k":"Skin vesicles in a febrile infant should trigger herpes testing and treatment."},{"n":19,"g":2,"q":"A 35-day-old febrile infant has a urinalysis collected by bag. It is negative for leukocyte esterase and white cells. What does the AAP guidance say about a catheterized urine culture?","o":["It is not needed if the urinalysis is negative for esterase and white cells","It should be replaced by a urine dipstick for nitrite alone in all cases","It is required only after a positive blood culture has been reported","It is always required in every febrile infant regardless of the urinalysis result","It must be collected only after the first dose of antibiotics has been given"],"a":0,"e":"For infants 29 days or older, urine may be collected by bag, spontaneous void, or stimulated void. If urinalysis is negative for leukocyte esterase and white cells, a catheterized urine culture is not needed.","k":"A negative urinalysis spares the catheterized culture in infants 29 days and older."},{"n":20,"g":2,"q":"Which change in terminology did the 2021 AAP febrile infant guideline recommend?","o":["Report only meningitis as a bacterial outcome since the others are minor illnesses","Use the term occult sepsis for all febrile infants regardless of the findings","Avoid any mention of bacteremia in the chart until the culture has turned positive","Replace blood cultures with serum procalcitonin for every infant in the group","Discuss urinary infection, bacteremia, and meningitis separately"],"a":4,"e":"The guideline advises replacing the grouped term serious bacterial infection with separate discussion of urinary tract infection, bacteremia, and bacterial meningitis, since each has a different risk and each leads to a different treatment course.","k":"Name the specific infection rather than saying serious bacterial infection."},{"n":21,"g":2,"q":"Which infant is outside the population covered by the AAP febrile infant guideline?","o":["A 25-day-old term infant with a documented rectal temperature of 38.0 C at triage","A 36-day-old born at 33 weeks of gestation with a temperature of 38.4 C","A 50-day-old term infant who had fever at home and looks well to the examiner","A 12-day-old term infant with fever in the clinic and no source of infection","A 36-day-old term infant with a rectal temperature of 38.4 C measured at home"],"a":1,"e":"The guideline covers well-appearing, term, otherwise healthy infants aged 8 to 60 days with fever of 38.0 C or more and no source. Preterm infants, those who do not look well, or those with risk factors for infection need a full evaluation instead.","k":"The febrile infant guideline excludes preterm and ill-appearing infants."},{"n":22,"g":2,"q":"A well-appearing 26-day-old febrile infant has a lumbar puncture that shows pleocytosis, and the CSF enterovirus PCR is positive. The caregivers are reliable. What does the guideline allow?","o":["Antibiotics must continue for 21 days regardless of the PCR result in any infant","Add acyclovir for 14 days in all patients with a positive enterovirus PCR","Antibiotics may be withheld or stopped, with discharge at 24 hours","Discharge immediately without any follow-up since enterovirus is a mild virus","Repeat lumbar puncture every day until the CSF cell count has become normal"],"a":2,"e":"For infants 22 to 28 days old, a positive CSF enterovirus PCR allows antibiotics to be withheld or stopped, with discharge at 24 hours if the other home criteria are met: a reliable phone and transport and parental willingness to observe.","k":"A positive CSF enterovirus PCR in a 22 to 28 day old can permit stopping antibiotics."},{"n":23,"g":2,"q":"A 5-day-old infant has a rectal temperature of 38.5 C. Parents report a mild cough in a sibling. What is the best first step?","o":["Full sepsis evaluation, antibiotics, and admission","Antipyretics and observation for 4 hours before any testing is done","Oral antibiotics and next-day review with the pediatrician","Reassure and discharge with a home thermometer and a call tomorrow","A viral swab alone with discharge only if the result is positive"],"a":0,"e":"Fever of 38.0 C or higher in a neonate in the first weeks of life is treated as a medical emergency. The guideline's 8 to 21 day pathway already calls for a full evaluation and admission, and younger infants are managed even more conservatively because infection risk is highest.","k":"Fever in a neonate needs a full evaluation and antibiotics."},{"n":24,"g":3,"q":"In a prospective cohort of 190 patients evaluated for palpitations, which category was the most frequently identified cause?","o":["Medication or street drug effect","Anxiety or panic disorder alone","Thyroid disease","A cardiac cause, mostly arrhythmia","No cause was found in most patients"],"a":3,"e":"In the cohort a cause was found in 84%: cardiac in 43% (arrhythmia 40%), anxiety or panic disorder in 31%, drugs in 6%, other noncardiac causes in 4%, and no cause in 16%. Panic and arrhythmia can coexist, so arrhythmia is excluded first.","k":"A cardiac cause, usually an arrhythmia, is the most common finding in palpitations."},{"n":25,"g":3,"q":"A 52-year-old man has palpitations and one episode of near-fainting. His father died suddenly at 44. Which feature most increases concern for a serious arrhythmia?","o":["Palpitations that only occur at rest after drinking several cups of coffee a day","Palpitations that settle after lying on the left side","Near-syncope with the palpitations and a family history of sudden death","Palpitations in a person who jogs 5 times a week","A single skipped beat once a week without other symptoms"],"a":2,"e":"Palpitations accompanied by dizziness, near-syncope, or syncope suggest tachyarrhythmia and are more serious. Organic or structural heart disease and a family history of arrhythmia, syncope, or sudden death also raise the risk.","k":"Palpitations with near-syncope or a family history of sudden death are red flags."},{"n":26,"g":3,"q":"A 34-year-old woman has palpitations about once a month that last 10 to 20 minutes. A 12-lead ECG at rest is normal. Which monitoring option is most appropriate?","o":["A single exercise stress test for all patients","A repeat resting ECG at the next visit","No monitoring because the ECG was normal","A 2-week continuous loop or event monitor","A 24-hour Holter monitor only"],"a":3,"e":"For palpitations less often than daily, a 2-week event monitor is advised. Event monitors give a diagnosis in 66% to 83% compared with 33% to 35% for Holter monitoring, and daily symptoms are the setting where a 24 to 48 hour Holter is suitable.","k":"Infrequent palpitations need an event monitor, not a 24 hour Holter."},{"n":27,"g":3,"q":"A 27-year-old man describes rapid, regular pounding in his neck that has happened since childhood and stops when he bears down. Which rhythm is the most likely explanation?","o":["Ventricular tachycardia from cardiomyopathy","Frequent isolated ventricular premature beats","Supraventricular tachycardia","Atrial fibrillation with a rapid ventricular response","Sinus tachycardia from anxiety"],"a":2,"e":"Rapid regular pounding in the neck, onset in childhood, and termination with vagal maneuvers all point to supraventricular tachycardia. Irregular rapid palpitations suggest atrial fibrillation, and single skipped beats are usually benign ectopy.","k":"Childhood onset and termination with vagal maneuvers point to SVT."},{"n":28,"g":3,"q":"A 24-year-old woman reports a fluttering feeling and a skipped beat. Auscultation reveals a midsystolic click. Which diagnosis best explains the finding?","o":["Pericarditis","Aortic stenosis","Atrial septal defect","Mitral valve prolapse","Hypertrophic cardiomyopathy"],"a":3,"e":"A midsystolic click is a listed clue to mitral valve prolapse in the palpitations workup. Echocardiography is indicated when the examination or ECG suggests structural heart disease.","k":"A midsystolic click suggests mitral valve prolapse."},{"n":29,"g":3,"q":"A 30-year-old woman has frequent palpitations with a sense of impending doom. A screening questionnaire for panic disorder is positive. What should be done before the symptoms are attributed to panic?","o":["A trial of beta-blocker alone without an ECG","Referral for treatment only after 3 months of symptoms","Nothing more is needed because panic disorder is excluded only by a psychiatrist","Arrhythmia must be excluded first, since panic and arrhythmia can coexist","A cardiac catheterization in all patients"],"a":3,"e":"A panic questionnaire score above 21 is 81% sensitive and 80% specific for panic disorder, but the two conditions can coexist. A history, examination, and 12-lead ECG are done in all patients, with laboratory tests such as CBC, electrolytes, and TSH as indicated.","k":"Exclude arrhythmia before labeling palpitations as panic."},{"n":30,"g":3,"q":"A 58-year-old man comes for a medication refill. His blood pressure is 192/112 mm Hg. He has no headache, chest pain, vision change, or neurologic symptoms. Which ACEP position applies to this asymptomatic patient?","o":["All patients should have a head CT","All patients should be admitted for 24 hours","Routine screening for acute target organ injury is not required","Creatinine, urinalysis, and ECG must be done in all such patients","Intravenous nicardipine is required to lower the pressure within an hour"],"a":2,"e":"The ACEP policy (Level C, panel consensus) states that asymptomatic patients with markedly elevated blood pressure do not need routine screening for target organ injury such as creatinine, urinalysis, and ECG.","k":"Asymptomatic markedly high blood pressure does not need routine end-organ screening in the ED."},{"n":31,"g":3,"q":"A 61-year-old woman has asymptomatic blood pressure of 188/108 mm Hg and says she has no regular doctor and cannot attend a clinic. Which action is consistent with the ACEP guidance?","o":["Admit her to the ICU for an arterial line","Send her home with no instructions because no ED action is permitted","Give a rapid intravenous infusion to normalize the pressure within one hour","Consider starting long-term therapy and arrange outpatient follow-up","Give immediate nifedipine under the tongue"],"a":3,"e":"Routine ED medical intervention is not required, but select patients such as those with poor follow-up may be treated or started on long-term therapy, and all patients should be referred for outpatient follow-up whether or not treatment starts.","k":"ED treatment is optional in asymptomatic high blood pressure, but follow-up referral is always needed."},{"n":32,"g":3,"q":"An ED physician plans to normalize an asymptomatic patient's blood pressure within an hour with intravenous medication. What is the main safety argument against this approach?","o":["Rapid reduction is required by the guideline","Rapidly lowering blood pressure in asymptomatic patients can cause harm","Asymptomatic patients should be admitted","Intravenous antihypertensives are not available in most emergency departments in the country","Blood pressure always returns to normal without treatment"],"a":1,"e":"It is generally accepted that rapidly lowering blood pressure in asymptomatic patients can be harmful. Long-term control over time reduces target organ damage, morbidity, and mortality, which is a primary care goal and not a reason for emergent reduction.","k":"Do not rapidly lower asymptomatic high blood pressure."},{"n":33,"g":3,"q":"The ACEP policy treats markedly elevated blood pressure in an asymptomatic adult as which range?","o":["A mean arterial pressure over 100 mm Hg only, regardless of the systolic or the diastolic value","A diastolic over 90 mm Hg only, the stage 1 definition without any systolic criterion applied","A systolic over 220 mm Hg only, regardless of the diastolic pressure or any symptoms present","A systolic of 160 mm Hg or more, or a diastolic of 100 mm Hg or more, the stage 2 definition","A systolic over 140 mm Hg only, the stage 1 definition without any diastolic criterion applied"],"a":3,"e":"The policy used the JNC 7 stage 2 hypertension definition: systolic 160 or higher or diastolic 100 or higher. A reading of 190/115 meets it.","k":"ACEP marked elevation means stage 2 range, 160 or 100 and above."},{"n":34,"g":3,"q":"A 45-year-old man has an asymptomatic blood pressure of 176/104 mm Hg at a screening visit. In the ED, which statement is accurate about this population?","o":["ED visits for blood pressure should never be accompanied by outpatient referral or follow-up","Starting therapy may be considered in special populations such as those with poor follow-up","Only patients above 65 years of age can be treated","The blood pressure should be lowered to 120/80 mm Hg before the patient is discharged home","Every patient needs immediate antihypertensive therapy"],"a":1,"e":"Asymptomatic patients with markedly elevated pressures need neither screening studies nor acute treatment. Starting long-term therapy can be considered in special populations, such as those unlikely to follow up.","k":"Consider starting therapy only in selected asymptomatic patients, such as those with poor follow-up."},{"n":35,"g":4,"q":"A 31-year-old woman faints after standing for an hour in a hot, crowded church. She felt warm and nauseated first, was pale, and woke within a minute with no confusion. She has no heart disease, her blood pressure is 118/74, the ECG is normal, and troponin is below the 99th percentile. Her Canadian Syncope Risk Score is minus 3. Which disposition does the score support?","o":["Discharge from the department with return precautions","Observation unit stay with serial troponins at 3 and 6 hours after arrival","Outpatient tilt table testing before she leaves the emergency department today","Admission for 24 hours of telemetry because every faint needs monitoring","Admission for an echocardiogram and an electroencephalogram to confirm the cause"],"a":0,"e":"A score of minus 2 or lower is the very low risk group, with about a 0.2% risk of a serious outcome at 30 days, and the authors state these patients can be discharged safely. Monitoring and extra testing add cost without changing the outcome in this group.","k":"A very low Canadian Syncope Risk Score supports discharge."},{"n":36,"g":4,"q":"A 67-year-old man has a syncopal episode at home. He has a history of coronary artery disease. In the department his systolic pressure is 84 mm Hg, his QTc is 490 ms, and his troponin is above the 99th percentile. Which risk score element contributes the most points to the Canadian Syncope Risk Score in this patient?","o":["A history of heart disease, which adds 3 points","A QRS duration of 100 ms, which adds 2 points","A systolic pressure below 90 mm Hg, which adds 5 points","A QTc greater than 480 ms, which adds 2 points","A male sex score, which adds 1 point"],"a":3,"e":"The score adds 2 points for a systolic pressure below 90 or above 180, 2 for troponin above the 99th percentile, 2 for QTc above 480 ms, and 1 for known heart disease. Sex and a normal QRS duration add nothing. A QRS duration above 130 ms adds only 1 point.","k":"In the Canadian Syncope Risk Score, QTc over 480 ms, abnormal troponin, and extreme blood pressure each add 2 points."},{"n":37,"g":4,"q":"A 58-year-old man had a brief faint while walking. His blood pressure is 128/76 and his ECG is normal. Which single finding makes him high risk by the San Francisco Syncope Rule?","o":["A heart rate of 54 beats per minute","A hematocrit of 28%","Age over 55 years","A systolic pressure of 150 mm Hg","A history of one prior faint 5 years ago"],"a":1,"e":"The San Francisco rule counts congestive heart failure history, hematocrit below 30%, an abnormal ECG, shortness of breath, or a systolic pressure below 90 mm Hg. Any one makes the patient high risk. Age and a prior faint are not criteria, and a pulse of 54 is not scored on its own.","k":"Any one San Francisco Syncope Rule element makes the patient high risk."},{"n":38,"g":4,"q":"A 49-year-old woman faints at work. Her ECG is normal and her heart rate is 76. Which result would, by the ROSE rule, make admission the recommended disposition?","o":["A BNP of 140 pg/mL","A hemoglobin of 8.6 g/dL","An oxygen saturation of 98% on room air","A systolic pressure of 112 mm Hg","A hemoglobin of 11.2 g/dL"],"a":1,"e":"The ROSE rule recommends admission when any of these is present: BNP of 300 pg/mL or more, hemoglobin of 9 g/dL or less, a heart rate of 50 or less, chest pain, an abnormal ECG, oxygen saturation of 94% or less, or fecal occult blood. A hemoglobin of 8.6 meets the anemia item.","k":"ROSE flags hemoglobin of 9 g/dL or less, BNP of 300 or more, bradycardia, chest pain, oxygen saturation of 94% or less, and fecal occult blood."},{"n":39,"g":4,"q":"A 36-year-old man has a normal examination after a first syncopal episode with a clear vasovagal trigger. His ECG is normal. His physician plans a broad panel of blood tests. Which statement about testing in syncope best guides the decision?","o":["Routine blood tests find the cause in about half of patients, so a full panel is justified in all","The ECG is the most useful test but finds a cause in only about 5%, so testing should follow the history","The ECG is rarely informative and should be skipped whenever the history is typical, in all patients","A full panel should be sent for all patients because 45% leave without a diagnosis, so testing is routine","Brain imaging identifies the cause in most patients and should be done first in all patients with syncope"],"a":1,"e":"In a StatPearls review, the ECG is described as the most effective diagnostic study yet is diagnostic in about 5% of cases, and routine blood tests yield a diagnosis in about 2%. Testing should follow the history and examination, not a fixed panel.","k":"Syncope testing should be targeted because routine laboratory tests rarely find the cause."},{"n":40,"g":4,"q":"A 55-year-old man loses consciousness while lying in bed at night, with no warning. He wakes quickly. Which feature of this event most strongly raises concern for a cardiac cause?","o":["Pallor with recovery within a few minutes and no confusion","An episode that followed a long period of standing in a crowd","A preceding feeling of warmth and nausea","Loss of consciousness while supine with no prodrome","Occurrence soon after a painful procedure"],"a":3,"e":"Vasovagal faints follow prolonged standing, crowding, heat, pain, or stress, are preceded by a prodrome, and recover quickly. Syncope while supine or without a prodrome suggests a cardiac or neurocardiogenic cause, and dysrhythmias such as ventricular tachycardia and critical aortic stenosis are the ominous causes.","k":"Syncope while lying down or without warning points away from a vasovagal faint."},{"n":41,"g":4,"q":"A 28-year-old man collapses and wakes after a minute. His ECG shows an RBBB pattern with coved ST elevation in leads V1 and V2. What is the most appropriate disposition?","o":["Discharge with reassurance because the ECG pattern is a normal variant in young men","Treatment for a pulmonary embolism with full anticoagulation until imaging is done","Observation for 1 hour then discharge with a driving restriction only for 2 weeks","Discharge after a normal troponin with outpatient follow-up in 6 months","Admission with continuous monitoring and electrophysiology evaluation"],"a":4,"e":"Coved ST elevation in V1 and V2 with a right bundle branch pattern is the Brugada pattern, and a patient in an ECG case series had a ventricular fibrillation arrest shortly after such a tracing. Syncope with this pattern is high risk and needs monitoring and specialist assessment.","k":"Syncope with a Brugada ECG pattern needs monitored admission."},{"n":42,"g":4,"q":"A 22-year-old athlete had a syncopal episode during a basketball game. The resting ECG shows a short PR interval and a delta wave. What is the best next step in management?","o":["Referral for electrophysiology assessment and possible ablation","A head CT to look for an intracranial cause of the collapse during exertion","A tilt table test as the first diagnostic step before any referral","Treatment as vasovagal syncope with fluids, salt, and counterpressure maneuvers","Reassurance and return to sports after 48 hours of rest and fluids"],"a":0,"e":"A short PR interval with a delta wave is the preexcitation pattern of Wolff-Parkinson-White syndrome. Syncope in a patient with this pattern is a high-risk presentation, and the patient in the case series was referred for ablation.","k":"Syncope with preexcitation needs electrophysiology referral."},{"n":43,"g":4,"q":"A 19-year-old man collapses during a sprint and recovers within a minute. The ECG shows tall voltages, a prominent R wave in V1, and Q waves in the inferolateral leads. Which bedside test is most likely to explain the syncope?","o":["Point-of-care cardiac ultrasound for septal hypertrophy","Transcranial Doppler looking for cerebral vasospasm after the collapse","Point-of-care lung ultrasound looking for bilateral B lines","A bedside carotid artery ultrasound looking for hemodynamic stenosis","A venous Doppler study of both legs looking for deep vein thrombosis"],"a":0,"e":"Exertional syncope is a high-risk history feature, and tall voltages with septal Q waves point to hypertrophic cardiomyopathy. Point-of-care ultrasound in the case series showed septal hypertrophy and made the diagnosis at the bedside.","k":"Exertional syncope with septal ECG voltages calls for an echocardiogram looking for hypertrophic cardiomyopathy."},{"n":44,"g":4,"q":"A 74-year-old woman has syncope. The ECG shows sinus rhythm, a right bundle branch block, left axis deviation, and a first-degree AV block. What should be done before discharge is considered?","o":["No further action because first-degree block is benign in every patient","A brain MRI to look for a structural cause of the loss of consciousness","A repeat troponin as the only additional test before she goes home","Lower extremity ultrasound to exclude venous thrombosis as the cause of syncope","Rhythm monitoring on telemetry or an extended event monitor"],"a":4,"e":"RBBB with left axis deviation represents bifascicular block, and with a prolonged PR interval it suggests conduction system disease that can progress to high-grade block. StatPearls suggests overnight telemetry or event monitoring for conduction abnormalities on the presenting ECG.","k":"Bifascicular block with syncope calls for rhythm monitoring."},{"n":45,"g":4,"q":"A 78-year-old man faints on standing. His blood pressure supine is 150/84 and 3 minutes after standing is 118/72. The sitting-to-standing heart rate rises from 76 to 80. What does the small heart rate rise suggest?","o":["Anxiety-related hyperventilation with reduced cerebral blood flow","Neurogenic orthostatic hypotension from autonomic impairment","Cardiac tamponade with a pericardial effusion and pulsus paradoxus","Postural orthostatic tachycardia syndrome with a large heart rate rise","Hypovolemia from occult blood loss over the past several days"],"a":1,"e":"Orthostatic hypotension is a drop of more than 20 mm Hg systolic or 10 diastolic within 3 minutes of standing. A rise in heart rate under 10 beats per minute suggests autonomic impairment, whereas a marked rise to over 100, or by more than 30, suggests hypovolemia.","k":"A blunted heart rate response to orthostatic hypotension points to autonomic failure."},{"n":46,"g":4,"q":"An 80-year-old man takes an alpha-blocker, a diuretic, and a nitrate and has had a faint on standing. How should orthostatic vital signs be measured?","o":["Blood pressure only, with no heart rate recorded at either position","After 5 minutes supine, then at 1 and 3 minutes standing","Only the standing blood pressure after 10 minutes on his feet","Once while sitting, 30 seconds after sitting up from the stretcher","Once while supine with the legs raised to 45 degrees for a minute"],"a":1,"e":"The reference approach is blood pressure and heart rate after 5 minutes lying down, then at 1 and 3 minutes of standing. A drop of more than 20 mm Hg systolic or more than 10 diastolic within 3 minutes defines orthostatic hypotension, and stopping a suspected drug can confirm the cause.","k":"Measure orthostatics supine at 5 minutes and standing at 1 and 3 minutes."},{"n":47,"g":5,"q":"A 62-year-old man has had constant vertigo with vomiting for 8 hours. He has spontaneous horizontal nystagmus and a normal neurologic examination. Which patient description matches the group in whom the HINTS examination is meant to be used?","o":["Lightheadedness on standing with a normal examination of the eyes","Brief episodes of vertigo triggered only by rolling over in bed, with no nystagmus at rest","A patient with a known peripheral cause of dizziness and no new symptoms","A patient who cannot cooperate with eye movement testing because of agitation","Acute persistent vertigo with spontaneous nystagmus and a normal neurologic examination"],"a":4,"e":"HINTS applies to acute vestibular syndrome: persistent vertigo with nystagmus and a normal neurologic examination, with onset within about 24 hours. It is not for triggered episodic vertigo such as BPPV, known peripheral causes, or patients who cannot cooperate.","k":"HINTS is for continuous vertigo with nystagmus, not for brief positional vertigo."},{"n":48,"g":5,"q":"A 58-year-old man with continuous vertigo has horizontal nystagmus. On the head impulse test, his eyes stay on the target with no corrective saccade when the head is turned either way. How should this finding be interpreted?","o":["A normal reflex in continuous vertigo is a central sign","It confirms a peripheral vestibular neuritis and so excludes stroke entirely","It confirms benign positional vertigo of the posterior semicircular canal","It shows the vestibulo-ocular reflex is damaged on one side only","It is expected in all patients with severe vertigo and can be ignored safely"],"a":0,"e":"In a peripheral lesion the head impulse test is abnormal, with a corrective saccade toward the affected side. A normal reflex in a patient with continuous vertigo and nystagmus is a central sign and raises concern for brainstem or cerebellar stroke.","k":"A normal head impulse test in continuous vertigo points to a central cause."},{"n":49,"g":5,"q":"Which nystagmus pattern in a patient with acute continuous vertigo is a central sign on the HINTS examination?","o":["Nystagmus that is suppressed with visual fixation and beats away from the lesion","Unidirectional horizontal nystagmus that beats the same way in all gaze directions","Torsional upbeating nystagmus triggered only by lying back with the head turned","No nystagmus at rest and a normal reflex","Vertical or direction-changing nystagmus"],"a":4,"e":"Reassuring peripheral findings are no nystagmus or unidirectional horizontal nystagmus. Vertical or bidirectional (direction-changing) nystagmus is a central sign. Torsional upbeating nystagmus provoked by Dix-Hallpike belongs to posterior canal BPPV, a different syndrome.","k":"Vertical or bidirectional nystagmus is a central sign."},{"n":50,"g":5,"q":"A 66-year-old woman has acute vertigo. On alternate cover testing, the eyes show a vertical misalignment that corrects when each eye is uncovered. What does this finding suggest?","o":["A normal finding that rules out stroke","A medication effect from meclizine","A peripheral vestibular lesion on the side of the lower eye","Benign positional vertigo of the posterior canal","A skew deviation, which is a central sign"],"a":4,"e":"A vertical dysconjugate gaze on the test of skew, the S in HINTS, indicates a central lesion. The skew test also helps when a head impulse test looks peripheral but is falsely abnormal.","k":"A skew deviation on alternate cover testing is a central sign."},{"n":51,"g":5,"q":"In a study of HINTS, performance in a mixed group of emergency physicians and neurologists was a sensitivity of 83% and a specificity of 44%, versus 96.7% and 94.8% when neurologists performed it. What is the most appropriate conclusion?","o":["HINTS should be abandoned because it has never detected a stroke in any trial","Operator experience has no effect on the accuracy of HINTS in acute vestibular syndrome","HINTS is only accurate when the MRI diffusion sequence is already abnormal","Emergency physician HINTS alone is not accurate enough to exclude stroke","A reassuring HINTS result makes imaging unnecessary in every emergency setting"],"a":3,"e":"The original 100% sensitivity came from neuro-ophthalmologists in a small single-center study. Performance in emergency practice has been lower, so the test needs trained operators and does not replace clinical judgment and imaging when suspicion for stroke is high.","k":"HINTS accuracy depends on the examiner, so a reassuring result is not enough alone."},{"n":52,"g":5,"q":"A 55-year-old man with hypertension has continuous vertigo and truncal unsteadiness. An MRI with diffusion-weighted imaging done 6 hours after onset is read as normal. Which statement is correct?","o":["A normal MRI proves the vertigo is peripheral so he can be discharged with meclizine and outpatient follow-up","A normal early MRI excludes a posterior circulation stroke with more than 99% certainty, so he can go home","Any brainstem infarct is always visible on a plain head CT within 6 hours of the onset of his symptoms","MRI only becomes abnormal after 7 days, so it should not be ordered in the first day after symptom onset","Early diffusion MRI misses 15% to 20% of posterior fossa infarcts, so a negative scan does not exclude stroke"],"a":4,"e":"In a review of posterior circulation strokes, early MRI misses about 15% to 20% of posterior fossa infarcts in the first 24 hours, and sensitivity peaks at 72 to 100 hours. A negative scan should not override clinical signs that suggest a central cause.","k":"A negative early MRI does not rule out a posterior circulation stroke."},{"n":53,"g":5,"q":"A 54-year-old woman has brief spinning when she rolls over in bed, lasting under a minute. The Dix-Hallpike maneuver to the right provokes vertigo with upbeating torsional nystagmus. What is the best initial treatment?","o":["Intravenous diazepam for 24 hours","An MRI of the brain before any treatment","Strict bed rest with the head still for 3 days","Oral meclizine as the main treatment","A canalith repositioning maneuver"],"a":4,"e":"The AAO-HNS guideline strongly recommends that posterior canal BPPV be treated with a canalith repositioning procedure such as the Epley maneuver. Imaging and vestibular suppressant medications are not routinely recommended.","k":"Treat posterior canal BPPV with a repositioning maneuver."},{"n":54,"g":5,"q":"A 47-year-old man gives a history typical of BPPV, but the first Dix-Hallpike test, with the right ear down, shows no nystagmus. What is the best next step?","o":["Do a head impulse test and diagnose neuritis","Declare the diagnosis excluded and order an MRI","Perform a lumbar puncture to exclude infection","Repeat the maneuver with the left ear down","Start a benzodiazepine and ask him to return the next day"],"a":3,"e":"The guideline states the Dix-Hallpike maneuver should be repeated with the opposite ear down if the first side is negative. The test is also done on both sides because the diseased canal is not known at the start.","k":"If the Dix-Hallpike test is negative on one side, test the other side."},{"n":55,"g":5,"q":"A 63-year-old woman has a history compatible with BPPV. The Dix-Hallpike maneuver provokes horizontal nystagmus. Which test should be done next to assess for the lateral canal variant?","o":["A second Dix-Hallpike test with the head hanging lower","The supine roll test","A caloric irrigation test","A Valsalva maneuver to look for fistula signs","An audiogram in the department"],"a":1,"e":"If a history compatible with BPPV is paired with horizontal or absent nystagmus on Dix-Hallpike, the guideline advises a supine roll test to evaluate for lateral semicircular canal BPPV.","k":"Horizontal nystagmus on Dix-Hallpike calls for the supine roll test."},{"n":56,"g":5,"q":"A 70-year-old man meets the diagnostic criteria for posterior canal BPPV. He has a normal neurologic examination and no other symptoms. Which approach is consistent with guideline advice?","o":["A brain MRI with contrast in every case before any repositioning is attempted","No neuroimaging, since nothing inconsistent with BPPV is present","CT angiography of the head and neck to look for vertebral artery dissection","An EEG to look for a seizure focus that could explain the spinning","A CT of the head to exclude a posterior fossa mass before the maneuver"],"a":1,"e":"The AAO-HNS guideline recommends against radiographic imaging in a patient who meets criteria for BPPV unless additional signs or symptoms are inconsistent with BPPV. Imaging adds cost and false positives without changing treatment.","k":"Do not image typical BPPV."},{"n":57,"g":5,"q":"A 52-year-old woman has typical posterior canal BPPV. Her family physician asks whether to prescribe a medication to take every day until symptoms stop. What does the guideline advise?","o":["Prescribe a daily benzodiazepine to prevent recurrence of positional attacks","Add a long-acting antihistamine to every repositioning maneuver as standard care","Prescribe meclizine for 2 weeks as first-line treatment for the spinning sensation","Use intravenous promethazine as the main treatment until symptoms resolve fully","Do not routinely treat BPPV with vestibular suppressants"],"a":4,"e":"The guideline recommends against routine use of vestibular suppressants in BPPV. They do not fix the displaced crystals, they can sedate, and they may prolong recovery. Repositioning maneuvers are the treatment.","k":"Do not rely on vestibular suppressants for BPPV."},{"n":58,"g":5,"q":"A 59-year-old man has acute continuous vertigo. He cannot sit up or walk without assistance. His head impulse test appears normal. What does his inability to walk unaided suggest?","o":["A higher chance of a central cause, such as cerebellar or brainstem stroke","A functional disorder because the head impulse test is normal on both sides","Medication toxicity from a vestibular suppressant given before arrival today","A benign peripheral vestibular neuritis with a preserved reflex and no danger","Benign positional vertigo of the posterior canal with a normal examination"],"a":0,"e":"Patients who cannot sit or walk unassisted are more likely to have a central cause. Cerebellar strokes typically have a normal head impulse test because the vestibulo-ocular reflex does not pass through the cerebellum, and dizziness can be the only complaint in about 20% of basilar artery occlusion.","k":"Inability to sit or walk unaided in acute vertigo suggests a central cause."},{"n":59,"g":6,"q":"A 38-year-old man has a tender, fluctuant mass at the anal verge in the posterior midline. He has no fever, and he does not have diabetes. Which statement is correct about management?","o":["All anorectal abscesses must be drained in the operating room theater","Packing of the wound is contraindicated after any incision here","An isolated perianal abscess can be drained in the department","Drainage should be delayed for 2 weeks until the abscess has matured","Antibiotics alone are curative and drainage is never needed at all"],"a":2,"e":"An isolated perianal abscess is the only anorectal abscess type that should be treated in the emergency department, with linear incision and packing or other incision options. Ischiorectal, intersphincteric, and supralevator abscesses are drained in the operating room, and all need surgical referral.","k":"Only an isolated perianal abscess is drained in the ED."},{"n":60,"g":6,"q":"A 58-year-old woman with diabetes has a drained perianal abscess and surrounding cellulitis. Which statement about antibiotics is correct?","o":["Reserved for high-risk patients such as those with diabetes or cellulitis","Antibiotics are required in every case of anorectal abscess that is drained in the ED","Only intravenous vancomycin is allowed for a perianal abscess here","Antibiotics should replace drainage in patients who are at high risk of recurrence","Antibiotics are never used for a perianal abscess at any time"],"a":0,"e":"Antibiotic use is controversial and recommended in high-risk patients: older adults, diabetes, systemic signs, valvular heart disease, cellulitis, and immunosuppression. Fistula formation is the complication emphasized, particularly for perianal abscesses.","k":"Antibiotics supplement but never replace drainage, in high-risk patients."},{"n":61,"g":6,"q":"A 45-year-old man has painless bright red blood on the toilet tissue and a prolapse that reduces only with manual pressure. Which hemorrhoid grade is this?","o":["Grade I","Grade III","Grade II","Grade IV","An external hemorrhoid"],"a":1,"e":"Grade I has no prolapse, grade II prolapses and reduces spontaneously, grade III needs manual reduction, and grade IV is nonreducible and can strangulate. Internal hemorrhoids arise above the dentate line and are painless, whereas external ones arise below it and are painful. Passage of clots needs evaluation for colon lesions.","k":"Grade III hemorrhoids need manual reduction."},{"n":62,"g":6,"q":"A 70-year-old woman has a firm, painful, nonreducible groin mass, vomiting, and abdominal distension. The skin is red and tender over the mass. What is the most appropriate management?","o":["Reassure the patient and schedule an elective repair next month","Apply firm steady pressure to reduce the mass at the bedside","Do not reduce it, obtain CT if time allows, and consult surgery","Give oral laxatives and reassess the abdomen in the morning","Discharge with an elastic support belt and routine surgical follow-up"],"a":2,"e":"Reduction should not be attempted when strangulation is a concern, since returning ischemic bowel to the peritoneal cavity can cause sepsis. Femoral hernias have a 10 to 1 female predominance and are particularly prone to complications, and CT is indicated when obstruction or strangulation is suspected.","k":"A suspected strangulated hernia must not be reduced."},{"n":63,"g":6,"q":"A 55-year-old man has a soft, tender, easily reducible inguinal hernia without obstruction. Which statement is consistent with the reference?","o":["Start intravenous antibiotics and admit for 48 hours of therapy","Discharge with surgical referral","Keep him strictly NPO in the department for the next 24 hours","Obtain a CT of the abdomen before any decision is made","Admit for emergency repair under general anesthesia tonight"],"a":1,"e":"A reducible hernia can be discharged with surgical referral. If reduction is needed, the patient is kept NPO, given analgesia, placed supine in mild Trendelenburg, and firm steady pressure is applied. If it fails after one or two attempts, surgery is consulted.","k":"Easily reducible hernias can go home with surgical follow-up."},{"n":64,"g":6,"q":"A 36-year-old man has 4 days of jaundice, nausea, and right upper quadrant tenderness. Serology shows a positive anti-HAV IgM and negative other markers. What is the diagnosis?","o":["Acute hepatitis A","Hepatitis C","Chronic hepatitis B","Autoimmune hepatitis","Acute hepatitis B"],"a":0,"e":"A positive anti-HAV IgM with other markers negative indicates acute hepatitis A. HBsAg and anti-HBc IgM together indicate acute hepatitis B, and a positive HBsAg with negative anti-HBc IgM indicates chronic hepatitis B.","k":"Anti-HAV IgM positive means acute hepatitis A."},{"n":65,"g":6,"q":"A 42-year-old man with acute hepatitis has an INR 50% above normal, a glucose of 52 mg/dL, and a low albumin. Which action is most appropriate?","o":["Discharge with oral hydration and a repeat INR in one week","Reassure and arrange routine follow-up with the primary care physician","Admit for monitoring and treatment of complications","Prescribe steroids and send home with outpatient hepatology review","Order outpatient serology only and arrange routine follow-up"],"a":2,"e":"Admission considerations in acute hepatitis include a prothrombin time 50% above normal, hypoglycemia, hypoalbuminemia, a very high bilirubin, and any gastrointestinal bleeding. Acetaminophen toxicity is the most common cause of acute liver failure in the United States.","k":"Coagulopathy or hypoglycemia in acute hepatitis calls for admission."},{"n":66,"g":7,"q":"A 24-year-old man has 12 hours of pain that began near the umbilicus and moved to the right lower quadrant, with anorexia and a white cell count of 14,000 per microliter. Which Alvarado score items carry 2 points each?","o":["Migration of pain and a left shift above 75% neutrophils in the sample","Rovsing sign and psoas sign","Right lower quadrant tenderness and leukocytosis above 10,000","Anorexia and nausea with vomiting","Rebound tenderness and a temperature of 37.3 C or higher on arrival"],"a":2,"e":"In the Alvarado (MANTRELS) score, migration of pain, anorexia, nausea or vomiting, rebound, fever of 37.3 C or higher, and left shift each score 1 point. Right lower quadrant tenderness and a white count above 10,000 score 2 points each, for a maximum of 10.","k":"In the Alvarado score, right lower quadrant tenderness and leukocytosis score 2 points each."},{"n":67,"g":7,"q":"A 29-year-old woman at 24 weeks of pregnancy has right-sided abdominal pain concerning for appendicitis. Which imaging sequence is recommended?","o":["Barium enema first and then MRI","Plain abdominal radiographs followed by CT of the abdomen and pelvis","CT of the abdomen with intravenous contrast first, then ultrasound if the CT is unclear","Graded-compression ultrasound first, then MRI if the ultrasound is inconclusive","No imaging because pregnancy excludes the diagnosis of appendicitis"],"a":3,"e":"The WSES guidelines name graded-compression ultrasound as the preferred first test in pregnancy, with MRI after an inconclusive ultrasound where available. MRI is also preferred over CT in pregnancy, which avoids ionizing radiation to the fetus.","k":"In pregnancy, use ultrasound first and MRI next for suspected appendicitis."},{"n":68,"g":7,"q":"A 7-year-old boy has 18 hours of periumbilical pain, vomiting, and a low-grade fever. His examination is equivocal. Which imaging approach is recommended?","o":["Ultrasound as the first-line imaging test, avoiding routine first-line CT","MRI with sedation as the first test in every child","CT of the abdomen with oral and intravenous contrast first in every child","Plain radiographs of the abdomen as the main test","No imaging; operate on the basis of the Alvarado score alone in every child"],"a":0,"e":"The WSES guidelines advise ultrasound as the first-line test in children and advise against routine first-line CT. In children clinical scores should not be used alone to make the diagnosis, and biomarkers such as CRP and the white count are combined with the score.","k":"Children with suspected appendicitis get ultrasound first, not CT."},{"n":69,"g":7,"q":"An 81-year-old woman has 3 days of vague right-sided abdominal pain. She has no fever, a white count of 10,200, and a tender right lower quadrant. Which statement about appendicitis in older patients is correct?","o":["Perforation is rare in this age group because the appendix atrophies with age","Imaging is unnecessary because the examination is always typical in older patients","Appendicitis occurs only in patients who are younger than 40 years","Presentation is late, fever is often absent, and perforation approaches 50%","Fever is more intense and the white count is always above 15,000"],"a":3,"e":"Older adults present late, with less fever and less typical findings, and perforation rates approach 50%. Overall perforation risk rises from about 2% at 24 hours to about 50% by 72 hours of symptoms, so a normal white count does not exclude the diagnosis.","k":"Older adults with appendicitis often lack fever and present late with perforation."},{"n":70,"g":7,"q":"A 32-year-old man with uncomplicated appendicitis and no appendicolith on imaging asks about antibiotics instead of surgery. Which statement is supported by the WSES guidelines?","o":["Antibiotics are a safe option in selected adults without an appendicolith","Antibiotics alone are preferred first-line treatment during pregnancy","Antibiotics alone are contraindicated in every adult with appendicitis regardless of risk","Antibiotic treatment carries no risk of recurrence at any time","Antibiotic treatment is recommended mainly when an appendicolith is present"],"a":0,"e":"WSES states antibiotics are a safe alternative to surgery in selected adults with uncomplicated appendicitis and no appendicolith, with the need to discuss failure and misdiagnosis risk. Recurrence can reach 39% at 5 years. Non-operative management is not advised in pregnancy.","k":"Antibiotic-first treatment suits selected adults without an appendicolith, and recurrence must be discussed."},{"n":71,"g":7,"q":"A 35-year-old man undergoes laparoscopic appendectomy for uncomplicated, non-perforated appendicitis. What does the WSES guideline say about antibiotics?","o":["Oral antibiotics for 21 days","Seven days of postoperative antibiotics in all patients","A 14-day course of intravenous antibiotics after surgery","Antibiotics only if the white count rises after the operation","A single preoperative dose and no postoperative antibiotics"],"a":4,"e":"WSES recommends a single preoperative dose of broad-spectrum antibiotics and no postoperative antibiotics for uncomplicated appendicitis. For complicated disease with adequate source control, antibiotics should not extend beyond 3 to 5 days.","k":"Uncomplicated appendicitis needs one preoperative antibiotic dose and nothing after."},{"n":72,"g":7,"q":"A 54-year-old man with mild left lower quadrant pain has a CT showing uncomplicated sigmoid diverticulitis with no abscess. He is immunocompetent, tolerates oral intake, has no significant comorbidity, and can return in 2 to 3 days. Which management is consistent with current guidance?","o":["Outpatient care, with antibiotics used selectively","Admission and 10 days of intravenous antibiotics for every patient","Lifelong avoidance of all nuts, seeds, and popcorn from now on","Emergency sigmoid colectomy during the current hospital stay","Strict bowel rest with no oral intake for a full week at home"],"a":0,"e":"ACP guidance moves away from routine antibiotics for all patients and favors outpatient management of uncomplicated left-sided disease. The DINAMO trial found outpatient care without antibiotics noninferior at 90 days. Avoidance of nuts, seeds, and popcorn is no longer recommended.","k":"Uncomplicated diverticulitis can be managed as an outpatient, and antibiotics are selective."},{"n":73,"g":7,"q":"A 68-year-old man has fever and lower abdominal pain. CT shows a pelvic abscess and no free air. By the modified Hinchey classification, which stage is this?","o":["Stage II, a pelvic or distant abscess","Stage 0, mild clinical diverticulitis with no abscess or perforation","Stage III, generalized purulent peritonitis with free perforation","Stage IV, generalized fecal peritonitis with diffuse contamination","Stage Ia, confined pericolic inflammation or phlegmon without abscess"],"a":0,"e":"In the modified Hinchey scheme, 0 is mild disease, Ia pericolic inflammation or phlegmon, Ib a pericolic or mesocolic abscess, II a pelvic, distant, or retroperitoneal abscess, III purulent peritonitis, and IV fecal peritonitis. All complicated disease needs admission, and a large abscess needs percutaneous drainage.","k":"Hinchey II is a pelvic or distant abscess."},{"n":74,"g":7,"q":"A 60-year-old woman recovered from her first episode of CT-confirmed diverticulitis. What follow-up is advised?","o":["Repeat antibiotics every 3 months to prevent any recurrence","An annual CT of the abdomen for the next 5 years of her life","No follow-up is needed since the CT scan was diagnostic for it","A barium enema within one week of the initial episode here","Colonoscopy about 6 weeks later"],"a":4,"e":"Newly diagnosed patients should be referred for colonoscopy at about 6 weeks, since CT cannot reliably rule out colon cancer. ACP suggests colonoscopy if the patient has not had one recently.","k":"Refer for colonoscopy after a first episode of diverticulitis."},{"n":75,"g":7,"q":"A 66-year-old man with known diverticulosis reports air passing in his urine and three urinary infections in 6 months. Which complication is most likely?","o":["Prostatitis only","A colovesical fistula","Nephrolithiasis","An appendiceal abscess","A hiatal hernia"],"a":1,"e":"Pneumaturia or recurrent urinary tract infections in a patient with diverticular disease suggest a bladder fistula, which is a listed complication of complicated diverticulitis and needs surgical assessment.","k":"Pneumaturia with diverticulosis suggests a colovesical fistula."},{"n":76,"g":7,"q":"A 47-year-old man with diverticulitis wants to prevent recurrence and asks about taking mesalamine. What does the American College of Physicians advise?","o":["Recommend it only for patients who are under 40 years of age","Recommend against it, since it has no benefit and k

nown harms","Recommend it only when combined with oral corticosteroids for 2 weeks","Recommend it only after the third attack of diverticulitis occurs","Recommend it strongly for all patients with a diagnosis of diverticulitis"],"a":1,"e":"ACP strongly recommends against mesalamine to prevent recurrence of diverticulitis. It has no demonstrated benefit in this setting and has known harms.","k":"Do not use mesalamine to prevent diverticulitis recurrence."},{"n":77,"g":8,"q":"A 71-year-old woman has watery diarrhea after a course of clindamycin. Stool testing is positive for toxigenic Clostridioides difficile. Her white blood cell count is 18,000 per microliter and her creatinine is 1.1 mg/dL. She is not hypotensive and has no ileus. How is her episode classified?","o":["Mild, because she has no fever","Recurrent, because she took an antibiotic recently","Fulminant, because the white cell count is above 15,000 per microliter","Nonsevere, because the creatinine is normal and she is not hypotensive","Severe, because the white cell count is above 15,000"],"a":4,"e":"Severe infection is defined by a white blood cell count above 15,000 per microliter or a creatinine above 1.5 mg/dL. Fulminant infection adds hypotension, shock, ileus, or megacolon.","k":"Severe C. difficile: WBC above 15,000 or creatinine above 1.5."},{"n":78,"g":8,"q":"A 55-year-old man has a first episode of nonsevere C. difficile infection. Which treatment is preferred by the IDSA and SHEA 2021 focused update?","o":["Oral vancomycin only as a last resort","Fidaxomicin 200 mg every 12 hours for 10 days","Metronidazole 500 mg every 8 hours for 14 days","Oral rifaximin alone for 20 days","Loperamide to slow stool output"],"a":1,"e":"The 2021 update prefers standard-dose fidaxomicin, 200 mg twice daily for 10 days, for a first nonsevere episode. Oral vancomycin 125 mg every 6 hours for 10 days is the alternative, and metronidazole is used only when neither is available.","k":"Fidaxomicin is preferred for the first episode of C. difficile infection."},{"n":79,"g":8,"q":"An 80-year-old man with C. difficile infection has hypotension, a lactate of 4.0, and a distended abdomen with absent bowel sounds. Which regimen is recommended?","o":["Fidaxomicin 200 mg twice daily as the only agent for ten days","Vancomycin 500 mg every 6 hours with intravenous metronidazole","Probiotics and observation in the monitored bed for two days","Oral vancomycin 125 mg every 6 hours as the only agent for ten days","Oral metronidazole as the only agent for the whole of ten days"],"a":1,"e":"Fulminant disease is treated with vancomycin 500 mg every 6 hours by mouth or nasogastric tube plus intravenous metronidazole 500 mg every 8 hours. Rectal vancomycin may be added if ileus is present. Fidaxomicin is excluded for fulminant disease.","k":"Fulminant C. difficile needs high-dose vancomycin plus intravenous metronidazole."},{"n":80,"g":8,"q":"A 68-year-old woman has her first recurrence of C. difficile infection 5 months after the first. Which addition may be considered along with standard antibiotic therapy?","o":["Total colectomy at the first recurrence","Bezlotoxumab, with caution in patients with heart failure","Intravenous immunoglobulin for all patients with a recurrence","A second course of oral metronidazole alone for 14 days in all patients","Loperamide for symptom control"],"a":1,"e":"For a first recurrence, fidaxomicin (standard or extended-pulsed), or a tapered vancomycin regimen, is used, and bezlotoxumab is added if the prior episode occurred within 6 months. Deaths in heart failure were 19.5% with bezlotoxumab versus 12.5% with placebo.","k":"Bezlotoxumab can be added for recurrence within 6 months but needs caution in heart failure."},{"n":81,"g":8,"q":"A 59-year-old man has had three episodes of C. difficile infection treated with appropriate antibiotics. Which option is endorsed?","o":["Daily loperamide indefinitely","Fecal microbiota transplantation after at least two recurrences","Prophylactic oral vancomycin for life with every antibiotic course given","Fecal transplantation after the first episode in all patients","Surgery at the second recurrence"],"a":1,"e":"Fecal microbiota transplantation is considered after at least two recurrences, which means three episodes, that were treated with appropriate antibiotics. Rifaximin after vancomycin is a weak option for more than one recurrence.","k":"Fecal microbiota transplantation is for multiple recurrences."},{"n":82,"g":8,"q":"A 35-year-old woman with ulcerative colitis has bloody diarrhea, fever, and a distended, tender abdomen. A plain radiograph shows a continuous gas-filled colon. What diameter meets the definition of toxic megacolon?","o":["4 cm or more","6 cm or more","3 cm or more","2 cm or more","5 cm or more"],"a":1,"e":"Toxic megacolon is defined by colonic dilation of 6 cm or more with signs of systemic toxicity. Ulcerative colitis is the most common cause, followed by Crohn disease and infections such as C. difficile.","k":"Toxic megacolon means a colon of 6 cm or more with toxicity."},{"n":83,"g":8,"q":"A 40-year-old woman with toxic megacolon is hypokalemic and tachycardic. Which management step is recommended?","o":["Start sulfasalazine for maintenance and wait for it to take effect","Give intravenous opioids for the pain and repeat as needed often","Correct potassium and magnesium and give intravenous steroids","Give loperamide to reduce the stool output over the next day","Place a nasogastric tube to decompress the dilated colon quickly"],"a":2,"e":"Fluid resuscitation and aggressive correction of hypokalemia and hypomagnesemia are recommended because they worsen dilation. The reference lists intravenous hydrocortisone 100 mg every 6 hours and broad antibiotics, with emergent surgical consultation.","k":"Treat toxic megacolon with fluids, electrolyte repletion, steroids, antibiotics, and early surgery input."},{"n":84,"g":8,"q":"A 33-year-old man with toxic megacolon receives hydromorphone and loperamide. Which statement is correct?","o":["Antimotility drugs reduce bacterial overgrowth and are advised here","Opioids are the treatment of choice for the pain of this condition","Anticholinergics reduce the toxicity and shorten the course of illness","These drugs prevent perforation and are recommended in this setting","Opioids, anticholinergics, and antimotility drugs worsen dilation"],"a":4,"e":"Anticholinergics, antimotility agents, and opioids can precipitate or worsen megacolon. Nasogastric tubes and aminosalicylates are not useful for decompression or treatment, so emergent surgical consultation is the key step.","k":"Avoid opioids and antimotility drugs in toxic megacolon."},{"n":85,"g":8,"q":"A 30-year-old man has 3 days of diarrhea. Which feature would prompt stool testing?","o":["A normal examination and normal vital signs today","Diarrhea only after eating dairy","Two loose stools and no fever","One day of mild nausea","More than 10 stools in the previous 24 hours"],"a":4,"e":"Stool testing is considered with more than 10 stools in 24 hours, travel to a high-risk country, fever, bloody stool, persistent diarrhea, or HIV and other immunosuppression. Blood in the stool suggests a bacterial cause.","k":"Stool testing is reserved for severe, bloody, febrile, persistent, or high-risk diarrhea."},{"n":86,"g":8,"q":"A 25-year-old with bloody diarrhea is found to have Escherichia coli O157:H7. Which statement about antibiotics is correct?","o":["Ceftriaxone reduces the risk of kidney complications","Azithromycin should always be given","Ciprofloxacin is first-line","Metronidazole is first-line","Antibiotics are not indicated for E. coli O157:H7"],"a":4,"e":"Antibiotics are reserved for invasive infection such as Shigella, Campylobacter, and Yersinia, and are not indicated for E. coli O157:H7. Salmonella is not routinely treated except in sickle cell disease, inflammatory bowel disease, and infants under 3 months.","k":"Do not give antibiotics for E. coli O157:H7."},{"n":87,"g":9,"q":"A 58-year-old man has been unable to swallow his saliva for 3 hours after eating steak. He is drooling and coughing and has a stridulous voice. What is the most appropriate priority?","o":["Give a second dose of glucagon and observe him for an hour","Give a proteolytic enzyme by mouth to dissolve the meat bolus","Discharge with a soft diet and gastroenterology follow-up in a week","Protect the airway, then arrange endoscopic removal","Order a barium swallow to define the level of the obstruction"],"a":3,"e":"Endoscopy is definitive treatment for food impaction. If complete obstruction is suspected and the patient cannot handle secretions, the airway is secured first. Aspiration, stricture, perforation, and mediastinitis are the main complications.","k":"Complete esophageal obstruction with pooled secretions needs airway protection and endoscopy."},{"n":88,"g":9,"q":"A 44-year-old man has had a meat bolus lodged for 90 minutes and is handling saliva. An emergency physician gives intravenous glucagon. What does the evidence show about glucagon in food impaction?","o":["It is the only treatment that prevents perforation","It must be given by mouth to be effective","It works better than gas-forming agents in all trials","It succeeds in most patients and can replace endoscopy in all of them","Success rates are poor, no better than watchful waiting"],"a":4,"e":"Glucagon relaxes the lower esophageal sphincter at 1 to 2 mg intravenously, but studies show it is no better than expectant management. It should not delay endoscopy, and a bolus impacted for more than 12 hours needs early gastroenterology involvement.","k":"Glucagon does not reliably clear a food impaction."},{"n":89,"g":9,"q":"A resident plans to give a patient with a meat impaction a papain-containing meat tenderizer to dissolve the bolus. Which statement is correct?","o":["They are the first-line treatment for a meat impaction in adults","They are dangerous only in children who are under 5 years old","They should be mixed with a carbonated beverage before use","They are safe if the bolus has been lodged for under an hour","They can damage the mucosa and cause perforation"],"a":4,"e":"Proteolytic enzymes used to dissolve a meat bolus are contraindicated because they can cause mucosal damage and increase the risk of esophageal perforation. Carbonated drinks or gas-forming tablets have a pooled success rate of about 80% in retrospective studies.","k":"Do not use enzymatic meat tenderizer for esophageal impaction."},{"n":90,"g":9,"q":"A 52-year-old man develops severe chest pain after forceful vomiting. He has subcutaneous emphysema at the neck. Which three findings make up the classic triad for this diagnosis?","o":["Dysphagia, weight loss, and hoarseness","Vomiting, chest pain, and subcutaneous emphysema","Dyspnea, hemoptysis, and pleuritic pain","Hematemesis, epigastric pain, and melena","Fever, jaundice, and right upper quadrant pain with vomiting"],"a":1,"e":"Mackler's triad of chest pain, vomiting, and subcutaneous emphysema points to Boerhaave syndrome, a full-thickness rupture from a sudden rise in esophageal pressure. A water-soluble contrast esophagram is preferred for diagnosis, and management is resuscitation, broad antibiotics, and emergent surgical consultation.","k":"Mackler's triad suggests Boerhaave syndrome."},{"n":91,"g":9,"q":"A 3-year-old child swallowed a coin-sized object and is drooling. A radiograph shows a button battery lodged in the esophagus. What is the correct statement?","o":["The battery will pass spontaneously within a day","A laxative should be given and stools checked","This is a true emergency, because perforation can occur within about 6 hours","Observation for 48 hours is appropriate","The battery can be left in place if the child is feeding normally and has no pain"],"a":2,"e":"A button battery in the esophagus is a true emergency requiring urgent endoscopic removal, since perforation can occur within 6 hours. Honey, 10 mL every 10 minutes, can be given to children over 12 months if ingestion was under 12 hours earlier. Batteries past the esophagus can be watched with 24 hour follow-up.","k":"An esophageal button battery needs urgent removal."},{"n":92,"g":9,"q":"A 2-year-old swallowed several small spherical magnets 3 hours ago. He is asymptomatic. Which approach is recommended?","o":["Urgent endoscopy because multiple magnets can trap bowel between them","Observation only because swallowed magnets are inert and pass in a few days","A laxative and a repeat film in 1 week","A barium study to track the magnets","Reassurance and stool checks at home"],"a":0,"e":"Multiple magnets are an indication for urgent endoscopy because they can attract across bowel loops and cause obstruction or perforation. Barium swallow is not recommended, since it coats the mucosa and complicates endoscopy.","k":"Multiple ingested magnets call for urgent endoscopy."},{"n":93,"g":9,"q":"A 4-year-old child has swallowed a coin that sits at the level of the cricopharyngeus (C6) on the chest film. Which statement about this foreign body is correct?","o":["A coin at this level in a child is an indication for urgent endoscopy","The coin will always pass in 24 hours","Coins in the esophagus never need removal","Laparotomy is required for all coins","A barium swallow is the best next test before any decision about removal is made"],"a":0,"e":"A coin at the cricopharyngeus level in a child needs urgent endoscopy. Alternatives include Foley catheter removal or bougienage, and about 80% to 90% of ingested foreign bodies pass without help. Coins in the esophagus show the flat face on the anteroposterior view.","k":"A coin lodged at C6 in a child needs urgent removal."},{"n":94,"g":9,"q":"A 35-year-old man swallowed a 7 cm toothpick-like object and has no symptoms. Which management is most appropriate?","o":["Observation at home for a week with daily abdominal films","Reassurance and oral laxatives with a stool check at home","Intramuscular antibiotics only and a repeat film in the morning at home","A barium swallow for localization before any other decision","Urgent endoscopic removal, since sharp or long objects can perforate"],"a":4,"e":"Sharp or elongated objects, and those longer than 6 cm, warrant urgent endoscopy. Perforation from objects distal to the stomach can reach 35%, and a symptomatic patient with an object beyond the duodenum needs an immediate surgical consultation.","k":"Sharp or long ingested objects need urgent endoscopic removal."},{"n":95,"g":9,"q":"A 62-year-old man with chronic NSAID use has the abrupt onset of severe epigastric pain and a rigid abdomen. Free air is seen under the diaphragm. Where is a perforation most likely to be found?","o":["The posterior wall of the gastric fundus","The anterior wall of the duodenum","The lesser curvature of the gastric body","The gastric cardia","The second part of the duodenum"],"a":1,"e":"Perforation of a peptic ulcer most commonly occurs in the anterior wall of the duodenum. A perforated ulcer is a surgical emergency, managed with surgical consultation, intravenous fluids, and antibiotics covering abdominal flora.","k":"Perforated peptic ulcers most often lie in the anterior duodenum."},{"n":96,"g":9,"q":"A 45-year-old woman with epigastric pain is found to be positive for Helicobacter pylori. Which regimen reflects a standard triple therapy listed in the ED reference?","o":["Sucralfate alone for 10 days with no other agents added","A proton pump inhibitor and ciprofloxacin for 3 days with no repeat stool test","Bismuth alone for 2 days with a repeat stool test afterward","An H2 blocker and metronidazole for a single day of therapy","A proton pump inhibitor, clarithromycin, and amoxicillin for 10 to 14 days"],"a":4,"e":"Triple therapy combines a proton pump inhibitor, clarithromycin 500 mg twice daily, and amoxicillin 1 g or metronidazole 500 mg twice daily for 10 to 14 days. Quadruple therapy uses a PPI, bismuth, metronidazole, and tetracycline. Most ulcers relate to H. pylori or NSAIDs.","k":"H. pylori triple therapy lasts 10 to 14 days."},{"n":97,"g":10,"q":"A 28-year-old man has had two days of sharp chest pain that worsens when he lies flat and eases when he leans forward. A friction rub is heard. His ECG shows diffuse concave ST elevation with PR depression, and the troponin is normal. His vital signs are normal and he has no fever. Which initial treatment is best?","o":["Aspirin and clopidogrel loading with admission to a coronary care unit","Unfractionated heparin with activation of the catheterization laboratory","Empiric intravenous antibiotics for presumed bacterial pericarditis","Prednisone as the first-line drug to shorten the course","An NSAID combined with colchicine"],"a":4,"e":"First-line therapy for acute pericarditis is an NSAID plus colchicine. Corticosteroids are second line because they raise the risk of recurrence, and nothing in this presentation suggests a coronary occlusion that would call for antithrombotic therapy.","k":"Acute pericarditis is treated first with an NSAID plus colchicine, and steroids are held back as second line."},{"n":98,"g":10,"q":"A 55-year-old woman has 90 minutes of chest pressure. Her ECG shows ST elevation in the inferior leads and in V5 and V6. Which additional finding would most strongly argue for acute myocardial infarction rather than pericarditis?","o":["ST depression in lead aVL","ST elevation in lead II that is greater than in lead III","Concave upward shape of the ST segments","PR elevation in lead aVR","PR depression in the inferior leads"],"a":0,"e":"ST depression in aVL is a sensitive sign of inferior STEMI. Pericarditis is expected to cause ST depression only in V1 and aVR, produces larger ST elevation in lead II than in lead III, and is typically accompanied by PR depression and PR elevation in aVR.","k":"ST depression outside aVR and V1, and ST elevation greater in lead III than lead II, point to infarction rather than pericarditis."},{"n":99,"g":10,"q":"A 44-year-old man with a diagnosis of acute pericarditis is being considered for discharge. Which single finding would make admission preferable?","o":["A pericardial friction rub on examination","Diffuse ST elevation on the ECG","Pain that began one day ago","A temperature above 100.4 F (38 C)","Pleuritic pain that eases when he leans forward"],"a":3,"e":"Fever, subacute onset over weeks, a large effusion, tamponade, immunosuppression, anticoagulant use, a poor response to NSAIDs after 7 days, raised cardiac enzymes, and trauma are features that favor admission. The remaining options are ordinary features of uncomplicated pericarditis.","k":"Fever is a high-risk feature in pericarditis and favors admission over outpatient care."},{"n":100,"g":10,"q":"A 36-year-old woman has typical acute pericarditis. Her transaminases are twice the upper limit of normal. Her creatinine, weight, and blood pressure are otherwise unremarkable. How does this change the plan?","o":["Give colchicine only if the pain returns after a week of NSAIDs","Stop all anti-inflammatory therapy and give a steroid alone","Choose colchicine alone and omit the NSAID entirely","Add colchicine at double the usual dose to compensate for the liver","Give the NSAID and avoid colchicine because of the liver tests"],"a":4,"e":"Colchicine is avoided when transaminases are 1.5 times the upper limit of normal or higher, and also with a creatinine above 2.5 mg/dL, myopathy, inflammatory bowel disease, tuberculous or neoplastic pericarditis, or pregnancy and lactation. The NSAID can still be given.","k":"Colchicine is contraindicated when transaminases are 1.5 times normal or higher, so the NSAID carries the treatment."},{"n":101,"g":10,"q":"A 68-year-old woman collapses with chest pain two days after her husband's funeral. Her ECG shows anterior ST elevation. Troponin is only mildly elevated, but BNP is markedly high. Echocardiography shows apical ballooning with hyperkinetic basal segments, and coronary angiography shows no obstructive disease or acute plaque rupture. What is the most likely diagnosis?","o":["Takotsubo cardiomyopathy","Acute pericarditis","Vasospastic angina","Spontaneous coronary artery dissection","Acute viral myocarditis"],"a":0,"e":"A stress trigger, ST elevation that mimics ACS, a small troponin rise with a disproportionately high BNP, characteristic apical ballooning, and normal or mildly diseased coronary arteries define takotsubo cardiomyopathy. It is a diagnosis of exclusion.","k":"Apical ballooning with clean coronaries after an emotional stressor is takotsubo cardiomyopathy."},{"n":102,"g":10,"q":"A 71-year-old woman with takotsubo cardiomyopathy becomes hypotensive at 74/48 mmHg. A new late-peaking systolic murmur is heard, and bedside echocardiography shows left ventricular outflow tract obstruction. Which approach is best?","o":["An epinephrine infusion titrated to the blood pressure","Dobutamine to improve contractility and restore cardiac output","Phenylephrine, often with a beta-blocker, avoiding inotropes","Intravenous nitroglycerin to unload the ventricle","Milrinone to reduce afterload and raise the output"],"a":2,"e":"When takotsubo cardiomyopathy causes shock with outflow tract obstruction, inotropes make the obstruction worse. Phenylephrine, usually with a beta-blocker, is preferred. Inotropes or mechanical support are reserved for shock without obstruction.","k":"In takotsubo with outflow obstruction, avoid inotropes and use phenylephrine, often with a beta-blocker."},{"n":103,"g":10,"q":"A 62-year-old woman is admitted with takotsubo cardiomyopathy. Which finding would most clearly justify therapeutic anticoagulation?","o":["ST elevation on the admission ECG at presentation","A mild troponin elevation on the admission blood test","Thrombus visualized in the left ventricular apex","Typical apical ballooning on the echocardiogram","Sinus tachycardia at 105 per minute on the monitor"],"a":2,"e":"Anticoagulation in takotsubo cardiomyopathy is reserved for documented left ventricular thrombus or an embolic event, which occur in about 5 percent of patients. Ballooning, ST changes, and a small troponin rise are expected features and do not by themselves call for anticoagulation.","k":"Anticoagulate takotsubo cardiomyopathy only for documented left ventricular thrombus or embolism."},{"n":104,"g":10,"q":"A 34-year-old woman, three weeks after delivering her second child, has 40 minutes of chest pain and a new left bundle branch block. Troponin is raised. Angiography shows a spontaneous dissection of the mid-distal left anterior descending artery with less than 50 percent luminal narrowing and TIMI 3 flow. She is hemodynamically stable. What is the preferred management?","o":["Discharge with no antithrombotic or antianginal therapy","Conservative medical therapy with close observation","Stenting along the entire length of the dissection","Fibrinolytic therapy","Emergency coronary artery bypass grafting"],"a":1,"e":"In a stable patient with a mid-distal dissection, less than 50 percent narrowing, and TIMI 3 flow, conservative management is favored and many dissections heal spontaneously. PCI is for a short proximal segment, and bypass for extensive proximal LAD or left main involvement.","k":"Stable spontaneous coronary artery dissection with preserved flow is usually managed conservatively."},{"n":105,"g":10,"q":"A healthy 31-year-old woman, two weeks postpartum, has an anterior STEMI. Spontaneous coronary artery dissection is suspected. Which risk is the main reason fibrinolysis is discouraged in this setting?","o":["It causes severe bradycardia in young patients","It reliably precipitates ventricular fibrillation","It dissolves the intramural hematoma and leaves a false lumen","It may extend the dissection","It cannot be given within two weeks of delivery for any reason"],"a":3,"e":"Thrombolysis was used in the past for spontaneous coronary artery dissection, but it had harmful effects, including extension of the dissection. The typical patient is a young woman without cardiac risk factors, and pregnancy and the peripartum period are recognized precipitants.","k":"Fibrinolysis can extend a spontaneous coronary dissection, so catheter-based assessment is preferred."},{"n":106,"g":10,"q":"A 21-year-old college athlete has an exertional syncopal episode. A systolic murmur is heard at the left sternal border. Which pair of maneuvers would be expected to intensify the murmur if he has hypertrophic cardiomyopathy?","o":["Trendelenburg position and standing","Valsalva strain and standing","Squatting and the Valsalva strain","Squatting and the Trendelenburg position","Standing and squatting"],"a":1,"e":"In hypertrophic cardiomyopathy, maneuvers that lower preload, such as Valsalva and standing, increase outflow obstruction and intensify the murmur. Squatting and the Trendelenburg position raise preload and soften it.","k":"Valsalva and standing intensify the hypertrophic cardiomyopathy murmur, while squatting and Trendelenburg soften it."},{"n":107,"g":10,"q":"A 45-year-old man with known hypertrophic cardiomyopathy has three days of vomiting and diarrhea. He is hypotensive at 80/50 mmHg with a heart rate of 112. Fluids are started. Which vasopressor is the best choice if pressure remains low?","o":["Dopamine","Epinephrine","Phenylephrine","Dobutamine","Intravenous nitroglycerin"],"a":2,"e":"In hypertrophic cardiomyopathy, hypotension is treated by restoring volume and by using a pure vasoconstrictor such as phenylephrine. Positive inotropes and vasodilators increase outflow obstruction and are avoided.","k":"Treat hypotension in hypertrophic cardiomyopathy with volume and phenylephrine, not inotropes or vasodilators."},{"n":108,"g":10,"q":"A 52-year-old man with hypertrophic cardiomyopathy has chest discomfort and mild dyspnea. Which medication would be most likely to worsen his left ventricular outflow obstruction?","o":["Cardioversion for new atrial fibrillation","Phenylephrine","A cardioselective beta-blocker","Sublingual nitroglycerin","An isotonic crystalloid bolus"],"a":3,"e":"Nitrates and other vasodilators lower preload and afterload, which increases the dynamic outflow gradient. Beta-blockers, phenylephrine, volume, and restoration of sinus rhythm are all appropriate in hypertrophic cardiomyopathy.","k":"Avoid nitrates and other vasodilators in hypertrophic cardiomyopathy because they worsen outflow obstruction."},{"n":109,"g":10,"q":"A 30-year-old man with hypertrophic cardiomyopathy has a screening ECG. Which finding is a recognized mimic of posterior myocardial infarction in this condition?","o":["Prolongation of the PR interval to 240 ms","A tall R wave in lead V1","Diffuse concave ST elevation","Right axis deviation with an S1Q3T3 pattern","Low voltage in the limb leads"],"a":1,"e":"The ECG is abnormal in about 90 percent of patients with hypertrophic cardiomyopathy. High voltage, left ventricular hypertrophy, a tall R wave in V1 that can mimic a posterior infarct, and needle-like Q waves in the lateral leads that can mimic infarction are typical.","k":"A tall R wave in V1 and narrow lateral Q waves are hypertrophic cardiomyopathy findings that can mimic infarction."},{"n":110,"g":10,"q":"A 74-year-old man has had exertional syncope, angina, and progressive dyspnea. A systolic murmur is heard at the right second intercostal space, radiating to the carotids, with a delayed carotid upstroke. Which echocardiographic combination defines severe aortic stenosis?","o":["Area below 1 cm2, velocity above 4 m/s, and mean gradient of at least 40 mmHg","Valve area of 1.2 cm2, peak velocity of 3.5 m/s, and mean gradient of 25 mmHg","Valve area of 2 cm2, peak velocity above 4 m/s, and mean gradient of 5 mmHg","Valve area below 1 cm2, peak velocity of 2 m/s, and mean gradient of 10 mmHg","Valve area of 1.5 cm2, peak velocity of 3 m/s, and mean gradient of 20 mmHg"],"a":0,"e":"Severe aortic stenosis is defined by a valve area below 1 cm2, a peak velocity above 4 m/s, and a mean gradient of 40 mmHg or more. Syncope, angina, and dyspnea are the classic triad, and syncope and heart failure usually appear late.","k":"Severe aortic stenosis means area below 1 cm2, velocity above 4 m/s, and mean gradient of 40 mmHg or more."},{"n":111,"g":10,"q":"A 78-year-old woman with known severe aortic stenosis has had poor oral intake for four days. She is lethargic with a blood pressure of 76/40 mmHg and clear lungs. Which initial approach is best?","o":["Small fluid boluses with reassessment, then phenylephrine if needed","A large furosemide dose to prevent pulmonary edema from fluid","Intravenous nitroglycerin to reduce the preload on the ventricle and the wall stress","An epinephrine infusion titrated to a normal blood pressure","Intravenous metoprolol to slow the heart rate and lower the myocardial demand"],"a":0,"e":"Patients with severe aortic stenosis are preload dependent and prone to pulmonary edema, so fluid is given in small boluses with frequent reassessment. Phenylephrine is the preferred vasopressor, while epinephrine, nitrates, and negative inotropes are avoided or used with extreme caution.","k":"In severe aortic stenosis, treat hypotension with careful small boluses and phenylephrine, and avoid vasodilators."},{"n":112,"g":10,"q":"A 76-year-old man with severe aortic stenosis presents with atrial fibrillation at 150 per minute and a blood pressure of 86/50 mmHg. He is dyspneic and lightheaded. Which is the best next step?","o":["A furosemide bolus to treat the dyspnea","Intravenous nitroglycerin to reduce preload","Intravenous metoprolol to control the rapid rate","Intravenous diltiazem to slow the ventricular rate","Synchronized cardioversion at a low threshold"],"a":4,"e":"Loss of atrial contraction sharply reduces preload and cardiac output in aortic stenosis. Beta-blockers and calcium channel blockers are avoided because of their negative inotropy, so cardioversion has a low threshold in an unstable patient.","k":"Cardiovert unstable atrial fibrillation in aortic stenosis rather than using negative inotropes."},{"n":113,"g":10,"q":"A 69-year-old man with severe aortic stenosis and a blood pressure of 82/48 mmHg needs intubation for respiratory failure. Which approach is best?","o":["Skip induction medication to preserve blood pressure","Intubate at once with a standard propofol dose before correcting the hypotension","Give a nitroglycerin infusion first to ease the cardiac workload","Delay intubation until the aortic valve has been replaced","Resuscitate first, then induce with etomidate or ketamine"],"a":4,"e":"In aortic stenosis, patients should be resuscitated before intubation with fluids and vasopressors, and a hemodynamically favorable induction agent such as etomidate or ketamine is chosen. Definitive treatment is valve replacement, but airway support cannot wait for it.","k":"Resuscitate before intubating a patient with severe aortic stenosis and pick a hemodynamically favorable induction agent."},{"n":114,"g":10,"q":"A 29-year-old woman, two weeks after delivery, has orthopnea and leg swelling. She has no prior heart disease. Echocardiography shows a left ventricular ejection fraction of 30 percent. Which statement best defines peripartum cardiomyopathy?","o":["Any cardiomyopathy first diagnosed during the first trimester of pregnancy, at any ejection fraction","Cardiomyopathy first appearing more than twelve months after delivery","New cardiomyopathy in the last month of pregnancy or within five months after delivery","Any new arrhythmia occurring at any time during the peripartum period","Heart failure within two weeks of delivery only in women who already had known heart disease"],"a":2,"e":"Peripartum cardiomyopathy is a cardiomyopathy that develops in the last month of pregnancy or within five months postpartum in a woman with no prior heart disease and no other identifiable cause. Echocardiography is essential for diagnosis.","k":"Peripartum cardiomyopathy appears in the last month of pregnancy or within five months after delivery."},{"n":115,"g":10,"q":"A 33-year-old woman at 36 weeks of gestation has new heart failure with pulmonary edema from peripartum cardiomyopathy. Which medication should be avoided before delivery?","o":["Hydralazine","Metoprolol","Enalapril","Isosorbide dinitrate","Furosemide"],"a":2,"e":"Angiotensin-converting enzyme inhibitors are fetotoxic and are not used before delivery. Diuretics relieve congestion, hydralazine with nitrates is preferred before birth, and metoprolol is the beta-blocker more commonly used in pregnancy.","k":"ACE inhibitors are fetotoxic, so use diuretics, hydralazine, and nitrates for antepartum heart failure."},{"n":116,"g":10,"q":"A 30-year-old woman, three weeks postpartum, has peripartum cardiomyopathy with an ejection fraction of 20 percent and no visible thrombus. Which statement about thromboembolism is most accurate?","o":["Thromboembolism is so rare that prophylaxis is never considered","Events are common, so prophylaxis is widely used despite limited evidence","Anticoagulation is indicated only if atrial fibrillation is present","Anticoagulation is contraindicated throughout the entire postpartum period","Aspirin has proven superior to anticoagulation in randomized trials"],"a":1,"e":"Thromboembolic events are common in peripartum cardiomyopathy, and thromboprophylaxis is widely used, although the practice rests on expert opinion. One trial gave warfarin for six months to women with an ejection fraction below 25 percent or a left ventricular thrombus.","k":"Thromboprophylaxis is widely used in severe peripartum cardiomyopathy, but the evidence is mainly expert opinion."},{"n":117,"g":10,"q":"A 38-year-old smoker has repeated episodes of rest chest pain around 3 a.m., each lasting about ten minutes. During one episode her ECG shows transient ST elevation that resolves when the pain ends. Which long-term therapy is most appropriate?","o":["Dual antiplatelet therapy and early coronary stenting","Therapeutic anticoagulation with a fibrinolytic agent","A long-acting calcium channel blocker, adding nitrates if needed","A nonselective beta-blocker titrated to a resting heart rate below 60","Digoxin at a loading dose followed by daily maintenance"],"a":2,"e":"The picture is vasospastic (Prinzmetal) angina. Calcium channel blockers, usually long-acting and taken at night, are first line, nitrates can be added, and nonselective beta-blockers can worsen the spasm. Smoking cessation is essential.","k":"Treat vasospastic angina with a calcium channel blocker and nitrates, and avoid nonselective beta-blockers."},{"n":118,"g":10,"q":"A 42-year-old man has recurrent rest chest pain with transient ST changes. Standard coronary angiography is normal, but vasospastic angina is still suspected. Which test can confirm coronary spasm?","o":["A D-dimer assay combined with a high-sensitivity troponin level","A treadmill exercise test with continuous ECG","Dobutamine stress echocardiography at peak heart rate and peak dose","A coronary artery calcium score on noncontrast CT","Ergonovine or acetylcholine provocation at catheterization"],"a":4,"e":"When coronary spasm is suspected but not established, provocation testing in the catheterization laboratory with ergonovine, acetylcholine, or hyperventilation can reproduce spasm and confirm the diagnosis.","k":"Coronary spasm can be confirmed in the catheterization laboratory by provocation with ergonovine or acetylcholine."},{"n":119,"g":10,"q":"A 3-year-old boy has had fever for six days with bilateral nonexudative conjunctivitis, red cracked lips, a polymorphous rash, cervical lymphadenopathy, and swollen hands. Which treatment is recommended?","o":["Intravenous immune globulin 2 g/kg once, plus aspirin","Observation until the fever has lasted ten days","Oral amoxicillin for presumed streptococcal infection","Single-dose pulse methylprednisolone as the only treatment","Aspirin alone with outpatient follow-up in a week"],"a":0,"e":"Fever for at least five days with four of five principal features meets the criteria for complete Kawasaki disease. Treatment is intravenous immune globulin at 2 g/kg as a single infusion plus aspirin until the child is afebrile. Pulse steroid should not be used with immune globulin as primary therapy.","k":"Treat Kawasaki disease with a single 2 g/kg infusion of intravenous immune globulin plus aspirin."},{"n":120,"g":10,"q":"A 6-year-old girl has had fever for five days, red eyes, and cervical lymphadenopathy. She has two of the five principal features of Kawasaki disease. The CRP is 5 mg/dL. What is the best next step?","o":["Evaluate for incomplete Kawasaki disease with labs and echocardiography","Reassure the family that this is most likely a self-limited viral illness","Discharge with return precautions and no further testing at all","Diagnose Kawasaki disease only if all five features are present","Start antibiotics and wait until fever has lasted ten days"],"a":0,"e":"A child with fever for at least five days and two or three compatible features may have incomplete Kawasaki disease. A CRP of 3.0 mg/dL or higher supports the diagnosis, and treatment is given if supportive laboratory findings or a positive echocardiogram are present.","k":"Fever for five days with two or three features and a raised CRP needs an incomplete Kawasaki work-up."},{"n":121,"g":10,"q":"A 4-year-old boy with Kawasaki disease has an echocardiogram showing a coronary artery with a body-surface-area adjusted Z score of 6 and an absolute diameter of 6 mm. How is this finding classified?","o":["No coronary involvement","A large or giant aneurysm","Dilation only","A small aneurysm","A medium aneurysm"],"a":4,"e":"A Z score from 5 to below 10 with an absolute diameter below 8 mm is a medium aneurysm. Dilation only is a Z score of 2 to 2.5, a small aneurysm is 2.5 to below 5, and a large or giant aneurysm is 10 or higher or an absolute diameter of 8 mm or more.","k":"Kawasaki coronary aneurysms are graded by Z score: small 2.5 to below 5, medium 5 to below 10, large 10 or more."},{"n":122,"g":11,"q":"A 14-month-old boy with known tetralogy of Fallot becomes deeply cyanotic and screams after a blood draw. His oxygen saturation is 62 percent. What is the best first step?","o":["Calm him, flex his knees to the chest, and give oxygen","Perform immediate endotracheal intubation under sedation","Give a large dose of furosemide to reduce the preload","Start a dobutamine infusion to raise the oxygen delivery","Give albuterol by nebulizer for presumed bronchospasm"],"a":0,"e":"A hypercyanotic spell is driven by crying and hyperventilation, which worsen right-to-left shunting. First steps are to calm the child, flex the knees to the chest to raise systemic vascular resistance, and give oxygen, followed by analgesia, a fluid bolus, and phenylephrine if needed.","k":"For a tet spell, calm the child, flex the knees to the chest, and give oxygen first."},{"n":123,"g":11,"q":"Which mechanism best explains why crying makes a hypercyanotic spell worse in a child with tetralogy of Fallot?","o":["Bronchospasm lowers the alveolar oxygen tension and the saturation","Higher systemic vascular resistance forces more blood across the pulmonary valve into the lungs","Increased left ventricular preload reverses the flow across the ductus","Reduced heart rate decreases the blood returning to the lungs","Lower systemic and higher pulmonary resistance increase the right-to-left shunt"],"a":4,"e":"A fall in systemic vascular resistance increases right-to-left shunting across the ventricular septal defect. Crying raises pulmonary pressure and hyperventilation lowers systemic pressure, which together create a self-reinforcing cycle of worsening cyanosis.","k":"Crying lowers systemic resistance and raises pulmonary resistance, increasing right-to-left shunt in tetralogy of Fallot."},{"n":124,"g":11,"q":"An 18-month-old with tetralogy of Fallot remains cyanotic after positioning, oxygen, an opioid, and a saline bolus. Which is the next step?","o":["Epinephrine to increase the heart rate and output","Phenylephrine push doses to raise systemic resistance","Dobutamine to increase myocardial contractility and cardiac output","Furosemide to decrease the preload further and reduce the volume","Nitroglycerin to dilate the pulmonary vasculature and reduce afterload"],"a":1,"e":"If the spell persists after positioning, oxygen, analgesia, and fluid, a vasoconstrictor such as phenylephrine is used to raise systemic vascular resistance and reduce the right-to-left shunt. Later options include ketamine, intubation, sodium bicarbonate, and esmolol.","k":"If a tet spell persists after basic measures, give phenylephrine to raise systemic vascular resistance."},{"n":125,"g":11,"q":"An 8-day-old boy is brought in with poor feeding and lethargy. He is mottled and cool, with weak peripheral pulses and an enlarged liver. No murmur is heard. Bedside echocardiography is not immediately available. What is the best next step in addition to resuscitation?","o":["Observe for 24 hours with serial examinations before starting any specific cardiac treatment","Give indomethacin to close the ductus arteriosus","Start a prostaglandin E1 infusion for a presumed ductal-dependent lesion","Give high-concentration oxygen continuously to improve perfusion and reverse the shock","Perform a lumbar puncture before any other treatment"],"a":2,"e":"Shock in a neonate with weak pulses and hepatomegaly suggests a ductal-dependent lesion. Prostaglandin E1 should be started without delay when suspicion is high, even before echocardiography confirms the diagnosis, and the murmur may be absent in critical hypoperfusion.","k":"Start prostaglandin E1 in a shocked neonate with suspected ductal-dependent heart disease."},{"n":126,"g":11,"q":"A newborn with a suspected ductal-dependent lesion is started on a prostaglandin E1 infusion. Which complication should the team be prepared to manage?","o":["Hyperglycemia requiring insulin","Severe systemic hypertension requiring treatment","Acute urinary retention requiring catheterization","Bronchospasm requiring nebulized treatment","Apnea requiring ventilatory support"],"a":4,"e":"The main adverse effect of prostaglandin E1 is apnea, which may require intubation and ventilation, and the team should be prepared before transport. Fever, flushing, and hypotension may also occur.","k":"Prostaglandin E1 commonly causes apnea, so be ready to secure the airway."},{"n":127,"g":11,"q":"A cyanotic neonate is suspected to have a ductal-dependent heart lesion. What is the correct approach to supplemental oxygen?","o":["Give 100 percent oxygen to maximize saturation","Use oxygen only for the first hour","Give oxygen only when the pre- and post-ductal saturations match","Avoid excessive oxygen because it can constrict the ductus","Withhold all oxygen regardless of saturation"],"a":3,"e":"Excessive oxygen can constrict the ductus arteriosus, which may be the only source of blood flow to the lungs or the body. Oxygen is used only as indicated, and a pre- and post-ductal saturation difference above 3 percent or a saturation below 90 percent in either limb is abnormal.","k":"Avoid high oxygen concentrations in a neonate who may be ductal dependent."},{"n":128,"g":11,"q":"A 52-year-old man with a mechanical aortic valve is scheduled for a tooth extraction that involves manipulation of gingival tissue. He asks whether he needs antibiotics beforehand. What is the best advice?","o":["Prophylaxis is unnecessary because a mechanical prosthetic valve is not a risk for endocarditis","Prophylaxis is never recommended before any dental procedure in a cardiac patient","Prophylaxis is recommended because he has a prosthetic cardiac valve","Prophylaxis is needed only for procedures on the lower jaw","Prophylaxis is needed only if he has a fever on the day"],"a":2,"e":"Antibiotic prophylaxis before dental procedures involving gingival manipulation, the periapical region, or perforation of the oral mucosa is recommended for prosthetic valves, prior infective endocarditis, certain transplants, unrepaired cyanotic congenital disease, and repaired defects with residual shunt or regurgitation next to prosthetic material.","k":"Prosthetic valves are among the few conditions for which dental prophylaxis against endocarditis is recommended."},{"n":129,"g":11,"q":"A 9-month-old has a heart rate of 260 per minute on the monitor with a narrow, regular complex, but is alert, well perfused, and feeding poorly. Which first-line approach is appropriate?","o":["A vagal maneuver such as a cold wet cloth on the face for 30 seconds","Intravenous verapamil given as a rapid bolus","Immediate unsynchronized shock delivered at a high energy level without any vagal maneuvers","Carotid sinus massage on both sides at the same time for thirty seconds","Observation for twelve hours without any treatment"],"a":0,"e":"In stable pediatric supraventricular tachycardia, vagal maneuvers such as an ice-cold wet cloth applied to the face for 30 seconds are tried, and they should not delay adenosine. Bilateral carotid massage is unsafe, and only one-sided massage is described.","k":"Try a vagal maneuver such as a cold facecloth in stable infant SVT, but do not delay adenosine."},{"n":130,"g":11,"q":"A child with stable supraventricular tachycardia is to receive adenosine. Which administration technique is correct?","o":["A rapid bolus with a rapid saline flush through a three-way tap","A bolus through a distal peripheral vein without any saline flush afterward","A bolus given only after opioid sedation has been completed and the child is asleep","A slow infusion over five minutes through a small peripheral line in the hand","An intramuscular injection into the thigh"],"a":0,"e":"Adenosine has a very short half-life, so it is given as a rapid bolus followed by a rapid saline flush, usually through a three-way tap, with a continuous ECG strip. It is used with caution in asthma, and a repeat dose can be given within one minute.","k":"Give adenosine as a rapid bolus with an immediate saline flush while recording the rhythm."},{"n":131,"g":11,"q":"A 4-month-old with supraventricular tachycardia is pale, lethargic, and hypotensive, with delayed capillary refill. Which is the best treatment?","o":["Oral propranolol given by nasogastric tube","Observation with maintenance fluids only until she improves on her own over several hours","Vagal maneuvers repeated for ten minutes before any other step is considered or attempted","Synchronized cardioversion with sedation, without waiting for IV access","Intravenous diltiazem given as a slow infusion"],"a":3,"e":"An unstable child in supraventricular tachycardia needs synchronized cardioversion with appropriate sedation and analgesia, and the lack of IV access must not delay it. Anesthesia support for the airway should be considered.","k":"Unstable pediatric SVT needs prompt synchronized cardioversion, not repeated vagal maneuvers."},{"n":132,"g":11,"q":"An 8-year-old in a low-risk population has fever of 38.7 C, a sore throat two weeks ago confirmed as group A streptococcus, and painful, swollen knees and ankles. Which finding counts as a minor criterion in the 2015 revised Jones criteria for a low-risk population?","o":["Subcutaneous nodules over the extensor tendons","Fever of at least 38.5 C","Carditis on physical examination","Erythema marginatum","Sydenham chorea"],"a":1,"e":"In low-risk populations, minor criteria are polyarthralgia, fever of at least 38.5 C, an ESR of at least 60 mm per hour or CRP of at least 3 mg/dL, and a prolonged PR interval. Carditis, polyarthritis, chorea, erythema marginatum, and subcutaneous nodules are major criteria.","k":"In low-risk populations, fever of 38.5 C or higher is a minor Jones criterion."},{"n":133,"g":11,"q":"Which combination establishes a first episode of acute rheumatic fever under the 2015 revised Jones criteria?","o":["Streptococcal evidence plus two major, or one major and two minor, criteria","A raised ASO titer alone, without any clinical criteria being present or required","Two minor criteria together with a positive throat culture for group A streptococcus","One major criterion alone is enough, with or without evidence of streptococcal infection","Three minor criteria alone are enough to establish a first episode without a major criterion"],"a":0,"e":"For an initial episode, two major criteria, or one major plus two minor, are needed together with evidence of preceding group A streptococcal infection, except in isolated chorea. For recurrence, three minor criteria can suffice.","k":"Initial rheumatic fever needs two major, or one major plus two minor, criteria with streptococcal evidence."},{"n":134,"g":11,"q":"A 45-year-old woman with pulmonary arterial hypertension has acute right heart failure with a blood pressure of 78/50 mmHg and a distended jugular vein. Which vasopressor is the best first choice?","o":["Nifedipine","Phenylephrine","A beta-blocker infusion","Norepinephrine","Sildenafil"],"a":3,"e":"In right ventricular failure from pulmonary hypertension, norepinephrine is the first-choice vasopressor and vasopressin is reasonable. Phenylephrine raises pulmonary vascular resistance, and beta-blockers, calcium channel blockers, and oral vasodilators are poorly tolerated in a critically ill patient.","k":"Use norepinephrine for hypotension in pulmonary hypertension, and avoid phenylephrine."},{"n":135,"g":11,"q":"A patient with pulmonary arterial hypertension on a continuous prostacyclin infusion becomes acutely hypotensive and hypoxic. The infusion pump was found to have stopped two hours earlier. Which explanation is the most likely?","o":["Overdose of the pulmonary vasodilator infusion running at the programmed rate for hours","An allergic reaction to the infusion drug","Rebound pulmonary hypertension after abrupt interruption of the infusion","Sepsis from a contaminated infusion pump set and a colonized central line","Volume overload from the carrier fluid delivered through the infusion line over two hours"],"a":2,"e":"Abrupt interruption of a pulmonary vasodilator infusion can cause rebound pulmonary hypertension and right ventricular collapse. Infusions should be continued or restarted promptly, and the pulmonary hypertension center should be contacted early.","k":"Never stop a pulmonary vasodilator infusion abruptly, because rebound pulmonary hypertension can follow."},{"n":136,"g":11,"q":"A 58-year-old man is in the emergency department with a blood pressure of 188/104 mmHg, no symptoms, normal examination, and no target-organ findings. He has primary care follow-up arranged. What does the ACEP clinical policy suggest?","o":["Starting treatment in the ED is unnecessary when follow-up is arranged","Immediate clonidine to ensure compliance after discharge from the department","Rapid lowering of the pressure to normal before discharge from the department","Routine head CT and echocardiography before discharge","An intravenous nicardipine infusion with hospital admission for monitoring"],"a":0,"e":"The ACEP policy (Level B) states that treatment in the emergency department is not necessary when follow-up is arranged, and that rapid lowering is unnecessary and potentially harmful. Persistently elevated readings should be referred for follow-up.","k":"Asymptomatic hypertension with arranged follow-up does not need ED treatment or rapid lowering."},{"n":137,"g":12,"q":"A 74-year-old man has a syncopal episode with no prodrome. He has a history of congestive heart failure and his ECG shows a new abnormality. Using the San Francisco Syncope Rule, which feature in his history places him in the high-risk group?","o":["Syncope after standing in a hot crowded room","A single episode lasting a few seconds","A history of congestive heart failure","Male sex","Nausea and warmth before losing consciousness"],"a":2,"e":"The San Francisco Syncope Rule is positive for an abnormal ECG, a hematocrit below 30 percent, a history of congestive heart failure, shortness of breath, or a systolic blood pressure below 90 mmHg. A prodrome of nausea or warmth and situational triggers suggest vasovagal syncope.","k":"The San Francisco Syncope Rule flags heart failure, abnormal ECG, anemia, dyspnea, and hypotension."},{"n":138,"g":12,"q":"A 66-year-old man has syncope. He has known heart disease (1 point), a systolic pressure of 85 mmHg (2 points), a troponin above the 99th percentile (2 points), and a vasovagal predisposition (minus 1 point). What risk category does this Canadian Syncope Risk Score place him in?","o":["Very low risk, with a 30-day serious adverse event rate of about 0.2 percent","Very high risk, with a 30-day serious adverse event rate of about 51 percent","Medium risk, with a 30-day serious adverse event rate of about 8 percent","High risk, with about a 19 percent 30-day serious adverse event rate","Low risk, with a 30-day serious adverse event rate of about 0.7 percent"],"a":3,"e":"The points add to 4, which falls in the high-risk band of 4 to 5 and carries a serious adverse event rate of about 19 percent at 30 days. Medium risk is 1 to 3, and very high risk is 6.","k":"A Canadian Syncope Risk Score of 4 to 5 is high risk, with about a 19 percent 30-day serious adverse event rate."},{"n":139,"g":12,"q":"A 60-year-old woman has syncope. The ROSE rule is used to stratify her risk. Which finding makes the rule positive?","o":["A hemoglobin of 12 g/dL","An oxygen saturation of 98 percent","A resting heart rate of 96 per minute","A resting heart rate of 46 per minute","A BNP of 120 pg/mL"],"a":3,"e":"The ROSE rule is positive for a BNP of 300 pg/mL or higher, hemoglobin of 9 g/dL or lower, bradycardia of 50 per minute or less, chest pain, an abnormal ECG, an oxygen saturation of 94 percent or lower, or occult blood in stool.","k":"ROSE high-risk items include BNP 300 or more, hemoglobin 9 or less, heart rate 50 or less, and saturation 94 percent or less."},{"n":140,"g":12,"q":"In the Canadian Syncope Risk Score, which ECG measurement adds 2 points to a patient's total?","o":["A resting heart rate of 55 per minute","A QRS axis of minus 20 degrees on the tracing","A QRS duration of 120 ms on the tracing","A PR interval of 210 ms on the tracing","A corrected QT interval above 480 ms"],"a":4,"e":"A corrected QT above 480 ms adds 2 points. A QRS duration above 130 ms adds 1 point, as does a QRS axis below minus 30 or above 100 degrees. The other values do not score.","k":"A QTc above 480 ms scores 2 points on the Canadian Syncope Risk Score."},{"n":141,"g":12,"q":"A 67-year-old man with an implantable cardioverter-defibrillator received a single shock at home and now feels well. He is hemodynamically normal. Which approach is best?","o":["Start a loading dose of amiodarone before any testing is done or results return","Admit every patient with a single shock to the intensive care unit for monitoring","Discharge him without any device interrogation or any laboratory testing","An ECG, electrolytes, and chest radiograph, then device interrogation","Apply a magnet over the device and send him home"],"a":3,"e":"After a single shock, patients are usually told not to come to the emergency department, but if they do, a focused history and examination, ECG, electrolytes, and chest radiograph are appropriate, and cardiology should interrogate the device. Multiple shocks need emergency evaluation.","k":"After a single ICD shock in a well patient, check ECG and electrolytes and arrange interrogation."},{"n":142,"g":12,"q":"A patient with an implantable cardioverter-defibrillator is receiving repeated inappropriate shocks for sinus tachycardia while an external defibrillator is attached and ready. What is the effect of placing a magnet over the device?","o":["It converts the device to asynchronous pacing and shocking","It resets the device to factory settings","It delivers a single synchronized shock","It suspends shock delivery without changing pacing","It disables all device functions including pacing"],"a":3,"e":"A magnet temporarily stops shock delivery from an implantable defibrillator and does not affect pacing. External pads should be applied before the magnet, because some devices may not resume therapy after the magnet is removed.","k":"A magnet suspends ICD shock therapy but not pacing, so apply pads first."},{"n":143,"g":12,"q":"A 58-year-old man with an implantable cardioverter-defibrillator has had four appropriate shocks for ventricular tachycardia within twelve hours. Which definition and plan are correct?","o":["A battery alert that is treated with a replacement in clinic next month or later","Device oversensing that is treated by placing a magnet and going home the same day","Pacemaker syndrome that is treated with a diuretic and reassurance","Electrical storm: amiodarone, beta-blockade, sedation, electrolytes, ICU","A single-shock event that can be discharged after interrogation"],"a":3,"e":"Electrical storm is three or more separate episodes of ventricular tachycardia, ventricular fibrillation, or appropriate shocks within 24 hours. Precipitants such as ischemia, heart failure, hypokalemia, and hypomagnesemia are sought, and treatment is amiodarone with beta-blockade, early analgesia and sedation, and ICU admission with electrophysiology input.","k":"Three or more arrhythmia episodes or appropriate shocks in 24 hours is electrical storm and needs ICU care."},{"n":144,"g":12,"q":"A 63-year-old man with an implantable cardioverter-defibrillator receives a shock during rapid sequence intubation just after succinylcholine is given. His monitor rhythm is sinus tachycardia. What is the most likely mechanism?","o":["Ventricular fibrillation triggered by hypokalemia","Lead dislodgement into the right atrium","Oversensing of muscle fasciculations","Depletion of the device battery","Magnet interference from the monitor"],"a":2,"e":"Fasciculations after succinylcholine can be oversensed by the device and interpreted as a tachyarrhythmia, producing an inappropriate shock. Interrogation can identify such events from stored electrograms.","k":"Succinylcholine fasciculations can be oversensed and cause an inappropriate ICD shock."},{"n":145,"g":12,"q":"A 62-year-old man with a continuous-flow left ventricular assist device arrives awake and talking, but no pulse can be palpated. How should his blood pressure be assessed?","o":["Doppler over the brachial artery; the first sound is the MAP","Palpate the carotid pulse for a full 30 seconds","Rely on a cuff with auscultation to find the systolic pressure","Begin chest compressions immediately because no pulse is felt","Use a pulse oximeter as the only guide to perfusion"],"a":0,"e":"Patients with continuous-flow devices may have no palpable pulse at baseline, and pulse oximetry can be unreliable without pulse pressure. A Doppler probe with a cuff gives the mean arterial pressure at the first sound, and an arterial line is ideal in critical illness.","k":"In an LVAD patient, use Doppler to find the mean arterial pressure instead of relying on a pulse."},{"n":146,"g":12,"q":"A patient with a left ventricular assist device is hypotensive. The pump is hot and running at a high speed with an abnormal hum. Bedside ultrasound shows a small left ventricle. What is the most likely cause and the best initial management?","o":["Acute pulmonary hypertension, treated with intubation and bicarbonate","Right ventricular infarction, treated with an emergency catheterization","Cardiac tamponade, treated with pericardiocentesis alone","Suction event, treated with fluid and urgent device center transfer","Pump thrombosis, treated with a heparin bolus and a low-dose infusion"],"a":3,"e":"A small left ventricle with a hot pump, high speed, and abnormal hum suggests a suction event from underfilling, treated with intravenous fluid and urgent contact with and transfer to the LVAD center. Pump thrombosis shows enlarged ventricles.","k":"A small left ventricle with a hot, high-speed pump points to suction, treated with volume."},{"n":147,"g":12,"q":"A patient with a left ventricular assist device has a hot pump running at high speed with an abnormal hum. Bedside ultrasound shows enlarged right and left ventricles. What is the most likely diagnosis and the best immediate treatment?","o":["Aortic regurgitation, treated with a vasodilator infusion","A driveline infection, treated with antibiotics alone","A suction event, treated with a large intravenous fluid bolus","Hypovolemia from bleeding, treated with blood products","Pump thrombosis, treated with a heparin bolus"],"a":4,"e":"An abnormal hum and high power with dilated ventricles indicate pump thrombosis. A heparin bolus is given, thrombolytics can be considered if the patient is peri-arrest, and the LVAD center should be contacted early.","k":"A hot, high-speed pump with dilated ventricles is pump thrombosis and needs heparin."},{"n":148,"g":12,"q":"A patient with a left ventricular assist device is found unresponsive. There is no Doppler mean arterial pressure and the pump is not running. What is the appropriate response?","o":["Start chest compressions and treat as a patient without a device","Give a heparin bolus and observe the patient closely","Wait for the device team to arrive before taking any action on the patient","Withhold compressions because they may dislodge the pump from the left ventricle","Apply a magnet to the pump controller to restart the pump after a short delay"],"a":0,"e":"If there is no measurable mean arterial pressure and the pump is not working, CPR is started and the patient is treated as if there were no device. Compressions can theoretically dislodge the device, so they are avoided when a pump is functioning or can be restarted with a hand pump.","k":"With no pressure and no pump function, start CPR in an LVAD patient."},{"n":149,"g":12,"q":"A 71-year-old man with atrial fibrillation has a cold, pale, painful right leg that began three hours ago. Sensation is lost beyond the toes, he has mild weakness, and arterial Doppler signals are absent. CT angiography is being arranged. What should be done immediately?","o":["Apply a warm compress and elevate the leg overnight","A heparin bolus given at once, without waiting for imaging","Wait for CT angiography before starting any anticoagulant","Give aspirin alone and observe the leg for two hours","Load warfarin and discharge for outpatient vascular imaging"],"a":1,"e":"An embolus from atrial fibrillation is the likely cause. Unfractionated heparin is given as a bolus, followed by an infusion, and should not be delayed for imaging. Time is tissue, and limb salvage depends on time to reperfusion.","k":"Give heparin immediately for acute limb ischemia and do not wait for imaging."},{"n":150,"g":12,"q":"A patient has an acutely ischemic leg with sensory loss extending beyond the toes, mild to moderate weakness, and inaudible arterial Doppler signals with audible venous signals. How is this classified by the Rutherford system?","o":["Not classifiable without angiography","Category IIb, immediately threatened","Category III, irreversible","Category I, viable","Category IIa, marginally threatened"],"a":1,"e":"Category IIb has sensory loss beyond the toes with mild or moderate motor deficit and inaudible arterial signals. It is salvageable if revascularized promptly. Category IIa has minimal toe-only sensory loss, and category III is irreversible with profound sensory and motor loss.","k":"Rutherford IIb means sensory loss beyond the toes with mild to moderate weakness and salvageable if treated promptly."},{"n":151,"g":12,"q":"A patient develops a wide-complex rhythm and cardiovascular collapse minutes after revascularization of a limb that had been ischemic for many hours. Which reperfusion complication is the leading concern?","o":["Hypermagnesemia","Alkalosis from reperfusion","Acute hypercalcemia","Hypernatremia","Hyperkalemia with acidosis"],"a":4,"e":"Reperfusion of an ischemic limb releases potassium, myoglobin, and acid into the circulation. Hyperkalemia causes arrhythmias, and myoglobinuria can cause kidney injury, so life takes priority over limb in an unstable patient.","k":"Reperfusion after prolonged limb ischemia can cause hyperkalemia, acidosis, and myoglobinuria."},{"n":152,"g":13,"q":"A 40-year-old man with diabetes has a 6 cm fluctuant abscess on the thigh. After incision and drainage, which statement about packing is correct?","o":["Packing is contraindicated after any abscess drainage in the department today","Packing is replaced by a large dressing with no wound check scheduled","Packing is indicated only when the wound culture grows an organism","Packing is used only for abscesses on the face and neck, never the limbs","Pack abscesses over 5 cm and those in diabetic patients"],"a":4,"e":"Packing is advised for abscesses larger than 5 cm, pilonidal abscesses, and abscesses in immunocompromised or diabetic patients. Loop drainage is an alternative, with a failure rate of 4.1% compared with 9.8% for conventional packing.","k":"Pack abscesses over 5 cm and those in diabetic or immunocompromised patients."},{"n":153,"g":13,"q":"A 28-year-old man has a 3 cm skin abscess with mild surrounding cellulitis but no systemic signs. After drainage, which statement about antibiotics is supported?","o":["Penicillin V alone gives adequate coverage for the usual pathogen in outpatients","Fluoroquinolones are first-line therapy for skin abscess in outpatients","Antibiotics never reduce treatment failure in any skin abscess after drainage","MRSA is the usual cause and trimethoprim-sulfamethoxazole is an oral option","Antibiotics are required in every abscess regardless of size or setting"],"a":3,"e":"MRSA is the most common cause of purulent skin and soft-tissue infection. The reference lists trimethoprim-sulfamethoxazole DS twice daily for 5 days, with clindamycin as effective but with more adverse events, and a number needed to treat of about 14 to prevent one treatment failure.","k":"Purulent skin infection is usually MRSA, and trimethoprim-sulfamethoxazole is an oral option."},{"n":154,"g":13,"q":"A resident asks when bedside ultrasound is helpful in a swollen red area of skin. Which statement is the most accurate?","o":["It is no better than examination alone, so it should never be used","It always shows a swirling collection when the diagnosis is cellulitis","It is required before every incision and drainage procedure in all patients","It separates abscess from cellulitis but rarely changes management","It should replace the clinical examination in every patient with swelling"],"a":3,"e":"Soft-tissue ultrasound can distinguish an abscess, with a fluid collection and swirl, from cellulitis, which shows cobblestoning. Small studies suggest it rarely changes management, and the diagnosis is usually clinical.","k":"Ultrasound separates abscess from cellulitis but seldom changes management."},{"n":155,"g":13,"q":"A 52-year-old woman with a history of lymphedema has leg cellulitis. Which factor most strongly predicts outpatient treatment failure?","o":["A prior fracture of the same leg in the past year","Female sex","A normal white cell count at triage","A temperature above 38 C at triage","Age over 50"],"a":3,"e":"In the reference, fever above 38 C at triage had an odds ratio of 4.3 for treatment failure, chronic leg ulcers and chronic edema 2.5 each, prior cellulitis in the same area 2.1, and cellulitis at a wound site 1.9.","k":"Fever at triage is the strongest predictor of cellulitis treatment failure."},{"n":156,"g":13,"q":"A 66-year-old man has bilateral red, scaly, warm shins that have been present for months. He has no fever. Which diagnosis is most likely to be mistaken for cellulitis?","o":["Necrotizing fasciitis","Cellulitis from a puncture","Venous stasis dermatitis","Erysipelas","Impetigo"],"a":2,"e":"Mimics of cellulitis include venous stasis dermatitis, deep venous thrombosis, gout and pseudogout, contact dermatitis, lymphedema, and calciphylaxis. A bilateral, chronic, afebrile presentation points away from true cellulitis.","k":"Bilateral chronic redness without fever suggests stasis dermatitis, not cellulitis."},{"n":157,"g":13,"q":"A 47-year-old diabetic man has cellulitis of the hand with fever and a poor response to oral therapy. Which disposition is appropriate?","o":["Discharge with the same antibiotic and a recheck in a week","Admission, since hand infection with treatment failure meets criteria","Discharge with a topical antibiotic ointment and daily dressing changes","Discharge with a recheck in 2 weeks and no change in therapy","Observation in the waiting room for 1 hour then discharge home"],"a":1,"e":"Admit for sepsis, significant infection of the hand, face, or genitalia, failure of outpatient treatment, or significant comorbidity such as poorly controlled diabetes or immunosuppression.","k":"Hand infection with treatment failure and diabetes needs admission."},{"n":158,"g":13,"q":"A 68-year-old woman has burning pain and then a unilateral band of grouped vesicles on the right chest that does not cross the midline. The rash began 40 hours ago. Which statement about antiviral therapy is correct?","o":["Antivirals are contraindicated in all patients over 60 years of age","Antivirals are required only when the face is involved by the rash","Antivirals work best within 72 hours or while new vesicles appear","Antivirals have no effect on postherpetic neuralgia in any setting","Antivirals are useful only after the first 7 days of rash"],"a":2,"e":"In immunocompetent patients, treatment is started within 72 hours of rash onset, or later if new vesicles are developing. Antivirals reduce the risk and duration of postherpetic neuralgia but do not work once it has developed.","k":"Treat herpes zoster within 72 hours or while new vesicles appear."},{"n":159,"g":13,"q":"A 50-year-old man receiving chemotherapy has herpes zoster. The rash began 5 days ago. Which statement is correct?","o":["Withhold antivirals because he is receiving cancer chemotherapy now","Give antivirals only if he also has a fever above 38 C","Give antivirals only if the lesions involve the face or scalp","Give antivirals only if started within the first 24 hours of rash","Give antivirals regardless of the time since onset"],"a":4,"e":"Immunosuppressed patients should receive antiviral therapy regardless of onset time. Intravenous acyclovir is used for severe disease, and foscarnet is used for resistant virus, disseminated zoster, central nervous system or ophthalmic involvement, advanced AIDS, or recent transplant.","k":"Treat zoster in immunosuppressed patients at any time."},{"n":160,"g":13,"q":"A 55-year-old woman receiving high-dose steroids has more than 20 lesions outside the primary and adjacent dermatomes and a new cough. Which precaution is required?","o":["Airborne isolation for disseminated zoster","Isolation only after the lesions have fully healed and scarred over","No isolation is required because zoster is not contagious","Contact precautions only, with a gown and gloves","Droplet precautions only, with a surgical mask"],"a":0,"e":"Disseminated zoster requires airborne precautions, and the patient is contagious until the lesions have crusted. Disseminated disease can involve the liver, lung, and brain, so pneumonitis, hepatitis, and encephalitis should be considered, and these patients are admitted.","k":"Disseminated zoster needs airborne precautions."},{"n":161,"g":13,"q":"An 80-year-old man has intensely itchy urticarial plaques that have become tense bullae in the axillae and inner thighs. Nikolsky sign is negative, and a recent medication list includes furosemide. Which diagnosis is most likely?","o":["Scabies","Bullous pemphigoid","Pemphigus vulgaris with a positive Nikolsky sign","Toxic epidermal necrolysis","Impetigo"],"a":1,"e":"Bullous pemphigoid occurs mainly after age 60, begins urticarial, forms tense blisters up to 10 cm, and has a negative Nikolsky sign. Furosemide is one reported trigger. The mucosa is involved in 10% to 25%, and diagnosis rests on biopsy.","k":"Tense bullae with a negative Nikolsky sign in an older patient suggest bullous pemphigoid."},{"n":162,"g":13,"q":"A dermatologist is called about an 82-year-old patient with bullous pemphigoid and a limited rash. Which treatment option is described in the reference?","o":["High-potency topical steroids such as clobetasol","Oral antihistamines are the only treatment that is recommended here","Immediate high-dose oral prednisone is required for all patients today","Radiation therapy directed at the affected areas of the skin","Intravenous antibiotics for 14 days is the standard regimen for it"],"a":0,"e":"Treatment options are an antihistamine for itch, topical clobetasol, oral prednisone, tetracycline with nicotinamide, dapsone, and immunosuppressants. Topical steroids may offer a similar effect to oral steroids with fewer systemic adverse effects.","k":"Topical high-potency steroids are an option in bullous pemphigoid."},{"n":163,"g":13,"q":"A 9-year-old boy has intense night itching, small burrows between the fingers, and similar symptoms in his brother. Which treatment is first-line?","o":["Permethrin 5% cream from neck to toe, repeated in 1 to 2 weeks","Topical mupirocin for 5 days applied to the burrows only","Lindane lotion as the first-line treatment for the whole family","Oral antibiotics for 10 days to treat the secondary infection","Oral ivermectin only, because it is first-line in children under 15 kg"],"a":0,"e":"Permethrin 5% is first-line, with a success rate of 95% to 98%. All household members are treated, and linens and clothes are washed in hot water or sealed for 2 weeks. Lindane is reserved for refractory cases because of seizure and neurotoxicity risks.","k":"Treat scabies with permethrin and treat household contacts."},{"n":164,"g":13,"q":"A patient treated for scabies one week ago still itches. No new burrows are visible. What should he be told?","o":["The itch shows a second parasite is present and needs new therapy","The itch can persist for weeks and steroids may help","Oral ivermectin must be given again within 3 days of the first dose","Scabies results only from poor hygiene and must be treated at home","The treatment has failed and must be repeated every day this week"],"a":1,"e":"Pruritus may continue for weeks after the infestation is cleared, and steroids can ease the symptoms. Scabies is not a reflection of poor hygiene. Crusted scabies in immunocompromised patients needs repeated treatments.","k":"Itch can outlast the infestation for weeks."},{"n":165,"g":13,"q":"A 4-year-old has honey-colored crusted lesions around the nose. Which treatment is appropriate for limited nonbullous impetigo?","o":["Topical mupirocin 2% ointment three times daily for 5 days","Observation without treatment, since antibiotics prevent glomerulonephritis","Topical hydrocortisone","Intravenous vancomycin","Oral steroids"],"a":0,"e":"Topical mupirocin 2% for 5 days is the listed topical agent. Poststreptococcal glomerulonephritis is a possible complication, and its incidence is not reduced by antibiotic therapy.","k":"Mupirocin treats limited impetigo, but antibiotics do not prevent glomerulonephritis."},{"n":166,"g":13,"q":"A 22-year-old man has symmetric target lesions with three zones of color on the palms and backs of the hands, and a cold sore 1 week earlier. Which trigger is most common?","o":["Oral prednisone for 5 days to reduce inflammation of the crusts","Topical hydrocortisone cream to relieve the itch around the nose","Intravenous vancomycin for 7 days in the hospital for the infection","Observation alone, since antibiotics prevent poststreptococcal nephritis","Topical mupirocin 2% ointment for 5 days"],"a":4,"e":"Target lesions with three zones of color are the hallmark of erythema multiforme, and herpes simplex virus causes about 70% of cases. Minor disease has no mucosal involvement. Major disease involves mucous membranes, with epidermal detachment under 10%. It is separate from SJS and TEN.","k":"Herpes simplex is the most common trigger of erythema multiforme."},{"n":167,"g":13,"q":"A 78-year-old bedbound patient has a sacral ulcer with full-thickness skin loss, deep necrosis, and a covering eschar that obscures the wound base. How is this ulcer classified?","o":["Unstageable","Superficial burn","Stage 1","Stage 4","Stage 2"],"a":0,"e":"Stage 1 is intact skin with nonblanchable erythema, stage 2 is epidermal erosion, stage 3 is deep necrosis with full-thickness loss, and stage 4 shows muscle or bone. A full-thickness wound with devitalized tissue or eschar obscuring the base is unstageable. Sepsis or deep wounds call for blood cultures and evaluation for osteomyelitis.","k":"Eschar hiding the wound base makes a pressure injury unstageable."},{"n":168,"g":14,"q":"A 60-year-old man with known cranial diabetes insipidus is admitted dehydrated after vomiting for two days. His sodium is 158 mmol/L. His urine output is surprisingly low. What is the best first step?","o":["Withhold all fluids until the urine output rises again","Give a ten-fold dose of desmopressin to control the urine output quickly","Give a rapid bolus of 5 percent dextrose in water to lower the sodium at once","Resuscitate with 0.9% saline, since low volume can mask the polyuria","Give hypertonic saline to correct the sodium quickly"],"a":3,"e":"Patients with cranial diabetes insipidus may not be polyuric when circulating volume is low, so dehydrated patients are first resuscitated with 0.9 percent saline. A single 1 mcg intravenous desmopressin dose can be considered if urine output exceeds 250 mL per hour for 3 hours after resuscitation.","k":"Resuscitate a dehydrated patient with diabetes insipidus with isotonic saline before adjusting desmopressin."},{"n":169,"g":14,"q":"A patient with cranial diabetes insipidus has symptomatic hypernatremia. What is the safe limit for lowering the serum sodium?","o":["Any rate, provided desmopressin is given","30 mmol/L in 24 hours","No more than 10 mmol/L in 24 hours","Back to normal within 4 hours","20 mmol/L in the first 6 hours"],"a":2,"e":"Hypernatremia in cranial diabetes insipidus is an emergency, but the sodium should not fall by more than 10 mmol/L in 24 hours. Severe symptomatic cases may be corrected by up to 5 mmol/L in the first hour, with frequent sodium checks.","k":"Lower sodium by no more than 10 mmol/L in 24 hours in hypernatremia from diabetes insipidus."},{"n":170,"g":14,"q":"A patient with cranial diabetes insipidus who takes desmopressin and drinks large amounts of water becomes confused. His sodium is 122 mmol/L. What is the best next step?","o":["Give an extra dose of desmopressin to reduce the polyuria","Give a rapid hypertonic saline bolus to correct the sodium at once to the normal range","Encourage more oral water intake to dilute the urine further and treat the thirst","Consider delaying desmopressin until the sodium normalizes, and get senior help","Stop all monitoring and observe overnight in the department without any blood tests"],"a":3,"e":"Hyponatremia in a patient with diabetes insipidus may reflect overhydration from excess water intake or excessive desmopressin. Delaying desmopressin until the sodium normalizes, or if it is overcorrecting, and early senior or endocrine involvement are recommended.","k":"Hyponatremia in diabetes insipidus can come from water excess or too much desmopressin, so hold desmopressin and get help."},{"n":171,"g":14,"q":"A 52-year-old woman has episodic severe headache, palpitations, tremor, and sweating. Her blood pressure is 245/130 mmHg with a heart rate of 130. A
